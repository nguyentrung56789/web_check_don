<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>KHO</title>

  <script src="./js/internal_key.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/cod_config.js"></script>
  <script src="./js/auth_token.js"></script>

  <style>

:root{
  --bg:#0b1220;
  --card:#0f1830;
  --card2:#111d36;
  --txt:#e6edff;
  --muted:#9aa7c7;
  --line:#233043;
  --primary:#60a5fa;
  --danger:#f87171;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--txt);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
}
body.loading{visibility:hidden}
.top{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:14px 18px;
  background:rgba(15,24,48,.97);
  border-bottom:1px solid var(--line);
  box-shadow:0 2px 12px rgba(0,0,0,.35);
}
.top-left{display:flex;align-items:center;gap:12px;min-width:0}
.back{
  border:1px solid #33415b;
  background:#17233d;
  color:var(--txt);
  border-radius:10px;
  padding:9px 12px;
  cursor:pointer;
  font-weight:700;
}
.title-wrap{min-width:0}
.page-title{margin:0;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hello{color:var(--muted);font-size:13px;margin-top:2px}
.logout{
  background:none;
  color:var(--danger);
  border:0;
  cursor:pointer;
  font-weight:800;
}
.wrap{
  width:min(1000px,94vw);
  margin:28px auto 60px;
}
.hero{
  border:1px solid var(--line);
  background:linear-gradient(145deg,var(--card),var(--card2));
  border-radius:18px;
  padding:24px;
  box-shadow:0 10px 35px rgba(0,0,0,.22);
}
.hero h2{margin:0 0 8px;font-size:25px}
.hero p{margin:0;color:var(--muted);line-height:1.6}
.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:16px;
  margin-top:18px;
}
.card{
  border:1px solid var(--line);
  background:var(--card);
  border-radius:16px;
  padding:18px;
}
.card h3{margin:0 0 12px;font-size:17px}
.action{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:13px 14px;
  margin-top:10px;
  border:1px solid #2a3852;
  border-radius:12px;
  background:#111c32;
}
.action span{font-weight:700}
.action button{
  border:0;
  border-radius:9px;
  background:var(--primary);
  color:#052e2b;
  padding:9px 12px;
  font-weight:800;
  cursor:pointer;
}
.token-box{
  margin-top:18px;
  padding:12px 14px;
  border:1px dashed #385172;
  border-radius:12px;
  color:var(--muted);
  font-size:13px;
  overflow-wrap:anywhere;
}
.badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:6px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
  margin-bottom:12px;
}
footer{text-align:center;color:var(--muted);font-size:12px;padding:24px}
@media(max-width:720px){
  .grid{grid-template-columns:1fr}
  .top{align-items:flex-start}
  .page-title{font-size:16px}
}

</style>
</head>
<body class="loading">
  <header class="top">
    <div class="top-left">
      <button class="back" type="button" data-back>← Trang chính</button>
      <div class="title-wrap">
        <h1 class="page-title" data-page-title>KHO</h1>
        <div class="hello">Xin chào <span data-user-name>...</span></div>
      </div>
    </div>
    <button class="logout" type="button" data-logout>Đăng xuất</button>
  </header>

  <main class="wrap">
    <section class="hero">
      <div class="badge" style="background:#60a5fa22;color:#60a5fa;border:1px solid #60a5fa66">
        📦 NHÓM KHO
      </div>
      <h2>📦 KHO</h2>
      <p>Quản lý nhập kho, xuất kho, tồn kho và chuẩn bị hàng.</p>

      <div class="grid">
        <article class="card">
          <h3>Nhập kho</h3>
          <div class="action">
            <span>Mở chức năng</span>
            <button type="button" data-open="./nhap_kho.html">Mở →</button>
          </div>
        </article>
<article class="card">
          <h3>Xuất kho</h3>
          <div class="action">
            <span>Mở chức năng</span>
            <button type="button" data-open="./xuat_kho.html">Mở →</button>
          </div>
        </article>
<article class="card">
          <h3>Tồn kho</h3>
          <div class="action">
            <span>Mở chức năng</span>
            <button type="button" data-open="./ton_kho.html">Mở →</button>
          </div>
        </article>
<article class="card">
          <h3>Chuẩn bị hàng</h3>
          <div class="action">
            <span>Mở chức năng</span>
            <button type="button" data-open="./chuan_bi_hang.html">Mở →</button>
          </div>
        </article>
      </div>

      <div class="token-box" data-token-state>Đang kiểm tra token...</div>
    </section>
  </main>

  <footer>© <span data-year></span> COD Internal</footer>

  <script>

const LOGIN_STORAGE_KEY = 'nv';

export function readUser() {
  const raw = localStorage.getItem(LOGIN_STORAGE_KEY);
  if (!raw) {
    location.replace('./login.html' + location.search);
    throw new Error('Chưa đăng nhập');
  }

  try {
    return JSON.parse(raw);
  } catch {
    localStorage.removeItem(LOGIN_STORAGE_KEY);
    location.replace('./login.html' + location.search);
    throw new Error('Dữ liệu đăng nhập không hợp lệ');
  }
}

export function getAccessToken() {
  const params = new URLSearchParams(location.search);

  return (
    params.get('token') ||
    params.get('access_token') ||
    params.get('auth_token') ||
    sessionStorage.getItem('access_token') ||
    localStorage.getItem('access_token') ||
    ''
  );
}

export function rememberToken() {
  const token = getAccessToken();
  if (token) sessionStorage.setItem('access_token', token);
  return token;
}

export function openWithToken(path) {
  const url = new URL(path, location.href);

  // Giữ toàn bộ tham số hiện có, bao gồm token.
  new URLSearchParams(location.search).forEach((value, key) => {
    url.searchParams.set(key, value);
  });

  const token = getAccessToken();
  if (token && !url.searchParams.has('token')) {
    url.searchParams.set('token', token);
  }

  location.assign(url.href);
}

export function logout() {
  localStorage.removeItem('nv');
  localStorage.removeItem('last_ma_nv');
  sessionStorage.removeItem('access_token');
  localStorage.removeItem('access_token');
  location.replace('./login.html');
}

export function initPage(title) {
  const user = readUser();
  const token = rememberToken();

  document.querySelector('[data-page-title]').textContent = title;
  document.querySelector('[data-user-name]').textContent =
    user?.ten_nv || user?.ma_nv || 'Nhân viên';

  document.querySelector('[data-token-state]').textContent =
    token ? `Token đã được giữ khi mở trang: ${token.slice(0, 10)}••••••` :
            'Không tìm thấy token trên URL hoặc bộ nhớ trình duyệt.';

  document.querySelector('[data-back]')?.addEventListener('click', () => {
    openWithToken('./main.html');
  });

  document.querySelector('[data-logout]')?.addEventListener('click', logout);

  document.querySelectorAll('[data-open]').forEach(button => {
    button.addEventListener('click', () => openWithToken(button.dataset.open));
  });

  document.querySelector('[data-year]').textContent = new Date().getFullYear();
  document.body.classList.remove('loading');
}


initPage('KHO');

</script>
</body>
</html>
