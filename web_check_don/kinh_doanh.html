<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <title>Kinh doanh</title>

  <script src="./js/internal_key.js"></script>
  <script src="./js/cod_config.js"></script>
  <script src="./js/auth_token.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      padding: 24px;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
      color: #fff;
      background:
        radial-gradient(
          circle at 50% 20%,
          rgba(59, 130, 246, 0.12),
          transparent 38%
        ),
        #07101f;
    }

    .page {
      width: min(100%, 760px);
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 34px;
    }

    .back-btn {
      min-height: 42px;
      padding: 9px 15px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 11px;
      background: #0f172a;
      color: #fff;
      font-weight: 750;
      cursor: pointer;
    }

    .page-title {
      margin: 0 0 32px;
      text-align: center;
      font-size: clamp(28px, 6vw, 40px);
      font-weight: 900;
      text-transform: uppercase;
    }

    .menu {
      display: grid;
      gap: 22px;
    }

    .hidden {
      display: none !important;
    }

    .permission-btn {
      width: 100%;
      min-height: 116px;
      padding: 22px 28px;
      border: 0;
      border-radius: 19px;
      color: #07101f;
      text-align: left;
      font-size: clamp(22px, 5vw, 31px);
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 18px 38px rgba(0, 0, 0, 0.26);
      transition:
        transform 0.18s ease,
        filter 0.18s ease;
    }

    .permission-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.05);
    }

    .btn-chamsockhachhang {
      background: linear-gradient(135deg, #a855f7, #c084fc);
    }

    .btn-tinhdoanhso {
      background: linear-gradient(135deg, #fb7185, #fda4af);
    }

    .empty-note,
    .error-note,
    .debug-note {
      display: none;
      margin-top: 20px;
      padding: 16px;
      border-radius: 13px;
      line-height: 1.55;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .empty-note {
      background: rgba(120, 53, 15, 0.58);
      color: #fef3c7;
    }

    .error-note {
      background: rgba(127, 29, 29, 0.65);
      color: #fee2e2;
    }

    .debug-note {
      background: #0f172a;
      border: 1px solid rgba(148, 163, 184, 0.25);
      color: #cbd5e1;
      font-family: Consolas, monospace;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      body {
        padding: 16px;
      }

      .permission-btn {
        min-height: 94px;
        padding: 18px 20px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="topbar">
      <button id="btnBack" class="back-btn" type="button">
        ← Quay lại
      </button>

      <strong id="tenNhanVien">Nhân viên</strong>
    </div>

    <h1 class="page-title">Kinh doanh</h1>

    <section class="menu">
      <button
        id="chamsockhachhang"
        class="permission-btn btn-chamsockhachhang hidden"
        type="button"
        data-phan-quyen
        data-url="./chamsockhachhang.html"
      >
        💬 Chăm sóc khách hàng
      </button>

      <button
        id="tinhdoanhso"
        class="permission-btn btn-tinhdoanhso hidden"
        type="button"
        data-phan-quyen
        data-url="./tinhdoanhsonhanvien.html"
      >
        🧮 Tính doanh số nhân viên
      </button>
    </section>

    <div id="emptyNote" class="empty-note">
      Tài khoản chưa được cấp quyền sử dụng hai chức năng này.
    </div>

    <div id="errorNote" class="error-note"></div>
    <div id="debugNote" class="debug-note"></div>
  </main>

  <script type="module">
    import {
      quyen_duocxem,
      layTenTrangHienTai,
      layMaNhanVienDangNhap
    } from './js/phan_quyen.js';

    const buttons = [
      ...document.querySelectorAll('[data-phan-quyen]')
    ];

    const emptyNote =
      document.querySelector('#emptyNote');

    const errorNote =
      document.querySelector('#errorNote');

    const debugNote =
      document.querySelector('#debugNote');

    function getToken() {
      return (
        new URLSearchParams(
          window.location.search
        ).get('token') ||
        sessionStorage.getItem('APP_ACCESS') ||
        ''
      );
    }

    function openWithToken(url) {
      const target =
        new URL(url, window.location.href);

      const token = getToken();

      if (token) {
        target.searchParams.set(
          'token',
          token
        );
      }

      window.location.assign(
        target.toString()
      );
    }

    function readLoginUser() {
      const keys = [
        'nv',
        'chatwoot_crm_user'
      ];

      for (const key of keys) {
        try {
          const raw =
            localStorage.getItem(key);

          if (!raw) {
            continue;
          }

          const user = JSON.parse(raw);

          if (
            user &&
            typeof user === 'object'
          ) {
            return user;
          }
        } catch (error) {
          console.warn(error);
        }
      }

      return null;
    }

    async function applyPermissions() {
      let visibleCount = 0;
      const results = [];

      for (const button of buttons) {
        const idChucNang =
          String(button.id || '')
            .trim()
            .toLowerCase();

        const allowed =
          await quyen_duocxem(
            idChucNang
          );

        button.dataset.duocXem =
          String(allowed);

        if (allowed) {
          button.classList.remove(
            'hidden'
          );

          visibleCount += 1;
        }

        results.push({
          id_chucnang:
            idChucNang,
          duoc_xem:
            allowed
        });
      }

      emptyNote.style.display =
        visibleCount === 0
          ? 'block'
          : 'none';

      debugNote.style.display =
        'block';

      debugNote.textContent =
        JSON.stringify(
          {
            ma_nv:
              layMaNhanVienDangNhap(),
            duong_dan:
              layTenTrangHienTai(),
            ket_qua:
              results
          },
          null,
          2
        );

      console.table(results);
    }

    function bindButtons() {
      for (const button of buttons) {
        button.addEventListener(
          'click',
          async () => {
            const idChucNang =
              String(button.id || '')
                .trim()
                .toLowerCase();

            const allowed =
              await quyen_duocxem(
                idChucNang
              );

            if (!allowed) {
              alert(
                'Bạn không có quyền sử dụng chức năng này.'
              );

              return;
            }

            openWithToken(
              button.dataset.url
            );
          }
        );
      }
    }

    document
      .querySelector('#btnBack')
      .addEventListener(
        'click',
        () => {
          if (
            document.referrer &&
            window.history.length > 1
          ) {
            window.history.back();
            return;
          }

          openWithToken('./main.html');
        }
      );

    document.addEventListener(
      'DOMContentLoaded',
      async () => {
        try {
          const user =
            readLoginUser();

          document.querySelector(
            '#tenNhanVien'
          ).textContent =
            user?.ten_nv ||
            user?.name ||
            layMaNhanVienDangNhap() ||
            'Nhân viên';

          bindButtons();
          await applyPermissions();
        } catch (error) {
          console.error(
            '[KINH_DOANH_INIT]',
            error
          );

          errorNote.style.display =
            'block';

          errorNote.textContent =
            error?.message ||
            String(error);
        }
      }
    );
  </script>
</body>
</html>
