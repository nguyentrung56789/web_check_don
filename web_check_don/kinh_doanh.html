<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <title>Chức năng riêng</title>

  <script src="./js/internal_key.js"></script>
  <script src="./js/cod_config.js"></script>
  <script src="./js/auth_token.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #07101f;
      color: #fff;
    }

    .page {
      width: min(100%, 760px);
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 28px;
      text-align: center;
      font-size: 30px;
    }

    .menu {
      display: grid;
      gap: 20px;
    }

    .hidden {
      display: none !important;
    }

    .permission-btn {
      width: 100%;
      min-height: 110px;
      padding: 20px 28px;
      border: 0;
      border-radius: 18px;
      color: #07101f;
      text-align: left;
      font-size: 26px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
      transition: transform 0.18s ease, filter 0.18s ease;
    }

    .permission-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.04);
    }

    .btn-chamsockhachhang {
      background: linear-gradient(135deg, #a855f7, #c084fc);
    }

    .btn-tinhdoanhso {
      background: linear-gradient(135deg, #fb7185, #fda4af);
    }

    .empty-note,
    .error-note {
      display: none;
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      line-height: 1.5;
    }

    .empty-note {
      background: rgba(120, 53, 15, 0.55);
      color: #fef3c7;
    }

    .error-note {
      background: rgba(127, 29, 29, 0.6);
      color: #fee2e2;
      white-space: pre-wrap;
    }

    @media (max-width: 600px) {
      body {
        padding: 16px;
      }

      h1 {
        font-size: 24px;
      }

      .permission-btn {
        min-height: 92px;
        font-size: 22px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <h1>Chức năng</h1>

    <section class="menu">
      <button
        id="chamsockhachhang"
        class="permission-btn btn-chamsockhachhang hidden"
        type="button"
        data-phan-quyen
        data-id-chucnang="chamsockhachhang"
        data-url="./chamsockhachhang.html"
      >
        💬 Chăm sóc khách hàng
      </button>

      <button
        id="tinhdoanhso"
        class="permission-btn btn-tinhdoanhso hidden"
        type="button"
        data-phan-quyen
        data-id-chucnang="tinhdoanhso"
        data-url="./tinhdoanhsonhanvien.html"
      >
        🧮 Tính doanh số nhân viên
      </button>
    </section>

    <div id="emptyNote" class="empty-note">
      Tài khoản chưa được cấp quyền sử dụng hai chức năng này.
    </div>

    <div id="errorNote" class="error-note"></div>
  </main>

  <script type="module">
    import {
      quyen_duocxem
    } from './js/phan_quyen.js';

    const buttons = [
      ...document.querySelectorAll('[data-phan-quyen]')
    ];

    const emptyNote = document.querySelector('#emptyNote');
    const errorNote = document.querySelector('#errorNote');

    function getToken() {
      return (
        sessionStorage.getItem('APP_ACCESS') ||
        new URLSearchParams(location.search).get('token') ||
        ''
      );
    }

    function openWithToken(url) {
      const target = new URL(url, location.href);
      const token = getToken();

      if (token) {
        target.searchParams.set('token', token);
      }

      location.href = target.toString();
    }

    async function applyPermissions() {
      let visibleCount = 0;

      for (const button of buttons) {
        const idChucNang = String(
          button.dataset.idChucnang || button.id || ''
        )
          .trim()
          .toLowerCase();

        const allowed = await quyen_duocxem(
          idChucNang,
          'main.html',
          {
            thongBao: false,
            batBuocTaiLai: false
          }
        );

        if (allowed) {
          button.classList.remove('hidden');
          visibleCount += 1;
        }
      }

      emptyNote.style.display =
        visibleCount === 0 ? 'block' : 'none';
    }

    function bindButtons() {
      for (const button of buttons) {
        button.addEventListener('click', async () => {
          const idChucNang = String(
            button.dataset.idChucnang || button.id || ''
          )
            .trim()
            .toLowerCase();

          const allowed = await quyen_duocxem(
            idChucNang,
            'main.html',
            {
              thongBao: false,
              batBuocTaiLai: true
            }
          );

          if (!allowed) {
            alert('Bạn không có quyền sử dụng chức năng này.');
            return;
          }

          openWithToken(button.dataset.url);
        });
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        if (
          typeof window.checkAccess === 'function' &&
          !window.checkAccess()
        ) {
          return;
        }

        bindButtons();
        await applyPermissions();
      } catch (error) {
        console.error(error);

        errorNote.style.display = 'block';
        errorNote.textContent =
          'Không thể tải phân quyền.\n\n' +
          (error?.message || String(error));
      }
    });
  </script>
</body>
</html>
