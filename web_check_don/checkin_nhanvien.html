<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <meta name="theme-color" content="#07101f" />
  <title>Quản lý Check-in Salon</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      padding:
        max(20px, env(safe-area-inset-top))
        18px
        max(20px, env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      justify-content: center;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
      color: #fff;
      background:
        radial-gradient(
          circle at 50% 12%,
          rgba(37, 99, 235, 0.25),
          transparent 36%
        ),
        linear-gradient(160deg, #07101f, #0f172a);
    }

    .page {
      width: min(100%, 680px);
    }

    .card {
      padding: 26px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 24px;
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.34);
    }

    .title {
      margin: 0 0 8px;
      text-align: center;
      font-size: clamp(26px, 6vw, 40px);
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    .subtitle {
      margin: 0 0 28px;
      text-align: center;
      color: #aab8d1;
      font-size: 15px;
      line-height: 1.5;
    }

    .menu {
      display: grid;
      gap: 16px;
    }

    .menu-btn {
      width: 100%;
      min-height: 78px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 16px;
      border: 0;
      border-radius: 17px;
      color: #06111f;
      text-align: left;
      cursor: pointer;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.24);
      transition:
        transform 0.18s ease,
        filter 0.18s ease,
        box-shadow 0.18s ease;
    }

    .menu-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.04);
      box-shadow: 0 17px 34px rgba(0, 0, 0, 0.28);
    }

    .menu-btn:active {
      transform: translateY(0);
    }

    .checkin-btn {
      background: linear-gradient(135deg, #22c55e, #86efac);
    }

    .map-btn {
      background: linear-gradient(135deg, #38bdf8, #93c5fd);
    }

    .report-btn {
      background: linear-gradient(135deg, #f59e0b, #fde68a);
    }

    .icon {
      flex: 0 0 50px;
      width: 50px;
      height: 50px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.42);
      font-size: 29px;
    }

    .content {
      min-width: 0;
      flex: 1;
    }

    .name {
      display: block;
      font-size: clamp(19px, 4vw, 24px);
      font-weight: 900;
    }

    .description {
      display: block;
      margin-top: 3px;
      color: rgba(6, 17, 31, 0.72);
      font-size: 13px;
      font-weight: 650;
    }

    .arrow {
      flex: 0 0 auto;
      font-size: 24px;
      font-weight: 900;
    }

    .back-btn {
      width: 100%;
      min-height: 46px;
      margin-top: 18px;
      border: 1px solid rgba(148, 163, 184, 0.26);
      border-radius: 13px;
      background: #172033;
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .back-btn:hover {
      background: #202b40;
    }

    @media (max-width: 540px) {
      body {
        align-items: stretch;
        padding-left: 14px;
        padding-right: 14px;
      }

      .page {
        display: flex;
        align-items: center;
      }

      .card {
        width: 100%;
        padding: 20px 16px;
        border-radius: 20px;
      }

      .menu-btn {
        min-height: 72px;
        padding: 12px 14px;
      }

      .icon {
        flex-basis: 46px;
        width: 46px;
        height: 46px;
        font-size: 25px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="card">
      <h1 class="title">Quản lý Salon</h1>
      <p class="subtitle">
        Chọn chức năng cần sử dụng
      </p>

      <div class="menu">
        <button
          class="menu-btn checkin-btn"
          type="button"
          data-url="./app_checkin.html"
        >
          <span class="icon">📍</span>

          <span class="content">
            <span class="name">Check-in salon</span>
            <span class="description">
              Chụp ảnh và xác nhận vị trí
            </span>
          </span>

          <span class="arrow">›</span>
        </button>

        <button
          class="menu-btn map-btn"
          type="button"
          data-url="./xem_ban_do.html"
        >
          <span class="icon">🗺️</span>

          <span class="content">
            <span class="name">Xem bản đồ</span>
            <span class="description">
              Xem vị trí check-in trên bản đồ
            </span>
          </span>

          <span class="arrow">›</span>
        </button>

        <button
          class="menu-btn report-btn"
          type="button"
          data-url="./baocao_checkin_salon.html"
        >
          <span class="icon">📊</span>

          <span class="content">
            <span class="name">Báo cáo</span>
            <span class="description">
              Xem lịch sử và thống kê check-in
            </span>
          </span>

          <span class="arrow">›</span>
        </button>
      </div>

      <button id="btnBack" class="back-btn" type="button">
        ← Quay lại
      </button>
    </section>
  </main>

  <script>
    function getToken() {
      return (
        new URLSearchParams(location.search).get('token') ||
        sessionStorage.getItem('APP_ACCESS') ||
        ''
      );
    }

    function openPage(url) {
      const target = new URL(url, location.href);
      const token = getToken();

      if (token) {
        target.searchParams.set('token', token);
      }

      location.assign(target.toString());
    }

    document.querySelectorAll('[data-url]').forEach((button) => {
      button.addEventListener('click', () => {
        const url = button.dataset.url;

        if (!url) {
          alert('Chưa đặt đường dẫn cho chức năng này.');
          return;
        }

        openPage(url);
      });
    });

    document
      .getElementById('btnBack')
      .addEventListener('click', () => {
        if (document.referrer && history.length > 1) {
          history.back();
          return;
        }

        openPage('./main.html');
      });
  </script>
</body>
</html>
