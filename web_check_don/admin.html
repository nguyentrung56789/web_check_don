<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  />

  <title>Trang chính</title>

  <!-- Các file cấu hình và xác thực -->
  <script src="./js/internal_key.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/cod_config.js"></script>
  <script src="./js/auth_token.js"></script>

  <link rel="stylesheet" href="./css/main.css" />

  <style>
    :root {
      --bg:#0b1220;
      --card:#0f1830;
      --txt:#e6edff;
      --muted:#9aa7c7;

      --btn1:#2dd4bf;
      --btn2:#60a5fa;
      --btn3:#fbbf24;
      --btn4:#a78bfa;
      --btn5:#fb7185;
      --btn6:#34d399;
    }

    * {
      box-sizing:border-box;
    }

    html,
    body {
      height:100%;
    }

    body {
      visibility:hidden;
      margin:0;
      background:var(--bg);
      color:var(--txt);
      font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;
    }

    .top {
      position:fixed;
      z-index:10;
      left:0;
      right:0;
      top:0;

      display:flex;
      align-items:center;
      justify-content:space-between;

      padding:14px 18px;

      background:var(--card);
      border-bottom:1px solid #233043;
      box-shadow:0 2px 10px rgba(0,0,0,.35);
    }

    .hello {
      font-weight:600;
    }

    #btnLogout {
      background:none;
      border:0;
      color:#f87171;
      cursor:pointer;
      font-weight:700;
      font-size:15px;
    }

    #btnLogout:hover {
      text-decoration:underline;
    }

    .menu {
      width:min(520px,92vw);
      margin:120px auto 48px;

      display:grid;
      gap:18px;
    }

    .menu button {
      width:100%;
      padding:18px;

      border:0;
      border-radius:14px;

      cursor:pointer;
      font-weight:800;
      font-size:18px;

      color:#041a18;

      transition:
        transform .15s ease,
        filter .15s ease;
    }

    .menu button:hover {
      transform:scale(1.04);
      filter:brightness(1.06);
    }

    .menu button:active {
      transform:scale(1.01);
    }

    #admin {
      background:var(--btn1);
    }

    #donghang {
      background:var(--btn2);
    }

    #checkdon {
      background:var(--btn3);
      color:#3a2a04;
    }

    #mapview {
      background:var(--btn4);
    }

    #chamsockhachhang {
      background:var(--btn5);
      color:#3b0713;
    }

    #tinhdoanhso {
      background:var(--btn6);
      color:#052e20;
    }

    footer {
      text-align:center;
      color:var(--muted);
      font-size:12px;
      margin:8px 0 24px;
    }

    .hidden {
      display:none !important;
    }

    @media (max-width:520px) {
      .top {
        padding:12px 14px;
      }

      .menu {
        margin-top:100px;
        gap:14px;
      }

      .menu button {
        padding:16px;
        font-size:17px;
      }
    }
  </style>
</head>

<body>
  <noscript>
    <div
      style="
        padding:12px;
        background:#ffdbdb;
        color:#6b0000;
        text-align:center;
      "
    >
      Trình duyệt đang tắt JavaScript. Vui lòng bật JavaScript để tiếp tục.
    </div>
  </noscript>

  <header
    class="top"
    role="banner"
    aria-label="Thanh tiêu đề"
  >
    <div class="hello">
      Xin chào <span id="ten_nv">...</span> 👋
    </div>

    <button
      id="btnLogout"
      type="button"
      title="Đăng xuất"
    >
      Đăng xuất
    </button>
  </header>

  <main
    class="menu"
    role="main"
    aria-label="Menu chính"
  >
    <!-- Nút Admin vẫn do main.js quyết định có hiển thị hay không -->
    <button
      id="admin"
      type="button"
      class="admin-only hidden"
    >
      👤 Admin
    </button>

    <button
      id="donghang"
      type="button"
      class="dh-only hidden"
    >
      📦 Đóng hàng COD
    </button>

    <button
      id="checkdon"
      type="button"
      class="cd-only hidden"
    >
      🧾 Check đơn
    </button>

    <button
      id="mapview"
      type="button"
      class="map-only hidden"
    >
      🗺️ Xem bản đồ
    </button>

    <button
      id="chamsockhachhang"
      type="button"
      class="cskh-only hidden"
    >
      💬 Chăm sóc khách hàng
    </button>

    <!-- Nút này luôn hiển thị -->
    <button
      id="tinhdoanhso"
      type="button"
    >
      🧮 Tính doanh số nhân viên
    </button>
  </main>

  <footer>
    © <span id="year"></span> COD Internal
  </footer>

  <script type="module">
    document.getElementById('year').textContent =
      new Date().getFullYear();

    function getTokenFromAnywhere() {
      const currentParams =
        new URLSearchParams(window.location.search);

      return (
        currentParams.get('token') ||
        currentParams.get('access_token') ||
        currentParams.get('t') ||
        localStorage.getItem('token') ||
        localStorage.getItem('access_token') ||
        localStorage.getItem('cod_token') ||
        sessionStorage.getItem('token') ||
        sessionStorage.getItem('access_token') ||
        sessionStorage.getItem('cod_token') ||
        ''
      );
    }

    function openPageWithCurrentParams(path) {
      const targetUrl = new URL(path, window.location.href);
      const currentParams =
        new URLSearchParams(window.location.search);

      // Giữ toàn bộ tham số hiện tại
      currentParams.forEach((value, key) => {
        targetUrl.searchParams.set(key, value);
      });

      // Bổ sung token nếu URL hiện tại chưa có
      const token = getTokenFromAnywhere();

      if (token && !targetUrl.searchParams.get('token')) {
        targetUrl.searchParams.set('token', token);
      }

      window.location.href = targetUrl.href;
    }

    const btnAdmin = document.getElementById('admin');
    const btnTinhDoanhSo = document.getElementById('tinhdoanhso');

    // Bấm Admin → admin.html?token=...
    if (btnAdmin) {
      btnAdmin.addEventListener(
        'click',
        (event) => {
          event.preventDefault();
          event.stopImmediatePropagation();
          openPageWithCurrentParams('./admin.html');
        },
        true
      );
    }

    // Bấm Tính doanh số → tinhdoanhsonhanvien.html?token=...
    if (btnTinhDoanhSo) {
      btnTinhDoanhSo.addEventListener('click', () => {
        openPageWithCurrentParams('./tinhdoanhsonhanvien.html');
      });
    }
  </script>

  <!-- Vẫn giữ nguyên main.js để xác thực và phân quyền các nút -->
  <script type="module" src="./js/main.js"></script>
</body>
</html>
