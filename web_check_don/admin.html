<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Admin</title>

  <script src="./js/internal_key.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/cod_config.js"></script>
  <script src="./js/auth_token.js"></script>

  <style>
    :root{
      --bg:#0b1220;
      --card:#0f1830;
      --text:#e6edff;
      --muted:#9aa7c7;
      --primary:#2dd4bf;
      --primary-text:#042f2e;
      --danger:#f87171;
      --line:#233043;
    }

    *{
      box-sizing:border-box;
    }

    html,body{
      min-height:100%;
    }

    body{
      margin:0;
      background:linear-gradient(135deg,#0b1220,#111a2f);
      color:var(--text);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    }

    .topbar{
      position:fixed;
      top:0;
      left:0;
      right:0;
      z-index:10;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      min-height:64px;
      padding:12px 18px;
      background:var(--card);
      border-bottom:1px solid var(--line);
      box-shadow:0 4px 14px rgba(0,0,0,.25);
    }

    .title{
      font-size:20px;
      font-weight:800;
    }

    .back-btn{
      border:0;
      background:none;
      color:var(--danger);
      font-size:15px;
      font-weight:750;
      cursor:pointer;
    }

    .back-btn:hover{
      text-decoration:underline;
    }

    .menu{
      width:min(520px,92vw);
      margin:110px auto 40px;
      display:grid;
      gap:16px;
    }

    .menu-card{
      padding:22px;
      border:1px solid var(--line);
      border-radius:18px;
      background:rgba(15,24,48,.96);
      box-shadow:0 12px 34px rgba(0,0,0,.28);
    }

    .menu-card h1{
      margin:0 0 6px;
      font-size:22px;
    }

    .menu-card p{
      margin:0 0 20px;
      color:var(--muted);
      font-size:14px;
      line-height:1.5;
    }

    .menu-btn{
      width:100%;
      min-height:58px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      border:0;
      border-radius:14px;
      padding:14px 18px;
      background:var(--primary);
      color:var(--primary-text);
      font-size:18px;
      font-weight:850;
      cursor:pointer;
      transition:transform .15s ease,filter .15s ease;
    }

    .menu-btn:hover{
      transform:translateY(-1px);
      filter:brightness(1.06);
    }

    .menu-btn:active{
      transform:translateY(0);
    }

    footer{
      text-align:center;
      color:var(--muted);
      font-size:12px;
      padding:0 16px 24px;
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="title">⚙️ Trang quản trị</div>

    <button id="btnBack" class="back-btn" type="button">
      ← Quay lại
    </button>
  </header>

  <main class="menu">
    <section class="menu-card">
      <h1>Admin</h1>
      <p>Chọn chức năng quản trị bên dưới.</p>

      <button id="btnQuanLyNhanVien" class="menu-btn" type="button">
        👥 Quản lý nhân viên
      </button>
    </section>
  </main>

  <footer>
    © <span id="year"></span> COD Internal
  </footer>

  <script>
    document.getElementById('year').textContent =
      new Date().getFullYear();

    function openPageWithCurrentParams(path) {
      const targetUrl = new URL(path, window.location.href);
      const currentParams = new URLSearchParams(window.location.search);

      currentParams.forEach((value, key) => {
        targetUrl.searchParams.set(key, value);
      });

      const token =
        currentParams.get('token') ||
        currentParams.get('access_token') ||
        currentParams.get('t') ||
        localStorage.getItem('token') ||
        localStorage.getItem('access_token') ||
        localStorage.getItem('cod_token') ||
        sessionStorage.getItem('token') ||
        sessionStorage.getItem('access_token') ||
        sessionStorage.getItem('cod_token') ||
        '';

      if (token && !targetUrl.searchParams.get('token')) {
        targetUrl.searchParams.set('token', token);
      }

      window.location.href = targetUrl.href;
    }

    document
      .getElementById('btnQuanLyNhanVien')
      .addEventListener('click', () => {
        openPageWithCurrentParams('./quan_ly_nhan_vien_hoan_chinh.html');
      });

    document
      .getElementById('btnBack')
      .addEventListener('click', () => {
        if (window.history.length > 1) {
          window.history.back();
        } else {
          openPageWithCurrentParams('./index.html');
        }
      });
  </script>
</body>
</html>
