<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <title>Trang quản trị</title>

  <script src="./js/internal_key.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/cod_config.js"></script>
  <script src="./js/auth_token.js"></script>

  <style>
    :root {
      --bg: #0b1220;
      --card: #0f1830;
      --text: #e6edff;
      --muted: #9aa7c7;
      --line: #233043;
      --primary: #2dd4bf;
      --primary-hover: #5eead4;
      --primary-text: #042f2e;
      --secondary: #60a5fa;
      --secondary-hover: #93c5fd;
      --danger: #f87171;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      background: linear-gradient(135deg, #0b1220, #111a2f);
      color: var(--text);
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    .topbar {
      position: fixed;
      top: 0;
      right: 0;
      left: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-height: 64px;
      padding: 12px 18px;
      background: rgba(15, 24, 48, 0.98);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(10px);
    }

    .title {
      font-size: 20px;
      font-weight: 800;
    }

    .back-btn {
      border: 0;
      padding: 8px 4px;
      background: transparent;
      color: var(--danger);
      font-size: 15px;
      font-weight: 750;
      cursor: pointer;
    }

    .back-btn:hover {
      text-decoration: underline;
    }

    .wrap {
      width: min(560px, 92vw);
      margin: 110px auto 40px;
    }

    .card {
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(15, 24, 48, 0.98);
      box-shadow: 0 14px 38px rgba(0, 0, 0, 0.3);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 24px;
    }

    .desc {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .menu {
      display: grid;
      gap: 14px;
    }

    .menu-btn {
      width: 100%;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 0;
      border-radius: 14px;
      padding: 14px 18px;
      background: var(--primary);
      color: var(--primary-text);
      font-size: 18px;
      font-weight: 850;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      transition:
        transform 0.15s ease,
        background 0.15s ease,
        filter 0.15s ease;
    }

    .menu-btn:hover {
      transform: translateY(-1px);
      background: var(--primary-hover);
      filter: brightness(1.03);
    }

    .menu-btn:active {
      transform: translateY(0);
    }

    #linkDanhSachQuyen {
      background: var(--secondary);
      color: #071a34;
    }

    #linkDanhSachQuyen:hover {
      background: var(--secondary-hover);
    }

    footer {
      padding: 0 16px 24px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 520px) {
      .topbar {
        padding: 12px 14px;
      }

      .wrap {
        margin-top: 92px;
      }

      .card {
        padding: 20px;
      }

      .menu-btn {
        min-height: 56px;
        font-size: 17px;
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="title">⚙️ Trang quản trị</div>

    <button
      id="btnBack"
      class="back-btn"
      type="button"
    >
      ← Quay lại
    </button>
  </header>

  <main class="wrap">
    <section class="card">
      <h1>Admin</h1>

      <p class="desc">
        Chọn chức năng quản trị bên dưới.
      </p>

      <div class="menu">
        <a
          id="linkQuanLyNhanVien"
          class="menu-btn"
          href="./qly_nhanvien.html"
        >
          👥 Quản lý nhân viên
        </a>

        <a
          id="linkDanhSachQuyen"
          class="menu-btn"
          href="./danh_sach_quyen.html"
        >
          🛡️ Danh sách quyền
        </a>
      </div>
    </section>
  </main>

  <footer>
    © <span id="year"></span> COD Internal
  </footer>

  <script>
    (() => {
      'use strict';

      const yearElement =
        document.getElementById('year');

      const linkQuanLyNhanVien =
        document.getElementById('linkQuanLyNhanVien');

      const linkDanhSachQuyen =
        document.getElementById('linkDanhSachQuyen');

      const btnBack =
        document.getElementById('btnBack');

      if (yearElement) {
        yearElement.textContent =
          new Date().getFullYear();
      }

      function getTokenFromAnywhere() {
        const params =
          new URLSearchParams(window.location.search);

        return (
          params.get('token') ||
          params.get('access_token') ||
          params.get('t') ||
          localStorage.getItem('token') ||
          localStorage.getItem('access_token') ||
          localStorage.getItem('cod_token') ||
          sessionStorage.getItem('token') ||
          sessionStorage.getItem('access_token') ||
          sessionStorage.getItem('cod_token') ||
          ''
        );
      }

      function buildUrl(fileName) {
        const url =
          new URL(fileName, window.location.href);

        const currentParams =
          new URLSearchParams(window.location.search);

        currentParams.forEach((value, key) => {
          if (key !== '_v') {
            url.searchParams.set(key, value);
          }
        });

        const token = getTokenFromAnywhere();

        if (token) {
          url.searchParams.set('token', token);
        }

        url.searchParams.set(
          '_v',
          Date.now().toString()
        );

        return url.href;
      }

      function bindLink(element, fileName) {
        if (!element) return;

        element.href = buildUrl(fileName);

        element.addEventListener('click', event => {
          event.preventDefault();

          window.location.assign(
            buildUrl(fileName)
          );
        });
      }

      bindLink(
        linkQuanLyNhanVien,
        './qly_nhanvien.html'
      );

      bindLink(
        linkDanhSachQuyen,
        './themdanh_sachquyen.html'
      );

      if (btnBack) {
        btnBack.addEventListener('click', () => {
          if (
            document.referrer &&
            window.history.length > 1
          ) {
            window.history.back();
            return;
          }

          window.location.assign(
            buildUrl('./main.html')
          );
        });
      }
    })();
  </script>
</body>
</html>
