<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Danh sách khách hàng</title>

  <script src="./js/internal_key.js"></script>
  <script src="./js/cod_config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/check_login.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      visibility: hidden;
    }

    body.ready {
      visibility: visible;
    }

    .hidden {
      display: none !important;
    }

    .app {
      width: 100%;
      height: 100vh;
      padding: 6px;
      background: #f3f4f6;
      overflow: hidden;
    }

    .content {
      width: 100%;
      height: calc(100vh - 12px);
      background: #ffffff;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .toolbar {
      display: grid;
      grid-template-columns:
        minmax(320px, 1fr)
        minmax(220px, 320px)
        max-content
        max-content;
      gap: 8px;
      margin-bottom: 8px;
      align-items: center;
      position: relative;
      z-index: 30;
      background: #ffffff;
      flex: 0 0 auto;
      width: 100%;
      min-width: 0;
    }

    /* Không cho ô tìm kiếm và ô lọc nhân viên đè lên nhau */
    .toolbar > * {
      min-width: 0;
    }

    .toolbar .staff-dropdown {
      width: 100%;
      min-width: 0;
    }

    .toolbar input {
      width: 100%;
      height: 34px;
      padding: 6px 10px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      font-size: 13px;
      outline: none;
      background: #ffffff;
      color: #111827;
    }

    .toolbar input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.12);
    }

    .toolbar-second-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      flex: 0 0 auto;
      position: relative;
      z-index: 29;
    }

    #searchBtn {
      height: 34px;
      min-width: 78px;
      border: none;
      background: #2563eb;
      color: #ffffff;
      padding: 0 12px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }

    #searchBtn:hover {
      background: #1d4ed8;
    }

    #searchBtn.loading {
      opacity: 0.65;
      pointer-events: none;
    }

    #refreshBtn {
      height: 34px;
      min-width: 92px;
      border: none;
      background: #10b981;
      color: #ffffff;
      padding: 0 12px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }

    #refreshBtn:hover {
      background: #059669;
    }

    #runSelectedBtn {
      height: 34px;
      min-width: 82px;
      border: none;
      background: #7c3aed;
      color: #ffffff;
      padding: 0 14px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    #runSelectedBtn:hover {
      background: #6d28d9;
    }

    #runSelectedBtn:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    #selectedCountText {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 0 11px;
      border-radius: 7px;
      background: #eef2ff;
      color: #4338ca;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
      border: 1px solid #c7d2fe;
      transition: background .15s ease, color .15s ease, border-color .15s ease;
    }

    #selectedCountText:hover {
      background: #e0e7ff;
      border-color: #818cf8;
    }

    #selectedCountText.selected-filter-active {
      background: #4338ca;
      color: #ffffff;
      border-color: #4338ca;
    }

    #selectedCountText.selected-filter-active:hover {
      background: #3730a3;
      border-color: #3730a3;
    }

    #refreshBtn.loading,
    #refreshBtn:disabled {
      opacity: 0.65;
      pointer-events: none;
      cursor: not-allowed;
    }


    .select-col-cell{
      width:44px; min-width:44px; max-width:44px;
      text-align:center !important; overflow:visible !important;
    }

    .avatar-col-cell {
      width: 58px;
      min-width: 58px;
      max-width: 58px;
      text-align: center !important;
      overflow: visible !important;
    }

    .customer-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      display: inline-block;
      vertical-align: middle;
      border: 1px solid #e5e7eb;
      background: #f3f4f6;
    }

    .customer-avatar-placeholder {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      vertical-align: middle;
      border: 1px solid #e5e7eb;
      background: #f3f4f6;
      color: #9ca3af;
      font-size: 18px;
      font-weight: 700;
    }
    #selectAllRows,.row-select-checkbox{
      width:17px; height:17px; cursor:pointer; vertical-align:middle;
    }
    .customer-main-row.row-selected > td{
      background:#eef6ff;
    }

    .column-dropdown {
      position: relative;
      display: inline-block;
    }

    #columnToggleBtn {
      height: 34px;
      min-width: 82px;
      border: none;
      background: #374151;
      color: #ffffff;
      padding: 0 12px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }

    #columnToggleBtn:hover {
      background: #1f2937;
    }

    .column-dropdown-menu {
      position: absolute;
      top: 38px;
      right: 0;
      width: 220px;
      max-height: 300px;
      overflow-y: auto;
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.16);
      padding: 8px;
      z-index: 1200;
    }

    .column-dropdown-menu label {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 6px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 13px;
      color: #111827;
    }

    .column-dropdown-menu label:hover {
      background: #f3f4f6;
    }

    .column-dropdown-menu input {
      width: auto;
      height: auto;
      margin: 0;
    }

    .customer-table col.col-hidden,
    .customer-table th.col-hidden,
    .customer-table td.col-hidden {
      display: none !important;
    }

    .staff-dropdown {
      position: relative;
      width: 100%;
    }

    #staffDropdownBtn {
      width: 100%;
      height: 34px;
      padding: 6px 10px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      background: #ffffff;
      text-align: left;
      cursor: pointer;
      font-size: 13px;
      color: #111827;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #staffDropdownBtn:hover {
      border-color: #2563eb;
    }

    #staffDropdownBtn:disabled {
      opacity: 1;
      cursor: not-allowed;
      background: #f3f4f6;
      color: #374151;
      border-color: #d1d5db;
    }

    .staff-dropdown-menu {
      position: absolute;
      top: 38px;
      left: 0;
      width: 100%;
      min-width: 170px;
      max-height: 230px;
      overflow-y: auto;
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.12);
      padding: 6px;
      z-index: 1000;
    }

    .staff-dropdown-menu label {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px;
      cursor: pointer;
      font-size: 13px;
      color: #111827;
      border-radius: 6px;
    }

    .staff-dropdown-menu label:hover {
      background: #f3f4f6;
    }

    .staff-dropdown-menu input {
      width: auto;
      height: auto;
      margin: 0;
    }

    .table-wrap {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      border-top: 1px solid #f3f4f6;
    }

    .customer-table {
      width: max-content;
      min-width: 720px;
      border-collapse: collapse;
      font-size: 13px;
      table-layout: fixed;
      margin-top: 0;
    }

    .customer-table th,
    .customer-table td {
      padding: 8px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
      white-space: nowrap;
      vertical-align: middle;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .customer-table th[data-col="ma_nv"],
    .customer-table td[data-col="ma_nv"] {
      min-width: 190px;
      max-width: 190px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .customer-table th {
      background: #f9fafb;
      font-weight: 700;
      color: #111827;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .customer-table tr:hover td {
      background: #f9fafb;
    }

    .customer-table th.sortable {
      cursor: pointer;
      user-select: none;
    }

    .customer-table th.sortable:hover {
      background: #eef2ff;
    }

    .sort-icon {
      margin-left: 4px;
      font-size: 11px;
      color: #2563eb;
    }

    .customer-table button {
      border: none;
      background: #2563eb;
      color: #ffffff;
      padding: 5px 9px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }

    .customer-table button:hover {
      background: #1d4ed8;
    }

    .customer-table tbody {
      transition: opacity 0.12s ease;
    }

    .customer-table tbody.loading {
      opacity: 0.45;
      pointer-events: none;
    }

    .customer-table th.resizable {
      position: sticky;
      top: 0;
    }

    .col-resizer {
      position: absolute;
      top: 0;
      right: 0;
      width: 7px;
      height: 100%;
      cursor: col-resize;
      user-select: none;
      touch-action: none;
      z-index: 30;
    }

    .col-resizer::after {
      content: "";
      position: absolute;
      top: 20%;
      bottom: 20%;
      left: 3px;
      width: 1px;
      background: transparent;
    }

    .col-resizer:hover::after,
    .col-resizer.active::after {
      background: #2563eb;
    }


    /* ===================== KÉO / THẢ ĐỂ DI CHUYỂN CỘT ===================== */
    .customer-table th.column-draggable {
      cursor: grab;
    }

    .customer-table th.column-draggable:active {
      cursor: grabbing;
    }

    .customer-table th.column-dragging {
      opacity: .45;
    }

    .customer-table th.column-drag-over {
      box-shadow: inset 3px 0 0 #2563eb;
      background: #eef2ff !important;
    }

    body.resizing-column {
      cursor: col-resize;
      user-select: none;
    }

    .staff-cell-select {
      width: 100%;
      height: 34px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background: #ffffff;
      color: #111827;
      font-size: 13px;
      padding: 0 6px;
      cursor: pointer;
    }

    .staff-cell-select:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.12);
    }

    .staff-cell-select.changed {
      border-color: #f97316;
      background: #fff7ed;
    }


    .xung-ho-select {
      width: 100%;
      min-width: 74px;
      height: 32px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      background: #ffffff;
      color: #111827;
      font-size: 13px;
      padding: 0 7px;
      cursor: pointer;
    }

    .xung-ho-select:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.12);
    }

    .xung-ho-select.saving {
      opacity: .6;
      pointer-events: none;
    }

    /* ===================== MÔ TẢ: NHẬP TRỰC TIẾP + TỰ LƯU ===================== */
    .mo-ta-input {
      width: 100%;
      min-width: 220px;
      height: 32px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      background: #ffffff;
      color: #111827;
      font-size: 13px;
      padding: 0 8px;
      outline: none;
      font-family: inherit;
    }

    .mo-ta-input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.12);
    }

    .mo-ta-input.saving {
      opacity: .6;
      background: #f3f4f6;
      pointer-events: none;
    }


    /* ===================== CHÂN DUNG KH: CLICK ĐỂ MỞ RỘNG ===================== */
    .chan-dung-kh-cell {
      cursor: pointer;
      vertical-align: top !important;
    }

    .chan-dung-kh-content {
      display: block;
      width: 100%;
      max-height: 36px;
      line-height: 18px;
      white-space: normal;
      overflow: hidden;
      text-overflow: ellipsis;
      word-break: break-word;
      padding: 2px 4px;
      border-radius: 6px;
    }

    .chan-dung-kh-cell:hover .chan-dung-kh-content {
      background: #f9fafb;
    }

    .chan-dung-kh-cell.expanded {
      overflow: visible !important;
      white-space: normal !important;
      text-overflow: initial !important;
    }

    .chan-dung-kh-cell.expanded .chan-dung-kh-content {
      max-height: none;
      overflow: visible;
      white-space: pre-wrap;
      background: #fffbea;
      border: 1px solid #facc15;
      padding: 8px;
      min-width: 280px;
    }

    /* ===================== HỎI CHĂM SÓC: SỬA TRỰC TIẾP ===================== */
    .hoi-cham-soc-input {
      width: 100%;
      min-width: 220px;
      height: 32px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      background: #ffffff;
      color: #111827;
      font-size: 13px;
      padding: 0 8px;
      outline: none;
      font-family: inherit;
    }

    .hoi-cham-soc-input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.12);
    }

    .hoi-cham-soc-input.saving {
      opacity: .6;
      background: #f3f4f6;
      pointer-events: none;
    }


    /* ===================== FACEBOOK: NHẬP TRỰC TIẾP + TỰ LƯU + XEM LINK ===================== */
    .facebook-cell-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      min-width: 0;
      overflow: visible;
    }

    .facebook-input {
      flex: 1 1 auto;
      width: 0;
      min-width: 80px;
      height: 32px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      background: #ffffff;
      color: #111827;
      font-size: 13px;
      padding: 0 8px;
      outline: none;
      font-family: inherit;
    }

    .facebook-input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.12);
    }

    .facebook-input.saving {
      opacity: .6;
      background: #f3f4f6;
      pointer-events: none;
    }

    .facebook-view-btn {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 32px;
      min-width: 68px;
      padding: 0 8px;
      border-radius: 7px;
      background: #1877f2;
      color: #ffffff !important;
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .customer-table td[data-col="facebook"] {
      overflow: visible !important;
      text-overflow: initial !important;
    }

    .facebook-view-btn:hover {
      background: #166fe5;
    }

    .facebook-view-btn.disabled {
      opacity: .45;
      pointer-events: none;
    }

    .staff-chip-editor {
      min-height: 38px;
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      background: #ffffff;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      padding: 4px 7px;
      cursor: pointer;
      overflow: visible;
    }

    .staff-chip-editor:hover,
    .staff-chip-editor.active {
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.12);
    }

    .staff-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 145px;
      min-height: 28px;
      padding: 4px 8px;
      border-radius: 8px;
      background: #eef0f3;
      color: #111827;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
    }

    .staff-chip-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .staff-chip-remove {
      border: none;
      background: transparent;
      color: #4b5563;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      padding: 0 1px;
      font-weight: 800;
    }

    .staff-chip-remove:hover {
      color: #dc2626;
    }

    .staff-chip-placeholder {
      color: #6b7280;
      font-size: 13px;
      padding: 4px 2px;
    }

    .staff-chip-picker {
      position: fixed;
      z-index: 6500;
      width: 300px;
      max-width: calc(100vw - 24px);
      max-height: 320px;
      overflow-y: auto;
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.2);
      padding: 8px;
    }

    .staff-chip-picker-title {
      font-size: 13px;
      font-weight: 800;
      color: #111827;
      margin: 2px 4px 8px;
    }

    .staff-chip-picker label {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 7px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      color: #111827;
    }

    .staff-chip-picker label:hover {
      background: #f3f4f6;
    }

    .staff-chip-picker input {
      width: auto;
      height: auto;
      margin: 0;
    }


    .staff-chip-option {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 9px 10px;
      border: none;
      border-radius: 9px;
      cursor: pointer;
      font-size: 13px;
      color: #111827;
      background: transparent;
      text-align: left;
      font-family: inherit;
    }

    .staff-chip-option:hover {
      background: #f3f4f6;
    }

    .staff-chip-option-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 600;
    }

    .staff-chip-empty-option {
      padding: 10px;
      color: #6b7280;
      font-size: 13px;
    }

    .footer-actions {
      margin-top: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: #6b7280;
      flex-wrap: wrap;
      background: #ffffff;
      padding-top: 6px;
      padding-bottom: 2px;
      flex: 0 0 auto;
    }

    .page-actions,
    .user-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    #pageSizeSelect {
      height: 28px;
      border: 1px solid #d1d5db;
      background: #ffffff;
      border-radius: 6px;
      padding: 0 8px;
      font-size: 12px;
      color: #111827;
    }

    .page-actions button {
      min-width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      color: #374151;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }

    .page-actions button:hover {
      background: #f3f4f6;
    }

    .page-actions button:disabled {
      color: #cbd5e1;
      cursor: not-allowed;
      background: transparent;
    }

    #pageInput {
      width: 48px;
      height: 28px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      text-align: center;
      font-size: 12px;
      outline: none;
    }

    #pageInput:focus {
      border-color: #2563eb;
    }

    #pageInfo {
      color: #374151;
      font-size: 12px;
      white-space: nowrap;
      min-width: 165px;
    }

    #userInfo {
      max-width: 360px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #logoutBtn {
      border: none;
      background: #ef4444;
      color: #ffffff;
      padding: 5px 8px;
      border-radius: 5px;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
    }

    #logoutBtn:hover {
      background: #dc2626;
    }

    .floating-save-bar {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 5000;
      min-width: 320px;
      max-width: calc(100vw - 36px);
      background: #111827;
      color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.28);
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .floating-save-bar b {
      display: block;
      font-size: 13px;
    }

    #saveMessage {

    const LOGIN_STORAGE_KEY = "nv";
    function getConfiguredTableName(configName, fallbackTable) {
      try {
        if (typeof window.getConfig === "function") {
          const cfg = window.getConfig(configName);

          if (cfg && typeof cfg === "object" && cfg.table) {
            return cfg.table;
          }
        }
      } catch (error) {
        console.warn("Không lấy được cấu hình bảng:", configName, error);
      }

      return fallbackTable;
    }

    const TABLE_NHAN_VIEN = getConfiguredTableName("index", "kv_nhan_vien");

    // Bảng/view dùng để ĐỌC danh sách khách hàng trên giao diện.

function normalizeBigintOrNull(value) {
      if (value === undefined || value === null) return null;

      const text = String(value).trim();
      if (!text) return null;

      const lowered = text.toLowerCase();
      if (lowered === "undefined" || lowered === "null" || lowered === "nan") {
        return null;
      }

      return /^\d+$/.test(text) ? text : null;
    }

    function normalizeTimestampOrNull(value) {
      if (value === undefined || value === null) return null;

      const text = String(value).trim();
      if (!text) return null;

      const lowered = text.toLowerCase();
      if (
        lowered === "undefined" ||
        lowered === "null" ||
        lowered === "nan"
      ) {
        return null;
      }

      const date = new Date(text);

      if (Number.isNaN(date.getTime())) {
        return null;
      }

      return date.toISOString();
    }

    async function syncSelectedCustomersToGuiTin(selectedRows) {
      if (!supabaseClient) {
        throw new Error("Supabase chưa sẵn sàng.");
      }

      const selectedMaKh = Array.from(new Set(
        (selectedRows || [])
          .map(function (row) { return String(row.ma_kh || "").trim(); })
          .filter(Boolean)
      ));

      if (selectedMaKh.length === 0) {
        throw new Error("Chưa chọn khách hàng nào.");
      }

      // Lấy ma_nv đang chọn ở dropdown để khi bấm Chạy
      // chỉ đọc đúng dữ liệu của nhân viên đang được lọc.
      const selectedStaffDbCodes = getSelectedStaffDbCodes();

      let customerQuery = supabaseClient
        .from(TABLE_KHACH_HANG)
        .select("ma_kh, ten_kh, zalo_name, ma_nv, dia_chi, khu_vuc, phuong_xa, dien_thoai, xung_ho, conversation_id, contact_id, ngay_chat_cuoi, uid_from, reminderid, gio_hen, check")
        .in("ma_kh", selectedMaKh);

      if (selectedStaffDbCodes.length > 0) {
        customerQuery = customerQuery.in("ma_nv", selectedStaffDbCodes);
      }

      const { data: customerIdRows, error: customerIdError } = await customerQuery;

      if (customerIdError) {
        throw customerIdError;
      }

      // Khóa theo ma_kh + ma_nv để các dòng cùng khách nhưng khác nhân viên
      // không ghi đè lẫn nhau.
      const customerIdMap = new Map();
      (customerIdRows || []).forEach(function (row) {
        const maKh = String(row.ma_kh || "").trim();
        const maNv = String(row.ma_nv || "").trim();
        customerIdMap.set(maKh + "|" + maNv, row);
      });

      const selectedMaNv = Array.from(new Set(
        []
          .concat(customerIdRows || [])
          .concat(selectedRows || [])
          .map(function (row) { return String(row.ma_nv || "").trim(); })
          .filter(Boolean)
      ));

      const staffNameMap = new Map();

      if (selectedMaNv.length > 0) {
        const { data: staffRowsForName, error: staffError } = await supabaseClient
          .from(TABLE_NHAN_VIEN)
          .select("ma_nv, ten_nv")
          .in("ma_nv", selectedMaNv);

        if (staffError) {
          throw staffError;
        }

        (staffRowsForName || []).forEach(function (staff) {
          staffNameMap.set(
            String(staff.ma_nv || "").trim(),
            String(staff.ten_nv || "").trim()
          );
        });
      }

      // Đọc reminderid + gio_hen hiện có từ bảng gửi tin để làm fallback.
      // View sql_khachhang_nhanvien hiện đã có 2 cột này và được ưu tiên khi INSERT.
      const existingConversationIds = Array.from(new Set(
        (selectedRows || [])
          .map(function (row) {
            return normalizeBigintOrNull(row.conversation_id);
          })
          .filter(Boolean)
      ));

      const reminderMap = new Map();

      if (existingConversationIds.length > 0) {
        const { data: reminderRows, error: reminderReadError } = await supabaseClient
          .from(TABLE_KHACH_HANG_NHANVIEN_GUITIN)
          .select("conversation_id, reminderid, gio_hen")
          .in("conversation_id", existingConversationIds);

        if (reminderReadError) {
          throw reminderReadError;
        }

        (reminderRows || []).forEach(function (item) {
          const key = normalizeBigintOrNull(item.conversation_id);
          if (!key) return;

          reminderMap.set(String(key), {
            reminderid: normalizeBigintOrNull(item.reminderid),
            gio_hen: normalizeTimestampOrNull(item.gio_hen)
          });
        });
      }

      // Xóa danh sách gửi tin cũ trước khi ghi danh sách mới.
      // Nếu dropdown đang lọc nhân viên thì chỉ xóa đúng ma_nv đó.
      let deleteQuery = supabaseClient
        .from(TABLE_KHACH_HANG_NHANVIEN_GUITIN)
        .delete()
        .not("conversation_id", "is", null);

      if (selectedStaffDbCodes.length > 0) {
        deleteQuery = deleteQuery.in("ma_nv", selectedStaffDbCodes);
      }

      const { error: deleteError } = await deleteQuery;

      if (deleteError) {
        throw deleteError;
      }

      const mappedRows = (selectedRows || []).map(function (row) {
        const maKh = String(row.ma_kh || "").trim();
        const rowMaNv = String(row.ma_nv || "").trim();
        const idRow = customerIdMap.get(maKh + "|" + rowMaNv) || {};

        const maNv = idRow.ma_nv
          ? String(idRow.ma_nv).trim()
          : (row.ma_nv ? String(row.ma_nv).trim() : null);

        const conversationId = normalizeBigintOrNull(
          row.conversation_id ?? idRow.conversation_id
        );

        const contactId = normalizeBigintOrNull(
          idRow.contact_id ?? row.contact_id
        );

        return {
  ma_kh: maKh,
  ten_kh: String(idRow.ten_kh ?? row.ten_kh ?? "").trim() || null,
  zalo_name: String(idRow.zalo_name ?? row.zalo_name ?? "").trim() || null,

  ma_nv: maNv,

  ten_nv: maNv
    ? (staffNameMap.get(maNv) || String(row.ten_nv || "").trim() || null)
    : null,

  dia_chi:
    String(idRow.dia_chi ?? row.dia_chi ?? "").trim() || null,

  khu_vuc:
    String(idRow.khu_vuc ?? row.khu_vuc ?? "").trim() || null,

  phuong_xa:
    String(idRow.phuong_xa ?? row.phuong_xa ?? "").trim() || null,

  dien_thoai:
    String(idRow.dien_thoai ?? row.dien_thoai ?? "").trim() || null,

  // Xưng hô được lấy từ sql_khachhang_nhanvien và ghi sang
  // kv_khachhang_nhanvien_guitin khi bấm Chạy.
  xung_ho:
    String(idRow.xung_ho ?? row.xung_ho ?? "").trim() || null,

  conversation_id: conversationId,
  contact_id: contactId,

  ngay_chat_cuoi:
    idRow.ngay_chat_cuoi ?? row.ngay_chat_cuoi ?? null,

  // uid_from là TEXT, có thể có dạng: 329078395489441443_291908697028
  // Không được ép bigint vì sẽ làm giá trị có dấu "_" thành null.
  uid_from:
    String(idRow.uid_from ?? row.uid_from ?? "").trim() || null,

  // reminderid + gio_hen:
  // ưu tiên dữ liệu nguồn sql_khachhang_nhanvien,
  // nếu nguồn chưa có thì giữ lại giá trị cũ trong bảng guitin.
  reminderid:
    normalizeBigintOrNull(
      idRow.reminderid ??
      row.reminderid ??
      reminderMap.get(String(conversationId || ""))?.reminderid
    ),

  gio_hen:
    normalizeTimestampOrNull(
      idRow.gio_hen ??
      row.gio_hen ??
      reminderMap.get(String(conversationId || ""))?.gio_hen
    ),

  check: true,

  trang_thai: null
};
      }).filter(function (row) {
        return !!row.ma_kh && row.conversation_id !== null;
      });

      const seenConversationIds = new Set();
      const rowsToInsert = mappedRows.filter(function (row) {
        const key = String(row.conversation_id);

        if (seenConversationIds.has(key)) {
          return false;
        }

        seenConversationIds.add(key);
        return true;
      });

      if (rowsToInsert.length === 0) {
        throw new Error("Không có khách nào có conversation_id hợp lệ.");
      }

      // Chốt an toàn lần cuối trước khi INSERT.
      // Các cột ID số vẫn chuẩn hóa bigint; riêng uid_from phải giữ dạng TEXT.
      rowsToInsert.forEach(function (item) {
        item.conversation_id = normalizeBigintOrNull(item.conversation_id);
        item.contact_id = normalizeBigintOrNull(item.contact_id);

        const uidText = String(item.uid_from ?? "").trim();
        item.uid_from =
          !uidText || ["undefined", "null", "nan"].includes(uidText.toLowerCase())
            ? null
            : uidText;

        item.reminderid = normalizeBigintOrNull(item.reminderid);
        item.gio_hen = normalizeTimestampOrNull(item.gio_hen);
      });

      console.log("[GUI_TIN] rowsToInsert:", rowsToInsert);
      console.table(rowsToInsert.map(function (item) {
        return {
          ma_kh: item.ma_kh,
          conversation_id: item.conversation_id,
          uid_from: item.uid_from,
          xung_ho: item.xung_ho,
          reminderid: item.reminderid,
          gio_hen: item.gio_hen
        };
      }));

      const { error: insertError } = await supabaseClient
        .from(TABLE_KHACH_HANG_NHANVIEN_GUITIN)
        .insert(rowsToInsert);

      if (insertError) {
        throw insertError;
      }

      return rowsToInsert.length;
    }

      */
      const popupWidth = 1100;
      const popupHeight = 700;

      const popupLeft = Math.max(
        0,
        Math.round((window.screen.width - popupWidth) / 2)
      );

      const popupTop = Math.max(
        0,
        Math.round((window.screen.height - popupHeight) / 2)
      );

      const popupWindow = window.open(
        "about:blank",
        "guitinPopup",
        [
          "width=" + popupWidth,
          "height=" + popupHeight,
          "left=" + popupLeft,
          "top=" + popupTop,
          "resizable=yes",
          "scrollbars=yes"
        ].join(",")
      );

      if (!popupWindow) {
        showNotice(
          "Trình duyệt đang chặn popup. Hãy cho phép popup cho trang này.",

          idNvDangNhap =

        if (!idNvDangNhap) {
          throw new Error(
            "Không lấy được id_nv của nhân viên đang đăng nhập."
          );
        }

        /*
          Đồng bộ các khách đã chọn sang bảng gửi tin.
        */
        const count =
          await syncSelectedCustomersToGuiTin(
            selectedRows
          );

        /*
          Truyền:
          - id_nv đăng nhập
          - quyền staffDropdownBtn.duoc_xem
        */
        const popupParams =
          new URLSearchParams();

        popupParams.set(
          "id_nv",
          idNvDangNhap
        );

        popupParams.set(
          "duoc_xem",
          duocLocTheoNhanVien === true
            ? "true"
            : "false"
        );

        const popupUrl =
          "./chamsockhachhang_guitin.html?" +
          popupParams.toString();

        /*
          Popup đã mở sẵn nên chỉ cần chuyển URL.
        */
        popupWindow.location.href =
          popupUrl;

        popupWindow.focus();

        console.log(
          "[MỞ FORM GỬI TIN]",
          {
            id_nv: idNvDangNhap,
            duoc_xem:
              duocLocTheoNhanVien === true,
            popupUrl: popupUrl,
            so_khach: count
          }
        );

        showNotice(
          "Đã cập nhật " +
          count +
          " khách. Đã mở form gửi tin.",
          "success",
          1800
        );

      } catch (error) {
        console.error(
          "Lỗi mở form gửi tin:",
          error
        );

        try {
          popupWindow.close();
        } catch (e) {}

        showNotice(
          "Không mở được form gửi tin: " +
          (
            error.message ||
            String(error)
          ),
          "error",
          5000
        );
      } finally {
        runSelectedBtn.disabled = false;
        runSelectedBtn.textContent = "▶ Chạy";
      }
    }

    if (runSelectedBtn) {
      runSelectedBtn.addEventListener("click", runSelectedCustomers);
    }

    if (selectedCountText) {
      selectedCountText.addEventListener("click", function (event) {
        event.preventDefault();
        event.stopPropagation();
        toggleSelectedOnlyFilter();
      });

      selectedCountText.addEventListener("keydown", function (event) {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          toggleSelectedOnlyFilter();
        }
      });
    }
