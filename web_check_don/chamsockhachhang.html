<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Danh sách khách hàng</title>

  <script src="./js/internal_key.js"></script>
  <script src="./js/cod_config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/check_login.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      visibility: hidden;
    }

    body.ready {
      visibility: visible;
    }

    .hidden {
      display: none !important;
    }

    .app {
      width: 100%;
      height: 100vh;
      padding: 6px;
      background: #f3f4f6;
      overflow: hidden;
    }

    .content {
      width: 100%;
      height: calc(100vh - 12px);
      background: #ffffff;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #e5e7eb;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .toolbar {
      display: grid;
      grid-template-columns:
        minmax(320px, 1fr)
        minmax(220px, 320px)
        max-content
        max-content;
      gap: 8px;
      margin-bottom: 8px;
      align-items: center;
      position: relative;
      z-index: 30;
      background: #ffffff;
      flex: 0 0 auto;
      width: 100%;
      min-width: 0;
    }

    /* Không cho ô tìm kiếm và ô lọc nhân viên đè lên nhau */
    .toolbar > * {
      min-width: 0;
    }

    .toolbar .staff-dropdown {
      width: 100%;
      min-width: 0;
    }

    .toolbar input {
      width: 100%;
      height: 34px;
      padding: 6px 10px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      font-size: 13px;
      outline: none;
      background: #ffffff;
      color: #111827;
    }

    .toolbar input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.12);
    }

    .toolbar-second-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      flex: 0 0 auto;
      position: relative;
      z-index: 29;
    }

    #searchBtn {
      height: 34px;
      min-width: 78px;
      border: none;
      background: #2563eb;
      color: #ffffff;
      padding: 0 12px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }

    #searchBtn:hover {
      background: #1d4ed8;
    }

    #searchBtn.loading {
      opacity: 0.65;
      pointer-events: none;
    }

    #refreshBtn {
      height: 34px;
      min-width: 92px;
      border: none;
      background: #10b981;
      color: #ffffff;
      padding: 0 12px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }

    #refreshBtn:hover {
      background: #059669;
    }

    #runSelectedBtn {
      height: 34px;
      min-width: 82px;
      border: none;
      background: #7c3aed;
      color: #ffffff;
      padding: 0 14px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    #runSelectedBtn:hover {
      background: #6d28d9;
    }

    #runSelectedBtn:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    #selectedCountText {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 0 11px;
      border-radius: 7px;
      background: #eef2ff;
      color: #4338ca;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    #refreshBtn.loading,
    #refreshBtn:disabled {
      opacity: 0.65;
      pointer-events: none;
      cursor: not-allowed;
    }


    .select-col-cell{
      width:44px; min-width:44px; max-width:44px;
      text-align:center !important; overflow:visible !important;
    }
    #selectAllRows,.row-select-checkbox{
      width:17px; height:17px; cursor:pointer; vertical-align:middle;
    }
    .customer-main-row.row-selected > td{
      background:#eef6ff;
    }

    .column-dropdown {
      position: relative;
      display: inline-block;
    }

    #columnToggleBtn {
      height: 34px;
      min-width: 82px;
      border: none;
      background: #374151;
      color: #ffffff;
      padding: 0 12px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }

    #columnToggleBtn:hover {
      background: #1f2937;
    }

    .column-dropdown-menu {
      position: absolute;
      top: 38px;
      right: 0;
      width: 220px;
      max-height: 300px;
      overflow-y: auto;
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.16);
      padding: 8px;
      z-index: 1200;
    }

    .column-dropdown-menu label {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 6px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 13px;
      color: #111827;
    }

    .column-dropdown-menu label:hover {
      background: #f3f4f6;
    }

    .column-dropdown-menu input {
      width: auto;
      height: auto;
      margin: 0;
    }

    .customer-table col.col-hidden,
    .customer-table th.col-hidden,
    .customer-table td.col-hidden {
      display: none !important;
    }

    .staff-dropdown {
      position: relative;
      width: 100%;
    }

    #staffDropdownBtn {
      width: 100%;
      height: 34px;
      padding: 6px 10px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      background: #ffffff;
      text-align: left;
      cursor: pointer;
      font-size: 13px;
      color: #111827;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #staffDropdownBtn:hover {
      border-color: #2563eb;
    }

    #staffDropdownBtn:disabled {
      opacity: 1;
      cursor: not-allowed;
      background: #f3f4f6;
      color: #374151;
      border-color: #d1d5db;
    }

    .staff-dropdown-menu {
      position: absolute;
      top: 38px;
      left: 0;
      width: 100%;
      min-width: 170px;
      max-height: 230px;
      overflow-y: auto;
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.12);
      padding: 6px;
      z-index: 1000;
    }

    .staff-dropdown-menu label {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px;
      cursor: pointer;
      font-size: 13px;
      color: #111827;
      border-radius: 6px;
    }

    .staff-dropdown-menu label:hover {
      background: #f3f4f6;
    }

    .staff-dropdown-menu input {
      width: auto;
      height: auto;
      margin: 0;
    }

    .table-wrap {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      border-top: 1px solid #f3f4f6;
    }

    .customer-table {
      width: max-content;
      min-width: 720px;
      border-collapse: collapse;
      font-size: 13px;
      table-layout: fixed;
      margin-top: 0;
    }

    .customer-table th,
    .customer-table td {
      padding: 8px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
      white-space: nowrap;
      vertical-align: middle;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .customer-table th[data-col="ma_nv"],
    .customer-table td[data-col="ma_nv"] {
      min-width: 190px;
      max-width: 190px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .customer-table th {
      background: #f9fafb;
      font-weight: 700;
      color: #111827;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .customer-table tr:hover td {
      background: #f9fafb;
    }

    .customer-table th.sortable {
      cursor: pointer;
      user-select: none;
    }

    .customer-table th.sortable:hover {
      background: #eef2ff;
    }

    .sort-icon {
      margin-left: 4px;
      font-size: 11px;
      color: #2563eb;
    }

    .customer-table button {
      border: none;
      background: #2563eb;
      color: #ffffff;
      padding: 5px 9px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }

    .customer-table button:hover {
      background: #1d4ed8;
    }

    .customer-table tbody {
      transition: opacity 0.12s ease;
    }

    .customer-table tbody.loading {
      opacity: 0.45;
      pointer-events: none;
    }

    .customer-table th.resizable {
      position: sticky;
      top: 0;
    }

    .col-resizer {
      position: absolute;
      top: 0;
      right: 0;
      width: 7px;
      height: 100%;
      cursor: col-resize;
      user-select: none;
      touch-action: none;
      z-index: 30;
    }

    .col-resizer::after {
      content: "";
      position: absolute;
      top: 20%;
      bottom: 20%;
      left: 3px;
      width: 1px;
      background: transparent;
    }

    .col-resizer:hover::after,
    .col-resizer.active::after {
      background: #2563eb;
    }

    body.resizing-column {
      cursor: col-resize;
      user-select: none;
    }

    .staff-cell-select {
      width: 100%;
      height: 34px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background: #ffffff;
      color: #111827;
      font-size: 13px;
      padding: 0 6px;
      cursor: pointer;
    }

    .staff-cell-select:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.12);
    }

    .staff-cell-select.changed {
      border-color: #f97316;
      background: #fff7ed;
    }

    .staff-chip-editor {
      min-height: 38px;
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      background: #ffffff;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      padding: 4px 7px;
      cursor: pointer;
      overflow: visible;
    }

    .staff-chip-editor:hover,
    .staff-chip-editor.active {
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.12);
    }

    .staff-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 145px;
      min-height: 28px;
      padding: 4px 8px;
      border-radius: 8px;
      background: #eef0f3;
      color: #111827;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
    }

    .staff-chip-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .staff-chip-remove {
      border: none;
      background: transparent;
      color: #4b5563;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      padding: 0 1px;
      font-weight: 800;
    }

    .staff-chip-remove:hover {
      color: #dc2626;
    }

    .staff-chip-placeholder {
      color: #6b7280;
      font-size: 13px;
      padding: 4px 2px;
    }

    .staff-chip-picker {
      position: fixed;
      z-index: 6500;
      width: 300px;
      max-width: calc(100vw - 24px);
      max-height: 320px;
      overflow-y: auto;
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.2);
      padding: 8px;
    }

    .staff-chip-picker-title {
      font-size: 13px;
      font-weight: 800;
      color: #111827;
      margin: 2px 4px 8px;
    }

    .staff-chip-picker label {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 7px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      color: #111827;
    }

    .staff-chip-picker label:hover {
      background: #f3f4f6;
    }

    .staff-chip-picker input {
      width: auto;
      height: auto;
      margin: 0;
    }


    .staff-chip-option {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 9px 10px;
      border: none;
      border-radius: 9px;
      cursor: pointer;
      font-size: 13px;
      color: #111827;
      background: transparent;
      text-align: left;
      font-family: inherit;
    }

    .staff-chip-option:hover {
      background: #f3f4f6;
    }

    .staff-chip-option-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 600;
    }

    .staff-chip-empty-option {
      padding: 10px;
      color: #6b7280;
      font-size: 13px;
    }

    .footer-actions {
      margin-top: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: #6b7280;
      flex-wrap: wrap;
      background: #ffffff;
      padding-top: 6px;
      padding-bottom: 2px;
      flex: 0 0 auto;
    }

    .page-actions,
    .user-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    #pageSizeSelect {
      height: 28px;
      border: 1px solid #d1d5db;
      background: #ffffff;
      border-radius: 6px;
      padding: 0 8px;
      font-size: 12px;
      color: #111827;
    }

    .page-actions button {
      min-width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      color: #374151;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }

    .page-actions button:hover {
      background: #f3f4f6;
    }

    .page-actions button:disabled {
      color: #cbd5e1;
      cursor: not-allowed;
      background: transparent;
    }

    #pageInput {
      width: 48px;
      height: 28px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      text-align: center;
      font-size: 12px;
      outline: none;
    }

    #pageInput:focus {
      border-color: #2563eb;
    }

    #pageInfo {
      color: #374151;
      font-size: 12px;
      white-space: nowrap;
      min-width: 165px;
    }

    #userInfo {
      max-width: 360px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #logoutBtn {
      border: none;
      background: #ef4444;
      color: #ffffff;
      padding: 5px 8px;
      border-radius: 5px;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
    }

    #logoutBtn:hover {
      background: #dc2626;
    }

    .floating-save-bar {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 5000;
      min-width: 320px;
      max-width: calc(100vw - 36px);
      background: #111827;
      color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.28);
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .floating-save-bar b {
      display: block;
      font-size: 13px;
    }

    #saveMessage {
      display: block;
      margin-top: 2px;
      font-size: 12px;
      color: #cbd5e1;
    }

    .floating-save-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .floating-save-actions button {
      border: none;
      border-radius: 8px;
      padding: 8px 11px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    #saveStaffBtn {
      background: #22c55e;
      color: #ffffff;
    }

    #saveStaffBtn:hover {
      background: #16a34a;
    }


    .row-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .zalo-chat-popover.assign-staff-dropdown {
      width: 260px;
      padding: 8px;
    }

    .zalo-chat-popover.assign-staff-dropdown .zalo-chat-title,
    .zalo-chat-popover.assign-staff-dropdown .zalo-sender-chooser-title {
      display: none;
    }

    .zalo-chat-popover.assign-staff-dropdown .zalo-sender-chooser {
      margin-bottom: 0;
      padding: 0;
      border: none;
      background: transparent;
    }

    .zalo-chat-popover.assign-staff-dropdown .zalo-sender-buttons {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .zalo-chat-popover.assign-staff-dropdown .zalo-sender-btn {
      width: 100%;
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .zalo-chat-popover.assign-staff-dropdown .zalo-sender-btn::after {
      content: "Chọn";
      font-size: 11px;
      font-weight: 700;
      color: #6b7280;
    }

    .zalo-chat-popover.assign-staff-dropdown .zalo-sender-btn.selected::after {
      content: "✓";
      color: #ffffff;
    }

    .customer-table button.zalo-chat-btn {
      background: #16a34a;
    }

    .customer-table button.zalo-chat-btn:hover {
      background: #15803d;
    }

    .customer-table button:disabled,
    .customer-table button.zalo-chat-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      filter: grayscale(0.15);
    }

    .customer-table button.zalo-chat-btn:disabled:hover {
      background: #16a34a;
    }

    .zalo-chat-popover {
      position: fixed;
      z-index: 6000;
      width: 320px;
      max-width: calc(100vw - 24px);
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.2);
      padding: 10px;
    }

    .zalo-chat-title {
      font-size: 13px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 8px;
    }

    .zalo-sender-info {
      margin-bottom: 8px;
      padding: 7px 8px;
      border-radius: 8px;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
      font-size: 13px;
      font-weight: 700;
    }

    .zalo-sender-chooser {
      margin-bottom: 8px;
      padding: 8px;
      border-radius: 10px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
    }

    .zalo-sender-chooser-title {
      font-size: 13px;
      font-weight: 800;
      color: #111827;
      margin-bottom: 8px;
    }

    .zalo-sender-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .zalo-sender-btn {
      border: 1px solid #d1d5db;
      border-radius: 9px;
      padding: 8px 10px;
      background: #ffffff;
      color: #111827;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .zalo-sender-btn:hover {
      border-color: #16a34a;
      background: #f0fdf4;
    }

    .zalo-sender-btn.selected {
      border-color: #16a34a;
      background: #16a34a;
      color: #ffffff;
      box-shadow: 0 0 0 2px rgba(22, 163, 74, 0.16);
    }

    .zalo-chat-popover textarea {
      width: 100%;
      min-height: 82px;
      resize: vertical;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 8px;
      font-family: Arial, sans-serif;
      font-size: 13px;
      outline: none;
    }

    .zalo-chat-popover textarea:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.12);
    }

    .zalo-attach-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .zalo-attach-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 32px;
      padding: 7px 10px;
      border-radius: 8px;
      background: #eef2ff;
      color: #1d4ed8;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid #c7d2fe;
      user-select: none;
    }

    .zalo-attach-btn:hover {
      background: #e0e7ff;
    }

    #zaloAttachmentName {
      font-size: 12px;
      color: #374151;
      max-width: 210px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #zaloAttachmentPreview {
      margin-top: 8px;
    }

    #zaloAttachmentPreview img,
    #zaloAttachmentPreview video {
      max-width: 180px;
      max-height: 130px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      display: block;
      background: #000000;
    }

    .zalo-file-preview {
      font-size: 12px;
      color: #374151;
      padding: 8px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #f9fafb;
      max-width: 260px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .zalo-file-remove {
      border: none;
      background: #fee2e2;
      color: #991b1b;
      border-radius: 7px;
      padding: 6px 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    function normalizePermissionText(value) {
      return String(value || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim()
        .toLowerCase();
    }

    function findCurrentStaffForPermission() {
      const idNvLogin = normalizeKiotStaffId(currentUser?.id_nv || "");
      const maNvLogin = String(currentUser?.ma_nv || "").trim();

      if (idNvLogin) {
        const byId = getStaffByIdNv(idNvLogin);
        if (byId) return byId;
      }

      if (maNvLogin) {
        const byMa = getStaffByAnyCode(maNvLogin);
        if (byMa) return byMa;
      }

      return null;
    }

    function forceStaffFilterToCurrentUser() {
      const currentStaff = findCurrentStaffForPermission();

      Array.from(getStaffOptions()).forEach(function (option) {
        option.checked = false;
      });

      if (!currentStaff) {
        console.warn(
          "[PHÂN QUYỀN] Không tìm thấy nhân viên đăng nhập trong kv_nhan_vien:",
          currentUser
        );

        // Không hiện mã/id ra giao diện.
        staffDropdownBtn.textContent =
          String(currentUser?.ten_nv || "").trim() ||
          "Nhân viên hiện tại";

        staffDropdownBtn.disabled = true;
        staffDropdownBtn.dataset.locTheoNhanVien = "false";
        staffDropdownBtn.title =
          "Bạn không có quyền lọc theo nhân viên khác.";
        staffDropdownMenu.classList.add("hidden");
        return;
      }

      const wantedIdNv =
        normalizeKiotStaffId(currentStaff.id_nv).toLowerCase();

      const ownOption = Array.from(getStaffOptions()).find(function (option) {
        if (option.value === "all") return false;

        const optionIdNv = normalizeKiotStaffId(
          option.dataset.idNv || option.value
        ).toLowerCase();

        return optionIdNv === wantedIdNv;
      });

      if (ownOption) {
        ownOption.checked = true;
      }

      staffDropdownBtn.disabled = true;
      staffDropdownBtn.dataset.locTheoNhanVien = "false";
      staffDropdownBtn.title =
        "Bạn không có quyền lọc theo nhân viên khác.";
      staffDropdownMenu.classList.add("hidden");

      // Giao diện chỉ hiện TÊN NHÂN VIÊN.
      staffDropdownBtn.textContent =
        String(currentStaff.ten_nv || currentUser?.ten_nv || "").trim() ||
        "Nhân viên hiện tại";
    }

    function enableStaffFilterPermission() {
      duocLocTheoNhanVien = true;

      staffDropdownBtn.disabled = false;
      staffDropdownBtn.dataset.locTheoNhanVien = "true";
      staffDropdownBtn.title = "Chọn nhân viên để lọc";

      const allOption = document.querySelector(
        '.staff-option[value="all"]'
      );

      Array.from(getStaffOptions()).forEach(function (option) {
        option.checked = false;
      });

      if (allOption) {
        allOption.checked = true;
      }

      // Có quyền: trên nút hiện chữ, không hiện mã/id.
      staffDropdownBtn.textContent = "Tất cả nhân viên";

function normalizeBigintOrNull(value) {
      if (value === undefined || value === null) return null;

      const text = String(value).trim();
      if (!text) return null;

      const lowered = text.toLowerCase();
      if (lowered === "undefined" || lowered === "null" || lowered === "nan") {
        return null;
      }

      return /^\d+$/.test(text) ? text : null;
    }

    function normalizeTimestampOrNull(value) {
      if (value === undefined || value === null) return null;

      const text = String(value).trim();
      if (!text) return null;

      const lowered = text.toLowerCase();
      if (
        lowered === "undefined" ||
        lowered === "null" ||
        lowered === "nan"
      ) {
        return null;
      }

      const date = new Date(text);

      if (Number.isNaN(date.getTime())) {
        return null;
      }

      return date.toISOString();
    }

    async function syncSelectedCustomersToGuiTin(selectedRows) {
      if (!supabaseClient) {
        throw new Error("Supabase chưa sẵn sàng.");
      }

      const selectedMaKh = Array.from(new Set(
        (selectedRows || [])
          .map(function (row) { return String(row.ma_kh || "").trim(); })
          .filter(Boolean)
      ));

      if (selectedMaKh.length === 0) {
        throw new Error("Chưa chọn khách hàng nào.");
      }

      const { data: customerIdRows, error: customerIdError } = await supabaseClient
        .from(TABLE_KHACH_HANG)
        .select("ma_kh, ten_kh, ma_nv, dia_chi, khu_vuc, phuong_xa, dien_thoai, conversation_id, contact_id, ngay_chat_cuoi, uid_from, reminderid, gio_hen")
        .in("ma_kh", selectedMaKh);

      if (customerIdError) {
        throw customerIdError;
      }

      const customerIdMap = new Map();
      (customerIdRows || []).forEach(function (row) {
        customerIdMap.set(String(row.ma_kh || "").trim(), row);
      });

      const selectedMaNv = Array.from(new Set(
        []
          .concat(customerIdRows || [])
          .concat(selectedRows || [])
          .map(function (row) { return String(row.ma_nv || "").trim(); })
          .filter(Boolean)
      ));

      const staffNameMap = new Map();

      if (selectedMaNv.length > 0) {
        const { data: staffRowsForName, error: staffError } = await supabaseClient
          .from(TABLE_NHAN_VIEN)
          .select("ma_nv, ten_nv")
          .in("ma_nv", selectedMaNv);

        if (staffError) {
          throw staffError;
        }

        (staffRowsForName || []).forEach(function (staff) {
          staffNameMap.set(
            String(staff.ma_nv || "").trim(),
            String(staff.ten_nv || "").trim()
          );
        });
      }

      // Đọc reminderid + gio_hen hiện có từ bảng gửi tin để làm fallback.
      // View sql_khachhang_nhanvien hiện đã có 2 cột này và được ưu tiên khi INSERT.
      const existingConversationIds = Array.from(new Set(
        (selectedRows || [])
          .map(function (row) {
            return normalizeBigintOrNull(row.conversation_id);
          })
          .filter(Boolean)
      ));

      const reminderMap = new Map();

      if (existingConversationIds.length > 0) {
        const { data: reminderRows, error: reminderReadError } = await supabaseClient
          .from(TABLE_KHACH_HANG_NHANVIEN_GUITIN)
          .select("conversation_id, reminderid, gio_hen")
          .in("conversation_id", existingConversationIds);

        if (reminderReadError) {
          throw reminderReadError;
        }

        (reminderRows || []).forEach(function (item) {
          const key = normalizeBigintOrNull(item.conversation_id);
          if (!key) return;

          reminderMap.set(String(key), {
            reminderid: normalizeBigintOrNull(item.reminderid),
            gio_hen: normalizeTimestampOrNull(item.gio_hen)
          });
        });
      }

      // Xóa danh sách gửi tin cũ trước khi ghi danh sách mới.
      const { error: deleteError } = await supabaseClient
        .from(TABLE_KHACH_HANG_NHANVIEN_GUITIN)
        .delete()
        .not("conversation_id", "is", null);

      if (deleteError) {
        throw deleteError;
      }

      const mappedRows = (selectedRows || []).map(function (row) {
        const maKh = String(row.ma_kh || "").trim();
        const idRow = customerIdMap.get(maKh) || {};

        const maNv = idRow.ma_nv
          ? String(idRow.ma_nv).trim()
          : (row.ma_nv ? String(row.ma_nv).trim() : null);

        const conversationId = normalizeBigintOrNull(
          row.conversation_id ?? idRow.conversation_id
        );

        const contactId = normalizeBigintOrNull(
          idRow.contact_id ?? row.contact_id
        );

        return {
  ma_kh: maKh,
  ten_kh: String(idRow.ten_kh ?? row.ten_kh ?? "").trim() || null,

  ma_nv: maNv,

  ten_nv: maNv
    ? (staffNameMap.get(maNv) || String(row.ten_nv || "").trim() || null)
    : null,

  dia_chi:
    String(idRow.dia_chi ?? row.dia_chi ?? "").trim() || null,

  khu_vuc:
    String(idRow.khu_vuc ?? row.khu_vuc ?? "").trim() || null,

  phuong_xa:
    String(idRow.phuong_xa ?? row.phuong_xa ?? "").trim() || null,

  dien_thoai:
    String(idRow.dien_thoai ?? row.dien_thoai ?? "").trim() || null,

  conversation_id: conversationId,
  contact_id: contactId,

  ngay_chat_cuoi:
    idRow.ngay_chat_cuoi ?? row.ngay_chat_cuoi ?? null,

  // uid_from là TEXT, có thể có dạng: 329078395489441443_291908697028
  // Không được ép bigint vì sẽ làm giá trị có dấu "_" thành null.
  uid_from:
    String(idRow.uid_from ?? row.uid_from ?? "").trim() || null,

  // reminderid + gio_hen:
  // ưu tiên dữ liệu nguồn sql_khachhang_nhanvien,
  // nếu nguồn chưa có thì giữ lại giá trị cũ trong bảng guitin.
  reminderid:
    normalizeBigintOrNull(
      idRow.reminderid ??
      row.reminderid ??
      reminderMap.get(String(conversationId || ""))?.reminderid
    ),

  gio_hen:
    normalizeTimestampOrNull(
      idRow.gio_hen ??
      row.gio_hen ??
      reminderMap.get(String(conversationId || ""))?.gio_hen
    ),

  trang_thai: null
};
      }).filter(function (row) {
        return !!row.ma_kh && row.conversation_id !== null;
      });

      const seenConversationIds = new Set();
      const rowsToInsert = mappedRows.filter(function (row) {
        const key = String(row.conversation_id);

        if (seenConversationIds.has(key)) {
          return false;
        }

        seenConversationIds.add(key);
        return true;
      });

      if (rowsToInsert.length === 0) {
        throw new Error("Không có khách nào có conversation_id hợp lệ.");
      }

      // Chốt an toàn lần cuối trước khi INSERT.
      // Các cột ID số vẫn chuẩn hóa bigint; riêng uid_from phải giữ dạng TEXT.
      rowsToInsert.forEach(function (item) {
        item.conversation_id = normalizeBigintOrNull(item.conversation_id);
        item.contact_id = normalizeBigintOrNull(item.contact_id);

        const uidText = String(item.uid_from ?? "").trim();
        item.uid_from =
          !uidText || ["undefined", "null", "nan"].includes(uidText.toLowerCase())
            ? null
            : uidText;

        item.reminderid = normalizeBigintOrNull(item.reminderid);
        item.gio_hen = normalizeTimestampOrNull(item.gio_hen);
      });

      console.log("[GUI_TIN] rowsToInsert:", rowsToInsert);
      console.table(rowsToInsert.map(function (item) {
        return {
          ma_kh: item.ma_kh,
          conversation_id: item.conversation_id,
          uid_from: item.uid_from,
          reminderid: item.reminderid,
          gio_hen: item.gio_hen
        };
      }));

      const { error: insertError } = await supabaseClient
        .from(TABLE_KHACH_HANG_NHANVIEN_GUITIN)
        .insert(rowsToInsert);

      if (insertError) {
        throw insertError;
      }

      return rowsToInsert.length;
    }

    function getQueryParam(name) {
      const value = new URLSearchParams(window.location.search).get(name);
      if (!value || String(value).includes("{{")) {
        return null;
      }
      return value;
    }

    function tryParseJson(value) {
      if (typeof value !== "string") {
        return value;
      }

      let current = value;

      for (let i = 0; i < 4; i++) {
        if (typeof current !== "string") {
          return current;
        }

        const trimmed = current.trim();

        if (!trimmed || (!trimmed.startsWith("{") && !trimmed.startsWith("["))) {
          return current;
        }

        try {
          current = JSON.parse(trimmed);
        } catch (error) {
          return value;
        }
      }

      return current;
    }

    function getRawText(value) {
      if (typeof value === "string") {
        return value;
      }

      try {
        return JSON.stringify(value || {});
      } catch (error) {
        return "";
      }
    }

    function extractFirstMatch(text, regex) {
      const match = String(text || "").match(regex);
      return match && match[1] ? String(match[1]) : null;
    }

    function extractIdsFromRawChatwootMessage(rawData) {
      const raw = getRawText(rawData);

      if (!raw || (raw.indexOf("appContext") === -1 && raw.indexOf("conversation_id") === -1)) {
        return null;
      }

      chatwootContextRaw = raw;
      window.__CHATWOOT_APP_CONTEXT_RAW__ = raw;

      const conversationId =
        extractFirstMatch(raw, /["']conversation_id["']\s*:\s*["']?(\d+)["']?/i) ||
        extractFirstMatch(raw, /conversation_id=(\d+)/i);

      // Trong context Chatwoot của anh, contact nằm ở conversation.sender.id.
      // Regex này cố tình tìm sender.id, tránh lấy nhầm id message.
      const senderBlock = raw.match(/["']sender["']\s*:\s*\{[\s\S]{0,2000}?\}/i);
      const contactId = senderBlock
        ? extractFirstMatch(senderBlock[0], /["']id["']\s*:\s*["']?(\d+)["']?/i)
        : null;

      if (conversationId) {
        chatwootFallbackConversationId = String(conversationId);
        window.__CHATWOOT_CONVERSATION_ID__ = String(conversationId);
      }

      if (contactId) {
        chatwootFallbackContactId = String(contactId);
        window.__CONTACT_ID__ = String(contactId);
      }

      if (conversationId || contactId) {
        console.log("✅ BẮT ID TỪ RAW CHATWOOT MESSAGE:", {
          conversation_id: conversationId || null,
          contact_id: contactId || null
        });
      }

      return {
        conversation_id: conversationId || null,
        contact_id: contactId || null
      };
    }

    function extractChatwootContextFromMessage(rawData) {
      extractIdsFromRawChatwootMessage(rawData);

      const payload = tryParseJson(rawData);

      if (!payload || typeof payload !== "object") {
        return null;
      }

      if (payload.event === "appContext") {
        return payload.data || null;
      }

      if (payload.data && payload.data.event === "appContext") {
        return payload.data.data || null;
      }

      if (payload.conversation && typeof payload.conversation === "object") {
        return payload;
      }

      if (payload.data && payload.data.conversation && typeof payload.data.conversation === "object") {
        return payload.data;
      }

      return null;
    }

    function resolveWaitingChatwootContext() {
      const resolvers = chatwootContextReadyResolvers;
      chatwootContextReadyResolvers = [];

      resolvers.forEach(function (resolve) {
        resolve(chatwootContext);
      });
    }

    function handleChatwootMessage(event) {
      const context = extractChatwootContextFromMessage(event.data);

      if (!context) {
        // Nếu không parse được context nhưng regex đã lấy được conversation_id, vẫn cho các nút chạy.
        if (getCurrentConversationId()) {
          resolveWaitingChatwootContext();
          scheduleLocateCurrentChatwootRow(80);
        }
        return;
      }

      chatwootContext = context;
      window.__CHATWOOT_APP_CONTEXT__ = context;

      const conversationId = getCurrentConversationId();
      const contactId = getCurrentContactId();

      console.log("✅ CHATWOOT APP CONTEXT ĐÃ NHẬN:", {
        conversation_id: conversationId,
        contact_id: contactId,
        conversation_field: context && context.conversation ? context.conversation : null,
        context: context
      });

      resolveWaitingChatwootContext();

      // Hội thoại Chatwoot thay đổi -> tự tìm đúng dòng mới.
      scheduleLocateCurrentChatwootRow(80);
    }

    function requestChatwootContext() {
      try {
        window.parent.postMessage(CHATWOOT_FETCH_INFO_EVENT, "*");
      } catch (error) {
        console.warn("Không gửi được yêu cầu lấy Chatwoot context:", error);
      }
    }

    function waitForChatwootContext(timeoutMs = 1500) {
      if (getCurrentConversationId()) {
        return Promise.resolve(chatwootContext);
      }

      requestChatwootContext();

      return new Promise(function (resolve) {
        const timeout = setTimeout(function () {
          chatwootContextReadyResolvers = chatwootContextReadyResolvers.filter(function (item) {
            return item !== done;
          });
          resolve(chatwootContext);
        }, timeoutMs);

        function done(context) {
          clearTimeout(timeout);
          resolve(context);
        }

        chatwootContextReadyResolvers.push(done);

        setTimeout(requestChatwootContext, 250);
        setTimeout(requestChatwootContext, 700);
        setTimeout(requestChatwootContext, 1400);
        setTimeout(requestChatwootContext, 2400);
      });
    }

    function getCurrentConversationId() {
      const queryId = getQueryParam("conversation_id");
      if (queryId) {
        return String(queryId);
      }

      const ctx = chatwootContext || window.__CHATWOOT_APP_CONTEXT__ || null;
      const c = ctx && ctx.conversation ? ctx.conversation : null;

      // Chatwoot Dashboard App bản anh đang dùng trả ID hội thoại ở conversation.conversation_id.
      // Không dùng conversation.id làm ưu tiên vì trường đó có thể là ID message.
      if (c && c.conversation_id) {
        return String(c.conversation_id);
      }

      if (ctx && ctx.conversation_id) {
        return String(ctx.conversation_id);
      }

      if (ctx && ctx.message && ctx.message.conversation_id) {
        return String(ctx.message.conversation_id);
      }

      if (chatwootFallbackConversationId) {
        return String(chatwootFallbackConversationId);
      }

      if (window.__CHATWOOT_CONVERSATION_ID__) {
        return String(window.__CHATWOOT_CONVERSATION_ID__);
      }

      if (chatwootContextRaw) {
        const rawId = extractFirstMatch(chatwootContextRaw, /["']conversation_id["']\s*:\s*["']?(\d+)["']?/i);
        if (rawId) return String(rawId);
      }

      return null;
    }

    function getCurrentContactId() {
      const queryId = getQueryParam("contact_id");
      if (queryId) {
        return String(queryId);
      }

      const ctx = chatwootContext || window.__CHATWOOT_APP_CONTEXT__ || null;
      const c = ctx && ctx.conversation ? ctx.conversation : null;

      const contactId =
        (ctx && ctx.contact && ctx.contact.id) ||
        (c && c.sender && c.sender.id) ||
        (c && c.contact && c.contact.id) ||
        (c && c.meta && c.meta.sender && c.meta.sender.id) ||
        chatwootFallbackContactId ||
        window.__CONTACT_ID__ ||
        null;

      return contactId ? String(contactId) : null;
    }

    function normalizeNullableMaNv(value) {
      const raw = String(value || "").trim();
      return raw ? raw : null;
    }

    function getZaloIdFromUidFrom(value) {
      const uidFrom = String(value || "").trim();

      if (!uidFrom || !uidFrom.includes("_")) {
        return "";
      }

      const idZalo = uidFrom.split("_").pop().trim();

      return /^\d+$/.test(idZalo) ? idZalo : "";
    }

    function hasValidUidFrom(value) {
      return !!getZaloIdFromUidFrom(value);
    }



    function normalizeConversationId(value) {
      const text = String(value ?? "").trim();
      return text ? text : null;
    }

    function scheduleLocateCurrentChatwootRow(delayMs = 120) {
      clearTimeout(chatwootLocateTimer);
      chatwootLocateTimer = setTimeout(function () {
        locateCurrentChatwootRow().catch(function (error) {

      return true;
    }

    function escapePostgrestSearchValue(value) {
      return String(value || "")
        .trim()
        .replaceAll("\\", "\\\\")
        .replaceAll("%", "\\%")
        .replaceAll("*", "\\*")
        .replaceAll(",", " ");
    }

    function applySearchAllColumns(query, rawKeyword) {
      const keyword = String(rawKeyword || "").trim();
      if (!keyword) return query;

      const safeKeyword = escapePostgrestSearchValue(keyword);
      const filters = [];

      /*
        CHỈ TÌM TRÊN NHỮNG CỘT ĐANG HIỂN THỊ Ở BẢNG:

        - Mã KH           -> ma_kh
        - Tên khách hàng -> ten_kh
        - Alias name      -> alias_name
        - Số điện thoại  -> dien_thoai
        - Công nợ         -> congno
        - Nhân viên       -> ten_nv / ma_nv
        - conversation_id -> conversation_id
        - Ngày            -> ngay_chat_cuoi

        KHÔNG tìm các cột ẩn như:
        id, contact_id, uid_from, content, zalo_name,
        nguoi_goi, zalo_kh, id_nv, ...
      */

      // Các cột text đang hiển thị.
      [
        "ma_kh",
        "ten_kh",
        "alias_name",
        "dien_thoai",
        "ten_nv",
        "ma_nv"
      ].forEach(function (column) {
        filters.push(`${column}.ilike.%${safeKeyword}%`);
      });

      // Các cột số đang hiển thị.
      // Chỉ thêm điều kiện nếu từ khóa thực sự là số.
      if (/^-?\d+(?:\.\d+)?$/.test(keyword)) {
        filters.push(`congno.eq.${keyword}`);
        filters.push(`conversation_id.eq.${keyword}`);
      }

      // Cột Ngày đang hiển thị.
      // Nhập dạng YYYY-MM-DD, ví dụ 2026-08-09.
      if (/^\d{4}-\d{2}-\d{2}$/.test(keyword)) {
        const start = new Date(keyword + "T00:00:00");

        if (!Number.isNaN(start.getTime())) {
          const next = new Date(start);
          next.setDate(next.getDate() + 1);

          const nextDate = [
            next.getFullYear(),
            String(next.getMonth() + 1).padStart(2, "0"),
            String(next.getDate()).padStart(2, "0")
          ].join("-");

          filters.push(
            `and(ngay_chat_cuoi.gte.${keyword}T00:00:00,ngay_chat_cuoi.lt.${nextDate}T00:00:00)`
          );
        }
      }

      if (filters.length === 0) {
        return query;
      }

      return query.or(filters.join(","));
    }

    function applyCustomerListFiltersToQuery(query) {
      const keyword = searchInput ? searchInput.value.trim() : "";
      const selectedStaffDbCodes = getSelectedStaffDbCodes();

      query = applySearchAllColumns(query, keyword);

      if (selectedStaffDbCodes.length > 0) {
        query = query.in("ma_nv", selectedStaffDbCodes);
      }

      return query;
    }

    async function findConversationAbsoluteIndex(conversationId) {
      const wantedId = normalizeConversationId(conversationId);
      if (!wantedId || !supabaseClient) return -1;

      const dbSortField = getDbSortField();
      const ascending = getDbSortAscending();
      const batchSize = 1000;
      let offset = 0;

      while (true) {
        let query = supabaseClient
          .from(TABLE_KHACH_HANG)
          .select("ma_kh, conversation_id, ma_nv")
          .order(dbSortField, { ascending: ascending, nullsFirst: false });

        query = applyCustomerListFiltersToQuery(query);
        query = query.range(offset, offset + batchSize - 1);

        const { data, error } = await query;

        if (error) {
          // Một số view có thể không hỗ trợ ma_nv trong điều kiện hiện tại.
          // Khi đó thử lại mà không lọc nhân viên, vẫn giữ đúng conversation_id.
          console.warn("Không quét được vị trí conversation_id theo bộ lọc hiện tại:", error);
          return -1;
        }

        const rows = data || [];
        const localIndex = rows.findIndex(function (item) {
          return normalizeConversationId(item.conversation_id) === wantedId;
        });

        if (localIndex >= 0) {
          return offset + localIndex;
        }

        if (rows.length < batchSize) {
          return -1;
        }

        offset += batchSize;
      }
    }

    async function conversationExists(conversationId) {
      const wantedId = normalizeConversationId(conversationId);
      if (!wantedId || !supabaseClient) return false;

      const { data, error } = await supabaseClient
        .from(TABLE_KHACH_HANG)
        .select("conversation_id")
        .eq("conversation_id", wantedId)
        .limit(1);

      if (error) {
        console.warn("Lỗi kiểm tra conversation_id:", error);
        return false;
      }

      return Array.isArray(data) && data.length > 0;
    }

    async function locateCurrentChatwootRow() {
      const conversationId = normalizeConversationId(getCurrentConversationId());

      if (!conversationId || !supabaseClient || !currentUser) {
        return;
      }

      // Nếu dòng đang ở ngay trang hiện tại thì chỉ cần tô và cuộn.
      if (highlightAndScrollToConversation(conversationId, true)) {
        lastLocatedConversationId = conversationId;
        return;
      }

      if (chatwootLocateBusy) {
        scheduleLocateCurrentChatwootRow(250);
        return;
      }

      chatwootLocateBusy = true;

      try {
        const exists = await conversationExists(conversationId);
        if (!exists) {
          console.log("Không có conversation_id trong bảng:", conversationId);
          return;
        }

        // Tìm vị trí trong danh sách hiện tại (có áp dụng tìm kiếm/nhân viên).
        let absoluteIndex = await findConversationAbsoluteIndex(conversationId);

        // Nếu bộ lọc hiện tại che mất khách đang chat thì bỏ bộ lọc để vẫn nhảy đúng dòng.
        if (absoluteIndex < 0) {
          await resetCustomerFiltersForChatwootLocate();
          absoluteIndex = await findConversationAbsoluteIndex(conversationId);
        }

        if (absoluteIndex < 0) {
          console.warn("Có conversation_id nhưng không xác định được vị trí:", conversationId);
          return;
        }

        const targetPage = Math.floor(absoluteIndex / pageSize) + 1;

        if (currentPage !== targetPage || !highlightAndScrollToConversation(conversationId, false)) {
          await loadCustomersFromSupabase(targetPage);
        }

        // renderCustomers() đã tạo data-conversation-id, nên giờ cuộn đúng dòng.
        if (highlightAndScrollToConversation(conversationId, true)) {
          lastLocatedConversationId = conversationId;
          console.log("✅ ĐÃ NHẢY ĐÚNG DÒNG CHATWOOT:", {
            conversation_id: conversationId,
            page: targetPage,
            absolute_index: absoluteIndex
          });
        }
      } finally {
        chatwootLocateBusy = false;
      }
    }

    function readMaKhFromObject(obj) {
      if (!obj || typeof obj !== "object") {
        return null;
      }

      const candidates = [
        obj.ma_kh,
        obj.makh,
        obj.customer_code,
        obj.custom_attributes && obj.custom_attributes.ma_kh,
        obj.custom_attributes && obj.custom_attributes.makh,
        obj.additional_attributes && obj.additional_attributes.ma_kh,
        obj.additional_attributes && obj.additional_attributes.makh
      ];

      for (const value of candidates) {
        const text = String(value || "").trim();
        if (text) {
          return text;
        }
      }

      return null;
    }

    async function buildWebhookPayload(action, maKh, maNv, extra) {
      const data = extra || {};

      const contextConversationId = data.conversation_id || data.chatwoot_conversation_id
        ? String(data.conversation_id || data.chatwoot_conversation_id)
        : null;

      if (!contextConversationId) {
        await waitForChatwootContext();
      }

      const conversationId = contextConversationId || getCurrentConversationId();
      const contactId = data.contact_id || getCurrentContactId();

      return {
        action: action,
        ma_kh: maKh,
        ma_nv: normalizeNullableMaNv(maNv),
        conversation_id: conversationId ? String(conversationId) : null,
        chatwoot_conversation_id: conversationId ? String(conversationId) : null,
        contact_id: contactId ? String(contactId) : null,
        source: data.source || "",
        ...data
      };
    }

    async function sendCustomerWebhook(action, maKh, maNv, extra, options) {
      const opts = options || {};
      const payload = await buildWebhookPayload(action, maKh, maNv, extra || {});

      if (opts.requireConversation && !payload.conversation_id) {
        console.error("Thiếu conversation_id khi gửi webhook:", {
          payload: payload,
          chatwootContext: chatwootContext,
          iframe_url: window.location.href,
          referrer: document.referrer
        });

        throw new Error("Chưa lấy được ID hội thoại từ Chatwoot appContext.");
      }

      const webhookUrl = opts.webhookUrl || UPDATE_STAFF_WEBHOOK_URL;
      console.log("SEND WEBHOOK PAYLOAD:", payload, "URL:", webhookUrl);

      const resp = await fetch(webhookUrl, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      });

      const text = await resp.text();
      let result = {};

      try {
        result = text ? JSON.parse(text) : {};
      } catch (error) {
        result = { raw: text };
      }

      if (!resp.ok) {
        throw new Error(result.message || text || "Webhook lỗi");
      }

      return {
        payload: payload,
        result: result
      };
    }

    function getWebhookDisplayMessage(result, fallbackMessage) {
      if (result && result.message) {
        return result.message;
      }

      const raw = result && result.raw ? String(result.raw).trim() : "";

      if (!raw || raw === "Workflow was started") {
        return fallbackMessage;
      }

      return raw;
    }

        let supabaseAnon = "";

        try {
          const resp = await fetch("/api/getConfig", {
            headers: {
              "x-internal-key": window.getInternalKey ? window.getInternalKey() : ""
            }
          });

          if (resp.ok) {
            const cfg = await resp.json();
            supabaseUrl = cfg.url || "";
            supabaseAnon = cfg.anon || cfg.key || "";
          }
        } catch (error) {
          console.warn("Không gọi được /api/getConfig trực tiếp:", error);
        }

        if ((!supabaseUrl || !supabaseAnon) && window.configReady) {
          await window.configReady;

          if (typeof window.getConfig === "function") {
            const urlValue = window.getConfig("url");
            const anonValue = window.getConfig("anon");

            if (typeof urlValue === "string") {
              supabaseUrl = supabaseUrl || urlValue;
            }

            if (typeof anonValue === "string") {
              supabaseAnon = supabaseAnon || anonValue;
            }
          }
        }

        if (!supabaseUrl || !supabaseAnon) {
          console.error("Chưa lấy được Supabase URL hoặc anon key.");
          return;
        }

        SUPABASE_REST_URL = supabaseUrl;
        SUPABASE_REST_ANON = supabaseAnon;

        supabaseClient = window.supabase.createClient(supabaseUrl, supabaseAnon);
      } catch (error) {
        console.error("Lỗi initSupabase:", error);
        console.error(error.message || "Không lấy được cấu hình.");
      }
    }


    function normalizeKiotStaffId(value) {
      if (value === null || value === undefined) {
        return "";
      }

      if (typeof value === "number") {
        if (!Number.isFinite(value)) {
          return "";
        }

        if (Number.isInteger(value)) {
          return String(value);
        }

        return String(value).trim().replace(/\.0$/, "");
      }

      return String(value || "").trim().replace(/\.0$/, "");
    }

    async function loadStaffFromSupabase() {
      if (!supabaseClient) {
        return;
      }

      const { data, error } = await supabaseClient
        .from(TABLE_NHAN_VIEN)
        .select("ma_nv, id_nv, ten_nv")
        .not("id_nv", "is", null)
        .not("ma_nv", "is", null)
        .order("ten_nv", { ascending: true });

      if (error) {
        console.error("Lỗi tải nhân viên:", error);

        if (typeof showNotice === "function") {
          showNotice("Lỗi tải nhân viên: " + (error.message || JSON.stringify(error)), "error", 3500);
        }

        return;
      }

      staffRows = (data || [])
        .map(function (item) {
          const maNv = String(item.ma_nv || "").trim();
          const idNv = normalizeKiotStaffId(item.id_nv);

          return {
            // ma_nv là mã nhân viên nội bộ để lưu vào kv_khachhang.ma_nv.
            ma_nv: maNv,

            // id_nv là ID nhân viên KiotViet, chỉ dùng để lọc và gửi kèm webhook.
            id_nv: idNv,

            ten_nv: String(item.ten_nv || maNv || idNv || "").trim()
          };
        })
        .filter(function (item) {
          // Chỉ hiện nhân viên đã có cả ma_nv và ID KiotViet id_nv.
          return item.ma_nv !== "" && item.id_nv !== "";
        });

      renderStaffDropdown();

      if (customers.length > 0) {
        renderCustomers();
      }
    }

    function getStaffByIdNv(idNv) {

      });

      return found ? found.ten_nv : maNv;

    function getStaffByAnyCode(value) {
      const code = normalizeKiotStaffId(value).toLowerCase();
      if (!code) {
        return null;
      }

      return staffRows.find(function (staff) {
        return normalizeKiotStaffId(staff.id_nv).toLowerCase() === code ||
               String(staff.ma_nv || "").trim().toLowerCase() === code;
      }) || null;

    function getCustomerStaffIds(maKh) {

      if (!customer) {

      const savedCode = normalizeKiotStaffId(customer.ma_nv || customer.id_nv);
      if (!savedCode) {

      const staff = getStaffByAnyCode(savedCode);
      return [staff ? normalizeKiotStaffId(staff.id_nv) : savedCode];

    function getCustomerStaffRows(maKh) {

    async function saveCustomerStaffAssignment(maKh, selectedIdNv) {
      const maKhText = String(maKh || "").trim();
      const idNv = normalizeKiotStaffId(selectedIdNv);

      if (!maKhText) {
        return;
      }

      if (!supabaseClient) {
        showNotice("Supabase chưa sẵn sàng.", "error", 2500);
        return;
      }

      const found = getCustomerByMaKh(maKhText);
      const staff = idNv ? getStaffByAnyCode(idNv) : null;
      const valueToSave = idNv || null;

      try {
        const { error } = await supabaseClient
          .from(TABLE_KHACH_HANG_NHANVIEN)
          .update({ ma_nv: valueToSave })
          .eq("ma_kh", maKhText);

        if (error) {
          throw error;
        }

        if (found) {
          found.ma_nv = valueToSave;
          found.id_nv = staff ? normalizeKiotStaffId(staff.id_nv) : valueToSave;
          found.ten_nv = staff ? staff.ten_nv : null;
        }

        updateCustomerStaffEditorUI(maKhText);
        renderCustomers();

        await sendCustomerWebhook(
          "set_khachhang_nhanvien",
          maKhText,
          valueToSave,
          {
            table: TABLE_KHACH_HANG,
            source: "kv_khachhang_ma_nv_select",
            mode: "single_staff_kv_khachhang_only",
            id_nv: staff ? normalizeKiotStaffId(staff.id_nv) : valueToSave,
            ma_nv: valueToSave,
            selected_id_nv: staff ? normalizeKiotStaffId(staff.id_nv) : valueToSave,
            selected_ma_nv: valueToSave,
            selected_ten_nv: staff ? staff.ten_nv : ""
          },
          { requireConversation: false, webhookUrl: UPDATE_CHATWOOT_WEBHOOK_URL }
        ).catch(function (webhookError) {
          console.warn("Webhook cập nhật nhân viên lỗi:", webhookError);
        });

        showNotice(valueToSave
          ? "Đã cập nhật nhân viên phụ trách cho " + maKhText
          : "Đã bỏ nhân viên phụ trách của " + maKhText,
          "ok",
          1800
        );
      } catch (error) {
        console.error("Lỗi lưu ma_nv vào kv_khachhang:", error);
        showNotice("Lỗi lưu nhân viên: " + (error.message || JSON.stringify(error)), "error", 4500);
        if (found) {
          updateCustomerStaffEditorUI(maKhText);
        }
      }
    }

    async function loadCustomersFromSupabase(page = 1) {
      if (isLoadingCustomers) {
        return;
      }

      if (!supabaseClient) {
        customerBody.innerHTML = `
          <tr>
            <td colspan="12">Supabase chưa sẵn sàng.</td>
          </tr>
        `;
        return;
      }

      currentPage = page;

      const from = (currentPage - 1) * pageSize;
      const to = from + pageSize - 1;
      const keyword = searchInput.value.trim();
      const selectedStaffDbCodes = getSelectedStaffDbCodes();

      setCustomerLoading(true);

      const dbSortField = getDbSortField();
      const ascending = getDbSortAscending();

      let query = supabaseClient
        .from(TABLE_KHACH_HANG)
        .select("ma_kh, ten_kh, alias_name, dien_thoai, congno, ma_nv, ngay_chat_cuoi, conversation_id, contact_id, uid_from, reminderid, gio_hen", { count: "exact" })
        .order(dbSortField, { ascending: ascending, nullsFirst: false });

      query = applySearchAllColumns(query, keyword);

      if (selectedStaffDbCodes.length > 0) {
        query = query.in("ma_nv", selectedStaffDbCodes);
      }

      query = query.range(from, to);

      const { data, error, count } = await query;

      if (error) {
        if (String(error.message || "").includes("ma_nv")) {
          setCustomerLoading(false);
          return loadCustomersWithoutStaff(page);
        }

        customerBody.innerHTML = `
          <tr>
            <td colspan="12">
              Lỗi tải dữ liệu: ${escapeHtml(error.message || JSON.stringify(error))}
            </td>
          </tr>
        `;

        setCustomerLoading(false);
        return;
      }

      totalRows = count || 0;

      customers = (data || []).map(function (item) {
        return {
          ma_kh: item.ma_kh || "",
          ten_kh: item.ten_kh || "",
          alias_name: item.alias_name || "",
          sdt: item.dien_thoai || "",
          cong_no: item.congno || 0,
          ma_nv: normalizeNullableMaNv(item.ma_nv),
          ngay_chat_cuoi: item.ngay_chat_cuoi || null,
          conversation_id: item.conversation_id || null,
          contact_id: item.contact_id || null,
          uid_from: item.uid_from || null,
          reminderid: normalizeBigintOrNull(item.reminderid),
          gio_hen: normalizeTimestampOrNull(item.gio_hen)
        };
      });

      await loadCustomerStaffAssignments(customers.map(function (item) { return item.ma_kh; }));
      await loadReminderInfoForCustomers(customers);
      renderCustomers();
      setCustomerLoading(false);
    }


    async function loadReminderInfoForCustomers(customerRows) {
      if (!supabaseClient || !Array.isArray(customerRows) || customerRows.length === 0) {
        return;
      }

      const ids = Array.from(new Set(
        customerRows
          .map(function (item) {
            return normalizeBigintOrNull(item?.conversation_id);
          })
          .filter(Boolean)
      ));

      if (ids.length === 0) return;

      const { data, error } = await supabaseClient
        .from(TABLE_KHACH_HANG_NHANVIEN_GUITIN)
        .select("conversation_id, reminderid, gio_hen")
        .in("conversation_id", ids);

      if (error) {
        console.warn("[REMINDER] Không tải được reminderid/gio_hen:", error);
        return;
      }

      const map = new Map();

      (data || []).forEach(function (row) {
        const key = normalizeBigintOrNull(row.conversation_id);
        if (!key) return;

        map.set(String(key), {
          reminderid: normalizeBigintOrNull(row.reminderid),
          gio_hen: normalizeTimestampOrNull(row.gio_hen)
        });
      });

      customerRows.forEach(function (item) {
        const key = normalizeBigintOrNull(item?.conversation_id);
        const reminder = key ? map.get(String(key)) : null;

        if (item.reminderid == null) {
          item.reminderid = reminder?.reminderid ?? null;
        }

        if (item.gio_hen == null) {
          item.gio_hen = reminder?.gio_hen ?? null;
        }
      });
    }

    async function saveStaffChanges() {
      const changes = Object.values(pendingStaffChanges);

      if (changes.length === 0) {
        return;
      }

      if (!supabaseClient) {
        saveMessage.textContent = "Supabase chưa sẵn sàng.";
        return;
      }

      saveStaffBtn.disabled = true;
      saveStaffBtn.textContent = "Đang lưu...";
      saveMessage.textContent = "Đang cập nhật mã nhân viên...";

      try {
        for (const change of changes) {
          const { error } = await supabaseClient
            .from(TABLE_KHACH_HANG_NHANVIEN)
            .update({
              ma_nv: change.new_ma_nv || null
            })
            .eq("ma_kh", change.ma_kh);

          if (error) {
            throw error;
          }
        }

        pendingStaffChanges = {};
        saveMessage.textContent = "Đã lưu xong.";

        await loadCustomersFromSupabase(currentPage);

        setTimeout(function () {
          floatingSaveBar.classList.add("hidden");
          saveMessage.textContent = "";
        }, 800);
      } catch (error) {
        console.error("Lỗi lưu mã nhân viên:", error);
        saveMessage.textContent = "Lỗi lưu: " + (error.message || JSON.stringify(error));
      } finally {
        saveStaffBtn.disabled = false;
        saveStaffBtn.textContent = "Lưu";
      }
    }

    function updatePagination() {
      const totalPages = Math.max(1, Math.ceil(totalRows / pageSize));

      const fromRow = totalRows === 0 ? 0 : ((currentPage - 1) * pageSize) + 1;
      const toRow = Math.min(currentPage * pageSize, totalRows);

      pageInput.value = currentPage;
      pageInput.max = totalPages;

      pageInfo.textContent = `${fromRow} - ${toRow} trong ${totalRows} khách hàng`;

      firstPageBtn.disabled = currentPage <= 1;
      prevPageBtn.disabled = currentPage <= 1;
      nextPageBtn.disabled = currentPage >= totalPages;
      lastPageBtn.disabled = currentPage >= totalPages;
    }

    function safeParseStorage(key, storage) {
      try {
        return JSON.parse(storage.getItem(key) || "null");
      } catch (error) {
        return null;
      }
    }

    function getLoginUser() {
      const nv =
        safeParseStorage("nv", localStorage) ||
        safeParseStorage("chatwoot_crm_user", localStorage) ||
        safeParseStorage("nv_ctx", sessionStorage) ||
        null;

      const maNv = String(nv?.ma_nv || "").trim();
      const tenNv = String(nv?.ten_nv || "").trim();

      if (!maNv) {
        return null;
      }

      return {
        ...(nv || {}),
        ma_nv: maNv,
        ten_nv: tenNv || maNv
      };
    }


    // =========================================================
    // REALTIME: CẬP NHẬT NGAY KHI kv_khachhang_nhanvien THAY ĐỔI
    // - Dùng conversation_id làm khóa chính để tìm đúng dòng.
    // - Nếu không có conversation_id thì fallback theo ma_kh.
    // - Sau event, đọc lại TABLE_KHACH_HANG để lấy dữ liệu hợp nhất mới nhất.
    // =========================================================
    function normalizeRealtimeText(value) {
      return String(value ?? "").trim();
    }

    function findCustomerIndexForRealtime(row) {
      const conversationId = normalizeConversationId(row?.conversation_id);

      if (conversationId) {
        const byConversation = customers.findIndex(function (item) {
          return normalizeConversationId(item?.conversation_id) === conversationId;
        });

        if (byConversation >= 0) {
          return byConversation;
        }
      }

      const maKh = normalizeRealtimeText(row?.ma_kh).toUpperCase();

      if (maKh) {
        return customers.findIndex(function (item) {
          return normalizeRealtimeText(item?.ma_kh).toUpperCase() === maKh;
        });
      }

      return -1;
    }

    async function fetchLatestCustomerForRealtime(row) {
      if (!supabaseClient) return null;

      const conversationId = normalizeConversationId(row?.conversation_id);
      const maKh = normalizeRealtimeText(row?.ma_kh);

      let query = supabaseClient
        .from(TABLE_KHACH_HANG)
        .select(
          "ma_kh, ten_kh, alias_name, dien_thoai, congno, ma_nv, ngay_chat_cuoi, conversation_id, contact_id, uid_from"
        )
        .limit(1);

      if (conversationId) {
        query = query.eq("conversation_id", conversationId);
      } else if (maKh) {
        query = query.eq("ma_kh", maKh);
      } else {
        return null;
      }

      const { data, error } = await query;

      if (error) {
        console.warn("[REALTIME KH] Không đọc lại được dòng mới nhất:", error);
        return null;
      }

      const item = Array.isArray(data) ? data[0] : null;
      if (!item) return null;

      return {
        ma_kh: item.ma_kh || "",
        ten_kh: item.ten_kh || "",
        alias_name: item.alias_name || "",
        sdt: item.dien_thoai || "",
        cong_no: item.congno || 0,
        ma_nv: normalizeNullableMaNv(item.ma_nv),
        ngay_chat_cuoi: item.ngay_chat_cuoi || null,
        conversation_id: item.conversation_id || null,
        contact_id: item.contact_id || null,
        uid_from: item.uid_from || null
      };
    }

    async function applyCustomerRealtimeChange(payload) {
      const eventType = String(payload?.eventType || "").toUpperCase();
      const newRow = payload?.new || {};
      const oldRow = payload?.old || {};
      const lookupRow =
        eventType === "DELETE"
          ? oldRow
          : newRow;

      console.log("[REALTIME KH]", eventType, lookupRow);

      if (eventType === "DELETE") {
        const index = findCustomerIndexForRealtime(lookupRow);

        if (index >= 0) {
          customers.splice(index, 1);
          totalRows = Math.max(0, totalRows - 1);
          renderCustomers();
          updatePagination();
        }

        return;
      }

      // Patch alias ngay từ payload trước để giao diện phản ứng tức thì,
      // sau đó đọc lại view để đồng bộ đầy đủ dữ liệu.
      const currentIndex = findCustomerIndexForRealtime(lookupRow);

      if (currentIndex >= 0) {
        let changed = false;

        if (Object.prototype.hasOwnProperty.call(newRow, "alias_name")) {
          const oldAlias = normalizeRealtimeText(customers[currentIndex]?.alias_name);
          const newAlias = normalizeRealtimeText(newRow.alias_name);

          if (oldAlias !== newAlias) {
            customers[currentIndex].alias_name = newRow.alias_name ?? "";
            changed = true;
          }
        }

        if (Object.prototype.hasOwnProperty.call(newRow, "ngay_chat_cuoi")) {
          customers[currentIndex].ngay_chat_cuoi = newRow.ngay_chat_cuoi || null;
          changed = true;
        }

        if (Object.prototype.hasOwnProperty.call(newRow, "contact_id")) {
          customers[currentIndex].contact_id = newRow.contact_id || null;
          changed = true;
        }

        if (Object.prototype.hasOwnProperty.call(newRow, "uid_from")) {
          customers[currentIndex].uid_from = newRow.uid_from || null;
          changed = true;
        }

        if (changed) {
          renderCustomers();
        }
      }

      const latest = await fetchLatestCustomerForRealtime(lookupRow);

      if (latest) {
        const latestIndex = findCustomerIndexForRealtime(latest);

        if (latestIndex >= 0) {
          // Giữ các field nhân viên đã được bổ sung ở client nếu view chưa trả về.
          const current = customers[latestIndex] || {};
          customers[latestIndex] = {
            ...current,
            ...latest,
            id_nv: current.id_nv || latest.id_nv || null,
            ten_nv: current.ten_nv || latest.ten_nv || null
          };

          renderCustomers();
          return;
        }
      }

      // Nếu đây là dòng mới / dòng hiện chưa có trên trang,
      // debounce tải lại trang hiện tại để đúng bộ lọc, sort và phân trang.
      clearTimeout(customerRealtimeRefreshTimer);
      customerRealtimeRefreshTimer = setTimeout(function () {
        if (!isLoadingCustomers) {
          loadCustomersFromSupabase(currentPage).catch(function (error) {
            console.warn("[REALTIME KH] Không tải lại được danh sách:", error);
          });
        }
      }, 250);
    }

    function subscribeCustomerRealtime() {
      if (!supabaseClient) {
        console.warn("[REALTIME KH] Supabase chưa sẵn sàng.");
        return;
      }

      // Tránh subscribe trùng khi init lại.
      if (customerRealtimeChannel) {
        try {
          supabaseClient.removeChannel(customerRealtimeChannel);
        } catch (error) {
          console.warn("[REALTIME KH] Không remove được channel cũ:", error);
        }

        customerRealtimeChannel = null;
      }

      customerRealtimeChannel = supabaseClient
        .channel("realtime_kv_khachhang_nhanvien")
        .on(
          "postgres_changes",
          {
            event: "*",
            schema: "public",
            table: TABLE_KHACH_HANG_NHANVIEN
          },
          function (payload) {
            applyCustomerRealtimeChange(payload).catch(function (error) {
              console.error("[REALTIME KH] Lỗi xử lý event:", error);
            });
          }
        )
        .subscribe(function (status, error) {
          console.log("[REALTIME KH SUBSCRIBE]", status, error || "");

          if (status === "SUBSCRIBED") {
            console.log(
              "✅ Đã kết nối Realtime:",
              TABLE_KHACH_HANG_NHANVIEN
            );
          }
        });
    }

    function handleStaffChange(changedOption) {
      const staffOptions = getStaffOptions();
      const allOption = document.querySelector('.staff-option[value="all"]');

      const normalOptions = Array.from(staffOptions).filter(function (option) {
        return option.value !== "all";
      });

      if (changedOption.value === "all" && changedOption.checked) {
        normalOptions.forEach(function (option) {
          option.checked = false;
        });
        return;
      }

      if (changedOption.value !== "all" && changedOption.checked) {
        allOption.checked = false;
      }

      const hasAnyNormalChecked = normalOptions.some(function (option) {
        return option.checked;
      });

      if (!hasAnyNormalChecked) {
        allOption.checked = true;
      }
    }
