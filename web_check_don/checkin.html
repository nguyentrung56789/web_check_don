<style>
:root{
  --bar-h:76px;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  min-height:-webkit-fill-available;

  background:#000;
  color:#fff;

  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

  overflow:hidden;
}


/* =====================================================
   CAMERA
===================================================== */

.stage{
  position:fixed;
  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#000;

  z-index:1;

  opacity:0;
  transform:scale(.001);

  transition:.18s;
}

.stage.ready{
  opacity:1;
  transform:scale(1);
}

video,
canvas{
  width:100%;
  height:100%;

  object-fit:cover;

  display:block;

  background:#000;

  pointer-events:none;
}


/* =====================================================
   BOTTOM BAR
===================================================== */

.bar{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  min-height:var(--bar-h);

  padding:
    8px
    8px
    calc(8px + env(safe-area-inset-bottom));

  display:flex;
  flex-wrap:wrap;

  gap:7px;

  justify-content:center;
  align-items:center;

  background:rgba(0,0,0,.38);

  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);

  border-top:
    1px solid rgba(255,255,255,.12);

  z-index:50;
}


.btn{
  appearance:none;
  -webkit-appearance:none;

  border:none;

  border-radius:11px;

  padding:9px 11px;

  font-weight:800;
  font-size:14px;

  cursor:pointer;

  white-space:nowrap;

  touch-action:manipulation;
}

.btn:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.btn-blue{
  background:#2563eb;
  color:#fff;
}

.btn-green{
  background:#10b981;
  color:#001b12;
}

.btn-gray{
  background:#374151;
  color:#fff;
}

.btn-on{
  background:#10b981 !important;
  color:#fff !important;
}

.btn-icon{
  padding:8px;

  width:42px;
  height:42px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:18px;
}


/* =====================================================
   RADIUS
===================================================== */

.radius-wrap{
  display:flex;

  border:
    1px solid rgba(255,255,255,.25);

  border-radius:11px;

  overflow:hidden;
}

.radius-btn{
  border-radius:0;

  min-width:48px;

  background:#374151;
  color:#fff;
}

.radius-btn.active{
  background:#10b981;
  color:#052e1d;
}


/* =====================================================
   TOAST
===================================================== */

#toast{
  position:fixed;

  left:50%;
  top:0;

  transform:
    translate(-50%,-120%);

  opacity:0;

  max-width:
    calc(100vw - 30px);

  padding:10px 14px;

  border-radius:12px;

  background:#e0f2fe;
  color:#075985;

  border:1px solid #38bdf8;

  font-weight:800;

  text-align:center;

  box-shadow:
    0 6px 22px rgba(0,0,0,.25);

  transition:.25s;

  z-index:100001;
}


/* =====================================================
   INFO
===================================================== */

#tagInfo{
  position:fixed;

  left:12px;
  top:10px;

  max-width:
    calc(100vw - 24px);

  padding:6px 10px;

  font-size:12px;

  border-radius:10px;

  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);

  background:#111a;

  border:
    1px solid #ffffff22;

  z-index:60;
}


/* =====================================================
   NEARBY CUSTOMER SHEET
===================================================== */

#nearbyWrap{

  inset:0;

  display:none;

  background:
    rgba(0,0,0,.48);

}

#nearbyWrap.open{

}

#nearbySheet{

  max-width:520px;

  max-height:78vh;

  color:#111827;

  box-shadow:

    env(safe-area-inset-bottom,0);
}

.nearby-grip{

}

.nearby-head{

}

.nearby-title-row{

}

.nearby-title{

}

.nearby-close{

}

#nearbyStatus{
  margin-top:4px;

  color:#64748b;
}

#nearbyList{
  padding:10px 12px;

  -webkit-overflow-scrolling:touch;

/* =====================================================
   CUSTOMER ITEM
===================================================== */

.customer-item{
  width:100%;

  display:block;

  text-align:left;

  border:
    1px solid #dbe3ec;

  border-radius:13px;

  cursor:pointer;
}

.customer-item:active{

}

.customer-name{

.customer-address{

}

.customer-phone{

}

.customer-bottom{
  margin-top:8px;

  justify-content:
    space-between;

}

.customer-distance{

}

.customer-select{

/* =====================================================

===================================================== */

.nearby-loading,

.nearby-empty strong{

.nearby-actions{

.nearby-actions .btn{

/* =====================================================

@media(max-width:390px){

  }

  }

<script>

/* =========================================================
   CONFIG
========================================================= */

const TARGET_W = 900;

const TARGET_H = 1600;


/*
  Có thể truyền link bằng:

  checkin.html?sheet=https://...

  Nếu không truyền thì dùng link mặc định.
*/

const SHEET_URL =
  new URLSearchParams(
    location.search
  ).get('sheet')

  ||

  'https://docs.google.com/spreadsheets/d/.../pub?output=csv';


const SHEET_TTL_MS =
  5 * 60 * 1000;


/*
  MẶC ĐỊNH 50M
*/

let NEAR_RADIUS_M =
  Number(
    localStorage.getItem(
      'CHECKIN_RADIUS_M'
    ) || 50
  );


if (
  NEAR_RADIUS_M !== 20 &&
  NEAR_RADIUS_M !== 50
) {
  NEAR_RADIUS_M = 50;
}


let SHEET_POINTS =
  [];


const SESSION_IMG_KEY =
  'CHECKIN_IMAGE_PAYLOAD';



/* =========================================================
   HELPERS
========================================================= */

const $ =
  id =>
    document.getElementById(id);


const lsGet =
  key => {

    try {

      return JSON.parse(
        localStorage.getItem(key) ||
        'null'
      );

    } catch {

      return null;

    }

  };


const lsSet =
  (key,value) => {

    try {

      localStorage.setItem(
        key,
        JSON.stringify(value)
      );

    } catch {}

  };


function escapeHtml(value){

  return String(value ?? '')

    .replace(/&/g,'&amp;')

    .replace(/</g,'&lt;')

    .replace(/>/g,'&gt;')

    .replace(/"/g,'&quot;')

    .replace(/'/g,'&#039;');
}


/* =========================================================
   CSV PARSER
   HỖ TRỢ CẢ ĐỊA CHỈ CÓ DẤU PHẨY
========================================================= */

function parseCSVLine(line){

  const out = [];

  let cur = '';

  let quoted = false;


  for(
    let i=0;
    i<line.length;
    i++
  ){

    const ch =
      line[i];


    if(ch === '"'){

      if(
        quoted &&
        line[i+1] === '"'
      ){

        cur += '"';

        i++;

      }else{

        quoted =
          !quoted;

      }

      continue;
    }


    if(
      ch === ',' &&
      !quoted
    ){

      out.push(
        cur.trim()
      );

      cur = '';

      continue;
    }


    cur += ch;
  }


  out.push(
    cur.trim()
  );


  return out;
}



function normalizeNumber(value){

  if(
    value === null ||
    value === undefined
  ){

    return NaN;
  }


  const s =
    String(value)
      .trim();


  if(!s){

    return NaN;
  }


  /*
    GPS chuẩn thường dùng dấu chấm.
    Nếu chỉ có dấu phẩy thì đổi thành dấu chấm.
  */

  const normalized =
    s.includes('.') ?
    s :
    s.replace(',','.');


  return Number(
    normalized
  );
}



function parseCsv(text){

  const lines =
    String(text || '')
      .replace(/^\uFEFF/,'')
      .split(/\r?\n/)
      .filter(
        line =>
          line.trim() !== ''
      );


  if(
    !lines.length
  ){

    return [];
  }


  const headers =
    parseCSVLine(
      lines[0]
    )
    .map(
      s =>
        String(s || '')
          .trim()
          .toLowerCase()
    );


  const id =
    name =>
      headers.indexOf(
        String(name).toLowerCase()
      );


  const pick =
    (...names) => {

      for(
        const name
        of names
      ){

        const index =
          id(name);


        if(
          index >= 0
        ){

          return index;
        }

      }


      return -1;
    };


  const idx = {

    lat:
      pick(
        'lat',
        'latitude',
        'vi_do',
        'vido',
        'vĩ độ'
      ),

    lng:
      pick(
        'lng',
        'lon',
        'longitude',
        'kinh_do',
        'kinhdo',
        'kinh độ'
      ),

    ma_kh:
      pick(
        'ma_kh',
        'makh',
        'mã_kh',
        'mã kh',
        'ma'
      ),

    ten_kh:
      pick(
        'ten_kh',
        'tenkh',
        'tên_kh',
        'tên khách hàng',
        'ten',
        'tên',
        'name'
      ),

    dia_chi:
      pick(
        'dia_chi',
        'diachi',
        'địa_chỉ',
        'địa chỉ',
        'address'
      ),

    dien_thoai:
      pick(
        'dien_thoai',
        'dienthoai',
        'điện_thoại',
        'điện thoại',
        'sdt',
        'phone',
        'telephone'
      ),

    ma_hd:
      pick(
        'ma_hd',
        'mahd',
        'mã_hd',
        'mã hóa đơn'
      )

  };


  console.log(
    '[CHECKIN] Sheet headers:',
    headers
  );


  console.log(
    '[CHECKIN] Column index:',
    idx
  );


  if(
    idx.lat < 0 ||
    idx.lng < 0
  ){

    throw new Error(
      'Sheet không có cột lat/lng'
    );
  }


  const out = [];


  for(
    let i=1;
    i<lines.length;
    i++
  ){

    const cols =
      parseCSVLine(
        lines[i]
      );


    const lat =
      normalizeNumber(
        cols[idx.lat]
      );


    const lng =
      normalizeNumber(
        cols[idx.lng]
      );


    if(
      !Number.isFinite(lat) ||
      !Number.isFinite(lng)
    ){

      continue;
    }


    out.push({

      lat,

      lng,

      ma_kh:
        idx.ma_kh >= 0
          ? String(
              cols[idx.ma_kh] || ''
            ).trim()
          : '',

      ten_kh:
        idx.ten_kh >= 0
          ? String(
              cols[idx.ten_kh] || ''
            ).trim()
          : '',

      dia_chi:
        idx.dia_chi >= 0
          ? String(
              cols[idx.dia_chi] || ''
            ).trim()
          : '',

      dien_thoai:
        idx.dien_thoai >= 0
          ? String(
              cols[idx.dien_thoai] || ''
            ).trim()
          : '',

      ma_hd:
        idx.ma_hd >= 0
          ? String(
              cols[idx.ma_hd] || ''
            ).trim()
          : ''

    });

  }


  console.log(
    '[CHECKIN] Tổng điểm đọc được:',
    out.length
  );


  return out;
}



/* =========================================================
   LOAD SHEET
========================================================= */

async function ensureSheetPoints(
  force=false
){

  if(
    force
  ){

    SHEET_POINTS = [];

    try{

      localStorage.removeItem(
        'SHEET_POINTS_CACHE'
      );

      localStorage.removeItem(
        'SHEET_POINTS_TS'
      );

    }catch{}

  }


  if(
    SHEET_POINTS.length
  ){

    return SHEET_POINTS;
  }


  const cached =
    lsGet(
      'SHEET_POINTS_CACHE'
    );


  const ts =
    lsGet(
      'SHEET_POINTS_TS'
    );


  if(
    !force &&
    Array.isArray(cached) &&
    cached.length &&
    ts &&
    Date.now() - ts <
      SHEET_TTL_MS
  ){

    SHEET_POINTS =
      cached;


    console.log(
      '[CHECKIN] Dùng cache Sheet:',
      SHEET_POINTS.length
    );


    return SHEET_POINTS;
  }


  if(
    !SHEET_URL ||
    SHEET_URL.includes(
      '/d/.../'
    )
  ){

    throw new Error(
      'Bạn chưa khai báo SHEET_URL thật'
    );
  }


  console.log(
    '[CHECKIN] Đang tải Sheet:',
    SHEET_URL
  );


  const res =
    await fetch(
      SHEET_URL,
      {
        cache:
          'no-store'
      }
    );


  if(
    !res.ok
  ){

    throw new Error(
      'Không tải được Sheet. HTTP ' +
      res.status
    );
  }


  const contentType =
    (
      res.headers.get(
        'content-type'
      ) || ''
    ).toLowerCase();


  let data =
    [];


  if(
    contentType.includes(
      'application/json'
    )
  ){

    const json =
      await res.json();


    const arr =
      Array.isArray(json)
        ? json
        : (
            Array.isArray(json?.data)
              ? json.data
              : []
          );


    data =
      arr
        .map(
          row => {

            const lat =
              normalizeNumber(
                row.lat ??
                row.latitude ??
                row.vi_do
              );


            const lng =
              normalizeNumber(
                row.lng ??
                row.lon ??
                row.longitude ??
                row.kinh_do
              );


            return {

              lat,

              lng,

              ma_kh:
                String(
                  row.ma_kh ??
                  row.makh ??
                  ''
                ).trim(),

              ten_kh:
                String(
                  row.ten_kh ??
                  row.ten ??
                  row.name ??
                  ''
                ).trim(),

              dia_chi:
                String(
                  row.dia_chi ??
                  row.diachi ??
                  row.address ??
                  ''
                ).trim(),

              dien_thoai:
                String(
                  row.dien_thoai ??
                  row.dienthoai ??
                  row.phone ??
                  row.sdt ??
                  ''
                ).trim(),

              ma_hd:
                String(
                  row.ma_hd ??
                  row.mahd ??
                  ''
                ).trim()

            };

          }
        )

        .filter(
          row =>
            Number.isFinite(
              row.lat
            ) &&
            Number.isFinite(
              row.lng
            )
        );

  }else{

    const text =
      await res.text();


    data =
      parseCsv(
        text
      );

  }


  SHEET_POINTS =
    data;


  lsSet(
    'SHEET_POINTS_CACHE',
    data
  );


  lsSet(
    'SHEET_POINTS_TS',
    Date.now()
  );


  return SHEET_POINTS;
}



/* =========================================================
   DISTANCE
========================================================= */

function distanceMeters(
  a,
  b
){

  const toRad =
    d =>
      d *
      Math.PI /
      180;


  const R =
    6371000;


  const dLat =
    toRad(
      b.lat -
      a.lat
    );


  const dLng =
    toRad(
      b.lng -
      a.lng
    );


  const s1 =
    Math.sin(
      dLat / 2
    );


  const s2 =
    Math.sin(
      dLng / 2
    );


  const aa =
    s1*s1 +

    Math.cos(
      toRad(a.lat)
    ) *

    Math.cos(
      toRad(b.lat)
    ) *

    s2*s2;


  return (
    2 *
    R *
    Math.atan2(
      Math.sqrt(aa),
      Math.sqrt(1-aa)
    )
  );
}



/* =========================================================
   TÌM TẤT CẢ KHÁCH TRONG BÁN KÍNH
========================================================= */

function findNearbyAll(
  lat,
  lng,
  arr,
  radiusM =
    NEAR_RADIUS_M
){

  const result =
    [];


  for(
    const item
    of arr
  ){

    const distance =
      distanceMeters(

        {
          lat,
          lng
        },

        {
          lat:
            Number(
              item.lat
            ),

          lng:
            Number(
              item.lng
            )
        }

      );


    if(
      distance <=
      radiusM
    ){

      result.push({

        ...item,

        dist:
          Math.round(
            distance
          )

      });

    }

  }


  /*
    Gần nhất lên đầu
  */

  result.sort(
    (a,b) =>
      a.dist -
      b.dist
  );


  return result;
}

/* =========================================================
   AUDIO
========================================================= */

let audioCtx =
  null;


let compressor =
  null;


const SHUTTER_GAIN =
  .9;


async function ensureAudioCtx(){

  if(!audioCtx){

    const AC =
      window.AudioContext ||
      window.webkitAudioContext;


    audioCtx =
      new AC();


    compressor =
      audioCtx.createDynamicsCompressor();


    compressor.threshold.setValueAtTime(
      -24,
      audioCtx.currentTime
    );


    compressor.knee.setValueAtTime(
      30,
      audioCtx.currentTime
    );


    compressor.ratio.setValueAtTime(
      12,
      audioCtx.currentTime
    );


    compressor.attack.setValueAtTime(
      .002,
      audioCtx.currentTime
    );


    compressor.release.setValueAtTime(
      .1,
      audioCtx.currentTime
    );


    compressor.connect(
      audioCtx.destination
    );
  }


  if(
    audioCtx.state ===
    'suspended'
  ){

    await audioCtx.resume();
  }

}



function noiseBurst(
  ctx,
  t0,
  dur=.03
){

  const len =
    Math.floor(
      ctx.sampleRate *
      dur
    );


  const buf =
    ctx.createBuffer(
      1,
      len,
      ctx.sampleRate
    );


  const data =
    buf.getChannelData(0);


  for(
    let i=0;
    i<len;
    i++
  ){

    data[i] =
      (
        Math.random()*2-1
      ) * .6;
  }


  const src =
    ctx.createBufferSource();


  src.buffer =
    buf;


  const gain =
    ctx.createGain();


  gain.gain.setValueAtTime(
    0,
    t0
  );


  gain.gain.linearRampToValueAtTime(
    SHUTTER_GAIN,
    t0+.005
  );


  gain.gain.exponentialRampToValueAtTime(
    .0008,
    t0+dur
  );


  const lp =
    ctx.createBiquadFilter();


  lp.type =
    'lowpass';


  lp.frequency.setValueAtTime(
    4500,
    t0
  );


  src.connect(lp);

  lp.connect(gain);

  gain.connect(
    compressor
  );


  src.start(t0);

  src.stop(
    t0 +
    dur +
    .01
  );
}

async function playShutter(){

  if(
    !soundEnabled
  ){

    return;
  }


  await ensureAudioCtx();


  const ctx =
    audioCtx;


  const now =
    ctx.currentTime;


  noiseBurst(
    ctx,
    now,
    .035
  );


  const osc1 =
    ctx.createOscillator();


  const g1 =
    ctx.createGain();


  osc1.type =
    'square';


  osc1.frequency.setValueAtTime(
    1400,
    now
  );


  g1.gain.setValueAtTime(
    0,
    now
  );


  g1.gain.linearRampToValueAtTime(
    SHUTTER_GAIN,
    now+.01
  );


  g1.gain.exponentialRampToValueAtTime(
    .001,
    now+.09
  );


  osc1.connect(g1);

  g1.connect(
    compressor
  );


  osc1.start(now);

  osc1.stop(
    now+.1
  );


  if(
    navigator.vibrate
  ){

    navigator.vibrate(30);
  }

}

function getGPSOnce(
  timeoutMs=10000
){

  return new Promise(
    resolve => {

      if(
        !(
          'geolocation'
          in navigator
        )
      ){

        resolve(null);

        return;
      }


      navigator.geolocation
        .getCurrentPosition(

          position => {

            resolve({

              lat:
                position
                .coords
                .latitude,

              lng:
                position
                .coords
                .longitude,

              acc:
                position
                .coords
                .accuracy

            });

          },


          err => {

            resolve({
              err
            });

          },


          {

            enableHighAccuracy:
              true,

            timeout:
              timeoutMs,

            maximumAge:
              30000

          }

        );

    }
  );

}

const CSS_DIGITAL_ZOOM_MAX =
  5;


let stream =
  null;

let torchOn =

let zoomSupported =
  false;


let cssZoomFallback =
  false;


let zoomMin =
  1;


let zoomMax =

let zoomStep =
  .1;


let zoomVal =

function stopCam(){

  if(stream){

    try{

      stream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

    }catch{}
  }


  stream =
    null;


  videoTrack =
    null;


  if(video){

    video.srcObject =
      null;
  }

}



async function startCam(){

  try{

    stopCam();


    stage
      ?.classList
      .remove(
        'ready'
      );


    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices
        .getUserMedia
    ){

      throw new Error(
        'Trình duyệt không hỗ trợ camera'
      );
    }


    const base = {

      video: {

        width:{
          ideal:1080
        },

        height:{
          ideal:1920
        },

        facingMode:{
          ideal:'environment'
        }

      },

      audio:false

    };


    try{

      stream =
        await navigator
          .mediaDevices
          .getUserMedia(
            base
          );

    }catch(error){

      if(
        error.name ===
        'NotAllowedError'
      ){

        throw new Error(
          'Bạn đã chặn quyền camera.'
        );
      }


      if(
        error.name ===
        'NotFoundError'
      ){

        throw new Error(
          'Không tìm thấy camera.'
        );
      }


      throw error;
    }


    video.srcObject =
      stream;


    video.setAttribute(
      'playsinline',
      ''
    );


    video.muted =
      true;


    await new Promise(
      resolve => {

        video.onloadedmetadata =
          resolve;

      }
    );


    try{

      await video.play();

    }catch(error){

      console.warn(
        'Không play được video:',
        error
      );
    }


    videoTrack =
      stream
        .getVideoTracks()[0]
        ||
        null;


    stage
      ?.classList
      .add(
        'ready'
      );


    btnShot.disabled =
      false;


    await initZoom();


    await setZoom(
      zoomMin
    );


    await tryApplyTorch(
      false
    );


    toast(
      `Camera sẵn sàng • bán kính ${NEAR_RADIUS_M}m`,
      'ok'
    );


  }catch(error){

    console.error(
      error
    );


    btnShot.disabled =
      true;


    stage
      ?.classList
      .remove(
        'ready'
      );


    toast(
      'Lỗi camera: ' +
      (
        error.message ||
        error
      ),
      'err',
      4200
    );
  }

}

   ZOOM
========================================================= */

function renderCssZoom(){

  if(
    !video
  ){

    return;
  }


  video.style.transformOrigin =
    'center center';


  video.style.transform =
    `scale(${zoomVal})`;
}



async function initZoom(){

  zoomSupported =
    false;


  cssZoomFallback =
    false;


  zoomMin =
    1;


  zoomMax =
    1;


  zoomStep =
    .1;


  zoomVal =
    1;


  try{

    const caps =
      videoTrack
        ?.getCapabilities
        ?.()
      ||
      {};


    const hasZoom =
      caps &&
      typeof caps.zoom ===
        'object';


    if(
      hasZoom &&
      typeof caps.zoom.min ===
        'number'
    ){

      zoomSupported =
        true;


      zoomMin =
        caps.zoom.min;


      zoomMax =
        caps.zoom.max ||
        caps.zoom.min;


      zoomStep =
        caps.zoom.step ||
        .1;


      zoomVal =
        zoomMin;


      await videoTrack
        .applyConstraints({

          advanced:[
            {
              zoom:
                zoomVal
            }
          ]

        });

    }else{

      cssZoomFallback =
        true;


      zoomMin =
        1;


      zoomMax =
        CSS_DIGITAL_ZOOM_MAX;


      zoomStep =
        .2;


      zoomVal =
        1;


      renderCssZoom();

    }

  }catch{

    cssZoomFallback =
      true;


    zoomSupported =
      false;


    zoomMin =
      1;


    zoomMax =
      CSS_DIGITAL_ZOOM_MAX;


    zoomStep =
      .2;


    zoomVal =
      1;


    renderCssZoom();

  }


  btnZoomIn.disabled =
    zoomVal >=
    zoomMax;


  btnZoomOut.disabled =
    zoomVal <=
    zoomMin;
}



async function setZoom(
  next
){

  next =
    Number(next) ||
    1;


  next =
    Math.max(
      zoomMin,
      Math.min(
        zoomMax,
        next
      )
    );


  if(
    Math.abs(
      next -
      zoomVal
    ) <
    .001
  ){

    return;
  }


  zoomVal =
    next;


  try{

    if(
      zoomSupported
    ){

      await videoTrack
        .applyConstraints({

          advanced:[
            {
              zoom:
                zoomVal
            }
          ]

        });

    }else if(
      cssZoomFallback
    ){

      renderCssZoom();
    }

  }catch{

    cssZoomFallback =
      true;


    zoomSupported =
      false;


    renderCssZoom();
  }


  btnZoomOut.disabled =
    zoomVal <=
    zoomMin;


  btnZoomIn.disabled =
    zoomVal >=
    zoomMax;
}


btnZoomIn.onclick =
  () =>
    setZoom(
      (
        zoomVal +
        zoomStep
      ).toFixed(2)
    );


btnZoomOut.onclick =
  () =>
    setZoom(
      (
        zoomVal -
        zoomStep
      ).toFixed(2)
    );

async function tryApplyTorch(
  turnOn
){

  try{

    if(
      !videoTrack
    ){

      return false;
    }


    const capabilities =
      videoTrack
        .getCapabilities
        ?.()
      ||
      {};


    if(
      !(

      )

/* =========================================================
   CANVAS
========================================================= */

function drawToCanvas(){

  if(
    !video ||
    !canvas
  ){

    return;
  }


  const fw =
    video.videoWidth;


  const fh =
    video.videoHeight;


  if(
    !fw ||
    !fh
  ){

    return;
  }


  const desired =
    TARGET_W /
    TARGET_H;


  const ar =
    fw /
    fh;


  let sx=0;

  let sy=0;

  let sw=fw;

  let sh=fh;


  if(
    ar >
    desired
  ){

    sw =
      fh *
      desired;


    sx =
      (
        fw -
        sw
      ) / 2;

  }else{

    sh =
      fw /
      desired;


    sy =
      (
        fh -
        sh
      ) / 2;
  }


  if(
    cssZoomFallback &&
    zoomVal >
    1
  ){

    const cx =
      sx +
      sw/2;


    const cy =
      sy +
      sh/2;


    const newSw =
      sw /
      zoomVal;


    const newSh =
      sh /
      zoomVal;


    sx =
      cx -
      newSw/2;


    sy =
      cy -
      newSh/2;


    sw =
      newSw;


    sh =
      newSh;
  }


  canvas.width =
    TARGET_W;


  canvas.height =
    TARGET_H;


  canvas
    .getContext('2d')
    .drawImage(

      video,

      sx,
      sy,
      sw,
      sh,

      0,
      0,
      TARGET_W,
      TARGET_H

    );
}

    `Đang tìm khách trong ${NEAR_RADIUS_M}m...`;


  nearbyList.innerHTML = `

    <div class="nearby-loading">

      📍 Đang đọc danh sách vị trí...

    </div>
  `;


  try{

    const points =
      await ensureSheetPoints(
        forceSheet
      );


    console.log(
      '[CHECKIN] GPS hiện tại:',
      LAST_GPS
    );


    console.log(
      '[CHECKIN] Tổng điểm:',
      points.length
    );


    const rows =
      findNearbyAll(

        LAST_GPS.lat,

        LAST_GPS.lng,

        points,

        NEAR_RADIUS_M

      );


    console.log(
      `[CHECKIN] Khách <= ${NEAR_RADIUS_M}m:`,
      rows
    );


    renderNearby(
      rows,
      LAST_GPS
    );


  }catch(error){

    console.error(
      '[CHECKIN] Lỗi tìm khách:',
      error
    );


    nearbyStatus.textContent =
      'Không đọc được danh sách vị trí';


    nearbyList.innerHTML = `

      <div class="nearby-empty">

        <strong>
          ⚠️ Không tìm được vị trí
        </strong>

        <div
          style="
            margin-top:8px;
            font-size:13px
          "
        >
          ${escapeHtml(
            error.message ||
            error
          )}
        </div>

      </div>
    `;
  }

}

/* =========================================================
   CHUYỂN SANG checkin_khach_hang.html
========================================================= */

function continueToCheckin(
  selectedCustomer=null
){

  if(
    !LAST_GPS
  ){

    toast(
      'Chưa có GPS',
      'err'
    );

    return;
  }


  const selectedMaKh =
    selectedCustomer?.ma_kh ||
    MA_KH ||
    '';


  /*
    Lưu khách vừa chọn để trang sau
    có thể sử dụng.
  */

  if(
    selectedCustomer
  ){

    try{

      sessionStorage.setItem(

        'CHECKIN_SELECTED_CUSTOMER',

        JSON.stringify(
          selectedCustomer
        )

      );

    }catch{}

  }else{

    try{

      sessionStorage.removeItem(
        'CHECKIN_SELECTED_CUSTOMER'
      );

    }catch{}

  }


  const targetUrl =
    new URL(
      '/checkin_khach_hang.html',
      location.origin
    );


  targetUrl.searchParams.set(
    'lat',
    String(
      LAST_GPS.lat
    )
  );


  targetUrl.searchParams.set(
    'lng',
    String(
      LAST_GPS.lng
    )
  );


  /*
    Giữ lại lag như code cũ.
  */

  targetUrl.searchParams.set(
    'lag',
    String(
      LAST_GPS.lat
    )
  );


  targetUrl.searchParams.set(
    'ma_nv',
    MA_NV
  );


  targetUrl.searchParams.set(
    'ten_nv',
    TEN_NV
  );


  targetUrl.searchParams.set(
    'radius',
    String(
      NEAR_RADIUS_M
    )
  );


  if(
    selectedMaKh
  ){

    targetUrl.searchParams.set(
      'ma_kh',
      selectedMaKh
    );

  }


  if(
    MA_HD
  ){

    targetUrl.searchParams.set(
      'ma_hd',
      MA_HD
    );

  }


  /*
    Có khách được chọn:
    truyền thêm thông tin.
  */

  if(
    selectedCustomer
  ){

    if(
      selectedCustomer.ten_kh
    ){

      targetUrl.searchParams.set(
        'ten_kh',
        selectedCustomer.ten_kh
      );

    }


    if(
      selectedCustomer.dia_chi
    ){

      targetUrl.searchParams.set(
        'dia_chi',
        selectedCustomer.dia_chi
      );

    }


    if(
      selectedCustomer.dien_thoai
    ){

      targetUrl.searchParams.set(
        'dien_thoai',
        selectedCustomer.dien_thoai
      );

    }


    targetUrl.searchParams.set(
      'distance',
      String(
        selectedCustomer.dist
      )
    );

  }


  targetUrl.searchParams.set(
    'img',
    'session'
  );


  const shotId =
    String(
      Date.now()
    );


  targetUrl.searchParams.set(
    'shot_id',
    shotId
  );


  sessionStorage.setItem(
    'CHECKIN_CURRENT_SHOT_ID',
    shotId
  );


  sessionStorage.removeItem(
    'CLICKED_CHECKIN_BROWSER_V1'
  );


  sessionStorage.removeItem(
    'CHECKIN_BROWSER_DONE_V1'
  );


  location.assign(
    targetUrl.toString()
  );
}

   EVENTS
========================================================= */

btnStart.onclick =

let shooting =
  false;



btnShot.onclick =
  async () => {

    if(
      !stream ||
      shooting
    ){

      toast(
        'Đang xử lý...',
        'info'
      );

      return;
    }


    shooting =
      true;


    btnShot.disabled =
      true;


    try{

      await ensureAudioCtx();


      await playShutter();


      drawToCanvas();


      toast(
        'Đang lấy vị trí GPS...',
        'info',
        1800
      );


      const gps =
        await getGPSOnce(
          10000
        );


      if(
        gps &&
        gps.err
      ){

        if(
          gps.err.code ===
          1
        ){

          toast(
            '⚠️ Bạn đã chặn quyền vị trí.',
            'err',
            4200
          );


          openGeoHelp();


          return;
        }


        toast(
          '⚠️ Không lấy được GPS. Hãy bật vị trí rồi chụp lại.',
          'err',
          3500
        );


        return;
      }


      const lat =
        gps?.lat ??
        0;


      const lng =
        gps?.lng ??
        0;


      if(
        !lat ||
        !lng
      ){

        toast(
          '⚠️ Chưa có vị trí GPS.',
          'err',
          3500
        );


        return;
      }


      LAST_GPS = {

        lat:

          Number(lat),

        lng:

          Number(lng),

        acc:

          Number(
            gps?.acc ||
            0
          )

      };


      window.__myLatLng = {

        lat:
          LAST_GPS.lat,

        lng:
          LAST_GPS.lng

      };


      console.log(
        '[CHECKIN] GPS chụp:',
        LAST_GPS
      );


      /*
        LƯU ẢNH GIỐNG CODE GỐC
      */

      const mime =
        'image/jpeg';


      const dataUrl =
        canvas.toDataURL(
          mime,
          .85
        );


      const payload = {

        image_mime:
          mime,

        image_b64:
          (
            dataUrl
              .split(',')[1]
            ||
            ''
          ),

        ma_nv:
          MA_NV,

        ten_nv:
          TEN_NV,

        ma_kh:
          MA_KH ||
          '',

        ma_hd:
          MA_HD ||
          '',

        gps_lat:
          LAST_GPS.lat,

        gps_lng:
          LAST_GPS.lng,

        gps_accuracy:
          LAST_GPS.acc,

        radius_m:
          NEAR_RADIUS_M

      };


      sessionStorage.setItem(

        SESSION_IMG_KEY,

        JSON.stringify(
          payload
        )

      );


      /*
        KHÁC CODE CŨ:

        Không chuyển trang ngay.

        Chụp xong:
        → đọc Sheet
        → tìm tất cả khách trong 20/50m
        → cho người dùng chọn.
      */

      await scanNearbyCustomers(
        false
      );


    }catch(error){

      console.error(
        error
      );


      toast(
        'Lỗi khi chuẩn bị dữ liệu: ' +
        (
          error.message ||
          error
        ),
        'err',
        4000
      );


    }finally{

      shooting =
        false;


      btnShot.disabled =
        !stream;
    }

  };

function showStage(){

  if(
    stage &&
    !stage.classList
      .contains(
        'ready'
      )
  ){

    stage
      .classList
      .add(
        'ready'
      );
  }

}



async function getPermState(
  name
){

  try{

    if(
      !navigator
        .permissions
        ?.query
    ){

      return null;
    }


    const permission =
      await navigator
        .permissions
        .query({
          name
        });


    return permission.state;

  }catch{

    return null;
  }

}



(async () => {

  showStage();


  btnShot.disabled =
    true;


  const camState =
    await getPermState(
      'camera'
    );


  if(
    camState ===
    'granted'
  ){

    toast(
      'Đang mở camera...',
      'info',
      1200
    );


    await startCam();


    return;
  }


  toast(
    `Bấm "Cam" để mở camera • bán kính mặc định ${NEAR_RADIUS_M}m`,
    'info',
    2600
  );

})();

========================================================= */

document.addEventListener(
  'visibilitychange',
  () => {

    if(
      document.hidden
    ){

      stopCam();

    }else{

      showStage();


      if(
        !stream
      ){

        btnShot.disabled =
          true;


        toast(
          'Bấm "Cam" để mở lại camera.',
          'info',
          2200
        );
      }

    }

  }
);
