<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
/>
<meta name="theme-color" content="#111" />

<title>Check-in giao thành công</title>

<style>
:root{
  --bar-h:76px;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  min-height:-webkit-fill-available;
  background:#000;
  color:#fff;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  overflow:hidden;
}

/* =====================================================
   CAMERA
===================================================== */

.stage{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#000;
  z-index:1;
  opacity:0;
  transform:scale(.001);
  transition:.18s;
}

.stage.ready{
  opacity:1;
  transform:scale(1);
}

video,
canvas{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  background:#000;
  pointer-events:none;
}

/* =====================================================
   BAR
===================================================== */

.bar{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  min-height:var(--bar-h);

  padding:
    8px
    8px
    calc(8px + env(safe-area-inset-bottom));

  display:flex;
  flex-wrap:wrap;
  gap:7px;

  justify-content:center;
  align-items:center;

  background:rgba(0,0,0,.38);

  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);

  border-top:1px solid rgba(255,255,255,.12);

  z-index:50;
}

.btn{
  appearance:none;
  -webkit-appearance:none;
  border:none;
  border-radius:11px;
  padding:9px 11px;
  font-weight:800;
  font-size:14px;
  cursor:pointer;
  white-space:nowrap;
  touch-action:manipulation;
}

.btn:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.btn-blue{
  background:#2563eb;
  color:#fff;
}

.btn-green{
  background:#10b981;
  color:#001b12;
}

.btn-gray{
  background:#374151;
  color:#fff;
}

.btn-on{
  background:#10b981!important;
  color:#fff!important;
}

.btn-icon{
  padding:8px;
  width:42px;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
}

/* =====================================================
   TOAST
===================================================== */

#toast{
  position:fixed;
  left:50%;
  top:0;

  transform:translate(-50%,-120%);

  opacity:0;

  max-width:calc(100vw - 30px);

  padding:10px 14px;

  border-radius:12px;

  background:#e0f2fe;
  color:#075985;

  border:1px solid #38bdf8;

  font-weight:800;
  text-align:center;

  box-shadow:0 6px 22px rgba(0,0,0,.25);

  transition:.25s;

  z-index:100001;
}

/* =====================================================
   INFO
===================================================== */

#tagInfo{
  position:fixed;
  left:12px;
  top:10px;

  max-width:calc(100vw - 24px);

  padding:6px 10px;

  font-size:12px;

  border-radius:10px;

  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);

  background:#111a;

  border:1px solid #ffffff22;

  z-index:60;
}

/* =====================================================
   DANH SÁCH KHÁCH XUNG QUANH
===================================================== */

#nearbyWrap{
  position:fixed;
  inset:0;

  display:none;

  background:rgba(0,0,0,.5);

  z-index:100000;
}

#nearbyWrap.open{
  display:block;
}

#nearbySheet{
  position:absolute;

  left:0;
  right:0;
  bottom:0;

  width:100%;
  max-width:520px;

  margin:0 auto;

  max-height:80vh;

  display:flex;
  flex-direction:column;

  background:#fff;
  color:#111827;

  border-radius:18px 18px 0 0;

  box-shadow:0 -12px 35px rgba(0,0,0,.3);

  overflow:hidden;

  padding-bottom:env(safe-area-inset-bottom,0);
}

.nearby-grip{
  width:44px;
  height:5px;

  border-radius:999px;

  background:#d1d5db;

  margin:8px auto 3px;
}

.nearby-head{
  padding:7px 12px 10px;

  border-bottom:1px solid #e5e7eb;
}

.nearby-title-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.nearby-title{
  font-size:18px;
  font-weight:900;
}

.nearby-close{
  width:38px;
  height:38px;

  border:none;

  border-radius:10px;

  background:#f3f4f6;

  font-size:20px;

  cursor:pointer;
}

#nearbyStatus{
  margin-top:4px;

  font-size:13px;

  color:#64748b;
}

#nearbyGPS{
  margin-top:3px;

  font-size:11px;

  color:#94a3b8;
}

#nearbyList{
  padding:10px 12px;

  overflow-y:auto;

  -webkit-overflow-scrolling:touch;
}

/* =====================================================
   KHÁCH
===================================================== */

.customer-item{
  width:100%;

  display:block;

  text-align:left;

  border:1px solid #dbe3ec;

  border-radius:13px;

  padding:12px;

  margin-bottom:9px;

  background:#fff;

  cursor:pointer;
}

.customer-item:active{
  background:#ecfdf5;
}

.customer-name{
  font-size:16px;
  font-weight:900;
  color:#111827;
  margin-bottom:5px;
}

.customer-code{
  font-size:11px;
  color:#94a3b8;
  margin-bottom:4px;
}

.customer-address,
.customer-phone{
  font-size:14px;
  color:#475569;
  margin-top:3px;
  line-height:1.4;
}

.customer-bottom{
  margin-top:8px;

  display:flex;

  justify-content:space-between;
  align-items:center;

  gap:10px;
}

.customer-distance{
  font-size:14px;

  color:#15803d;

  font-weight:900;
}

.customer-select{
  color:#2563eb;

  font-size:13px;

  font-weight:800;
}

/* =====================================================
   EMPTY / LOADING
===================================================== */

.nearby-loading,
.nearby-empty{
  padding:28px 12px;

  text-align:center;

  color:#64748b;
}

.nearby-empty strong{
  display:block;

  color:#334155;

  font-size:15px;
}

.nearby-actions{
  padding:0 12px 12px;

  display:flex;

  gap:8px;
}

.nearby-actions .btn{
  flex:1;

  padding:11px 10px;
}

/* =====================================================
   DEBUG GPS
===================================================== */

.debug-nearest{
  margin-top:12px;

  padding:10px;

  background:#f8fafc;

  border-radius:10px;

  text-align:left;

  font-size:12px;

  color:#64748b;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:390px){

  .bar{
    gap:5px;

    padding-left:5px;
    padding-right:5px;
  }

  .btn{
    padding:8px 9px;

    font-size:13px;
  }

  .btn-icon{
    width:39px;
    height:39px;
  }

}

</style>

<script>

/* =========================================================
   CẤU HÌNH
========================================================= */

const TARGET_W = 900;

const TARGET_H = 1600;


/*
  TABLE TRỰC TIẾP SUPABASE
*/

const TABLE_CUSTOMER =
  'nv_checkin_khach_hang';

/*
  Webhook giao hàng thành công
  Giống checkin.js gốc
*/
const WEBHOOK_URL =
  'https://dhsybbqoe.datadex.vn/webhook/hoadon';


/*
  Mỗi lần mở trang mặc định 50m.
*/

let NEAR_RADIUS_M =
  50;


/*
  CACHE TRONG RAM CỦA TRANG.
*/

let CUSTOMER_POINTS =
  [];


const SESSION_IMG_KEY =
  'CHECKIN_IMAGE_PAYLOAD';



/* =========================================================
   DOM HELPER
========================================================= */

const $ =
  id =>
    document.getElementById(id);


const video =
  $('video');

const canvas =
  $('canvas');

const btnStart =
  $('btnStart');

const btnShot =
  $('btnShot');

const btnTorch =
  $('btnTorch');

const btnSound =
  $('btnSound');

const btnZoomIn =
  $('btnZoomIn');

const btnZoomOut =
  $('btnZoomOut');

const btnMenu =
  $('btnMenu');

const toastEl =
  $('toast');

const tagInfo =
  $('tagInfo');

const stage =
  $('stage');

const nearbyWrap =
  $('nearbyWrap');

const nearbyList =
  $('nearbyList');

const nearbyStatus =
  $('nearbyStatus');

const nearbyGPS =
  $('nearbyGPS');

const btnCloseNearby =
  $('btnCloseNearby');

const btnScanAgain =
  $('btnScanAgain');

const btnContinueNoCustomer =
  $('btnContinueNoCustomer');

const btnSendImageWithGPS =
  $('btnSendImageWithGPS');


if(video){

  video.style.objectFit =
    'cover';

  video.setAttribute(
    'playsinline',
    ''
  );

  video.muted =
    true;
}



/* =========================================================
   STORAGE
========================================================= */

const lsGet =
  key => {

    try{

      return JSON.parse(
        localStorage.getItem(key) ||
        'null'
      );

    }catch{

      return null;
    }

  };



/* =========================================================
   STRING
========================================================= */

function cleanString(value){

  if(
    value === null ||
    value === undefined
  ){

    return '';
  }


  if(
    typeof value === 'string' ||
    typeof value === 'number'
  ){

    return String(value).trim();
  }


  return '';
}



function escapeHtml(value){

  return String(value ?? '')

    .replace(/&/g,'&amp;')

    .replace(/</g,'&lt;')

    .replace(/>/g,'&gt;')

    .replace(/"/g,'&quot;')

    .replace(/'/g,'&#039;');
}



/* =========================================================
   PARAMS
========================================================= */

const qp =
  new URLSearchParams(
    location.search
  );


const MA_KH =
  qp.get('ma_kh') ||
  '';


const MA_HD =
  qp.get('ma_hd') ||
  '';



/* =========================================================
   LOGIN
========================================================= */

function getLoggedNV(){

  const nv =
    lsGet('nv');


  if(
    nv &&
    nv.ma_nv
  ){

    return nv;
  }


  try{

    const ctx =
      JSON.parse(
        sessionStorage.getItem(
          'nv_ctx'
        ) ||
        'null'
      );


    if(
      ctx &&
      ctx.ma_nv
    ){

      return ctx;
    }

  }catch{}


  return null;
}


const LOGGED_NV =
  getLoggedNV();


const MA_NV =
  (
    qp.get('ma_nv') ||
    LOGGED_NV?.ma_nv ||
    ''
  ).trim();


const TEN_NV =
  (
    qp.get('ten_nv') ||
    LOGGED_NV?.ten_nv ||
    ''
  ).trim();


if(!MA_NV){

  try{

    alert(
      'Thiếu mã nhân viên. Vui lòng vào từ Trang chính.'
    );

  }catch{}


  location.replace(
    './main.html'
  );


  throw new Error(
    'Missing ma_nv'
  );
}


if(
  !LOGGED_NV ||
  !LOGGED_NV.ma_nv ||
  LOGGED_NV.hoat_dong === false
){

  try{

    alert(
      'Bạn chưa đăng nhập.'
    );

  }catch{}


  location.replace(
    './login.html'
  );


  throw new Error(
    'Not logged in'
  );
}


if(
  String(
    LOGGED_NV.ma_nv
  ) !==
  String(MA_NV)
){

  try{

    alert(
      'Mã nhân viên không khớp tài khoản đăng nhập.'
    );

  }catch{}


  location.replace(
    './main.html'
  );


  throw new Error(
    'ma_nv mismatch'
  );
}



/* =========================================================
   TOAST
========================================================= */

function toast(
  text,
  type='info',
  ms=2400
){

  if(!toastEl){
    return;
  }


  toastEl.textContent =
    text;


  if(type === 'err'){

    toastEl.style.background =
      '#fee2e2';

    toastEl.style.color =
      '#991b1b';

    toastEl.style.borderColor =
      '#ef4444';

  }

  else if(type === 'ok'){

    toastEl.style.background =
      '#dcfce7';

    toastEl.style.color =
      '#166534';

    toastEl.style.borderColor =
      '#22c55e';

  }

  else{

    toastEl.style.background =
      '#e0f2fe';

    toastEl.style.color =
      '#075985';

    toastEl.style.borderColor =
      '#38bdf8';
  }


  toastEl.style.opacity =
    '1';


  toastEl.style.transform =
    'translate(-50%,10px)';


  clearTimeout(
    toast._t
  );


  toast._t =
    setTimeout(
      () => {

        toastEl.style.opacity =
          '0';


        toastEl.style.transform =
          'translate(-50%,-120%)';

      },
      ms
    );

}



/* =========================================================
   BÁN KÍNH CỐ ĐỊNH 50M
========================================================= */

NEAR_RADIUS_M = 50;

if(tagInfo){

  tagInfo.textContent =
    [

      MA_NV &&
        `NV:${MA_NV}`,

      MA_KH &&
        `KH:${MA_KH}`,

      MA_HD &&
        `HD:${MA_HD}`,

      '📍50m'

    ]
    .filter(Boolean)
    .join(' · ');
}


/* =========================================================
   ĐỌC CONFIG SUPABASE
========================================================= */

function findConfigString(
  value,
  possibleKeys=[]
){

  const direct =
    cleanString(value);


  if(direct){

    return direct;
  }


  if(
    value &&
    typeof value ===
      'object'
  ){

    for(
      const key
      of possibleKeys
    ){

      const found =
        cleanString(
          value[key]
        );


      if(found){

        return found;
      }

    }


    /*
      Thử sâu thêm 1 cấp.
    */

    for(
      const child
      of Object.values(value)
    ){

      if(
        child &&
        typeof child ===
          'object'
      ){

        for(
          const key
          of possibleKeys
        ){

          const found =
            cleanString(
              child[key]
            );


          if(found){

            return found;
          }

        }

      }

    }

  }


  return '';
}



async function resolveSupabaseConfig(){

  let url =
    '';

  let key =
    '';


  /*
    CHỜ CONFIG
  */

  try{

    if(
      window.configReady &&
      typeof window.configReady.then ===
        'function'
    ){

      await window.configReady;
    }

  }catch{}



  /*
    1. getConfig()
  */

  try{

    if(
      typeof window.getConfig ===
        'function'
    ){

      url =
        findConfigString(

          window.getConfig(
            'url'
          ),

          [
            'url',
            'value',
            'SUPABASE_URL',
            'supabaseUrl',
            'supabase_url'
          ]

        );


      key =
        findConfigString(

          window.getConfig(
            'anon'
          ),

          [
            'anon',
            'key',
            'value',
            'SUPABASE_ANON',
            'SUPABASE_ANON_KEY',
            'supabaseAnon',
            'supabaseKey',
            'supabase_anon_key'
          ]

        );

    }

  }catch(error){

    console.warn(
      '[CHECKIN] getConfig lỗi:',
      error
    );
  }



  /*
    2. Các object config
  */

  const configObjects =
    [
      window.COD_CONFIG,
      window.CONFIG,
      window.APP_CONFIG
    ];


  for(
    const cfg
    of configObjects
  ){

    if(
      !cfg ||
      typeof cfg !==
        'object'
    ){

      continue;
    }


    if(!url){

      url =
        findConfigString(

          cfg,

          [
            'url',
            'SUPABASE_URL',
            'supabaseUrl',
            'supabase_url'
          ]

        );

    }


    if(!key){

      key =
        findConfigString(

          cfg,

          [
            'anon',
            'key',
            'SUPABASE_ANON',
            'SUPABASE_ANON_KEY',
            'supabaseAnon',
            'supabaseKey',
            'supabase_anon_key'
          ]

        );

    }

  }



  /*
    3. Nếu trang đang mở trong iframe,
       thử đọc config trang cha.
  */

  if(
    (!url || !key) &&
    window.parent &&
    window.parent !== window
  ){

    try{

      if(
        typeof window.parent.getConfig ===
          'function'
      ){

        if(!url){

          url =
            findConfigString(

              window.parent.getConfig(
                'url'
              ),

              [
                'url',
                'value',
                'SUPABASE_URL',
                'supabaseUrl'
              ]

            );

        }


        if(!key){

          key =
            findConfigString(

              window.parent.getConfig(
                'anon'
              ),

              [
                'anon',
                'key',
                'value',
                'SUPABASE_ANON',
                'SUPABASE_ANON_KEY'
              ]

            );

        }

      }

    }catch(error){

      console.warn(
        '[CHECKIN] Parent config lỗi:',
        error
      );
    }

  }



  /*
    4. /api/getConfig
  */

  if(
    !url ||
    !key
  ){

    try{

      let internalKey =
        '';


      if(
        typeof window.getInternalKey ===
          'function'
      ){

        internalKey =
          cleanString(
            window.getInternalKey()
          );
      }


      if(
        !internalKey &&
        window.parent &&
        window.parent !== window
      ){

        try{

          if(
            typeof window.parent.getInternalKey ===
              'function'
          ){

            internalKey =
              cleanString(
                window.parent.getInternalKey()
              );
          }

        }catch{}

      }


      const headers = {

        Accept:
          'application/json'

      };


      if(internalKey){

        headers[
          'x-internal-key'
        ] =
          internalKey;
      }


      const response =
        await fetch(

          '/api/getConfig',

          {
            method:'GET',
            headers,
            cache:'no-store'
          }

        );


      if(response.ok){

        const config =
          await response.json();


        if(!url){

          url =
            findConfigString(

              config,

              [
                'url',
                'SUPABASE_URL',
                'supabaseUrl',
                'supabase_url'
              ]

            );

        }


        if(!key){

          key =
            findConfigString(

              config,

              [
                'anon',
                'key',
                'SUPABASE_ANON',
                'SUPABASE_ANON_KEY',
                'supabaseAnon',
                'supabaseKey'
              ]

            );

        }

      }

    }catch(error){

      console.warn(
        '[CHECKIN] /api/getConfig lỗi:',
        error
      );
    }

  }



  url =
    cleanString(url)
      .replace(
        /\/+$/,
        ''
      );


  key =
    cleanString(key);


  if(
    !url ||
    !/^https?:\/\/.+/i.test(url)
  ){

    throw new Error(
      'Không lấy được URL Supabase hợp lệ'
    );
  }


  if(!key){

    throw new Error(
      'Không lấy được Supabase anon key'
    );
  }


  console.log(
    '[CHECKIN] Supabase OK:',
    url
  );


  return {
    url,
    key
  };
}



/* =========================================================
   CHUYỂN GPS TEXT → NUMBER
========================================================= */

function parseGPSNumber(value){

  if(
    value === null ||
    value === undefined
  ){

    return NaN;
  }


  let text =
    String(value)
      .trim();


  if(!text){

    return NaN;
  }


  /*
    Hỗ trợ:
    20.82608
    20,82608
  */

  if(
    !text.includes('.') &&
    text.includes(',')
  ){

    text =
      text.replace(
        ',',
        '.'
      );
  }


  return Number(text);
}



/* =========================================================
   ĐỌC TOÀN BỘ TABLE

   DÙNG PHÂN TRANG 1000 DÒNG
   ĐỂ KHÔNG BỊ THIẾU KHÁCH.
========================================================= */

async function loadCustomerPoints(
  force=false
){

  if(
    CUSTOMER_POINTS.length &&
    !force
  ){

    return CUSTOMER_POINTS;
  }


  const {
    url,
    key
  } =
    await resolveSupabaseConfig();


  const PAGE_SIZE =
    1000;


  let offset =
    0;


  let allRows =
    [];


  while(true){

    const query =
      new URLSearchParams();


    /*
      SELECT * để nếu dia_chi chưa có
      hoặc table có thêm cột thì không bị lỗi.
    */

    query.set(
      'select',
      '*'
    );


    query.set(
      'limit',
      String(
        PAGE_SIZE
      )
    );


    query.set(
      'offset',
      String(
        offset
      )
    );


    const response =
      await fetch(

        `${url}/rest/v1/${TABLE_CUSTOMER}?${query.toString()}`,

        {
          method:'GET',

          headers:{

            apikey:
              key,

            Authorization:
              `Bearer ${key}`,

            Accept:
              'application/json'

          },

          cache:
            'no-store'
        }

      );


    if(
      !response.ok
    ){

      const errorText =
        await response.text();


      throw new Error(

        `Không đọc được ${TABLE_CUSTOMER}: HTTP ${response.status} ${errorText}`

      );
    }


    const rows =
      await response.json();


    if(
      !Array.isArray(rows)
    ){

      break;
    }


    allRows.push(
      ...rows
    );


    console.log(
      '[CHECKIN] Đã tải:',
      allRows.length
    );


    if(
      rows.length <
      PAGE_SIZE
    ){

      break;
    }


    offset +=
      PAGE_SIZE;


    /*
      Giới hạn an toàn.
    */

    if(
      offset >=
      50000
    ){

      break;
    }

  }


  console.log(
    '[CHECKIN] Tổng dòng table:',
    allRows.length
  );


  CUSTOMER_POINTS =
    allRows

      .map(
        row => {

          const lat =
            parseGPSNumber(
              row.lat
            );


          const lng =
            parseGPSNumber(
              row.lng
            );


          return {

            ...row,

            ma_kh:
              cleanString(
                row.ma_kh
              ),

            ma_nv:
              cleanString(
                row.ma_nv
              ),

            ten_kh:
              cleanString(
                row.ten_kh
              ),

            dia_chi:
              cleanString(
                row.dia_chi
              ),

            dien_thoai:
              cleanString(
                row.dien_thoai
              ),

            lat,

            lng

          };

        }
      )

      .filter(
        row => {

          return (

            Number.isFinite(
              row.lat
            )

            &&

            Number.isFinite(
              row.lng
            )

            &&

            row.lat >= -90

            &&

            row.lat <= 90

            &&

            row.lng >= -180

            &&

            row.lng <= 180

          );

        }
      );


  console.log(
    '[CHECKIN] GPS hợp lệ:',
    CUSTOMER_POINTS.length
  );


  return CUSTOMER_POINTS;
}



/* =========================================================
   KHOẢNG CÁCH HAVERSINE
========================================================= */

function distanceMeters(
  a,
  b
){

  const toRad =
    degree =>
      degree *
      Math.PI /
      180;


  const R =
    6371000;


  const dLat =
    toRad(
      b.lat -
      a.lat
    );


  const dLng =
    toRad(
      b.lng -
      a.lng
    );


  const s1 =
    Math.sin(
      dLat / 2
    );


  const s2 =
    Math.sin(
      dLng / 2
    );


  const aa =

    s1*s1

    +

    Math.cos(
      toRad(
        a.lat
      )
    )

    *

    Math.cos(
      toRad(
        b.lat
      )
    )

    *

    s2*s2;


  return (

    2 *

    R *

    Math.atan2(

      Math.sqrt(aa),

      Math.sqrt(
        1-aa
      )

    )

  );
}



/* =========================================================
   TÍNH TẤT CẢ KHÁCH + KHOẢNG CÁCH
========================================================= */

function getAllCustomersWithDistance(
  lat,
  lng,
  points
){

  const result =
    [];


  for(
    const customer
    of points
  ){

    const distance =
      distanceMeters(

        {
          lat:
            Number(lat),

          lng:
            Number(lng)
        },

        {
          lat:
            customer.lat,

          lng:
            customer.lng
        }

      );


    if(
      !Number.isFinite(
        distance
      )
    ){

      continue;
    }


    result.push({

      ...customer,

      distance,

      dist:
        Math.round(
          distance
        )

    });

  }


  result.sort(
    (a,b) =>
      a.distance -
      b.distance
  );


  return result;
}



/* =========================================================
   NEARBY
========================================================= */

function findNearbyAll(
  lat,
  lng,
  points,
  radiusM
){

  return getAllCustomersWithDistance(
    lat,
    lng,
    points
  )
  .filter(
    row =>
      row.distance <=
      radiusM
  );

}

/* =========================================================
   AUDIO
========================================================= */

let audioCtx =
  null;


let compressor =
  null;


const SHUTTER_GAIN =
  .9;


async function ensureAudioCtx(){

  if(!audioCtx){

    const AC =
      window.AudioContext ||
      window.webkitAudioContext;


    audioCtx =
      new AC();


    compressor =
      audioCtx.createDynamicsCompressor();


    compressor.threshold
      .setValueAtTime(
        -24,
        audioCtx.currentTime
      );


    compressor.knee
      .setValueAtTime(
        30,
        audioCtx.currentTime
      );


    compressor.ratio
      .setValueAtTime(
        12,
        audioCtx.currentTime
      );


    compressor.attack
      .setValueAtTime(
        .002,
        audioCtx.currentTime
      );


    compressor.release
      .setValueAtTime(
        .1,
        audioCtx.currentTime
      );


    compressor.connect(
      audioCtx.destination
    );

  }


  if(
    audioCtx.state ===
    'suspended'
  ){

    await audioCtx.resume();
  }

}



function noiseBurst(
  ctx,
  t0,
  dur=.03
){

  const len =
    Math.floor(
      ctx.sampleRate *
      dur
    );


  const buf =
    ctx.createBuffer(
      1,
      len,
      ctx.sampleRate
    );


  const data =
    buf.getChannelData(0);


  for(
    let i=0;
    i<len;
    i++
  ){

    data[i] =
      (
        Math.random()*2-1
      ) * .6;
  }


  const src =
    ctx.createBufferSource();


  src.buffer =
    buf;


  const gain =
    ctx.createGain();


  gain.gain.setValueAtTime(
    0,
    t0
  );


  gain.gain.linearRampToValueAtTime(
    SHUTTER_GAIN,
    t0+.005
  );


  gain.gain.exponentialRampToValueAtTime(
    .0008,
    t0+dur
  );


  const lp =
    ctx.createBiquadFilter();


  lp.type =
    'lowpass';


  lp.frequency
    .setValueAtTime(
      4500,
      t0
    );


  src.connect(lp);

  lp.connect(gain);

  gain.connect(
    compressor
  );


  src.start(t0);

  src.stop(
    t0 +
    dur +
    .01
  );

}

const CSS_DIGITAL_ZOOM_MAX =
  5;


let stream =
  null;


let videoTrack =

let torchOn =
  false;


let zoomSupported =
  false;


let cssZoomFallback =
  false;


let zoomMin =
  1;


let zoomMax =
  1;


let zoomStep =
  .1;


let zoomVal =
  1;



function stopCam(){

  if(stream){

    try{

      stream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

    }catch{}

  }


  stream =
    null;


  videoTrack =
    null;


  if(video){

    video.srcObject =
      null;
  }

}



async function startCam(){

  try{

    stopCam();


    stage
      ?.classList
      .remove(
        'ready'
      );


    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      throw new Error(
        'Trình duyệt không hỗ trợ camera'
      );
    }


    const constraints = {

      video:{

        width:{
          ideal:1080
        },

        height:{
          ideal:1920
        },

        facingMode:{
          ideal:'environment'
        }

      },

      audio:false

    };


    stream =
      await navigator
        .mediaDevices
        .getUserMedia(
          constraints
        );


    video.srcObject =
      stream;


    video.setAttribute(
      'playsinline',
      ''
    );


    video.muted =
      true;


    await new Promise(
      resolve => {

        if(
          video.readyState >=
          1
        ){

          resolve();

        }else{

          video.onloadedmetadata =
            resolve;
        }

      }
    );


    try{

      await video.play();

    }catch(error){

      console.warn(
        'Không play được video:',
        error
      );
    }


    videoTrack =
      stream
        .getVideoTracks()[0]
      ||
      null;


    stage
      ?.classList
      .add(
        'ready'
      );


    btnShot.disabled =
      false;


    await initZoom();


    await setZoom(
      zoomMin
    );


    await tryApplyTorch(
      false
    );


    toast(
      `Camera sẵn sàng • bán kính ${NEAR_RADIUS_M}m`,
      'ok'
    );


  }catch(error){

    console.error(
      error
    );


    btnShot.disabled =
      true;


    stage
      ?.classList
      .remove(
        'ready'
      );


    toast(
      'Lỗi camera: ' +
      (
        error.message ||
        error
      ),
      'err',
      4200
    );

  }

}



/* =========================================================
   ZOOM
========================================================= */

function renderCssZoom(){

  if(!video){
    return;
  }


  video.style.transformOrigin =
    'center center';


  video.style.transform =
    `scale(${zoomVal})`;

}



async function initZoom(){

  zoomSupported =
    false;


  cssZoomFallback =
    false;


  zoomMin =
    1;


  zoomMax =
    1;


  zoomStep =
    .1;


  zoomVal =
    1;


  try{

    const caps =
      videoTrack
        ?.getCapabilities
        ?.()
      ||
      {};


    const hasZoom =
      caps &&
      typeof caps.zoom ===
        'object';


    if(
      hasZoom &&
      typeof caps.zoom.min ===
        'number'
    ){

      zoomSupported =
        true;


      zoomMin =
        caps.zoom.min;


      zoomMax =
        caps.zoom.max ||
        caps.zoom.min;


      zoomStep =
        caps.zoom.step ||
        .1;


      zoomVal =
        zoomMin;


      await videoTrack
        .applyConstraints({

          advanced:[
            {
              zoom:
                zoomVal
            }
          ]

        });

    }else{

      cssZoomFallback =
        true;


      zoomMin =
        1;


      zoomMax =
        CSS_DIGITAL_ZOOM_MAX;


      zoomStep =
        .2;


      zoomVal =
        1;


      renderCssZoom();

    }

  }catch{

    cssZoomFallback =
      true;


    zoomSupported =
      false;


    zoomMin =
      1;


    zoomMax =
      CSS_DIGITAL_ZOOM_MAX;


    zoomStep =
      .2;


    zoomVal =
      1;


    renderCssZoom();

  }


  btnZoomIn.disabled =
    zoomVal >=
    zoomMax;


  btnZoomOut.disabled =
    zoomVal <=
    zoomMin;

}



async function setZoom(next){

  next =
    Number(next) ||
    1;


  next =
    Math.max(
      zoomMin,
      Math.min(
        zoomMax,
        next
      )
    );


  if(
    Math.abs(
      next -
      zoomVal
    ) <
    .001
  ){

    return;
  }


  zoomVal =
    next;


  try{

    if(
      zoomSupported
    ){

      await videoTrack
        .applyConstraints({

          advanced:[
            {
              zoom:
                zoomVal
            }
          ]

        });

    }

    else if(
      cssZoomFallback
    ){

      renderCssZoom();
    }

  }catch{

    cssZoomFallback =
      true;


    zoomSupported =
      false;


    renderCssZoom();
  }


  btnZoomOut.disabled =
    zoomVal <=
    zoomMin;


  btnZoomIn.disabled =
    zoomVal >=
    zoomMax;

}



btnZoomIn.onclick =
  () =>
    setZoom(
      (
        zoomVal +
        zoomStep
      ).toFixed(2)
    );


btnZoomOut.onclick =
  () =>
    setZoom(
      (
        zoomVal -
        zoomStep
      ).toFixed(2)
    );

async function tryApplyTorch(turnOn){

  try{

    if(!videoTrack){

      return false;
    }


    const capabilities =
      videoTrack
        .getCapabilities
        ?.()
      ||
      {};


    if(
      !(
        'torch'
        in capabilities
      )
    ){

      btnTorch.disabled =
        true;


      return false;
    }


    await videoTrack
      .applyConstraints({

        advanced:[
          {
            torch:
              !!turnOn
          }
        ]

      });


    torchOn =
      !!turnOn;


    btnTorch.classList.toggle(
      'btn-on',
      torchOn
    );


    return true;

  }catch{

    btnTorch.disabled =
      true;


    return false;
  }

}

/* =========================================================
   CANVAS
========================================================= */

function drawToCanvas(){

  if(
    !video ||
    !canvas
  ){

    return false;
  }


  const fw =
    video.videoWidth;


  const fh =
    video.videoHeight;


  if(
    !fw ||
    !fh
  ){

    return false;
  }


  const desired =
    TARGET_W /
    TARGET_H;


  const ar =
    fw /
    fh;


  let sx =
    0;


  let sy =
    0;


  let sw =
    fw;


  let sh =
    fh;


  if(
    ar >
    desired
  ){

    sw =
      fh *
      desired;


    sx =
      (
        fw -
        sw
      ) /
      2;

  }else{

    sh =
      fw /
      desired;


    sy =
      (
        fh -
        sh
      ) /
      2;

  }


  if(
    cssZoomFallback &&
    zoomVal >
    1
  ){

    const cx =
      sx +
      sw/2;


    const cy =
      sy +
      sh/2;


    const newSw =
      sw /
      zoomVal;


    const newSh =
      sh /
      zoomVal;


    sx =
      cx -
      newSw/2;


    sy =
      cy -
      newSh/2;


    sw =
      newSw;


    sh =
      newSh;

  }


  canvas.width =
    TARGET_W;


  canvas.height =
    TARGET_H;


  canvas
    .getContext('2d')
    .drawImage(

      video,

      sx,
      sy,
      sw,
      sh,

      0,
      0,
      TARGET_W,
      TARGET_H

    );


  return true;
}

  ){

  }


  const allWithDistance =
    getAllCustomersWithDistance(

      LAST_GPS.lat,

function continueToCheckin(
  selectedCustomer=null
){

  if(!LAST_GPS){

    toast(
      'Chưa có GPS',
      'err'
    );


    return;
  }


  const selectedMaKh =

    selectedCustomer?.ma_kh

    ||

    MA_KH

    ||

    '';


  if(
    selectedCustomer
  ){

    try{

      sessionStorage.setItem(

        'CHECKIN_SELECTED_CUSTOMER',

        JSON.stringify(
          selectedCustomer
        )

      );

    }catch{}

  }else{

    try{

      sessionStorage.removeItem(
        'CHECKIN_SELECTED_CUSTOMER'
      );

    }catch{}

  }


  /*
    Cập nhật ma_kh trong payload ảnh
    bằng khách vừa chọn.
  */

  try{

    const oldPayload =
      JSON.parse(
        sessionStorage.getItem(
          SESSION_IMG_KEY
        ) ||
        '{}'
      );


    oldPayload.ma_kh =
      selectedMaKh;


    oldPayload.ten_kh =
      selectedCustomer?.ten_kh ||
      '';


    oldPayload.dia_chi =
      selectedCustomer?.dia_chi ||
      '';


    oldPayload.dien_thoai =
      selectedCustomer?.dien_thoai ||
      '';


    oldPayload.distance =
      selectedCustomer?.dist ??
      null;


    oldPayload.radius_m =
      NEAR_RADIUS_M;


    oldPayload.gps_lat =
      LAST_GPS.lat;


    oldPayload.gps_lng =
      LAST_GPS.lng;


    oldPayload.gps_accuracy =
      LAST_GPS.acc;


    sessionStorage.setItem(

      SESSION_IMG_KEY,

      JSON.stringify(
        oldPayload
      )

    );

  }catch(error){

    console.warn(
      '[CHECKIN] Không cập nhật payload:',
      error
    );

  }


  const targetUrl =
    new URL(

      '/checkin_khach_hang.html',

      location.origin

    );


  targetUrl.searchParams.set(
    'lat',
    String(
      LAST_GPS.lat
    )
  );


  targetUrl.searchParams.set(
    'lng',
    String(
      LAST_GPS.lng
    )
  );


  /*
    GIỮ lag THEO CODE CŨ.
  */

  targetUrl.searchParams.set(
    'lag',
    String(
      LAST_GPS.lat
    )
  );


  targetUrl.searchParams.set(
    'ma_nv',
    MA_NV
  );


  targetUrl.searchParams.set(
    'ten_nv',
    TEN_NV
  );


  targetUrl.searchParams.set(
    'radius',
    String(
      NEAR_RADIUS_M
    )
  );


  if(selectedMaKh){

    targetUrl.searchParams.set(
      'ma_kh',
      selectedMaKh
    );
  }


  if(MA_HD){

    targetUrl.searchParams.set(
      'ma_hd',
      MA_HD
    );
  }


  if(selectedCustomer){

    if(
      selectedCustomer.ten_kh
    ){

      targetUrl.searchParams.set(
        'ten_kh',
        selectedCustomer.ten_kh
      );
    }


    if(
      selectedCustomer.dia_chi
    ){

      targetUrl.searchParams.set(
        'dia_chi',
        selectedCustomer.dia_chi
      );
    }


    if(
      selectedCustomer.dien_thoai
    ){

      targetUrl.searchParams.set(
        'dien_thoai',
        selectedCustomer.dien_thoai
      );
    }


    targetUrl.searchParams.set(
      'distance',
      String(
        selectedCustomer.dist
      )
    );

  }


  targetUrl.searchParams.set(
    'img',
    'session'
  );


  const shotId =
    String(
      Date.now()
    );


  targetUrl.searchParams.set(
    'shot_id',
    shotId
  );


  sessionStorage.setItem(
    'CHECKIN_CURRENT_SHOT_ID',
    shotId
  );


  sessionStorage.removeItem(
    'CLICKED_CHECKIN_BROWSER_V1'
  );


  sessionStorage.removeItem(
    'CHECKIN_BROWSER_DONE_V1'
  );


  location.assign(
    targetUrl.toString()
  );

}




/* =========================================================

========================================================= */

let sendingCheckinPayload = false;


/*
  Gửi payload chung tới webhook giao hàng thành công.
*/
async function postCheckinPayload(payload){

  const response =
    await fetch(
      WEBHOOK_URL,
      {
        method:'POST',

        headers:{
          'Content-Type':
            'application/json'
        },

        body:
          JSON.stringify(
            payload
          )
      }
    );


  if(!response.ok){

    let detail = '';

    try{
      detail =
        await response.text();
    }catch{}


    throw new Error(
      `HTTP ${response.status}` +
      (
        detail
          ? ` - ${detail}`
          : ''
      )
    );

  }


  return response;
}


/*
  BẤM "CHỌN KHÁCH"

  → lấy vị trí lat/lng của CHÍNH KHÁCH ĐÓ trong table
  → action giống gửi vị trí: giaohangthanhcong
  → gửi kèm ảnh vừa chụp.
*/
async function sendSelectedCustomerWithImage(customer){

  if(sendingCheckinPayload){

    toast(
      'Đang gửi...',
      'info',
      1500
    );

    return;
  }


  if(!customer){

    toast(
      'Không có dữ liệu khách hàng',
      'err',
      2200
    );

    return;
  }


  const customerLat =
    Number(
      customer.lat
    );


  const customerLng =
    Number(
      customer.lng
    );


  if(
    !Number.isFinite(customerLat) ||
    !Number.isFinite(customerLng)
  ){

    toast(
      'Khách hàng chưa có vị trí hợp lệ',
      'err',
      2600
    );

    return;
  }


  let saved = null;


  try{

    saved =
      JSON.parse(
        sessionStorage.getItem(
          SESSION_IMG_KEY
        ) ||
        'null'
      );

  }catch{}


  if(
    !saved ||
    !saved.image_b64
  ){

    toast(
      'Chưa có ảnh để gửi',
      'err',
      2200
    );

    return;
  }


  const payload = {

    action:
      'giaohangthanhcong',

    ma_kh:
      customer.ma_kh ||
      saved.ma_kh ||
      MA_KH ||
      '',

    ma_hd:
      saved.ma_hd ||
      MA_HD ||
      '',

    image_mime:
      saved.image_mime ||
      'image/jpeg',

    image_b64:
      saved.image_b64,

    ts:
      new Date().toISOString(),

    source:
      'browser-checkin',

    ma_nv:
      saved.ma_nv ||
      MA_NV ||
      '',

    ten_nv:
      saved.ten_nv ||
      TEN_NV ||
      '',

    /*
      QUAN TRỌNG:
      Dùng vị trí của KHÁCH được chọn,
      không dùng GPS điện thoại.
    */
    lat:
      customerLat,

    lng:
      customerLng,

    /*
      Không phải accuracy GPS điện thoại.
    */
    acc:
      0,

    ten_kh:
      customer.ten_kh ||
      '',

    dia_chi:
      customer.dia_chi ||
      '',

    dien_thoai:
      customer.dien_thoai ||
      '',

    distance:
      customer.dist ??
      null,

    selected_customer:
      true,

    /*
      Loại vị trí:
      chọn khách có sẵn trong table.
    */
    loaivitri:
      'vitricosan'

  };


  console.log(
    '[CHECKIN] Chọn khách -> gửi vị trí khách + ảnh:',
    {
      ...payload,
      image_b64:
        `[base64 ${payload.image_b64.length} ký tự]`
    }
  );


  sendingCheckinPayload =
    true;


  toast(
    `Đang gửi ${customer.ten_kh || customer.ma_kh || 'khách hàng'}...`,
    'info',
    1800
  );


  try{

    await postCheckinPayload(
      payload
    );


    toast(
      `✅ Đã gửi ${customer.ten_kh || customer.ma_kh || 'khách hàng'}`,
      'ok',
      1800
    );


    closeNearby();


    try{

      sessionStorage.removeItem(
        SESSION_IMG_KEY
      );

    }catch{}


    try{

      stopCam();

    }catch{}


    setTimeout(
      () => {

        try{

          if(
            window.parent &&
            window.parent !== window
          ){

            window.parent.postMessage(
              {
                type:
                  'CHECKIN_GIAO_HANG_THANH_CONG',

                ma_kh:
                  payload.ma_kh,

                ma_hd:
                  payload.ma_hd,

                lat:
                  payload.lat,

                lng:
                  payload.lng,

                selected_customer:
                  true,

                loaivitri:
                  'vitricosan'
              },
              '*'
            );

          }


          if(
            history.length >
            1
          ){

            history.back();

          }

        }catch{}

      },
      900
    );


  }catch(error){

    console.error(
      '[CHECKIN] Gửi khách đã chọn lỗi:',
      error
    );


    toast(
      'Gửi thất bại: ' +
      (
        error.message ||
        error
      ),
      'err',
      3500
    );

  }finally{

    sendingCheckinPayload =
      false;

  }

}

function showStage(){

  if(
    stage &&
    !stage.classList.contains(
      'ready'
    )
  ){

    stage
      .classList
      .add(
        'ready'
      );
  }

}



async function getPermState(name){

  try{

    if(
      !navigator.permissions?.query
    ){

      return null;
    }


    const permission =
      await navigator
        .permissions
        .query({
          name
        });


    return permission.state;

  }catch{

    return null;
  }

}
