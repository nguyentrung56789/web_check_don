/* =========================================================

(function () {

  'use strict';


  /* =====================================================
     CẤU HÌNH

  const TABLE_CUSTOMER =

  /* =====================================================

  ===================================================== */

  const nearbyOverlay =

  /* =====================================================
     STRING
  ===================================================== */

  function str(value) {

    /*
      QUAN TRỌNG:

      Không dùng String(object) vì sẽ sinh ra
      "[object Object]"
      rồi Supabase hiểu đó là URL.

      Đây chính là kiểu lỗi vừa gặp.
    */

    if (
      value === null ||
      value === undefined
    ) {

      return '';

    }


    if (
      typeof value === 'string'
    ) {

      return value.trim();

    }


    if (
      typeof value === 'number'
    ) {

      return String(value).trim();

    }


    return '';

  }



  function escapeHtml(value) {

    return String(value ?? '')

      .replace(/&/g, '&amp;')

      .replace(/</g, '&lt;')

      .replace(/>/g, '&gt;')

      .replace(/"/g, '&quot;')

      .replace(/'/g, '&#039;');

  }



  /* =====================================================
     TÌM STRING TRONG OBJECT
  ===================================================== */

  function findString(
    value,
    possibleKeys = []
  ) {

    /*
      Nếu value đã là string
    */

    const direct =
      str(value);


    if (direct) {

      return direct;

    }


    /*
      Nếu là object
    */

    if (
      value &&
      typeof value === 'object'
    ) {

      for (
        const key of possibleKeys
      ) {

        const found =
          str(
            value[key]
          );


        if (found) {

          return found;

        }

      }


      /*
        Có thể config lồng thêm 1 tầng
      */

      for (
        const objectValue
        of Object.values(value)
      ) {

        if (
          objectValue &&
          typeof objectValue === 'object'
        ) {

          for (
            const key of possibleKeys
          ) {

            const found =
              str(
                objectValue[key]
              );


            if (found) {

              return found;

            }

          }

        }

      }

    }


    return '';

  }



  /* =====================================================
     TOAST
  ===================================================== */

  function showToast(message) {

    const el =
      document.getElementById(
        'nearbyToast'
      );


    if (!el) {

      return;

    }


    el.textContent =
      String(message || '');


    el.style.display =
      'block';


    clearTimeout(
      showToast.timer
    );


    showToast.timer =
      setTimeout(
        () => {

          el.style.display =
            'none';

        },
        3000
      );

  }



  /* =====================================================
     ĐỌC CONFIG TỪ WINDOW
  ===================================================== */

  function readConfigFromWindow(
    targetWindow
  ) {

    let url = '';

    let key = '';


    if (!targetWindow) {

      return {
        url,
        key
      };

    }


    /* -----------------------------------------
       getConfig()
    ----------------------------------------- */

    try {

      if (
        typeof targetWindow.getConfig ===
        'function'
      ) {

        const rawUrl =
          targetWindow.getConfig(
            'url'
          );


        const rawAnon =
          targetWindow.getConfig(
            'anon'
          );


        url =
          findString(
            rawUrl,
            [
              'url',
              'value',
              'SUPABASE_URL',
              'supabaseUrl',
              'supabase_url'
            ]
          );


        key =
          findString(
            rawAnon,
            [
              'anon',
              'key',
              'value',
              'SUPABASE_ANON',
              'SUPABASE_ANON_KEY',
              'supabaseAnon',
              'supabaseKey',
              'supabase_anon_key'
            ]
          );

      }

    } catch (e) {

      console.warn(
        '[CHECKIN] getConfig lỗi:',
        e
      );

    }



    /* -----------------------------------------
       COD_CONFIG
    ----------------------------------------- */

    try {

      const cfg =
        targetWindow.COD_CONFIG;


      if (
        cfg &&
        typeof cfg === 'object'
      ) {

        if (!url) {

          url =
            findString(
              cfg,
              [
                'url',
                'SUPABASE_URL',
                'supabaseUrl',
                'supabase_url'
              ]
            );

        }


        if (!key) {

          key =
            findString(
              cfg,
              [
                'key',
                'anon',
                'SUPABASE_ANON',
                'SUPABASE_ANON_KEY',
                'supabaseAnon',
                'supabaseKey',
                'supabase_anon_key'
              ]
            );

        }

      }

    } catch (e) {

      console.warn(
        '[CHECKIN] COD_CONFIG lỗi:',
        e
      );

    }



    return {
      url,
      key
    };

  }



  /* =====================================================
     LẤY CONFIG SUPABASE
  ===================================================== */

  async function resolveSupabaseConfig() {

    let url = '';

    let key = '';


    /* =================================================
       1. CHỜ CONFIG CỦA TRANG HIỆN TẠI
    ================================================= */

    try {

      if (
        window.configReady &&
        typeof window.configReady.then ===
        'function'
      ) {

        await window.configReady;

      }

    } catch (e) {

      console.warn(
        '[CHECKIN] configReady lỗi:',
        e
      );

    }



    /* =================================================
       2. ĐỌC TỪ CHECKIN.HTML
    ================================================= */

    let localConfig =
      readConfigFromWindow(
        window
      );


    url =
      localConfig.url;


    key =
      localConfig.key;



    /* =================================================
       3. NẾU ĐANG CHẠY TRONG IFRAME
          THỬ LẤY CONFIG TỪ TRANG CHA

          app giao hàng của bạn mở checkin.html
          bằng iframe cùng domain.
    ================================================= */

    if (
      (!url || !key) &&
      window.parent &&
      window.parent !== window
    ) {

      try {

        const parentConfig =
          readConfigFromWindow(
            window.parent
          );


        if (!url) {

          url =
            parentConfig.url;

        }


        if (!key) {

          key =
            parentConfig.key;

        }

      } catch (e) {

        console.warn(
          '[CHECKIN] Không đọc được parent config:',
          e
        );

      }

    }



    /* =================================================
       4. API /api/getConfig
    ================================================= */

    if (
      !url ||
      !key
    ) {

      try {

        let internalKey =
          '';


        try {

          if (
            typeof window.getInternalKey ===
            'function'
          ) {

            internalKey =
              str(
                window.getInternalKey()
              );

          }

        } catch (e) {}


        /*
          Nếu iframe không có internal key
          thử lấy từ parent
        */

        if (
          !internalKey &&
          window.parent &&
          window.parent !== window
        ) {

          try {

            if (
              typeof window.parent.getInternalKey ===
              'function'
            ) {

              internalKey =
                str(
                  window.parent.getInternalKey()
                );

            }

          } catch (e) {}

        }


        const headers = {

          'Accept':
            'application/json'

        };


        if (internalKey) {

          headers[
            'x-internal-key'
          ] = internalKey;

        }


        const response =
          await fetch(
            '/api/getConfig',
            {
              method:
                'GET',

              headers,

              cache:
                'no-store'
            }
          );


        if (!response.ok) {

          const text =
            await response.text();


          throw new Error(

            'HTTP ' +
            response.status +
            ' ' +
            text

          );

        }


        const config =
          await response.json();


        console.log(
          '[CHECKIN] /api/getConfig:',
          config
        );


        if (!url) {

          url =
            findString(
              config,
              [
                'url',
                'SUPABASE_URL',
                'supabaseUrl',
                'supabase_url'
              ]
            );

        }


        if (!key) {

          key =
            findString(
              config,
              [
                'anon',
                'key',
                'SUPABASE_ANON',
                'SUPABASE_ANON_KEY',
                'supabaseAnon',
                'supabaseKey',
                'supabase_anon_key'
              ]
            );

        }


      } catch (error) {

        console.warn(
          '[CHECKIN] /api/getConfig lỗi:',
          error
        );

      }

    }



    /* =================================================
       CHUẨN HOÁ
    ================================================= */

    url =
      str(url)
        .replace(
          /\/+$/,
          ''
        );


    key =
      str(key);



    /* =================================================
       KIỂM TRA URL
    ================================================= */

    if (
      !url ||
      !/^https?:\/\/.+/i.test(url)
    ) {

      console.error(
        '[CHECKIN] URL Supabase sai:',
        {
          url,
          keyLength:
            key.length
        }
      );


      throw new Error(
        'Không lấy được URL Supabase hợp lệ'
      );

    }



    if (!key) {

      throw new Error(
        'Không lấy được Supabase anon key'
      );

    }



    console.log(
      '[CHECKIN] Supabase config OK:',
      {
        url,
        keyLength:
          key.length
      }
    );


    return {
      url,
      key
    };

  }



  /* =====================================================
     TẠO SUPABASE CLIENT
  ===================================================== */

  async function getSupabase() {

    if (nearbySupabase) {

      return nearbySupabase;

    }


    if (
      !window.supabase ||
      typeof window.supabase.createClient !==
      'function'
    ) {

      throw new Error(
        'Chưa tải được thư viện Supabase'
      );

    }


    const config =
      await resolveSupabaseConfig();


    nearbySupabase =
      window.supabase.createClient(

        config.url,

        config.key,

        {
          auth: {

            persistSession:
              false,

            autoRefreshToken:
              false,

            detectSessionInUrl:
              false

          }
        }

      );


    return nearbySupabase;

  }



  /* =====================================================
     GPS
  ===================================================== */

  function getCurrentGPS() {

    return new Promise(
      (
        resolve,
        reject
      ) => {

        if (
          !navigator.geolocation
        ) {

          reject(
            new Error(
              'Thiết bị không hỗ trợ GPS'
            )
          );

          return;

        }


        navigator.geolocation
          .getCurrentPosition(

            position => {

              resolve({

                lat:
                  Number(
                    position.coords.latitude
                  ),

                lng:
                  Number(
                    position.coords.longitude
                  ),

                accuracy:
                  Number(
                    position.coords.accuracy ||
                    0
                  )

              });

            },


            error => {

              let message =
                'Không lấy được GPS';


              if (
                error.code === 1
              ) {

                message =
                  'Bạn chưa cấp quyền vị trí';

              }


              else if (
                error.code === 2
              ) {

                message =
                  'Thiết bị chưa xác định được vị trí';

              }


              else if (
                error.code === 3
              ) {

                message =
                  'Lấy GPS quá thời gian';

              }


              reject(
                new Error(
                  message
                )
              );

            },


            {

              enableHighAccuracy:
                true,

              timeout:
                20000,

              maximumAge:
                0

            }

          );

      }
    );

  }



  /* =====================================================
     KHOẢNG CÁCH
  ===================================================== */

  function toRad(value) {

    return (
      Number(value) *
      Math.PI /
      180
    );

  }



  function getDistanceMeters(
    lat1,
    lng1,
    lat2,
    lng2
  ) {

    const R =
      6371000;


    const p1 =
      toRad(lat1);


    const p2 =
      toRad(lat2);


    const dLat =
      toRad(
        lat2 -
        lat1
      );


    const dLng =
      toRad(
        lng2 -
        lng1
      );


    const a =

      Math.sin(
        dLat / 2
      ) ** 2

      +

      Math.cos(p1) *

      Math.cos(p2) *

      Math.sin(
        dLng / 2
      ) ** 2;


    const c =

      2 *

      Math.atan2(

        Math.sqrt(a),

        Math.sqrt(
          1 - a
        )

      );


    return (
      R *
      c
    );

  }



  /* =====================================================
     ĐỌC nv_checkin_khach_hang
  ===================================================== */

  async function loadNearbyCustomers(
    gps
  ) {

    const supa =
      await getSupabase();


    console.log(
      '[CHECKIN] Đọc table:',
      TABLE_CUSTOMER
    );


    const {
      data,
      error
    } = await supa

      .from(
        TABLE_CUSTOMER
      )

      .select('*');


    if (error) {

      console.error(
        '[CHECKIN] Supabase error:',
        error
      );


      throw new Error(

        error.message ||
        'Không đọc được table ' +
        TABLE_CUSTOMER

      );

    }


    const rows =
      Array.isArray(data)
        ? data
        : [];


    console.log(
      '[CHECKIN] Tổng khách:',
      rows.length
    );


    const result =
      [];


    for (
      const row
      of rows
    ) {

      const lat =
        Number(
          row.lat
        );


      const lng =
        Number(
          row.lng
        );


      /*
        Không có GPS
      */

      if (
        !Number.isFinite(lat) ||
        !Number.isFinite(lng)
      ) {

        continue;

      }


      /*
        GPS không hợp lệ
      */

      if (
        lat < -90 ||
        lat > 90 ||
        lng < -180 ||
        lng > 180
      ) {

        continue;

      }


      const distance =
        getDistanceMeters(

          gps.lat,

          gps.lng,

          lat,

          lng

        );


      if (
        distance >
        RADIUS_METERS
      ) {

        continue;

      }


      result.push({

        ...row,

        lat,

        lng,

        distance

      });

    }



    /*
      GẦN NHẤT LÊN ĐẦU
    */

    result.sort(
      (
        a,
        b
      ) =>

        a.distance -
        b.distance

    );


    return result;

  }



  /* =====================================================
     SHEET
  ===================================================== */

  function openNearby() {

    nearbyOverlay
      ?.classList
      .add(
        'open'
      );

  }



  function closeNearby() {

    nearbyOverlay
      ?.classList
      .remove(
        'open'
      );

  }



  btnCloseNearby
    ?.addEventListener(
      'click',
      closeNearby
    );


  nearbyOverlay
    ?.addEventListener(
      'click',
      event => {

        if (
          event.target ===
          nearbyOverlay
        ) {

          closeNearby();

        }

      }
    );



  /* =====================================================
     RENDER
  ===================================================== */

  function renderNearby(
    rows,
    gps
  ) {

    if (!nearbyList) {

      return;

    }


    nearbyStatus.textContent =

      `Tìm thấy ${rows.length} vị trí trong ${RADIUS_METERS}m`

      +

      (
        gps.accuracy
          ? ` • GPS ±${Math.round(gps.accuracy)}m`
          : ''
      );


    if (
      rows.length === 0
    ) {

      nearbyList.innerHTML = `

        <div class="nearby-empty">

          <div
            style="
              font-size:36px;
              margin-bottom:8px
            "
          >
            📍
          </div>


          <strong>
            Không có khách hàng trong ${RADIUS_METERS}m
          </strong>


          <div
            style="
              margin-top:7px;
              font-size:13px
            "
          >

            GPS hiện tại ±${Math.round(
              gps.accuracy || 0
            )}m

          </div>


          <button
            id="btnRetryNearby"
            class="retry-nearby"
            type="button"
          >
            Quét lại
          </button>

        </div>

      `;


      document
        .getElementById(
          'btnRetryNearby'
        )
        ?.addEventListener(
          'click',
          scanNearby
        );


      return;

    }



    nearbyList.innerHTML =
      '';


    rows.forEach(
      (
        row,
        index
      ) => {

        const item =
          document.createElement(
            'button'
          );


        item.type =
          'button';


        item.className =
          'nearby-item';


        const tenKh =

          str(
            row.ten_kh
          )

          ||

          'Không có tên khách';



        const diaChi =

          str(
            row.dia_chi
          )

          ||

          'Chưa có địa chỉ';



        const dienThoai =

          str(
            row.dien_thoai
          )

          ||

          'Chưa có điện thoại';



        const distance =

          Math.round(
            row.distance
          );


        item.innerHTML = `

          <div class="nearby-name">

            ${index + 1}.
            ${escapeHtml(
              tenKh
            )}

          </div>


          <div class="nearby-address">

            📍
            ${escapeHtml(
              diaChi
            )}

          </div>


          <div class="nearby-phone">

            📞
            ${escapeHtml(
              dienThoai
            )}

          </div>


          <div class="nearby-footer">

            <span class="nearby-distance">

              Cách ${distance} m

            </span>


            <span class="nearby-select">

              Chọn ›

            </span>

          </div>

        `;


        item.addEventListener(
          'click',
          () => {

            chooseCustomer(
              row
            );

          }
        );


        nearbyList.appendChild(
          item
        );

      }
    );

  }



  /* =====================================================
     CHỌN KHÁCH
  ===================================================== */

  function chooseCustomer(
    row
  ) {

    selectedCustomer =
      row;


    /*
      BIẾN DÙNG CHUNG
    */

    window.SELECTED_NEARBY_CUSTOMER =
      row;


    window.CHECKIN_CURRENT_GPS =
      currentGPS;



    /*
      SESSION
    */

    try {

      sessionStorage.setItem(

        'checkin_nearby_customer',

        JSON.stringify(
          row
        )

      );

    } catch (e) {}



    /*
      HIỆN KHÁCH ĐÃ CHỌN
    */

    if (
      selectedBox &&
      selectedName &&
      selectedInfo
    ) {

      selectedName.textContent =

        '📍 ' +

        (
          str(
            row.ten_kh
          )

          ||

          'Khách hàng'
        );


      const info =
        [];


      if (
        str(
          row.dia_chi
        )
      ) {

        info.push(
          str(
            row.dia_chi
          )
        );

      }


      if (
        str(
          row.dien_thoai
        )
      ) {

        info.push(
          str(
            row.dien_thoai
          )
        );

      }


      info.push(

        Math.round(
          row.distance || 0
        ) + 'm'

      );


      selectedInfo.textContent =
        info.join(
          ' • '
        );


      selectedBox.style.display =
        'block';

    }



    /*
      CUSTOM EVENT

      checkin.js có thể nghe event này
      nếu cần gửi khách vào webhook.
    */

    try {

      window.dispatchEvent(

        new CustomEvent(

          'nearby-customer-selected',

          {

            detail: {

              customer:
                row,

              gps:
                currentGPS

            }

          }

        )

      );

    } catch (e) {}



    closeNearby();



    showToast(

      'Đã chọn: ' +

      (
        str(
          row.ten_kh
        )

        ||

        'khách hàng'
      )

    );


    console.log(
      '[CHECKIN] Khách đã chọn:',
      row
    );

  }



  /* =====================================================
     QUÉT
  ===================================================== */

  async function scanNearby() {

    if (scanning) {

      return;

    }


    scanning =
      true;


    openNearby();


    nearbyStatus.textContent =
      'Đang xác định GPS...';


    nearbyList.innerHTML = `

      <div class="nearby-loading">

        📍 Đang lấy vị trí hiện tại...

      </div>

    `;


    try {


      /* ===============================================
         1. GPS
      =============================================== */

      currentGPS =
        await getCurrentGPS();


      window.CHECKIN_CURRENT_GPS =
        currentGPS;


      console.log(
        '[CHECKIN] GPS:',
        currentGPS
      );


      nearbyStatus.textContent =

        `GPS ±${Math.round(
          currentGPS.accuracy || 0
        )}m • Đang tìm khách...`;



      /* ===============================================
         2. SUPABASE
      =============================================== */

      const rows =
        await loadNearbyCustomers(
          currentGPS
        );


      console.log(
        '[CHECKIN] Khách <= 50m:',
        rows
      );



      /* ===============================================
         3. HIỆN DANH SÁCH
      =============================================== */

      renderNearby(
        rows,
        currentGPS
      );


    } catch (error) {


      console.error(
        '[CHECKIN] scanNearby ERROR:',
        error
      );


      nearbyStatus.textContent =
        'Không quét được vị trí';


      nearbyList.innerHTML = `

        <div class="nearby-empty">


          <div
            style="
              font-size:36px;
              margin-bottom:8px
            "
          >
            ⚠️
          </div>


          <strong>
            Không quét được vị trí
          </strong>


          <div
            style="
              margin-top:8px;
              font-size:13px;
              line-height:1.4
            "
          >

            ${escapeHtml(

              error?.message ||

              String(error)

            )}

          </div>


          <button
            id="btnRetryNearby"
            class="retry-nearby"
            type="button"
          >

            Thử lại

          </button>


        </div>

      `;


      document
        .getElementById(
          'btnRetryNearby'
        )
        ?.addEventListener(
          'click',
          scanNearby
        );


    } finally {


      scanning =
        false;


    }

  }



  /* =====================================================
     SAU KHI BẤM CHỤP
  ===================================================== */

  btnShot
    ?.addEventListener(
      'click',
      () => {

        /*
          checkin.js xử lý chụp ảnh trước.

          Chờ 500ms rồi quét vị trí.
        */

        setTimeout(
          () => {

            scanNearby();

          },
          500
        );

      }
    );



  /* =====================================================
     API CHO CHECKIN.JS
  ===================================================== */

  window.scanNearbyCustomers =
    scanNearby;


  window.getSelectedNearbyCustomer =
    function () {

      return (

        selectedCustomer

        ||

        window.SELECTED_NEARBY_CUSTOMER

        ||

        null

      );

    };


  window.getCheckinCurrentGPS =
    function () {

      return (

        currentGPS

        ||

        window.CHECKIN_CURRENT_GPS

        ||

        null

      );

    };


  console.log(
    '[CHECKIN] Nearby 50m READY'
  );

})();

</script>
