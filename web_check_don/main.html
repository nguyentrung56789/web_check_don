    body {

      color:var(--txt);

    body.ready {

    .top {

      padding:14px 18px;

      background:var(--card);

      box-shadow:0 2px 10px rgba(0,0,0,.35);

    .hello {
      font-weight:600;

    #btnLogout {
      background:none;
      border:0;
      color:var(--danger);
      cursor:pointer;
      font-weight:700;
      font-size:15px;
    }

    .menu {
      width:min(520px,92vw);
      margin:120px auto 48px;
      display:grid;
      gap:18px;
    }

    .menu button {
      width:100%;
      padding:18px;

      border:0;
      border-radius:14px;

      cursor:pointer;
      font-weight:800;
      font-size:18px;
      color:#041a18;
    }

    #admin {
      background:var(--btn1);
    }

    #kho {
      background:var(--btn2);
    }

    #checkdon {
      background:var(--btn3);
      color:#3a2a04;
    }

    #mapview {
      background:var(--btn4);
    }

    #chamsockhachhang {
      background:var(--btn5);
      color:#3b0713;
    }

    #tinhdoanhso {
      background:var(--btn6);
      color:#052e20;
    }

    .hidden {
      display:none !important;
    }

    #permissionMessage {
      display:none;
      padding:14px;

      border:1px solid #233043;
      border-radius:12px;

      background:#0f1830;
      color:var(--muted);

      font-size:14px;
      line-height:1.5;
      text-align:center;
    }

    #permissionMessage.show {
      display:block;
    }

    footer {
      margin:8px 0 24px;
      color:var(--muted);
      font-size:12px;
      text-align:center;
    }

<body>
  <header class="top">
    <div class="hello">
      Xin chào
      <span id="ten_nv">...</span>
      👋
    </div>

    <button id="btnLogout" type="button">
      Đăng xuất
    </button>
  </header>

  <main class="menu">
    <button
      id="admin"
      class="hidden"
      data-phan-quyen
      type="button"
    >
      👤 Admin
    </button>

    <button
      id="kho"
      class="hidden"
      data-phan-quyen
      type="button"
    >
      📦 Kho
    </button>

    <button
      id="checkdon"
      class="hidden"
      data-phan-quyen
      type="button"
    >
      🧾 Check đơn
    </button>

    <button
      id="mapview"
      class="hidden"
      data-phan-quyen
      type="button"
    >
      🗺️ Xem bản đồ
    </button>

    <button
      id="chamsockhachhang"
      class="hidden"
      data-phan-quyen
      type="button"
    >
      💬 Chăm sóc khách hàng
    </button>

    <button
      id="tinhdoanhso"
      class="hidden"
      data-phan-quyen
      type="button"
    >
      🧮 Tính doanh số nhân viên
    </button>

    <div id="permissionMessage">
      Tài khoản chưa được cấp quyền xem chức năng nào.
    </div>
  </main>

  <footer>
    © <span id="year"></span> COD Internal
  </footer>

  <script type="module">
    const VIEW_NAME = 'sql_phan_quyen_nhan_vien';
    const LOGIN_STORAGE_KEY = 'nv';

    /*
     * Tên cột vai trò trong view.
     * Nếu view thực tế dùng "vai_tro_id",
     * chỉ đổi dòng này thành:
     *
     * const ROLE_COLUMN = 'vai_tro_id';
     */
    const ROLE_COLUMN = 'id_vaitro';

    const routes = {
      admin:'./admin.html',
      kho:'./kho.html',
      checkdon:'./check_don.html',
      mapview:'./map_tuyen.html',
      chamsockhachhang:'./chamsockhachhang.html',
      tinhdoanhso:'./tinhdoanhsonhanvien.html'
    };


    /* =====================================================
       HIỂN THỊ TRANG
    ===================================================== */

    function showPage() {
      document.body.classList.add('ready');
      document.body.style.visibility = 'visible';
    }

    function hideAllPermissionButtons() {
      document
        .querySelectorAll('[data-phan-quyen]')
        .forEach(button => {
          button.classList.add('hidden');
        });
    }

    function showPermissionMessage(show) {
      document
        .getElementById('permissionMessage')
        ?.classList.toggle('show', Boolean(show));
    }


    /* =====================================================
       ĐỌC NHÂN VIÊN
    ===================================================== */

    function readUser() {
      const raw = localStorage.getItem(LOGIN_STORAGE_KEY);

      if (!raw) {
        throw new Error(
          `Không có localStorage key "${LOGIN_STORAGE_KEY}"`
        );
      }

      try {
        return JSON.parse(raw);
      } catch {
        throw new Error(
          `Dữ liệu trong localStorage "${LOGIN_STORAGE_KEY}" không hợp lệ`
        );
      }
    }

    function getEmployeeCode(user) {
      return String(
        user?.ma_nv ||
        user?.id_nv ||
        ''
      ).trim();
    }

    function getEmployeeName(user) {
      return String(
        user?.ten_nv ||
        user?.tenNhanVien ||
        user?.name ||
        ''
      ).trim();
    }

    function getRoleId(user) {
      return String(
        user?.id_vaitro ||
        user?.vai_tro_id ||
        user?.id_vai_tro ||
        user?.vaitro_id ||
        ''
      ).trim();
    }


    /* =====================================================
       TRANG HIỆN TẠI
    ===================================================== */

    function currentPage() {
      return (
        location.pathname.split('/').pop() ||
        'main.html'
      )
        .trim()
        .toLowerCase();
    }


    /* =====================================================
       TẠO SUPABASE CLIENT
    ===================================================== */

    async function createClient() {
      if (!window.supabase) {
        throw new Error('Không tải được thư viện Supabase');
      }

      const internalKey =
        (
          typeof window.getInternalKey === 'function'
            ? window.getInternalKey()
            : ''
        ) ||
        window.INTERNAL_KEY ||
        window.COD_INTERNAL_KEY ||
        window.internalKey ||
        '';

      const headers = {};

      if (internalKey) {
        headers['x-internal-key'] = internalKey;
      }

      const response = await fetch('/api/getConfig', {
        headers,
        cache:'no-store'
      });

      if (!response.ok) {
        throw new Error(
          `getConfig HTTP ${response.status}: ${await response.text()}`
        );
      }

      const config = await response.json();

      const supabaseUrl =
        config.url ||
        config.SUPABASE_URL ||
        config.supabaseUrl ||
        config.supabase_url;

      const supabaseKey =
        config.anon ||
        config.key ||
        config.SUPABASE_ANON ||
        config.SUPABASE_ANON_KEY ||
        config.supabaseAnon ||
        config.supabaseKey ||
        config.supabase_anon_key;

      if (!supabaseUrl || !supabaseKey) {
        throw new Error(
          'Thiếu URL hoặc anon key Supabase'
        );
      }

      return window.supabase.createClient(
        supabaseUrl,
        supabaseKey
      );
    }


    /* =====================================================
       LỌC QUYỀN MỘT NÚT

       Điều kiện:
       - ma_nv
       - id_vaitro
       - duong_dan
       - id_chucnang
       - duoc_xem = true
    ===================================================== */

    async function locQuyen(
      client,
      maNv,
      idVaiTro,
      idChucNang
    ) {
      const tenTrang = currentPage();

      let query = client
        .from(VIEW_NAME)
        .select(`
          ma_nv,
          ${ROLE_COLUMN},
          duong_dan,
          id_chucnang,
          ten_chucnang,
          duoc_xem
        `)
        .eq('ma_nv', maNv)
        .eq(ROLE_COLUMN, idVaiTro)
        .eq('duong_dan', tenTrang)
        .eq('id_chucnang', idChucNang)
        .eq('duoc_xem', true)
        .limit(1);

      const {
        data,
        error
      } = await query;

      if (error) {
        console.error('[LỌC QUYỀN] Lỗi:', {
          ma_nv:maNv,
          id_vaitro:idVaiTro,
          duong_dan:tenTrang,
          id_chucnang:idChucNang,
          error
        });

        throw error;
      }

      const allowed =
        Array.isArray(data) &&
        data.length > 0;

      console.log('[LỌC QUYỀN]', {
        ma_nv:maNv,
        id_vaitro:idVaiTro,
        duong_dan:tenTrang,
        id_chucnang:idChucNang,
        duoc_xem:allowed,
        data
      });

      return allowed;
    }


    /* =====================================================
       ÁP DỤNG QUYỀN CHO TẤT CẢ NÚT
    ===================================================== */

    async function applyPermissions(
      client,
      maNv,
      idVaiTro
    ) {
      const buttons = [
        ...document.querySelectorAll(
          '[data-phan-quyen]'
        )
      ];

      let visibleCount = 0;

      /*
       * Kiểm tra song song để không phải chờ từng nút.
       */
      const results = await Promise.all(
        buttons.map(async button => {
          try {
            const allowed = await locQuyen(
              client,
              maNv,
              idVaiTro,
              button.id
            );

            return {
              button,
              allowed
            };
          } catch (error) {
            return {
              button,
              allowed:false,
              error
            };
          }
        })
      );

      results.forEach(result => {
        result.button.classList.toggle(
          'hidden',
          !result.allowed
        );

        result.button.dataset.duocXem =
          String(result.allowed);

        if (result.allowed) {
          visibleCount++;
        }
      });

      showPermissionMessage(
        visibleCount === 0
      );

      console.log('[KẾT QUẢ PHÂN QUYỀN]', {
        ma_nv:maNv,
        id_vaitro:idVaiTro,
        trang:currentPage(),
        so_nut_duoc_hien:visibleCount,
        ket_qua:results.map(result => ({
          id_chucnang:result.button.id,
          duoc_xem:result.allowed,
          loi:result.error || null
        }))
      });
    }


    /* =====================================================
       GIỮ TOKEN VÀ THAM SỐ URL
    ===================================================== */

    function getToken() {
      const params =
        new URLSearchParams(location.search);

      return (
        params.get('token') ||
        params.get('access_token') ||
        params.get('auth_token') ||
        params.get('t') ||
        sessionStorage.getItem('access_token') ||
        localStorage.getItem('access_token') ||
        localStorage.getItem('token') ||
        ''
      );
    }

    function openWithParams(path) {
      const url = new URL(
        path,
        location.href
      );

      new URLSearchParams(
        location.search
      ).forEach((value, key) => {
        url.searchParams.set(
          key,
          value
        );
      });

      const token = getToken();

      if (
        token &&
        !url.searchParams.has('token')
      ) {
        url.searchParams.set(
          'token',
          token
        );
      }

      location.assign(url.href);
    }


    /* =====================================================
       SỰ KIỆN MỞ TRANG
    ===================================================== */

    Object.entries(routes).forEach(
      ([buttonId, path]) => {
        const button =
          document.getElementById(buttonId);

        if (!button) {
          console.warn(
            `Không tìm thấy nút id="${buttonId}"`
          );

          return;
        }

        button.addEventListener('click', () => {
          openWithParams(path);
        });
      }
    );


    /* =====================================================
       ĐĂNG XUẤT
    ===================================================== */

    document
      .getElementById('btnLogout')
      ?.addEventListener('click', () => {
        localStorage.removeItem('nv');
        localStorage.removeItem('last_ma_nv');
        localStorage.removeItem('access_token');

        sessionStorage.removeItem(
          'access_token'
        );

        location.replace('./login.html');
      });


    /* =====================================================
       KHỞI CHẠY
    ===================================================== */

    document.getElementById('year').textContent =
      new Date().getFullYear();

    async function init() {
      hideAllPermissionButtons();
      showPermissionMessage(false);

      try {
        const user = readUser();

        const maNv = getEmployeeCode(user);
        const tenNv = getEmployeeName(user);
        const idVaiTro = getRoleId(user);

        if (!maNv) {
          throw new Error(
            'Dữ liệu đăng nhập không có ma_nv'
          );
        }

        if (!idVaiTro) {
          console.error(
            'Dữ liệu localStorage hiện tại:',
            user
          );

          throw new Error(
            'Dữ liệu đăng nhập không có id_vaitro'
          );
        }

        document.getElementById(
          'ten_nv'
        ).textContent =
          tenNv ||
          maNv ||
          'Nhân viên';

        console.log('[NHÂN VIÊN ĐĂNG NHẬP]', {
          ma_nv:maNv,
          ten_nv:tenNv,
          id_vaitro:idVaiTro,
          trang:currentPage(),
          user
        });

        const client =
          await createClient();

        await applyPermissions(
          client,
          maNv,
          idVaiTro
        );
      } catch (error) {
        console.error(
          '[MAIN] Lỗi phân quyền:',
          error
        );

        showPermissionMessage(true);

        alert(
          `LỖI LẤY QUYỀN\n\n` +
          `message: ${error?.message || error}\n` +
          `code: ${error?.code || 'không có'}\n` +
          `details: ${error?.details || 'không có'}\n` +
          `hint: ${error?.hint || 'không có'}`
        );
      } finally {
        showPage();
      }
    }

    init();
  </script>
</body>

      const headers = {};

      if (internalKey) {
        headers['x-internal-key'] = internalKey;
      }

      const response = await fetch('/api/getConfig', {
        headers,
        cache:'no-store'
      });

      if (!response.ok) {
        throw new Error(
          `getConfig HTTP ${response.status}: ${await response.text()}`
        );
      }

      const config = await response.json();

      const supabaseUrl =
        config.url ||
        config.SUPABASE_URL ||
        config.supabaseUrl ||
        config.supabase_url;

      const supabaseKey =
        config.anon ||
        config.key ||
        config.SUPABASE_ANON ||
        config.SUPABASE_ANON_KEY ||
        config.supabaseAnon ||
        config.supabaseKey ||
        config.supabase_anon_key;

      if (!supabaseUrl || !supabaseKey) {
        throw new Error(
          'Thiếu URL hoặc anon key Supabase'
        );
      }

      return window.supabase.createClient(
        supabaseUrl,
        supabaseKey
      );
    }


    /* =====================================================
       LỌC QUYỀN MỘT NÚT

       Điều kiện:
       - ma_nv
       - id_vaitro
       - duong_dan
       - id_chucnang
       - duoc_xem = true
    ===================================================== */

    async function locQuyen(
      client,
      maNv,
      idVaiTro,
      idChucNang
    ) {
      const tenTrang = currentPage();

      let query = client
        .from(VIEW_NAME)
        .select(`
          ma_nv,
          ${ROLE_COLUMN},
          duong_dan,
          id_chucnang,
          ten_chucnang,
          duoc_xem
        `)
        .eq('ma_nv', maNv)
        .eq(ROLE_COLUMN, idVaiTro)
        .eq('duong_dan', tenTrang)
        .eq('id_chucnang', idChucNang)
        .eq('duoc_xem', true)
        .limit(1);

      const {
        data,
        error
      } = await query;

      if (error) {
        console.error('[LỌC QUYỀN] Lỗi:', {
          ma_nv:maNv,
          id_vaitro:idVaiTro,
          duong_dan:tenTrang,
          id_chucnang:idChucNang,
          error
        });

        throw error;
      }

      const allowed =
        Array.isArray(data) &&
        data.length > 0;

      console.log('[LỌC QUYỀN]', {
        ma_nv:maNv,
        id_vaitro:idVaiTro,
        duong_dan:tenTrang,
        id_chucnang:idChucNang,
        duoc_xem:allowed,
        data
      });

      return allowed;
    }


    /* =====================================================
       ÁP DỤNG QUYỀN CHO TẤT CẢ NÚT
    ===================================================== */

    async function applyPermissions(
      client,
      maNv,
      idVaiTro
    ) {
      const buttons = [
        ...document.querySelectorAll(
          '[data-phan-quyen]'
        )
      ];

      let visibleCount = 0;

      /*
       * Kiểm tra song song để không phải chờ từng nút.
       */
      const results = await Promise.all(
        buttons.map(async button => {
          try {
            const allowed = await locQuyen(
              client,
              maNv,
              idVaiTro,
              button.id
            );

            return {
              button,
              allowed
            };
          } catch (error) {
            return {
              button,
              allowed:false,
              error
            };
          }
        })
      );

      results.forEach(result => {
        result.button.classList.toggle(
          'hidden',
          !result.allowed
        );

        result.button.dataset.duocXem =
          String(result.allowed);

        if (result.allowed) {
          visibleCount++;
        }
      });

      showPermissionMessage(
        visibleCount === 0
      );

      console.log('[KẾT QUẢ PHÂN QUYỀN]', {
        ma_nv:maNv,
        id_vaitro:idVaiTro,
        trang:currentPage(),
        so_nut_duoc_hien:visibleCount,
        ket_qua:results.map(result => ({
          id_chucnang:result.button.id,
          duoc_xem:result.allowed,
          loi:result.error || null
        }))
      });
    }


    /* =====================================================
       GIỮ TOKEN VÀ THAM SỐ URL
    ===================================================== */

    function getToken() {
      const params =
        new URLSearchParams(location.search);

      return (
        params.get('token') ||
        params.get('access_token') ||
        params.get('auth_token') ||
        params.get('t') ||
        sessionStorage.getItem('access_token') ||
        localStorage.getItem('access_token') ||
        localStorage.getItem('token') ||
        ''
      );
    }

    function openWithParams(path) {
      const url = new URL(
        path,
        location.href
      );

      new URLSearchParams(
        location.search
      ).forEach((value, key) => {
        url.searchParams.set(
          key,
          value
        );
      });

      const token = getToken();

      if (
        token &&
        !url.searchParams.has('token')
      ) {
        url.searchParams.set(
          'token',
          token
        );
      }

      location.assign(url.href);
    }


    /* =====================================================
       SỰ KIỆN MỞ TRANG
    ===================================================== */

    Object.entries(routes).forEach(
      ([buttonId, path]) => {
        const button =
          document.getElementById(buttonId);

        if (!button) {
          console.warn(
            `Không tìm thấy nút id="${buttonId}"`
          );

          return;
        }

        button.addEventListener('click', () => {
          openWithParams(path);
        });
      }
    );


    /* =====================================================
       ĐĂNG XUẤT
    ===================================================== */

    document
      .getElementById('btnLogout')
      ?.addEventListener('click', () => {
        localStorage.removeItem('nv');
        localStorage.removeItem('last_ma_nv');
        localStorage.removeItem('access_token');

        sessionStorage.removeItem(
          'access_token'
        );

        location.replace('./login.html');
      });


    /* =====================================================
       KHỞI CHẠY
    ===================================================== */

    document.getElementById('year').textContent =
      new Date().getFullYear();

    async function init() {
      hideAllPermissionButtons();
      showPermissionMessage(false);

      try {
        const user = readUser();

        const maNv = getEmployeeCode(user);
        const tenNv = getEmployeeName(user);
        const idVaiTro = getRoleId(user);

        if (!maNv) {
          throw new Error(
            'Dữ liệu đăng nhập không có ma_nv'
          );
        }

        if (!idVaiTro) {
          console.error(
            'Dữ liệu localStorage hiện tại:',
            user
          );

          throw new Error(
            'Dữ liệu đăng nhập không có id_vaitro'
          );
        }

        document.getElementById(
          'ten_nv'
        ).textContent =
          tenNv ||
          maNv ||
          'Nhân viên';

        console.log('[NHÂN VIÊN ĐĂNG NHẬP]', {
          ma_nv:maNv,
          ten_nv:tenNv,
          id_vaitro:idVaiTro,
          trang:currentPage(),
          user
        });

        const client =
          await createClient();

        await applyPermissions(
          client,
          maNv,
          idVaiTro
        );
      } catch (error) {
        console.error(
          '[MAIN] Lỗi phân quyền:',
          error
        );

        showPermissionMessage(true);

        alert(
          `LỖI LẤY QUYỀN\n\n` +
          `message: ${error?.message || error}\n` +
          `code: ${error?.code || 'không có'}\n` +
          `details: ${error?.details || 'không có'}\n` +
          `hint: ${error?.hint || 'không có'}`
        );
      } finally {
        showPage();
      }
    }

    init();
  </script>
