<script type="module">
  import {
    quyen_duocxem
  } from './js/phan_quyen.js';

  document.addEventListener('DOMContentLoaded', async () => {
    const btnKho = document.getElementById('kho');

    if (!btnKho) {
      console.error('Không tìm thấy nút #kho');
      return;
    }

    // Luôn ẩn trước khi kiểm tra
    btnKho.classList.add('hidden');
    btnKho.style.display = 'none';

    const duocXemKho = await quyen_duocxem(
      'kho',
      'main.html',
      {
        thongBao: true,
        batBuocTaiLai: true
      }
    );

    console.log('[NÚT KHO]', {
      id_chucnang: 'kho',
      duong_dan: 'main.html',
      duoc_xem: duocXemKho
    });

    if (duocXemKho) {
      btnKho.classList.remove('hidden');
      btnKho.style.display = '';
    }

    btnKho.addEventListener('click', () => {
      if (!duocXemKho) {
        alert('Bạn không có quyền xem chức năng Kho.');
        return;
      }

      const token = sessionStorage.getItem('APP_ACCESS');
      const url = new URL('./kho.html', location.href);

      if (token) {
        url.searchParams.set('token', token);
      }

      location.href = url.toString();
    });
  });
</script>

</body>
</html>
