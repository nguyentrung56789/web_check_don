```html
<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <title>Kiểm tra quyền được xem</title>

  <!-- Các file cấu hình đang dùng trong hệ thống -->
  <script src="./js/internal_key.js"></script>
  <script src="./js/cod_config.js"></script>

  <!-- Thư viện Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #0b1220;
      color: #e6edff;
    }

    .wrap {
      width: min(100%, 680px);
      margin: 0 auto;
    }

    .card {
      padding: 22px;
      border: 1px solid #263451;
      border-radius: 16px;
      background: #111a2e;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.25);
    }

    h1 {
      margin: 0 0 20px;
      font-size: 24px;
    }

    label {
      display: block;

      font-weight: 700;
    }

    input {
      width: 100%;
      min-height: 46px;
      padding: 10px 12px;
      border: 1px solid #344563;
      border-radius: 10px;
      background: #0b1220;
      color: #ffffff;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #60a5fa;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    button {
      min-height: 42px;
      padding: 10px 14px;
      border: 0;
      border-radius: 10px;

      background: #334155;

      cursor: not-allowed;
      opacity: 0.6;

      display: block;

      display: block;
      border: 1px solid #f59e0b;

    }

    .result.error {
      display: block;
      border: 1px solid #ef4444;
      background: #7f1d1d;

    }

    .info {
      margin-top: 18px;
      padding: 12px;
      border-radius: 10px;
      background: #0b1220;

    }
  </style>
</head>

<body>
  <main class="wrap">
    <section class="card">
      <h1>🔐 Kiểm tra quyền được xem</h1>

      <label for="idChucNang">
        Nhập id_chucnang
      </label>

      <input
        id="idChucNang"
        type="text"
        value="admin"
        placeholder="Ví dụ: admin, donghang, checkdon"
        autocomplete="off"
      />

      <div class="buttons">
        <button id="btnCheck" type="button">
          Kiểm tra quyền
        </button>

        <button
          id="btnAdmin"
          class="secondary"
          type="button"
        >
          Test admin
        </button>

        <button
          id="btnDongHang"
          class="secondary"
          type="button"
        >
          Test donghang
        </button>

        <button
          id="btnCheckDon"
          class="secondary"
          type="button"
        >
          Test checkdon
        </button>
      </div>

      <div id="result" class="result"></div>

      <div class="info">
        Trang này gọi:

        <br />

        <code>
          quyen_duocxem(id_chucnang)
        </code>

        <br /><br />

        Mở F12 → Console để xem chi tiết dữ liệu phân quyền.
      </div>
    </section>
  </main>

  <script type="module">
    import {
      quyen_duocxem
    } from './js/phanquyen.js';

    const input = document.getElementById('idChucNang');
    const btnCheck = document.getElementById('btnCheck');
    const resultEl = document.getElementById('result');

    function setResult(type, text) {
      resultEl.className = `result ${type}`;
      resultEl.textContent = text;
    }

    async function kiemTraQuyen(idChucNang) {
      const id = String(idChucNang || '').trim();

      if (!id) {
        alert('Vui lòng nhập id_chucnang');

        setResult(
          'error',
          'Không có id_chucnang để kiểm tra.'
        );

        return;
      }

      btnCheck.disabled = true;
      btnCheck.textContent = 'Đang kiểm tra...';

      setResult(
        'no',
        [
          'Đang lấy phân quyền...',
          `id_chucnang: ${id}`
        ].join('\n')
      );

      try {
        console.log(
          '[TEST PHÂN QUYỀN] Bắt đầu kiểm tra:',
          id
        );

        const duocXem = await quyen_duocxem(id);

        console.log(
          '[TEST PHÂN QUYỀN] Kết quả:',
          {
            id_chucnang: id,
            duoc_xem: duocXem
          }
        );

        if (duocXem === true) {
          setResult(
            'ok',
            [
              '✅ CÓ QUYỀN ĐƯỢC XEM',
              '',
              `id_chucnang: ${id}`,
              'duoc_xem: true'
            ].join('\n')
          );

          alert(
            [
              'KẾT QUẢ PHÂN QUYỀN',
              '',
              `id_chucnang: ${id}`,
              'duoc_xem: TRUE',
              '',
              'Nhân viên được phép xem chức năng này.'
            ].join('\n')
          );
        } else {
          setResult(
            'no',
            [
              '⛔ KHÔNG CÓ QUYỀN ĐƯỢC XEM',
              '',
              `id_chucnang: ${id}`,
              'duoc_xem: false'
            ].join('\n')
          );

          alert(
            [
              'KẾT QUẢ PHÂN QUYỀN',
              '',
              `id_chucnang: ${id}`,
              'duoc_xem: FALSE',
              '',
              'Không tìm thấy quyền hoặc duoc_xem đang bằng false.'
            ].join('\n')
          );
        }
      } catch (error) {
        console.error(
          '[TEST PHÂN QUYỀN] Lỗi:',
          error
        );

        const message =
          error?.message || String(error);

        setResult(
          'error',
          [
            '❌ LỖI KIỂM TRA QUYỀN',
            '',
            `id_chucnang: ${id}`,
            `message: ${message}`
          ].join('\n')
        );

        alert(
          [
            'LỖI KIỂM TRA PHÂN QUYỀN',
            '',
            `id_chucnang: ${id}`,
            `message: ${message}`,
            '',
            'Mở F12 → Console để xem chi tiết.'
          ].join('\n')
        );
      } finally {
        btnCheck.disabled = false;
        btnCheck.textContent = 'Kiểm tra quyền';
      }
    }

    btnCheck.addEventListener('click', () => {
      kiemTraQuyen(input.value);
    });

    input.addEventListener('keydown', event => {
      if (event.key === 'Enter') {
        kiemTraQuyen(input.value);
      }
    });

    document
      .getElementById('btnAdmin')
      .addEventListener('click', () => {
        input.value = 'admin';
        kiemTraQuyen('admin');
      });

    document
      .getElementById('btnDongHang')
      .addEventListener('click', () => {
        input.value = 'donghang';
        kiemTraQuyen('donghang');
      });

    document
      .getElementById('btnCheckDon')
      .addEventListener('click', () => {
        input.value = 'checkdon';
        kiemTraQuyen('checkdon');
      });

    // Kiểm tra file module đã tải
    console.log(
      '[TEST PHÂN QUYỀN] Đã tải test_phan_quyen.html'
    );

    console.log(
      '[TEST PHÂN QUYỀN] Hàm quyen_duocxem:',
      typeof quyen_duocxem
    );
  </script>
</body>
</html>
