<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />

  <title>Trang chính</title>

  <script src="./js/internal_key.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/cod_config.js"></script>
  <script src="./js/auth_token.js"></script>

  <link rel="stylesheet" href="./css/main.css" />

  <style>
    :root {
      --bg:#0b1220;
      --card:#0f1830;
      --txt:#e6edff;
      --muted:#9aa7c7;
      --btn1:#2dd4bf;
      --btn2:#60a5fa;
      --btn3:#fbbf24;
      --btn4:#a78bfa;
      --btn5:#fb7185;
      --btn6:#34d399;
    }

    * { box-sizing:border-box; }

    html,
    body {
      min-height:100%;
    }

    body {
      visibility:hidden;
      margin:0;
      background:var(--bg);
      color:var(--txt);
      font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;
    }

    body.ready {
      visibility:visible;
    }

    .top {
      position:fixed;
      z-index:10;
      inset:0 0 auto 0;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:14px 18px;
      background:var(--card);
      border-bottom:1px solid #233043;
      box-shadow:0 2px 10px rgba(0,0,0,.35);
    }

    .hello {
      font-weight:600;
    }

    #btnLogout {
      background:none;
      border:0;
      color:#f87171;
      cursor:pointer;
      font-weight:700;
      font-size:15px;
    }

    #btnLogout:hover {
      text-decoration:underline;
    }

    .menu {
      width:min(520px,92vw);
      margin:120px auto 48px;
      display:grid;
      gap:18px;
    }

    .menu button {
      width:100%;
      padding:18px;
      border:0;
      border-radius:14px;
      cursor:pointer;
      font-weight:800;
      font-size:18px;
      color:#041a18;
      transition:transform .15s ease,filter .15s ease;
    }

    .menu button:hover {
      transform:scale(1.04);
      filter:brightness(1.06);
    }

    .menu button:active {
      transform:scale(1.01);
    }

    #admin { background:var(--btn1); }
    #donghang { background:var(--btn2); }
    #checkdon { background:var(--btn3); color:#3a2a04; }
    #mapview { background:var(--btn4); }
    #chamsockhachhang { background:var(--btn5); color:#3b0713; }
    #tinhdoanhso { background:var(--btn6); color:#052e20; }

    footer {
      text-align:center;
      color:var(--muted);
      font-size:12px;
      margin:8px 0 24px;
    }

    .hidden {
      display:none !important;
    }

    @media (max-width:520px) {
      .top { padding:12px 14px; }
      .menu { margin-top:100px; gap:14px; }
      .menu button { padding:16px; font-size:17px; }
    }
  </style>
</head>

<body>
  <noscript>
    <div style="padding:12px;background:#ffdbdb;color:#6b0000;text-align:center">
      Trình duyệt đang tắt JavaScript. Vui lòng bật JavaScript để tiếp tục.
    </div>
  </noscript>

  <header class="top" role="banner" aria-label="Thanh tiêu đề">
    <div class="hello">
      Xin chào <span id="ten_nv">...</span> 👋
    </div>

    <button id="btnLogout" type="button" title="Đăng xuất">
      Đăng xuất
    </button>
  </header>

  <main class="menu" role="main" aria-label="Menu chính">
    <button id="admin" type="button" class="hidden" data-phan-quyen>
      👤 Admin
    </button>

    <button id="donghang" type="button" class="hidden" data-phan-quyen>
      📦 Đóng hàng COD
    </button>

    <button id="checkdon" type="button" class="hidden" data-phan-quyen>
      🧾 Check đơn
    </button>

    <button id="mapview" type="button" class="hidden" data-phan-quyen>
      🗺️ Xem bản đồ
    </button>

    <button id="chamsockhachhang" type="button" class="hidden" data-phan-quyen>
      💬 Chăm sóc khách hàng
    </button>

    <button id="tinhdoanhso" type="button" class="hidden" data-phan-quyen>
      🧮 Tính doanh số nhân viên
    </button>
  </main>

  <footer>
    © <span id="year"></span> COD Internal
  </footer>

  <script type="module">
    import { taiPhanQuyenTrang } from './js/phan_quyen.js';

    const LOGIN_STORAGE_KEY = 'chatwoot_crm_user';
    const LOGIN_PAGE = './login.html';

    if (!window.__MAIN_PAGE_STARTED__) {
      window.__MAIN_PAGE_STARTED__ = true;
      khoiTaoTrang();
    }

    function hienTrang() {
      document.body.classList.add('ready');
      document.body.style.visibility = 'visible';
    }

    function layNguoiDung() {
      try {
        return JSON.parse(
          localStorage.getItem(LOGIN_STORAGE_KEY) || 'null'
        );
      } catch (error) {
        console.error('Không đọc được thông tin đăng nhập:', error);
        return null;
      }
    }

    async function choThongTinDangNhap(timeoutMs = 2500) {
      const batDau = Date.now();

      while (Date.now() - batDau < timeoutMs) {
        const user = layNguoiDung();
        if (user) return user;
        await new Promise(resolve => setTimeout(resolve, 120));
      }

      return null;
    }

    function moTrangGiuThamSo(path) {
      const targetUrl = new URL(path, window.location.href);
      const currentParams =
        new URLSearchParams(window.location.search);

      currentParams.forEach((value, key) => {
        targetUrl.searchParams.set(key, value);
      });

      const token =
        currentParams.get('token') ||
        currentParams.get('access_token') ||
        currentParams.get('t') ||
        localStorage.getItem('token') ||
        localStorage.getItem('access_token') ||
        localStorage.getItem('cod_token') ||
        sessionStorage.getItem('token') ||
        sessionStorage.getItem('access_token') ||
        sessionStorage.getItem('cod_token') ||
        '';

      if (token && !targetUrl.searchParams.get('token')) {
        targetUrl.searchParams.set('token', token);
      }

      window.location.assign(targetUrl.href);
    }

    function ganSuKienNut() {
      const routes = {
        admin: './admin.html',
        donghang: './donghangcod.html',
        checkdon: './checkdon.html',
        mapview: './xembando.html',
        chamsockhachhang: './chamsockhachhang.html',
        tinhdoanhso: './tinhdoanhsonhanvien.html'
      };

      for (const [buttonId, path] of Object.entries(routes)) {
        document
          .getElementById(buttonId)
          ?.addEventListener('click', () => {
            moTrangGiuThamSo(path);
          });
      }

      document
        .getElementById('btnLogout')
        ?.addEventListener('click', () => {
          localStorage.removeItem(LOGIN_STORAGE_KEY);
          localStorage.removeItem('token');
          localStorage.removeItem('access_token');
          localStorage.removeItem('cod_token');

          sessionStorage.removeItem('token');
          sessionStorage.removeItem('access_token');
          sessionStorage.removeItem('cod_token');

          window.location.replace(LOGIN_PAGE);
        });
    }

    async function khoiTaoTrang() {
      document.getElementById('year').textContent =
        new Date().getFullYear();

      ganSuKienNut();

      try {
        /*
         * auth_token.js có thể cần một khoảng ngắn để lưu thông tin nhân viên.
         * main.html không tự chuyển về login trong lúc này để tránh vòng lặp nhấp nháy.
         */
        const user = await choThongTinDangNhap();

        if (!user) {
          console.warn(
            'Chưa có chatwoot_crm_user. Để auth_token.js xử lý đăng nhập.'
          );
          hienTrang();
          return;
        }

        const tenNhanVien = String(
          user.ten_nv ||
          user.tenNhanVien ||
          user.name ||
          user.ma_nv ||
          'Nhân viên'
        ).trim();

        document.getElementById('ten_nv').textContent =
          tenNhanVien;

        const result = await taiPhanQuyenTrang();

        if (!result) {
          console.error('Không tải được quyền trang chính');
        }
      } catch (error) {
        console.error('Lỗi khởi tạo trang chính:', error);
      } finally {
        hienTrang();
      }
    }
  </script>
</body>
</html>
