<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  />

  <title>Trang chính</title>

  <!-- Các file cấu hình hiện tại của bạn -->
  <script src="./js/internal_key.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="./js/cod_config.js"></script>
  <script src="./js/auth_token.js"></script>

  <style>
    :root {
      --bg:#0b1220;
      --card:#0f1830;
      --card-hover:#17233d;
      --txt:#e6edff;
      --muted:#9aa7c7;
      --line:#233043;

      --admin:#2dd4bf;
      --kho:#60a5fa;
      --kiem:#fbbf24;
      --kinhdoanh:#a78bfa;
      --giaovan:#fb7185;

      --danger:#f87171;
    }

    * {
      box-sizing:border-box;
    }

    html,
    body {
      min-height:100%;
    }

    body {
      visibility:hidden;
      margin:0;
      background:var(--bg);
      color:var(--txt);
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    body.ready {
      visibility:visible;
    }

    button,
    input,
    select,
    textarea {
      font:inherit;
    }

    .top {
      position:fixed;
      z-index:20;
      inset:0 0 auto 0;

      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;

      min-height:64px;
      padding:13px 18px;

      background:rgba(15,24,48,.97);
      border-bottom:1px solid var(--line);
      box-shadow:0 2px 12px rgba(0,0,0,.35);
      backdrop-filter:blur(10px);
    }

    .hello-wrap {
      min-width:0;
    }

    .hello {
      font-size:15px;
      font-weight:800;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .role-name {
      margin-top:3px;
      color:var(--muted);
      font-size:12px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    #btnLogout {
      flex:0 0 auto;
      padding:9px 12px;

      background:transparent;
      border:1px solid rgba(248,113,113,.35);
      border-radius:10px;

      color:var(--danger);
      cursor:pointer;
      font-weight:800;
      font-size:14px;
    }

    #btnLogout:hover {
      background:rgba(248,113,113,.1);
    }

    .menu {
      width:min(620px,92vw);
      margin:96px auto 48px;

      display:grid;
      gap:16px;
    }

    .heading {
      padding:10px 4px 6px;
      text-align:center;
    }

    .heading h1 {
      margin:0 0 7px;
      font-size:28px;
      line-height:1.25;
    }

    .heading p {
      margin:0;
      color:var(--muted);
      font-size:14px;
      line-height:1.5;
    }

    .role {
      position:relative;
      width:100%;
      min-height:82px;

      display:flex;
      align-items:center;
      gap:15px;

      padding:17px 18px;

      border:0;
      border-radius:16px;

      color:#07111f;
      cursor:pointer;
      text-align:left;

      box-shadow:
        0 8px 26px rgba(0,0,0,.22),
        inset 0 1px 0 rgba(255,255,255,.15);

      transition:
        transform .15s ease,
        box-shadow .15s ease,
        filter .15s ease;
    }

    .role:hover {
      transform:translateY(-2px);
      filter:brightness(1.035);
      box-shadow:
        0 12px 32px rgba(0,0,0,.28),
        inset 0 1px 0 rgba(255,255,255,.2);
    }

    .role:active {
      transform:translateY(0);
    }

    .role-icon {
      flex:0 0 auto;
      width:48px;
      height:48px;

      display:grid;
      place-items:center;

      border-radius:14px;
      background:rgba(255,255,255,.22);

      font-size:25px;
    }

    .role-text {
      min-width:0;
      flex:1;
    }

    .role strong {
      display:block;
      font-size:19px;
      line-height:1.2;
    }

    .role small {
      display:block;
      margin-top:5px;

      font-size:13px;
      line-height:1.4;
      opacity:.8;
    }

    .role-arrow {
      flex:0 0 auto;
      font-size:22px;
      font-weight:900;
      opacity:.65;
    }

    #admin {
      background:var(--admin);
    }

    #kho {
      background:var(--kho);
    }

    #kiemsoatdon {
      background:var(--kiem);
    }

    #kinhdoanh {
      background:var(--kinhdoanh);
    }

    #giaovan {
      background:var(--giaovan);
    }

    .hidden {
      display:none !important;
    }

    .message {
      display:none;
      padding:16px;

      border:1px solid var(--line);
      border-radius:14px;
      background:var(--card);

      color:var(--muted);
      font-size:14px;
      line-height:1.6;
      text-align:center;
    }

    .message.show {
      display:block;
    }

    .message.error {
      color:#fecaca;
      border-color:rgba(248,113,113,.4);
      background:rgba(127,29,29,.22);
    }

    footer {
      margin:8px 0 24px;
      color:var(--muted);
      font-size:12px;
      text-align:center;
    }

    @media (max-width:600px) {
      .top {
        min-height:60px;
        padding:11px 13px;
      }

      .menu {
        margin-top:84px;
      }

      .heading h1 {
        font-size:24px;
      }

      .role {
        min-height:76px;
        padding:15px;
      }

      .role-icon {
        width:44px;
        height:44px;
        font-size:23px;
      }

      .role strong {
        font-size:17px;
      }

      .role small {
        font-size:12px;
      }
    }
  </style>
</head>

<body>
  <header class="top">
    <div class="hello-wrap">
      <div class="hello">
        Xin chào
        <span id="ten_nv">...</span>
        👋
      </div>

      <div class="role-name" id="ten_vai_tro">
        Đang tải quyền...
      </div>
    </div>

    <button id="btnLogout" type="button">
      Đăng xuất
    </button>
  </header>

  <main class="menu">
    <div class="heading">
      <h1>Chọn nhóm chức năng</h1>

      <p>
        Chỉ những nhóm bạn được cấp quyền xem mới hiển thị.
      </p>
    </div>

    <button
      id="admin"
      class="role hidden"
      type="button"
      data-phan-quyen
    >
      <span class="role-icon">👤</span>

      <span class="role-text">
        <strong>ADMIN</strong>
        <small>Quản trị hệ thống và phân quyền</small>
      </span>

      <span class="role-arrow">›</span>
    </button>

    <button
      id="kho"
      class="role hidden"
      type="button"
      data-phan-quyen
    >
      <span class="role-icon">📦</span>

      <span class="role-text">
        <strong>KHO</strong>
        <small>Nhập, xuất, tồn kho và chuẩn bị hàng</small>
      </span>

      <span class="role-arrow">›</span>
    </button>

    <button
      id="kiemsoatdon"
      class="role hidden"
      type="button"
      data-phan-quyen
    >
      <span class="role-icon">✅</span>

      <span class="role-text">
        <strong>KIỂM SOÁT ĐƠN</strong>
        <small>Kiểm hàng và xác nhận đóng gói</small>
      </span>

      <span class="role-arrow">›</span>
    </button>

    <button
      id="kinhdoanh"
      class="role hidden"
      type="button"
      data-phan-quyen
    >
      <span class="role-icon">📈</span>

      <span class="role-text">
        <strong>KINH DOANH</strong>
        <small>Khách hàng, đơn bán và doanh số</small>
      </span>

      <span class="role-arrow">›</span>
    </button>

    <button
      id="giaovan"
      class="role hidden"
      type="button"
      data-phan-quyen
    >
      <span class="role-icon">🚚</span>

      <span class="role-text">
        <strong>GIAO VẬN</strong>
        <small>Giao hàng, COD và đối soát</small>
      </span>

      <span class="role-arrow">›</span>
    </button>

    <div id="emptyMessage" class="message">
      Tài khoản này chưa được cấp quyền xem nhóm chức năng nào.
    </div>

    <div id="errorMessage" class="message error"></div>
  </main>

  <footer>
    © <span id="year"></span> COD Internal
  </footer>

  <script>
    /*
     * ==========================================================
     * CẤU HÌNH
     * ==========================================================
     */

    const VIEW_NAME = 'sql_phan_quyen_nhan_vien';
    const LOGIN_STORAGE_KEY = 'nv';

    const routes = {
      admin: './admin.html',
      kho: './kho.html',
      kiemsoatdon: './kiem_soat_don.html',
      kinhdoanh: './kinh_doanh.html',
      giaovan: './giao_van.html'
    };


    /*
     * ==========================================================
     * HÀM HỖ TRỢ GIAO DIỆN
     * ==========================================================
     */

    function showPage() {
      document.body.classList.add('ready');
      document.body.style.visibility = 'visible';
    }

    function showError(message) {
      const box = document.getElementById('errorMessage');

      if (!box) return;

      box.textContent = message || 'Có lỗi xảy ra.';
      box.classList.add('show');
    }

    function hideError() {
      const box = document.getElementById('errorMessage');

      if (!box) return;

      box.textContent = '';
      box.classList.remove('show');
    }

    function showEmptyMessage(show) {
      document
        .getElementById('emptyMessage')
        ?.classList.toggle('show', Boolean(show));
    }


    /*
     * ==========================================================
     * ĐĂNG NHẬP
     * ==========================================================
     */

    function readUser() {
      const raw = localStorage.getItem(LOGIN_STORAGE_KEY);

      if (!raw) {
        throw new Error(
          'Không tìm thấy dữ liệu đăng nhập trong localStorage key "nv".'
        );
      }

      try {
        const user = JSON.parse(raw);

        if (!user || typeof user !== 'object') {
          throw new Error('Dữ liệu đăng nhập không hợp lệ.');
        }

        return user;
      } catch (error) {
        localStorage.removeItem(LOGIN_STORAGE_KEY);

        throw new Error(
          'Dữ liệu đăng nhập trong localStorage bị lỗi JSON.'
        );
      }
    }


    /*
     * ==========================================================
     * TOKEN
     * ==========================================================
     */

    function getToken() {
      const query = new URLSearchParams(location.search);

      return (
        query.get('token') ||
        query.get('access_token') ||
        query.get('auth_token') ||
        sessionStorage.getItem('access_token') ||
        localStorage.getItem('access_token') ||
        ''
      );
    }

    function saveToken() {
      const token = getToken();

      if (token) {
        sessionStorage.setItem('access_token', token);
      }

      return token;
    }

    function openWithToken(path) {
      const url = new URL(path, location.href);

      /*
       * Giữ lại toàn bộ query hiện tại.
       */
      new URLSearchParams(location.search).forEach((value, key) => {
        url.searchParams.set(key, value);
      });

      /*
       * Nếu token chỉ đang nằm trong sessionStorage hoặc localStorage
       * thì gắn lại vào URL trang tiếp theo.
       */
      const token = getToken();

      if (token && !url.searchParams.has('token')) {
        url.searchParams.set('token', token);
      }

      location.assign(url.href);
    }


    /*
     * ==========================================================
     * TRANG HIỆN TẠI
     * ==========================================================
     */

    function currentPage() {
      const fileName =
        location.pathname.split('/').pop() ||
        'main.html';

      return fileName
        .trim()
        .toLowerCase();
    }


    /*
     * ==========================================================
     * CHUẨN HÓA TÊN CHỨC NĂNG
     * ==========================================================
     */

    function normalizeFunctionName(value) {
      return String(value ?? '')
        .trim()
        .toLowerCase()

        /*
         * Bỏ dấu tiếng Việt.
         */
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')

        /*
         * Đổi chữ đ thành d.
         */
        .replace(/đ/g, 'd')

        /*
         * Bỏ khoảng trắng, gạch dưới và gạch ngang.
         */
        .replace(/[\s_-]+/g, '')

        /*
         * Chỉ giữ chữ và số.
         */
        .replace(/[^a-z0-9]/g, '');
    }


    /*
     * ==========================================================
     * KIỂM TRA BOOLEAN
     * ==========================================================
     */

    function isTrue(value) {
      return (
        value === true ||
        value === 1 ||
        value === '1' ||
        String(value).trim().toLowerCase() === 'true'
      );
    }


    /*
     * ==========================================================
     * TẠO SUPABASE CLIENT
     * ==========================================================
     */

    async function createClient() {
      if (!window.supabase) {
        throw new Error(
          'Không tải được thư viện Supabase.'
        );
      }

      const internalKey =
        (
          typeof window.getInternalKey === 'function'
            ? window.getInternalKey()
            : ''
        ) ||
        window.INTERNAL_KEY ||
        window.COD_INTERNAL_KEY ||
        window.internalKey ||
        '';

      const response = await fetch('/api/getConfig', {
        method: 'GET',

        headers: {
          'x-internal-key': internalKey || ''
        },

        cache: 'no-store'
      });

      if (!response.ok) {
        const responseText = await response.text();

        throw new Error(
          `getConfig HTTP ${response.status}: ${responseText}`
        );
      }

      const config = await response.json();

      const supabaseUrl =
        config.url ||
        config.SUPABASE_URL ||
        config.supabaseUrl ||
        config.supabase_url;

      const supabaseAnonKey =
        config.anon ||
        config.key ||
        config.SUPABASE_ANON ||
        config.SUPABASE_ANON_KEY ||
        config.supabaseAnon ||
        config.supabaseKey ||
        config.supabase_anon_key;

      if (!supabaseUrl || !supabaseAnonKey) {
        throw new Error(
          'API getConfig không trả về SUPABASE_URL hoặc SUPABASE_ANON_KEY.'
        );
      }

      return window.supabase.createClient(
        supabaseUrl,
        supabaseAnonKey
      );
    }


    /*
     * ==========================================================
     * ÁP DỤNG PHÂN QUYỀN
     * ==========================================================
     */

    function applyPermissions(rows) {
      const permissionMap = new Map();

      /*
       * Không dùng id_chucnang vì đây có thể là UUID.
       *
       * Dùng ten_chucnang để so với ID nút:
       * kho
       * admin
       * kinh_doanh
       * giao_van
       * kiem_soat_don
       */
      (rows || []).forEach(row => {
        const functionName = normalizeFunctionName(
          row?.ten_chucnang
        );

        if (!functionName) return;

        /*
         * Nếu cùng chức năng có nhiều dòng,
         * chỉ cần một dòng duoc_xem = true là được xem.
         */
        const oldPermission = permissionMap.get(functionName);

        if (!oldPermission) {
          permissionMap.set(functionName, row);
          return;
        }

        if (
          isTrue(row?.duoc_xem) &&
          !isTrue(oldPermission?.duoc_xem)
        ) {
          permissionMap.set(functionName, row);
        }
      });

      let visibleCount = 0;

      document
        .querySelectorAll('[data-phan-quyen]')
        .forEach(button => {
          const buttonName = normalizeFunctionName(button.id);
          const permission = permissionMap.get(buttonName);

          const allowed = isTrue(permission?.duoc_xem);

          button.classList.toggle('hidden', !allowed);

          if (allowed) {
            visibleCount += 1;
          }

          console.log('[KIỂM TRA NÚT]', {
            button_id: button.id,
            button_chuan_hoa: buttonName,
            tim_thay_quyen: Boolean(permission),
            ten_chucnang: permission?.ten_chucnang,
            duoc_xem: permission?.duoc_xem,
            hien_thi: allowed
          });
        });

      showEmptyMessage(visibleCount === 0);

      console.log('[MAP PHÂN QUYỀN]', {
        map: Object.fromEntries(permissionMap),
        so_nut_duoc_hien: visibleCount
      });

      return visibleCount;
    }


    /*
     * ==========================================================
     * LẤY QUYỀN
     * ==========================================================
     */

    async function loadPermissions(client, maNv, page) {
      /*
       * Truy vấn chính xác theo nhân viên và trang.
       */
      const firstQuery = await client
        .from(VIEW_NAME)
        .select(`
          ma_nv,
          ten_nv,
          ten_vai_tro,
          duong_dan,
          id_chucnang,
          ten_chucnang,
          duoc_xem
        `)
        .eq('ma_nv', maNv)
        .eq('duong_dan', page);

      if (firstQuery.error) {
        throw firstQuery.error;
      }

      let rows = firstQuery.data || [];

      console.log('[TRUY VẤN THEO TRANG]', {
        ma_nv: maNv,
        duong_dan: page,
        so_dong: rows.length,
        du_lieu: rows
      });

      /*
       * Nếu không có dòng nào, thử lấy toàn bộ quyền của nhân viên.
       * Mục đích để phát hiện duong_dan trong Supabase bị sai.
       */
      if (rows.length === 0) {
        const fallbackQuery = await client
          .from(VIEW_NAME)
          .select(`
            ma_nv,
            ten_nv,
            ten_vai_tro,
            duong_dan,
            id_chucnang,
            ten_chucnang,
            duoc_xem
          `)
          .eq('ma_nv', maNv);

        if (fallbackQuery.error) {
          throw fallbackQuery.error;
        }

        const fallbackRows = fallbackQuery.data || [];

        console.warn(
          '[CẢNH BÁO] Không có quyền đúng duong_dan hiện tại.',
          {
            trang_hien_tai: page,
            tat_ca_quyen_cua_nhan_vien: fallbackRows
          }
        );

        /*
         * Chỉ lấy những dòng có đường dẫn gần giống main.html.
         */
        const normalizedCurrentPage =
          String(page).trim().toLowerCase();

        const similarRows = fallbackRows.filter(row => {
          const rowPath = String(
            row?.duong_dan ?? ''
          )
            .trim()
            .toLowerCase()
            .replace(/^\.\//, '')
            .replace(/^\//, '');

          return (
            rowPath === normalizedCurrentPage ||
            rowPath.endsWith('/' + normalizedCurrentPage)
          );
        });

        /*
         * Nếu vẫn không có đường dẫn tương tự,
         * trả về rỗng để không cấp quyền sai.
         */
        rows = similarRows;
      }

      return rows;
    }


    /*
     * ==========================================================
     * SỰ KIỆN
     * ==========================================================
     */

    Object.entries(routes).forEach(([buttonId, path]) => {
      const button = document.getElementById(buttonId);

      if (!button) {
        console.error(
          '[ROUTE] Không tìm thấy nút:',
          buttonId
        );

        return;
      }

      button.addEventListener('click', () => {
        console.log('[MỞ TRANG]', {
          button_id: buttonId,
          duong_dan: path,
          token: Boolean(getToken())
        });

        openWithToken(path);
      });
    });

    document
      .getElementById('btnLogout')
      ?.addEventListener('click', () => {
        localStorage.removeItem('nv');
        localStorage.removeItem('last_ma_nv');

        sessionStorage.removeItem('access_token');
        localStorage.removeItem('access_token');

        location.replace('./login.html');
      });

    document.getElementById('year').textContent =
      new Date().getFullYear();


    /*
     * ==========================================================
     * KHỞI CHẠY
     * ==========================================================
     */

    async function init() {
      hideError();
      showEmptyMessage(false);

      try {
        const user = readUser();

        const maNv = String(
          user?.ma_nv ?? ''
        ).trim();

        const tenNv = String(
          user?.ten_nv ?? ''
        ).trim();

        if (!maNv) {
          throw new Error(
            'Dữ liệu đăng nhập không có ma_nv.'
          );
        }

        const page = currentPage();
        const token = saveToken();

        document.getElementById('ten_nv').textContent =
          tenNv ||
          maNv ||
          'Nhân viên';

        console.log('[KHỞI TẠO MAIN]', {
          ma_nv: maNv,
          ten_nv: tenNv,
          trang: page,
          co_token: Boolean(token),
          url: location.href
        });

        const client = await createClient();

        const rows = await loadPermissions(
          client,
          maNv,
          page
        );

        /*
         * Hiển thị tên vai trò.
         */
        const roleNames = [
          ...new Set(
            rows
              .map(row =>
                String(row?.ten_vai_tro ?? '').trim()
              )
              .filter(Boolean)
          )
        ];

        document.getElementById('ten_vai_tro').textContent =
          roleNames.length > 0
            ? `Vai trò: ${roleNames.join(', ')}`
            : `Mã nhân viên: ${maNv}`;

        applyPermissions(rows);

        console.log('[PHÂN QUYỀN ĐÃ TẢI]', {
          ma_nv: maNv,
          trang: page,
          so_dong: rows.length,
          danh_sach: rows
        });
      } catch (error) {
        console.error('[LỖI MAIN]', error);

        const message =
          error?.message ||
          String(error);

        showError(
          `Không tải được phân quyền: ${message}`
        );

        alert(
          `LỖI LẤY QUYỀN\n\n` +
          `message: ${message}\n` +
          `code: ${error?.code || 'không có'}\n` +
          `details: ${error?.details || 'không có'}\n` +
          `hint: ${error?.hint || 'không có'}`
        );
      } finally {
        showPage();
      }
    }

    init();
  </script>
</body>
</html>
