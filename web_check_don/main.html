<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  />

  <title>Trang chính</title>

  <script src="./js/internal_key.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/cod_config.js"></script>
  <script src="./js/auth_token.js"></script>

  <style>
    :root {
      --bg:#0b1220;
      --card:#0f1830;
      --txt:#e6edff;
      --muted:#9aa7c7;
      --line:#233043;

      --admin:#2dd4bf;
      --kho:#60a5fa;
      --kiemsoatdon:#fbbf24;
      --kinhdoanh:#a78bfa;
      --giaovan:#fb7185;

      --danger:#f87171;
    }

    * {
      box-sizing:border-box;
    }

    html,
    body {
      min-height:100%;
    }

    body {
      visibility:hidden;
      margin:0;
      background:var(--bg);
      color:var(--txt);

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    body.ready {
      visibility:visible;
    }

    button {
      font:inherit;
    }

    .top {
      position:fixed;
      z-index:20;
      inset:0 0 auto 0;

      min-height:64px;
      padding:13px 18px;

      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;

      background:rgba(15,24,48,.97);
      border-bottom:1px solid var(--line);
      box-shadow:0 2px 12px rgba(0,0,0,.35);
      backdrop-filter:blur(10px);
    }

    .hello-wrap {
      min-width:0;
    }

    .hello {
      font-size:15px;
      font-weight:800;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .role-name {
      margin-top:3px;
      color:var(--muted);
      font-size:12px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    #btnLogout {
      flex:0 0 auto;
      padding:9px 12px;

      background:transparent;
      border:1px solid rgba(248,113,113,.35);
      border-radius:10px;

      color:var(--danger);
      cursor:pointer;
      font-weight:800;
      font-size:14px;
    }

    #btnLogout:hover {
      background:rgba(248,113,113,.1);
    }

    .menu {
      width:min(620px,92vw);
      margin:96px auto 48px;

      display:grid;
      gap:16px;
    }

    .heading {
      padding:10px 4px 6px;
      text-align:center;
    }

    .heading h1 {
      margin:0 0 7px;
      font-size:28px;
      line-height:1.25;
    }

    .heading p {
      margin:0;
      color:var(--muted);
      font-size:14px;
      line-height:1.5;
    }

    .role {
      position:relative;

      width:100%;
      min-height:82px;

      display:flex;
      align-items:center;
      gap:15px;

      padding:17px 18px;

      border:0;
      border-radius:16px;

      color:#07111f;
      cursor:pointer;
      text-align:left;

      box-shadow:
        0 8px 26px rgba(0,0,0,.22),
        inset 0 1px 0 rgba(255,255,255,.15);

      transition:
        transform .15s ease,
        box-shadow .15s ease,
        filter .15s ease;
    }

    .role:hover {
      transform:translateY(-2px);
      filter:brightness(1.035);

      box-shadow:
        0 12px 32px rgba(0,0,0,.28),
        inset 0 1px 0 rgba(255,255,255,.2);
    }

    .role:active {
      transform:translateY(0);
    }

    .role-icon {
      flex:0 0 auto;

      width:48px;
      height:48px;

      display:grid;
      place-items:center;

      border-radius:14px;
      background:rgba(255,255,255,.22);

      font-size:25px;
    }

    .role-text {
      min-width:0;
      flex:1;
    }

    .role strong {
      display:block;
      font-size:19px;
      line-height:1.2;
    }

    .role small {
      display:block;
      margin-top:5px;

      font-size:13px;
      line-height:1.4;
      opacity:.8;
    }

    .role-arrow {
      flex:0 0 auto;
      font-size:22px;
      font-weight:900;
      opacity:.65;
    }

    #admin {
      background:var(--admin);
    }

    #kho {
      background:var(--kho);
    }

    #kiemsoatdon {
      background:var(--kiemsoatdon);
    }

    #kinhdoanh {
      background:var(--kinhdoanh);
    }

    #giaovan {
      background:var(--giaovan);
    }

    .hidden {
      display:none !important;
    }

    .message {
      display:none;

      padding:16px;
      border:1px solid var(--line);
      border-radius:14px;

      background:var(--card);
      color:var(--muted);

      font-size:14px;
      line-height:1.6;
      text-align:center;
    }

    .message.show {
      display:block;
    }

    .message.error {
      color:#fecaca;
      border-color:rgba(248,113,113,.4);
      background:rgba(127,29,29,.22);
    }

    footer {
      margin:8px 0 24px;
      color:var(--muted);
      font-size:12px;
      text-align:center;
    }

    @media (max-width:600px) {
      .top {
        min-height:60px;
        padding:11px 13px;
      }

      .menu {
        margin-top:84px;
      }

      .heading h1 {
        font-size:24px;
      }

      .role {
        min-height:76px;
        padding:15px;
      }

      .role-icon {
        width:44px;
        height:44px;
        font-size:23px;
      }

      .role strong {
        font-size:17px;
      }

      .role small {
        font-size:12px;
      }
    }
  </style>
</head>

<body>
  <header class="top">
    <div class="hello-wrap">
      <div class="hello">
        Xin chào
        <span id="ten_nv">...</span>
        👋
      </div>

      <div id="ten_vai_tro" class="role-name">
        Đang tải quyền...
      </div>
    </div>

    <button id="btnLogout" type="button">
      Đăng xuất
    </button>
  </header>

  <main class="menu">
    <div class="heading">
      <h1>Chọn nhóm chức năng</h1>

      <p>
        Chỉ những nhóm đã được cấp quyền xem mới hiển thị.
      </p>
    </div>

    <button
      id="admin"
      class="role hidden"
      type="button"
      data-phan-quyen
    >
      <span class="role-icon">👤</span>

      <span class="role-text">
        <strong>ADMIN</strong>
        <small>Quản trị hệ thống và phân quyền</small>
      </span>

      <span class="role-arrow">›</span>
    </button>

    <button
      id="kho"
      class="role hidden"
      type="button"
      data-phan-quyen
    >
      <span class="role-icon">📦</span>

      <span class="role-text">
        <strong>KHO</strong>
        <small>Nhập, xuất, tồn kho và chuẩn bị hàng</small>
      </span>

      <span class="role-arrow">›</span>
    </button>

    <button
      id="kiemsoatdon"
      class="role hidden"
      type="button"
      data-phan-quyen
    >
      <span class="role-icon">✅</span>

      <span class="role-text">
        <strong>KIỂM SOÁT ĐƠN</strong>
        <small>Kiểm hàng và xác nhận đóng gói</small>
      </span>

      <span class="role-arrow">›</span>
    </button>

    <button
      id="kinhdoanh"
      class="role hidden"
      type="button"
      data-phan-quyen
    >
      <span class="role-icon">📈</span>

      <span class="role-text">
        <strong>KINH DOANH</strong>
        <small>Khách hàng, đơn bán và doanh số</small>
      </span>

      <span class="role-arrow">›</span>
    </button>

    <button
      id="giaovan"
      class="role hidden"
      type="button"
      data-phan-quyen
    >
      <span class="role-icon">🚚</span>

      <span class="role-text">
        <strong>GIAO VẬN</strong>
        <small>Giao hàng, COD và đối soát</small>
      </span>

      <span class="role-arrow">›</span>
    </button>

    <div id="emptyMessage" class="message">
      Tài khoản này chưa được cấp quyền xem nhóm chức năng nào.
    </div>

    <div id="errorMessage" class="message error"></div>
  </main>

  <footer>
    © <span id="year"></span> COD Internal
  </footer>

  <script type="module">
    const VIEW_NAME = 'sql_phan_quyen_nhan_vien';
    const LOGIN_STORAGE_KEY = 'nv';

    /*
     * ID trong routes phải trùng:
     * 1. ID nút HTML
     * 2. id_chucnang trong view Supabase
     */
    const routes = {
      admin:'./admin.html',
      kho:'./kho.html',
      kiemsoatdon:'./kiem_soat_don.html',
      kinhdoanh:'./kinh_doanh.html',
      giaovan:'./giao_van.html'
    };


    /* =========================================================
       HIỂN THỊ TRANG
    ========================================================= */

    function showPage() {
      document.body.classList.add('ready');
      document.body.style.visibility = 'visible';
    }

    function showError(message) {
      const box = document.getElementById('errorMessage');

      if (!box) return;

      box.textContent = message || 'Có lỗi xảy ra.';
      box.classList.add('show');
    }

    function hideError() {
      const box = document.getElementById('errorMessage');

      if (!box) return;

      box.textContent = '';
      box.classList.remove('show');
    }

    function showEmptyMessage(show) {
      document
        .getElementById('emptyMessage')
        ?.classList.toggle('show', Boolean(show));
    }


    /* =========================================================
       ĐỌC NHÂN VIÊN ĐANG ĐĂNG NHẬP
    ========================================================= */

    function readUser() {
      const raw = localStorage.getItem(
        LOGIN_STORAGE_KEY
      );

      if (!raw) {
        throw new Error(
          'Không có localStorage key "nv"'
        );
      }

      return JSON.parse(raw);
    }


    /* =========================================================
       LẤY TÊN FILE HIỆN TẠI
    ========================================================= */

    function currentPage() {
      return (
        location.pathname.split('/').pop() ||
        'main.html'
      ).toLowerCase();
    }


    /* =========================================================
       TOKEN VÀ THAM SỐ URL
    ========================================================= */

    function getToken() {
      const params = new URLSearchParams(
        location.search
      );

      return (
        params.get('token') ||
        params.get('access_token') ||
        params.get('auth_token') ||
        sessionStorage.getItem('access_token') ||
        localStorage.getItem('access_token') ||
        ''
      );
    }

    function saveToken() {
      const token = getToken();

      if (token) {
        sessionStorage.setItem(
          'access_token',
          token
        );
      }

      return token;
    }

    function openWithParams(path) {
      const url = new URL(
        path,
        location.href
      );

      /*
       * Giữ toàn bộ tham số hiện có trên URL.
       */
      new URLSearchParams(
        location.search
      ).forEach((value, key) => {
        url.searchParams.set(
          key,
          value
        );
      });

      /*
       * Nếu token chỉ có trong bộ nhớ,
       * thêm token vào URL trang con.
       */
      const token = getToken();

      if (
        token &&
        !url.searchParams.has('token')
      ) {
        url.searchParams.set(
          'token',
          token
        );
      }

      location.assign(url.href);
    }


    /* =========================================================
       TẠO SUPABASE CLIENT
    ========================================================= */

    async function createClient() {
      const internalKey =
        (
          typeof window.getInternalKey === 'function'
            ? window.getInternalKey()
            : ''
        ) ||
        window.INTERNAL_KEY ||
        window.COD_INTERNAL_KEY ||
        window.internalKey ||
        '';

      const response = await fetch(
        '/api/getConfig',
        {
          headers:{
            'x-internal-key':internalKey || ''
          },

          cache:'no-store'
        }
      );

      if (!response.ok) {
        throw new Error(
          `getConfig HTTP ${response.status}: ` +
          `${await response.text()}`
        );
      }

      const config = await response.json();

      const supabaseUrl =
        config.url ||
        config.SUPABASE_URL ||
        config.supabaseUrl ||
        config.supabase_url;

      const supabaseKey =
        config.anon ||
        config.key ||
        config.SUPABASE_ANON ||
        config.SUPABASE_ANON_KEY ||
        config.supabaseAnon ||
        config.supabaseKey ||
        config.supabase_anon_key;

      if (!supabaseUrl || !supabaseKey) {
        throw new Error(
          'Thiếu URL hoặc anon key Supabase'
        );
      }

      return window.supabase.createClient(
        supabaseUrl,
        supabaseKey
      );
    }


    /* =========================================================
       ÁP DỤNG PHÂN QUYỀN
       GIỮ ĐÚNG CƠ CHẾ CODE CŨ
    ========================================================= */

    function applyPermissions(rows) {
      /*
       * Lấy id_chucnang làm key.
       *
       * Ví dụ:
       * id_chucnang = kho
       * id_chucnang = admin
       * id_chucnang = kiemsoatdon
       */
      const permissionMap = new Map(
        (rows || [])
          .filter(row => row.id_chucnang)
          .map(row => [
            String(
              row.id_chucnang
            ).trim(),
            row
          ])
      );

      let visibleCount = 0;

      document
        .querySelectorAll('[data-phan-quyen]')
        .forEach(button => {
          /*
           * button.id phải trùng id_chucnang.
           */
          const permission = permissionMap.get(
            button.id
          );

          /*
           * Giữ đúng code cũ:
           * chỉ hiện khi duoc_xem === true.
           */
          const allowed =
            permission?.duoc_xem === true;

          button.classList.toggle(
            'hidden',
            !allowed
          );

          if (allowed) {
            visibleCount++;
          }

          console.log(
            '[KIỂM TRA PHÂN QUYỀN]',
            {
              id_nut:button.id,
              id_chucnang:
                permission?.id_chucnang,
              ten_chucnang:
                permission?.ten_chucnang,
              duoc_xem:
                permission?.duoc_xem,
              hien_thi:allowed
            }
          );
        });

      showEmptyMessage(
        visibleCount === 0
      );

      console.log(
        '[MAP PHÂN QUYỀN]',
        Object.fromEntries(
          permissionMap
        )
      );
    }


    /* =========================================================
       GẮN SỰ KIỆN MỞ TRANG
    ========================================================= */

    Object.entries(routes).forEach(
      ([id, path]) => {
        const button =
          document.getElementById(id);

        if (!button) {
          console.error(
            'Không tìm thấy nút:',
            id
          );

          return;
        }

        button.addEventListener(
          'click',
          () => {
            console.log(
              '[MỞ TRANG]',
              {
                id_nut:id,
                duong_dan:path
              }
            );

            openWithParams(path);
          }
        );
      }
    );


    /* =========================================================
       ĐĂNG XUẤT
    ========================================================= */

    document
      .getElementById('btnLogout')
      ?.addEventListener('click', () => {
        localStorage.removeItem('nv');
        localStorage.removeItem(
          'last_ma_nv'
        );

        localStorage.removeItem(
          'access_token'
        );

        sessionStorage.removeItem(
          'access_token'
        );

        location.replace(
          './login.html'
        );
      });


    /* =========================================================
       NĂM HIỆN TẠI
    ========================================================= */

    document.getElementById(
      'year'
    ).textContent =
      new Date().getFullYear();


    /* =========================================================
       KHỞI CHẠY
    ========================================================= */

    async function init() {
      hideError();
      showEmptyMessage(false);

      try {
        const user = readUser();

        const maNv = String(
          user?.ma_nv || ''
        ).trim();

        const tenNv = String(
          user?.ten_nv || ''
        ).trim();

        const page = currentPage();
        const token = saveToken();

        if (!maNv) {
          throw new Error(
            'Dữ liệu đăng nhập không có ma_nv'
          );
        }

        document.getElementById(
          'ten_nv'
        ).textContent =
          tenNv ||
          maNv ||
          'Nhân viên';

        const client =
          await createClient();

        /*
         * Giữ nguyên cách truy vấn code cũ:
         *
         * ma_nv = nhân viên đăng nhập
         * duong_dan = main.html
         */
        const {
          data,
          error
        } = await client
          .from(VIEW_NAME)
          .select(
            'ma_nv,' +
            'ten_nv,' +
            'ten_vai_tro,' +
            'duong_dan,' +
            'id_chucnang,' +
            'ten_chucnang,' +
            'duoc_xem'
          )
          .eq('ma_nv', maNv)
          .eq('duong_dan', page);

        if (error) {
          throw error;
        }

        const rows = data || [];

        /*
         * Hiển thị tên vai trò.
         */
        const roleNames = [
          ...new Set(
            rows
              .map(row =>
                String(
                  row?.ten_vai_tro || ''
                ).trim()
              )
              .filter(Boolean)
          )
        ];

        document.getElementById(
          'ten_vai_tro'
        ).textContent =
          roleNames.length
            ? `Vai trò: ${roleNames.join(', ')}`
            : `Mã nhân viên: ${maNv}`;

        console.log(
          '[PHÂN QUYỀN] Dữ liệu nhận được:',
          {
            ten_nv:tenNv,
            ma_nv:maNv,
            trang:page,
            co_token:Boolean(token),
            so_dong_quyen:rows.length,
            danh_sach_quyen:rows
          }
        );

        console.table(rows);

        applyPermissions(rows);
      } catch (error) {
        console.error(
          '[INLINE DEBUG] Lỗi:',
          error
        );

        const message =
          error?.message ||
          String(error);

        showError(
          `Không tải được phân quyền: ${message}`
        );

        alert(
          `LỖI LẤY QUYỀN\n\n` +
          `message: ${message}\n` +
          `code: ${error?.code || 'không có'}\n` +
          `details: ${error?.details || 'không có'}\n` +
          `hint: ${error?.hint || 'không có'}`
        );
      } finally {
        showPage();
      }
    }

    init();
  </script>
</body>
</html>
