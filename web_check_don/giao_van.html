  <div class="page">

    <header class="topbar">

  <script>
    function readLoginUser() {
      const storageKeys = [
        'nv',
        'chatwoot_crm_user'
      ];

      for (const key of storageKeys) {
        try {
          const raw = localStorage.getItem(key);

          if (!raw) {
            continue;
          }

          const data = JSON.parse(raw);

          if (
            data &&
            typeof data === 'object'
          ) {
            return data;
          }
        } catch (error) {
          console.warn(
            `Không đọc được ${key}:`,
            error
          );
        }
      }

      return null;
    }

    function dongBoNhanVien() {
      const loginUser = readLoginUser();

      if (!loginUser) {
        return;
      }

      const maNv = String(
        loginUser.ma_nv ||
        loginUser.id_nv ||
        ''
      ).trim();

      const tenNv = String(
        loginUser.ten_nv ||
        loginUser.name ||
        maNv ||
        'Nhân viên'
      ).trim();

      document.getElementById(
        'tenNhanVien'
      ).textContent = tenNv;

      if (maNv) {
        const nvContext = {
          ...loginUser,
          ma_nv: maNv,
          ten_nv: tenNv,
          ts: Date.now()
        };

        localStorage.setItem(
          'nv',
          JSON.stringify(nvContext)
        );

        sessionStorage.setItem(
          'nv_ctx',
          JSON.stringify({
            ma_nv: maNv,
            ten_nv: tenNv,
            ts: Date.now()
          })
        );
      }
    }

    document.addEventListener(
      'DOMContentLoaded',
      () => {
        dongBoNhanVien();

        document
          .getElementById('btnGiaoHang')
          .addEventListener(
            'click',
            () => {
              window.location.href =
                './app_giao_hang.html';
            }
          );
      }
    );
  </script>
</body>
</html>
