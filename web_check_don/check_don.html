<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kiểm tra đơn hàng (don_hang)</title>

<script src="./js/internal_key.js"></script>
<script src="./js/cod_config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
<script src="./js/check_login.js"></script>

<style>
/* =========================
   THEME (biến màu toàn cục)
   ========================= */
:root{
  --bg:#0b1220;        /* màu nền trang */
  --panel:#0f1830;     /* nền thẻ/card/panel */
  --line:#192542;      /* đường viền/đường kẻ */
  --txt:#e6edff;       /* màu chữ chính */
  --muted:#93a2c7;     /* màu chữ phụ/ghi chú */
  --brand:#69b4ff;     /* màu thương hiệu/nút chính */
  --ok:#2dd4bf;        /* màu trạng thái "OK/Success" */
  --err:#ff6b6b;       /* màu trạng thái lỗi */
  --head-bg:#0f2b5a;   /* nền header của bảng */
  --head-txt:#cfe7ff;  /* chữ header bảng */
  --head-border:#264a85; /* viền dưới header bảng */
}

/* =========================
   KHUNG/PHÔNG CHỮ CƠ BẢN
   ========================= */
html, body {
  height: 100%;                       /* chiếm toàn bộ chiều cao viewport */
  margin: 0;                          /* bỏ margin mặc định */
  overflow: hidden;                   /* khoá scroll trang (nội dung cuộn trong .grid) */
  background:var(--bg);               /* nền chung */
  color:var(--txt);                   /* màu chữ chung */
  font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; /* font fallback */
}
.wrap {
  height: 100vh;                      /* đủ 1 màn hình */
  max-width: 1200px;                  /* bề ngang tối đa */
  margin: 0 auto;                     /* căn giữa theo ngang */
  padding: 20px;                      /* khoảng đệm ngoài */
  display: flex;                      /* dùng flex để chứa .card */
}
.wrap.full { max-width: 100% !important; } /* mở rộng tối đa khi bật chế độ "full" */
.card {
  display: flex;                      /* xếp dọc bên trong */
  flex-direction: column;
  width: 100%;                        /* phủ toàn bộ chiều ngang wrap */
  background:var(--panel);            /* nền panel */
  border:1px solid var(--line);       /* viền panel */
  border-radius:16px;                 /* bo góc */
  padding:16px;                       /* khoảng đệm trong */
}

/* hàng điều khiển phía trên (lọc/tìm kiếm) */
.top{
  display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:10px;
}

/* input & button chung */
input,button{
  background:#111b3a;                 /* nền tối */
  color:#e6edff;                      /* chữ sáng */
  border:1px solid var(--line);       /* viền nhạt */
  border-radius:12px;                 /* bo góc */
  padding:10px 12px;                  /* đệm trong */
  font-size:14px;
  outline:none;                       /* bỏ viền focus mặc định */
}
.grow{ flex:1; min-width:220px }      /* phần tử có thể giãn chiếm chỗ còn lại */
button{
  background:var(--brand);            /* màu nút chính */
  color:#07142a;                      /* chữ đậm để dễ đọc trên nền sáng */
  font-weight:600;
  cursor:pointer;
}
.muted{ color:var(--muted) }          /* chữ mờ cho ghi chú */
h1{ margin:0 0 12px; font-size:26px } /* tiêu đề trang */

/* khung lưới/bảng cuộn được */
.grid{
  flex:1; min-height:0;               /* cho phép con cuộn (trong flex column) */
  overflow:auto;                      /* cuộn nội dung bảng */
  border:1px solid var(--line);       /* viền ngoài */
  border-radius:14px;
  background:var(--panel);
}

/* bảng dữ liệu */
table{
  border-collapse:separate;           /* tách border để dùng border-radius */
  border-spacing:0;
  width:100%;
  min-width:1180px;                   /* tránh co cột quá nhỏ */
}

/* header bảng cố định */
thead th{
  position:sticky; top:0; z-index:5;  /* ghim đầu khi cuộn */
  padding:12px 10px;
  text-align:left;
  text-transform:lowercase;           /* chữ thường để phong cách */
  background:var(--head-bg);
  color:var(--head-txt);
  border-bottom:1px solid var(--head-border);
  box-shadow: 0 1px 0 rgba(0,0,0,.25), 0 0 0 1px rgba(0,0,0,0) inset; /* nhấn nhẹ mép dưới */
}
tbody td{
  padding:10px;
  border-bottom:1px dashed var(--line); /* gạch phân tách hàng */
}
tr:hover td{ background:#0e1731 }     /* hiệu ứng hover hàng */
.right{ text-align:right; white-space:nowrap; } /* căn phải + không xuống dòng */
.empty{ color:var(--muted); text-align:center; padding:16px } /* hàng rỗng */

/* nhãn trạng thái */
.badge{
  display:inline-block; padding:4px 8px; border-radius:999px; font-size:12px;
  border:1px solid #2a3d64; background:#0f1b36; color:#cfe3ff;
}
.badge.ok{   border-color:#1f8f66; background:#0f2c23; color:#9FE870 }  /* thành công */
.badge.wait{ border-color:#8f7a1f; background:#2a240f; color:#facc15 }  /* đang chờ/tiến trình */
.badge.err{  border-color:#8f2a1f; background:#2a0f12; color:#ff6b6b }  /* lỗi/thất bại */

/* hàng nhập/scan mã */
.scan-row{ margin:12px 0 6px; display:flex; gap:10px; align-items:center; }
#scan{
  flex:1; padding:18px 20px; font-size:22px; font-weight:600;
  border:2px solid #2dd4bf; border-radius:14px; background:#0d1a3a; color:#fff; /* làm nổi bật ô scan */
}
#scan::placeholder{ color:#8fffe0; font-size:20px; } /* placeholder dễ nhìn */
#scan:focus{ outline:none; border-color:#5ff3df; box-shadow:0 0 0 2px rgba(45,212,191,.45); } /* trạng thái focus */

/* nút hành động phụ (không phải nút brand) */
.btn-action{
  padding:14px 18px; border-radius:12px; border:1px solid #223a5c; background:#13244a; color:#e6edff;
  font-weight:700; cursor:pointer; white-space:nowrap;
  transition:filter .15s ease, transform .02s ease;             /* hiệu ứng hover/press */
}
.btn-action:hover{ filter:brightness(1.12); box-shadow:0 4px 14px rgba(0,0,0,.25); transform:translateY(-1px); }
.btn-action:active{ transform:translateY(0); }
.btn-action.active{ background:#2dd4bf; color:#07142a; border-color:#1aa795; } /* trạng thái bật */

/* input chọn nhân viên giao hàng */
.emp-input{
  width:100%; min-width:210px; background:#111b3a; color:#e6edff; border:1px solid #223a5c;
  border-radius:10px; padding:8px 10px; outline:none;
}
.emp-input.err{ border-color:#ff6b6b; box-shadow:0 0 0 2px rgba(255,107,107,.25); } /* báo lỗi */

/* nút “Giao hàng” từng dòng */
.btn-ship-row{
  background:#153a21; border:1px solid #1e7f3b; color:#9FE870; font-weight:700;
  border-radius:12px; padding:10px 14px; cursor:pointer; white-space:nowrap;
  transition:filter .15s ease, transform .02s ease;
}
.btn-ship-row:disabled{ opacity:.6; cursor:not-allowed; }
.btn-ship-row:hover{
  filter:brightness(1.12);
  box-shadow: 0 0 0 2px rgba(255,255,255,.06), 0 6px 14px rgba(0,0,0,.25);
  transform: translateY(-1px);
}

/* hàng đang active (được bấm/chọn) */
tr.active-row td{ background:#0b2956 !important; }

/* link phụ “xem” trạng thái */
.link-soft{ color:#b7a7ff; opacity:.9; text-decoration:none; margin-left:8px; font-weight:600; }
.link-soft:hover{ text-decoration:underline; opacity:1; }

/* =========================
   OVERLAY CHI TIẾT ĐƠN
   ========================= */
#detailOverlay{
  position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; z-index:10000;
}
#detailPanel{
  width:min(1100px,94vw); height:min(740px,92vh); background:#0f1830; border:1px solid #223; border-radius:14px;
  display:flex; flex-direction:column; overflow:hidden;
}
#detailHead{
  display:flex; align-items:center; justify-content:space-between; padding:10px 12px; border-bottom:1px solid #223;
}
#detailHead .title{ font-weight:700; color:#a7c3ff }
#detailHead button{ background:#13244a; border:1px solid #20335d; color:#e6edff; border-radius:10px; padding:8px 10px; cursor:pointer; }
#detailClose{ background:#2b354d; }
#detailFrame{ flex:1; border:0; width:100% }

/* =========================
   THANH USER (góc phải)
   ========================= */
#userBar {
  position: fixed; top: 8px; right: 16px; z-index: 2000;
  background: rgba(255,255,255,0.15); padding: 6px 10px; border-radius: 10px;
  display: flex; align-items: center; color: #fff;
}

/* =========================
   CHUÔNG THÔNG BÁO (nút)
   ========================= */
#notifyBell {
  position: fixed; top: 8px; right: 220px;   /* đặt lệch so với userBar */
  background: #fff; border: none; cursor: pointer;
  font-size: 20px; line-height: 1; color: #fbbf24;
  border-radius: 50%; width: 38px; height: 38px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  z-index: 2001;
}
#notifyBell:hover {
  filter: brightness(1.15); transform: scale(1.1); transition: 0.2s; /* hiệu ứng hover */
}

/* checkbox đẹp hơn (màu xanh ngọc) */
#chkAll, .row-chk { accent-color: var(--ok); }

/* =========================
   “ĐƠN HÀNG COD” – hiển thị riêng
   ========================= */
th.col-don-hang, td.col-don-hang { text-align:center; } /* căn giữa cột */
.cod-flag {
  font-weight: 700; text-transform: none; background: transparent; border: 0; padding: 0; color: #22c55e; /* xanh cho COD */
}
.cod-flag a{ color: #22c55e; text-decoration: none; font-weight: 700; }      /* link COD */
.cod-flag a:hover{ text-decoration: underline; }
.cod-none{ color: inherit; opacity: 0.9; }                                    /* style cho không-COD */

/* =========================
   CỤM NGÀY CẬP NHẬT + NÚT
   (bên phải thanh trạng thái)
   ========================= */
#sbState{ gap:10px; display:flex; align-items:center; flex-wrap:wrap; }
#sbState .right-end{ margin-left: auto; display: inline-flex; gap: 10px; align-items: center; } /* đẩy về phải */
#capDate{ min-width:180px; background:#111b3a; border:1px solid var(--line); border-radius:10px; padding:8px 10px; } /* input ngày */
.inline-label{ font-size:14px; opacity:.85; } /* nhãn nhỏ */

/* =========================================================
   CHUÔNG – BADGE SỐ ĐỎ (đếm thông báo chưa đọc)
   ========================================================= */
/* ====== Chuông giữa form, ngang hàng tiêu đề ====== */
:root{
  /* chỉnh nhanh độ cao chuông so với mép trên viewport */
  --bell-top: 30px;    /* thử 28–34px tuỳ layout của bạn */
  --bell-size: 38px;   /* đúng bằng kích thước nút chuông */
  --bell-gap: 8px;     /* khoảng cách giữa chuông và panel */
}

#notifyBell{
  position: fixed !important;
  top: var(--bell-top) !important;       /* ↑ canh ngang hàng h1 */
  left: 50% !important;
  right: auto !important;
  transform: translateX(-50%) !important;
  z-index: 3000 !important;
  display: flex !important;
}

#notifyBell .nbadge{
  position: absolute !important;
  top: -8px !important;
  right: -8px !important;
  display: flex;
}

/* Panel bung ngay dưới chuông và canh giữa */
#notifyPanel{
  position: fixed !important;
  top: calc(var(--bell-top) + var(--bell-size) + var(--bell-gap)) !important;
  left: 50% !important;
  transform: translateX(-50%) !important;
  right: auto !important;
  z-index: 2999 !important;
}

/* (tuỳ chọn) tinh chỉnh trên màn nhỏ nếu tiêu đề cao hơn */
@media (max-width: 640px){
  :root{
    --bell-top: 36px;
  }
}

.t { color:#fbbf24; font-weight:700; }
th.col-trang-thai, td[data-cell="trang_thai"] {
  text-align: center;
}




/* ====== Bố cục để pager co giãn theo ô “Kiểm tra đơn” ====== */

/* Khối thẻ chứa: hiển thị dạng cột để .grid chiếm phần còn lại */
.card{
  display: flex;
  flex-direction: column;
  /* chiều cao tối thiểu để .grid có không gian cuộn; chỉnh nếu cần */
  min-height: 70vh;
}

/* .grid là VÙNG CUỘN chính (scrollbar nằm trong ô) */
.grid{
  flex: 1 1 auto;
  min-height: 0;            /* QUAN TRỌNG cho flex-child được cuộn */
  overflow: auto;           /* cuộn danh sách trong ô */
  /* bo viền/góc tuỳ bạn */
  border: 1px solid #22345c;
  border-radius: 10px;
  background: #0b1426;
}

/* Header bảng vẫn dính đỉnh của vùng cuộn .grid */
.grid thead th{
  position: sticky;
  top: 0;
  z-index: 5;
}

/* ====== PAGER: dính ĐÁY bên trong .grid (không ảnh hưởng bar top) ====== */
/* ===== PAGER nằm trong ô, nền đặc ===== */
#pager{
  position: sticky;
  bottom: 0;
  left: 0; right: 0;
  z-index: 6;

  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;

  /* NỀN ĐẶC giống bar top (không trong suốt nữa) */
  background: #0f1830;              /* cùng màu bar tiêu đề */
  border-top: 1px solid #22345c;
  box-shadow: 0 -6px 14px rgba(0,0,0,.35);

  padding: 10px 16px;
}

/* Nhóm nút trong pager */
#pager > div{ display:flex; align-items:center; gap:10px; }

#pager .btn-action{
  background:#12244a;
  border:1px solid #2a3d6a;
  color:#e6edff;
  padding:8px 12px;
  border-radius:10px;
  font-weight:700;
}

#pgSize{
  height:34px;
  padding:6px 10px;
  background:#0b1220;
  color:#e6edff;
  border:1px solid #2a3d6a;
  border-radius:8px;
}

#pgInfo{ color:#9aa7c7; }
/* ===== Căn giữa ô checkbox trong bảng ===== */
td:first-child, 
th:first-child {
  text-align: center;          /* căn giữa ngang */
  vertical-align: middle;      /* căn giữa dọc */
  width: 48px;                 /* giữ độ rộng hợp lý cho checkbox */
}

td:first-child input[type="checkbox"] {
  display: flex;
  margin: 0 auto;              /* giữa ngang trong ô */
  transform: scale(1.2);       /* phóng to nhẹ cho dễ bấm (tùy chọn) */
  accent-color: var(--ok);     /* màu xanh ngọc cho đồng bộ theme */
}


/* Banner trượt từ trên xuống */
.slide-banner{
  position:fixed; top:-80px; left:50%; transform:translateX(-50%);
  background:#ef4444; color:#fff;
  padding:12px 20px; border-radius:0 0 12px 12px;
  box-shadow:0 4px 12px rgba(0,0,0,.3);
  font-weight:600; font-size:15px; letter-spacing:.3px;
  transition:top .35s ease-in-out; z-index:9999;
}
.slide-banner.ok{ background:#10b981; }
.slide-banner.show{ top:0; }
</style>

<style>
  body{
    visibility:hidden;
  }

  body.ready{
    visibility:visible;
  }

  #userBar{
    position:fixed; top:8px; right:16px;
    display:flex; align-items:center; gap:10px; z-index:2000;
    background:transparent;
  }
  #userBar .name{
    max-width:220px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  #notifyBell{
    background:none;
    border:0;
    cursor:pointer;
    font-size:18px;
    line-height:1;
    color:#fbbf24;
  }
  #notifyBell:hover{ filter:brightness(1.1); }

  #notifyPanel{
    position:fixed;
    top:40px;
    right:16px;
    width:280px;
    display:none;
    overflow:hidden;
    z-index:2001;
    background:#0f1830;
    color:#e6edff;
    border:1px solid #2a3d6a;
    border-radius:12px;
    box-shadow:0 8px 30px rgba(0,0,0,.45);
  }
  #notifyPanel .np-head{
    padding:10px 12px;
    font-weight:700;
    border-bottom:1px solid #22345c;
    background:#11214a;
  }
  #notifyPanel .np-body{
    max-height:50vh;
    overflow:auto;
  }
  #notifyPanel .np-item{
    padding:10px 12px;
    border-bottom:1px dashed #20345e;
    font-size:14px;
  }
  #notifyPanel .np-item time{
    display:block;
    font-size:12px;
    color:#9aa7c7;
    margin-top:4px;
  }
  #notifyPanel .np-empty{
    padding:14px;
    color:#9aa7c7;
    font-size:14px;
    text-align:center;
  }

  th.col-don-hang, td.col-don-hang{
    width:180px;
    max-width:260px;
  }
  th.col-nv-xn, td.col-nv-xn,
  th.col-nv-gl, td.col-nv-gl{
    width:120px;
    max-width:120px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  th.col-ngay-dh, td.col-ngay-dh{
    width:140px;
    max-width:140px;
    white-space:nowrap;
  }

  .inline-label{
    font-size:14px;
    opacity:.85;
  }

  #sbState{
    gap:10px;
  }

  #capDate{ min-width:180px; }
  #btnCapNhatDon{ white-space:nowrap; }

  #pager .btn-action{ padding:8px 12px; }

  #pgSize{
    padding:6px 10px;
    background:#0b1220;
    color:#e6edff;
    border:1px solid #2a3d6a;
    border-radius:8px;
  }

  .grid table{
    table-layout:fixed;
  }

  #tbody{
    transition:opacity .12s ease;
  }

  #tbody tr{
    transition:opacity .12s ease;
  }
</style>
</head>
<body>
<div id="slideBanner" class="slide-banner"></div>

<button id="notifyBell" title="Thông báo" aria-label="Thông báo">🔔</button>

<div id="userBar" class="ub">
  <button id="userToggle" class="ub-toggle" type="button">
    <span class="ub-ico">👤</span>
    <span id="userName"></span>
  </button>

  <div id="userMenu" class="ub-menu" hidden>
    <button id="actLogout" class="ub-item" type="button">Đăng xuất</button>
  </div>
</div>

<div id="notifyPanel" role="dialog" aria-hidden="true">
  <div class="np-head">Thông báo</div>
  <div class="np-body" id="notifyList">
    <div class="np-empty">Chưa có thông báo.</div>
  </div>
</div>

<div class="wrap">
  <div class="card">
    <h1>Kiểm tra đơn hàng</h1>

    <div class="scan-row">
      <input id="scan" placeholder="Quét mã hóa đơn/mã vận đơn" />
      <button id="btnCheck" class="btn-action">Check đơn hàng</button>
      <button id="btnPrepTop" class="btn-action">Chuẩn bị đơn</button>
    </div>
    <div id="scanMsg" class="state muted" style="margin-top:6px;"></div>

    <div class="top">
      <input id="q" class="grow" placeholder="Nhập ma_hd / tên KH…" />
      <input id="from" class="grow" placeholder="Từ ngày (dd-mm-yyyy hoặc yyyy-mm-dd)" />
      <input id="to" class="grow" placeholder="Đến ngày (dd-mm-yyyy hoặc yyyy-mm-dd)" />
      <button id="btnReload">⟳ Tải lại</button>
      <button id="btnExpand" title="Mở rộng/thu gọn vùng làm việc">↔ Mở rộng</button>
    </div>

    <div class="muted">Bảng: <b id="tblName">don_hang</b> — hiển thị <b>dd-mm-yyyy</b></div>

    <div class="state muted" id="sbState" style="display:flex;align-items:center;flex-wrap:wrap">
      Supabase: <b id="sbMsg" class="muted" style="margin:0 8px;">đang tải…</b>

      <button id="btnFilterChecked" class="btn-action" title="Chỉ hiển thị các đơn đã chọn">Lọc đã chọn</button>
      <span id="selCount" class="badge" style="margin-left:8px">Đã chọn: <b id="chkCount">0</b></span>
      <button id="btnViewRoute" class="btn" type="button">Xem bản đồ tuyến</button>

      <label class="inline-label" for="filterTrangThai">Trạng thái:</label>
      <select id="filterTrangThai" title="Lọc theo cột trạng_thái">
        <option value="">Tất cả</option>
        <option value="da chuyen hoan">Đã chuyển hoàn</option>
        <option value="da kiem don">Đã kiểm đơn</option>
        <option value="dang giao hang">Đang giao hàng</option>
        <option value="giao thanh cong">Giao thành công</option>
      </select>

      <span class="right-end">

/* ===== Định dạng ngày/giờ AN TOÀN (local time) ===== */
function parseToLocalDate(v){
  if (!v) return null;
  if (v instanceof Date && !isNaN(v)) return v;
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);              // yyyy-mm-dd
  if (m) return new Date(+m[1], +m[2]-1, +m[3], 0, 0, 0);
  m = s.match(/^(\d{2})[-\/](\d{2})[-\/](\d{4})$/);          // dd-mm-yyyy hoặc dd/mm/yyyy
  if (m) return new Date(+m[3], +m[2]-1, +m[1], 0, 0, 0);
  const d = new Date(s);                                     // ISO có time/offset
  return isNaN(d) ? null : d;
}
function fmtDateHTML(v){
  const d = parseToLocalDate(v); if (!d) return '';
  const p = n => String(n).padStart(2,'0');
  const date = `${p(d.getDate())}-${p(d.getMonth()+1)}-${d.getFullYear()}`;
  const time = `${p(d.getHours())}:${p(d.getMinutes())}`;
  return `${date} <span class="t">${time}</span>`;
}
function toISOStart(str){
  if(!str) return null; let y,m,d;
  if(/^\d{2}-\d{2}-\d{4}$/.test(str)){[d,m,y]=str.split('-').map(Number);}
  else if(/^\d{4}-\d{2}-\d{2}$/.test(str)){[y,m,d]=str.split('-').map(Number);}
  else return null;
  return new Date(y,m-1,d,0,0,0).toISOString();
}
function toISONextStart(str){
  if(!str) return null; let y,m,d;
  if(/^\d{2}-\d{2}-\d{4}$/.test(str)){[d,m,y]=str.split('-').map(Number);}
  else if(/^\d{4}-\d{2}-\d{2}$/.test(str)){[y,m,d]=str.split('-').map(Number);}
  else return null;
  return new Date(y,m-1,d+1,0,0,0).toISOString();
}
function toYMD(str){
  if (!str) return null;
  const m = String(str).trim().match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
  if (!m) return null;
  const [, d, mo, y] = m;
  const dd = +d, mm = +mo;
  if (mm < 1 || mm > 12 || dd < 1 || dd > 31) return null;
  const p = n => String(n).padStart(2,'0');
  return `${y}-${p(mm)}-${p(dd)}`;
}
function isoToVN(ymd){
  if(!ymd) return '';
  const m = ymd.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m) return ymd;
  return `${m[3]}-${m[2]}-${m[1]}`;
}

/* ====== helper ngày ====== */
function todayYMD() {
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function getCapDateISO(){
  const el = document.getElementById('capDate');
  if (!el) return todayYMD();

  let v = (el.value || '').trim();

  if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;

  const m = v.match(/^(\d{2})[-\/](\d{2})[-\/](\d{4})$/);
  if (m) {
    const [, d, mo, y] = m;
    const ymd = `${y}-${mo}-${d}`;
    el.value = ymd; // đồng bộ lại input
    return ymd;
  }

  const ymd = todayYMD();
  el.value = ymd;
  return ymd;
}

/* ================== NHÂN VIÊN (chọn NV giao) ================== */
let EMPLOYEES=[]; 
let LAST_ACTIVE_TR=null;

/* Bỏ dấu tiếng Việt để so khớp tên linh hoạt */
function vnFold(s){
  return String(s||'').normalize('NFD').replace(/\p{Diacritic}/gu,'').toLowerCase().trim();
}

/* ===== Chỉ mục nhân viên: tra nhanh theo ID hoặc tên (không dấu) ===== */
let EMP_BY_ID   = new Map();   // "216939" -> {id, ten_nv, sender_id}
let EMP_BY_NAME = new Map();   // "phong be" -> {id, ten_nv, sender_id}

function buildEmpIndex(){
  EMP_BY_ID.clear(); EMP_BY_NAME.clear();
  for (const e of (EMPLOYEES||[])) {
    if (!e) continue;
    const idStr = String(e.id ?? '').trim();
    if (idStr) EMP_BY_ID.set(idStr, e);
    const nameKey = vnFold(e.ten_nv);
    if (nameKey) EMP_BY_NAME.set(nameKey, e);
  }
}

/* Tìm NV theo nội dung gõ trong ô:
   - Nếu toàn số -> coi là ID
   - Ngược lại -> coi là TÊN (không dấu, không phân biệt hoa/thường)
*/
function findEmpByInput(inputVal){
  const v = String(inputVal || '').trim();
  if (!v) return null;

  if (/^\d+$/.test(v)) return EMP_BY_ID.get(v) || null; // gõ ID

  const key = vnFold(v); // gõ tên
  let emp = EMP_BY_NAME.get(key);
  if (emp) return emp;
  for (const [k, e] of EMP_BY_NAME.entries()){ // bắt đầu bằng...
    if (k.startsWith(key)) return e;
  }
  return null;
}

async function checkAndOpenByScan(code){
  try{
    setScanMsg('ok','Đang kiểm tra…');

    const urlMatch = String(code).match(/[?&]ma_hd=([^&#]+)/i);
    if (urlMatch) code = decodeURIComponent(urlMatch[1]);

    // 1) Ưu tiên ma_hd
    let { data } = await supa.from(TABLE).select('ma_hd').eq('ma_hd', code).maybeSingle();

    // 2) fallback ma_vd
    if (!data || !data.ma_hd) {
      const alt = await supa.from(TABLE)
        .select('ma_hd, ma_vd')
        .eq('ma_vd', code)
        .maybeSingle();
      if (alt.data && alt.data.ma_hd) {
        data = { ma_hd: alt.data.ma_hd };
      } else {
        showSlideBanner('❌ Không tìm thấy mã hóa đơn / mã vận đơn: ' + esc(code), 'err');
        setScanMsg('err','Không tìm thấy');
        return;
      }
    }

    const tenNV = getCurrentNVName();
    const qs = new URLSearchParams({ ma_hd: data.ma_hd });

    const { data: detail } = await supa.from(TABLE)
      .select('trang_thai')

/* ================== WEBHOOK HELPER ================== */
function getWebhookUrl(){
  try {
    // 1) Ưu tiên cấu hình server trả từ /api/getConfig
    const fromApi = String(
      APP_CONFIG?.webhook ||
      APP_CONFIG?.WEBHOOK_URL ||
      APP_CONFIG?.webhook_url ||
      window.APP_WEBHOOK_URL ||
      ''
    ).trim();
    if (fromApi) return fromApi.replace(/\/+$/, '');

    // 2) Dùng URL dự phòng đã xác nhận
    if (FALLBACK_WEBHOOK_URL) return FALLBACK_WEBHOOK_URL.replace(/\/+$/, '');

    // 3) Fallback cuối cho cấu hình cũ
    const legacy = String((window.getConfig && window.getConfig('webhook')) || '').trim();
    return legacy.replace(/\/+$/, '');
  } catch (e) {
    console.error('[WEBHOOK] getWebhookUrl error:', e);
    return FALLBACK_WEBHOOK_URL;
  }
}
function getOrderInfoFromRow(tr){
  if (!tr) return { ma_hd:'', ten_kh:'', dia_chi:'' };
  const ma_hd  = String(tr.getAttribute('data-ma') || '').trim();
  const ten_kh = (tr.querySelector('[data-cell="ten_kh"]')?.textContent || '').trim();
  const dia_chi = String(tr.getAttribute('data-diachi') || '').trim();
  return { ma_hd, ten_kh, dia_chi };
}

/**
 * Gửi webhook giao hàng DIGIAOHANG.
 * YÊU CẦU: url webhook; có ma_nv, ma_hd, ten_kh, sender_id; dia_chi optional
 * @returns {Promise<boolean>} true nếu gửi OK, false nếu lỗi
 */
async function sendGiaohangWebhook({ ma_nv, ma_hd, ten_kh, sender_id, dia_chi }) {
  const url = getWebhookUrl();
  if (!url) { showSlideBanner('❌ Thiếu webhook', 'err'); return false; }
  if (!ma_hd) { showSlideBanner('❌ Thiếu mã hóa đơn (ma_hd)', 'err'); return false; }
  if (!ma_nv) { showSlideBanner('❌ Thiếu mã nhân viên (ma_nv)', 'err'); return false; }
  if (!sender_id) { showSlideBanner('⚠️ Nhân viên chưa đăng ký gửi tin (thiếu sender_id)', 'err'); return false; }

  try {
    const payload = {
      action: 'digiaohang',
      ma_nv: String(ma_nv),
      ma_hd: String(ma_hd),
      ten_kh: String(ten_kh || ''),
      sender_id: String(sender_id),
      dia_chi: String(dia_chi || '')
    };

    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    if (!res.ok) {
      const t = await res.text().catch(() => '');
      showSlideBanner('❌ Gửi tin thất bại: ' + (t || res.status), 'err');
      return false;
    }

    showSlideBanner('✅ Đã gửi tin nhắn giao hàng (digiaohang)', 'ok');
    try {
      if (typeof pushNotify === 'function') {
        const kh = ten_kh ? ` • KH: <i>${esc(ten_kh)}</i>` : '';
        const dc = dia_chi ? ` • ĐC: <i>${esc(dia_chi)}</i>` : '';
        pushNotify(`✉️ digiaohang • Đơn <b>${esc(String(ma_hd))}</b> • NV <i>${esc(String(ma_nv))}</i>${kh}${dc}`);
      }
    } catch {}
    return true;
  } catch (e) {
    showSlideBanner('❌ Lỗi kết nối webhook', 'err');
    return false;
  }
}

/* ================== TRẠNG THÁI + NÚT "ĐÃ GIAO" ================== */
function renderStatusCell(ma, val){
  const raw = (val || '').toString().trim();
  const low = raw.toLowerCase();
  const label = raw || '—';

  const cls = low.includes('chuẩn bị') ? 'wait'
           : low.includes('đang giao hàng') ? 'ok'
           : (low.includes('thành công')||low.includes('đã giao')||low==='done') ? 'ok'
           : (low.includes('chờ')||low.includes('đang')) ? 'wait'
           : (low.includes('hủy')||low.includes('huỷ')||low.includes('fail')) ? 'err' : '';

  const shouldShowBtn = (vnFold(raw) === vnFold('Đã kiểm đơn'));

  const btn = shouldShowBtn
    ? ` <button class="btn-da-giao" data-ma="${esc(ma)}" title="Cập nhật sang Giao thành công">Đã giao</button>`
    : '';

  return `<span class="badge ${cls}">${esc(label)}</span>${btn}`;
}

/**
 * Đánh dấu đơn "Giao thành công"
 * - cập nhật DB
 * - cập nhật ngay UI (không reload) qua updateRowFromRecord
 * - ẩn nút "Đã giao"
 */
async function markDaGiao(ma_hd, btnEl){
  if (!supa){ showSlideBanner('❌ Supabase chưa khởi tạo', 'err'); return; }
  const nv_id = getCurrentNVID();
  if (!nv_id){ showSlideBanner('⚠️ Thiếu mã NV đăng nhập (ma_nv)', 'err'); return; }
  if (!ma_hd){ showSlideBanner('❌ Thiếu mã hóa đơn', 'err'); return; }

  const patch = {
    trang_thai: 'Giao thành công',
    ngay_giao_thanh_cong: new Date().toISOString(),
    nv_giao_hang: nv_id
  };

  const oldTxt = btnEl?.textContent;
  if (btnEl){ btnEl.disabled = true; btnEl.textContent = 'Đang cập nhật…'; }

  try{
    const { data, error } = await supa
      .from(TABLE)
      .update(patch)
      .eq('ma_hd', ma_hd)
      .select('*')
      .maybeSingle();

    if (error) throw error;
    if (!data) throw new Error('Không nhận được bản ghi sau cập nhật');

    updateRowFromRecord(data);
    if (btnEl){ btnEl.style.display = 'none'; }

    showSlideBanner('✅ Đã cập nhật: Giao thành công', 'ok');
    try{
      if (typeof pushNotify === 'function'){
        pushNotify(`✅ Đơn <b>${esc(ma_hd)}</b> → <i>Giao thành công</i> • NV: <b>${esc(nv_id)}</b>`);
      }
    }catch{}
  }catch(e){
    showSlideBanner('❌ Lỗi cập nhật: ' + esc(e.message||e), 'err');
    if (btnEl){ btnEl.disabled = false; btnEl.textContent = oldTxt || 'Đã giao'; }
  }
}

/* ================== BẢNG & HÀNH ĐỘNG ================== */
function bindTableActions(){
  const tb = document.getElementById('tbody');

  tb?.addEventListener('change', (e)=>{
    const cb = e.target.closest?.('.row-chk');
    if(!cb) return;
    const tr = cb.closest('tr[data-ma]'); if(!tr) return;
    const ma = tr.dataset.ma;
    if(cb.checked){ SELECTED.add(ma); tr.classList.add('is-selected'); }
    else{ SELECTED.delete(ma); tr.classList.remove('is-selected'); }
    saveSelected();
    updateCheckedCount();
    syncHeaderCheckbox();
    if(FILTER_CHECKED && !cb.checked){ 
      tr.style.display='none'; 
      updateCheckedCount(); syncHeaderCheckbox(); 
    }
  });

  tb?.addEventListener('click', (e)=>{
    const tr=e.target.closest?.('tr[data-ma]'); if(!tr) return;
    if(LAST_ACTIVE_TR) LAST_ACTIVE_TR.classList.remove('active-row');
    tr.classList.add('active-row'); LAST_ACTIVE_TR=tr;
  });

  // ====== Click nút "Đã giao" ======
  tb?.addEventListener('click', async (e)=>{
    const doneBtn = e.target.closest?.('.btn-da-giao');
    if (doneBtn){
      const tr = doneBtn.closest('tr[data-ma]');
      if(!tr){ showSlideBanner('❌ Không xác định được dòng', 'err'); return; }
      const ma = (tr.getAttribute('data-ma') || '').trim();
      if (!ma){ showSlideBanner('❌ Thiếu mã hóa đơn', 'err'); return; }
      await markDaGiao(ma, doneBtn);
      return;
    }

    // ====== GỬI TIN từng dòng → webhook action="digiaohang" ======
    const btn = e.target.closest?.('.btn-send-row');
    if(!btn) return;

    const tr = btn.closest('tr[data-ma]');
    if(!tr){ showSlideBanner('❌ Không xác định được dòng', 'err'); return; }

    const { ma_hd, ten_kh, dia_chi } = getOrderInfoFromRow(tr);
    if(!ma_hd){ showSlideBanner('❌ Thiếu mã hóa đơn', 'err'); return; }

    const inp = tr.querySelector('.emp-input');
    const emp = findEmpByInput(inp?.value || '');
    if (!emp){
      showSlideBanner('⚠️ Vui lòng chọn nhân viên giao hàng (gõ tên/ID)', 'err');
      inp?.focus();
      return;
    }
    if (!emp.sender_id){
      showSlideBanner('⚠️ Nhân viên chưa đăng ký gửi tin (thiếu sender_id)', 'err');
      return;
    }

    const old = btn.textContent;
    btn.disabled = true; btn.textContent = 'Đang gửi…';
    await sendGiaohangWebhook({
      ma_nv: String(emp.id),
      ma_hd,
      ten_kh,
      sender_id: String(emp.sender_id),
      dia_chi
    });
    btn.disabled = false; btn.textContent = old || 'Gửi tin';
  });
}

/* ======= Header checkbox & đếm theo dòng đang HIỂN THỊ ======= */
function getVisibleRows(){
  return [...document.querySelectorAll('#tbody tr[data-ma]')].filter(tr=>getComputedStyle(tr).display!=='none');
}
function syncHeaderCheckbox(){
  const head = document.getElementById('chkAll');
  if(!head) return;
  const rows = getVisibleRows();
  const all = rows.map(tr=>tr.querySelector('.row-chk')).filter(Boolean);
  const checked = all.filter(cb=>cb.checked);
  head.indeterminate = checked.length>0 && checked.length<all.length;
  head.checked = all.length>0 && checked.length===all.length;
}
function bindHeaderSelectAll(){
  const head = document.getElementById('chkAll');
  if(!head) return;
  head.addEventListener('change', ()=>{
    const rows = getVisibleRows();
    rows.forEach(tr=>{
      const ma = tr.dataset.ma;
      const cb = tr.querySelector('.row-chk');
      if(!cb) return;
      cb.checked = head.checked;
      if(head.checked){ SELECTED.add(ma); tr.classList.add('is-selected'); }
      else{ SELECTED.delete(ma); tr.classList.remove('is-selected'); }
    });
    saveSelected();
    updateCheckedCount();
    syncHeaderCheckbox();
  });
}
function updateCheckedCount(){
  const el = document.getElementById('chkCount');
  if (!el) return;
  const count = getVisibleRows().filter(tr => tr.querySelector('.row-chk')?.checked).length;
  el.textContent = String(count);
}

/* ================== XEM BẢN ĐỒ TUYẾN (overlay) ================== */
function getCheckedOrderIds() {
  const rows = [...document.querySelectorAll('#tbody tr[data-ma] .row-chk:checked')]
    .map(cb => cb.closest('tr[data-ma]'))
    .filter(tr => tr && getComputedStyle(tr).display !== 'none');

  const seen = new Set(); const out = [];
  for (const tr of rows) {
    const ma = (tr.dataset.ma || '').trim();
    if (ma && !seen.has(ma)) { seen.add(ma); out.push(ma); }
  }
  return out;
}

function getCheckedCustomerIdsFromDOM(){
  const rows = [...document.querySelectorAll('#tbody tr[data-ma] .row-chk:checked')]
    .map(cb => cb.closest('tr[data-ma]'))
    .filter(tr => tr && getComputedStyle(tr).display !== 'none');

  const seen = new Set(); const ids = [];
  for (const tr of rows){
    const kh = (tr.getAttribute('data-kh') || '').trim();
    if (kh && !seen.has(kh)){ seen.add(kh); ids.push(kh); }
  }
  return ids;
}

  try { showSlideBanner(`🔎 Thu được ${total} mã KH: ${short}${more}`, 'ok'); } catch {}
  try { 
    if (typeof pushNotify === 'function'){
      pushNotify(`📍 Đã thu <b>${total}</b> mã KH:<br><pre style="white-space:pre-wrap;margin:6px 0 0">${ids.join(' ')}</pre>`);
    } 
  } catch {}
}

async function openMapOverlayInjected(maList){
  const ids = (Array.isArray(maList)?maList:[])
    .map(s=>String(s||'').trim()).filter(Boolean);
  if (!ids.length){ alert('Không có mã khách.'); return; }

  const q = 'ma: ' + ids.join(' ');

  const ov=document.getElementById('detailOverlay');
  const fr=document.getElementById('detailFrame');
  if(!ov || !fr){ alert('Thiếu overlay/frame (#detailOverlay, #detailFrame).'); return; }

  const target = new URL('map_tuyen.html', location.href);
  target.searchParams.set('no_logo', '1');
  target.searchParams.set('q', q); // truyền q qua URL để chắc chắn

  let token = '';
  try { token = sessionStorage.getItem('APP_ACCESS') || ''; } catch {}
  if (!token && typeof window.makeAccess === 'function') {
    try { token = window.makeAccess(); } catch {}
  }
  if (token) target.searchParams.set('token', token);

  fr.removeAttribute('src');
  ov.style.display='flex';

  const inject = ()=>{
    try{
      const doc = fr.contentWindow?.document;
      if (!doc) return false;
      const input = doc.getElementById('q') || doc.querySelector('input[name="q"]');
      if (!input) return false;
      input.value = q;
      input.dispatchEvent(new Event('input', { bubbles:true }));
      return true;
    }catch(_){ return false; }
  };

  fr.onload = ()=>{
    if (inject()) return;
    let n=0, max=20;
    const iv = setInterval(()=>{ if (inject() || ++n>=max) clearInterval(iv); }, 150);
  };

  fr.src = target.toString();

  previewMAKH(ids);
  try { showSlideBanner('🗺️ Đang mở bản đồ tuyến (overlay)…', 'ok'); } catch {}
  try { if (typeof pushNotify==='function') pushNotify('🗺️ Mở map (overlay) với truy vấn: <code>'+q.replace(/</g,'&lt;')+'</code>'); } catch {}
}

async function handleViewRouteOverlay(){
  try{
    let ids = getCheckedCustomerIdsFromDOM();

    if (!ids.length){
      const selHD = getCheckedOrderIds();
      if (!selHD.length){ alert('⚠️ Chưa chọn đơn nào!'); return; }
      if (!supa) throw new Error('Supabase chưa khởi tạo');

      const { data, error } = await supa
        .from('don_hang')
        .select('ma_hd, ma_kh')
        .in('ma_hd', selHD);
      if (error) throw error;

      const seen = new Set(); ids = [];
      for (const r of (data || [])){
        const v = (r.ma_kh || '').trim();
        if (v && !seen.has(v)){ seen.add(v); ids.push(v); }
      }
    }

    if (!ids.length){
      alert('⚠️ Các dòng đã chọn không có ma_kh. Vui lòng kiểm tra dữ liệu.');
      try { showSlideBanner('⚠️ Không có ma_kh để mở bản đồ', 'err'); } catch {}
      return;
    }

    await openMapOverlayInjected(ids);

  }catch(e){
    console.error(e);
    alert('❌ Lỗi khi mở bản đồ tuyến (overlay): ' + (e.message || e));
  }
}
function bindViewRouteButton(){
  const btn = document.getElementById('btnViewRoute');
  if(!btn) return;
  btn.addEventListener('click', (e)=>{

async function fetchDistinctStatuses(qtxt, from, to){
  let q = supa.from(TABLE).select('trang_thai');
  if(qtxt) q = q.or(`ma_hd.ilike.%${qtxt}%,ten_kh.ilike.%${qtxt}%`);
  const lo=toISOStart(from), hi=toISONextStart(to);
  if(lo) q=q.gte('ngay',lo);
  if(hi) q=q.lt('ngay',hi);
  if (FILTER_COD === 'true') q = q.eq('don_hang', true);
  else if (FILTER_COD === 'false') q = q.or('don_hang.eq.false,don_hang.is.null');
  const { data } = await q;
  const set = new Set((data||[]).map(r => (r.trang_thai||'').toString().trim()).filter(Boolean));
  return [...set];
}

/* ================== TẢI DỮ LIỆU & RENDER ================== */
async function reload(){
  const tb=document.getElementById('tbody');
  if(!supa){ if(tb) tb.innerHTML='<tr><td colspan="11" class="empty">Chưa khởi tạo.</td></tr>'; return; }

  const qtxt=(document.getElementById('q')?.value||'').replace(/[%]/g,'').trim();
  const from=document.getElementById('from')?.value.trim()||'';
  const to=document.getElementById('to')?.value.trim()||'';

  if(tb) tb.innerHTML='<tr><td colspan="11" class="empty">Đang tải…</td></tr>';

  let q = supa.from(TABLE).select('*', { count: 'exact' });

  if(qtxt) q=q.or(`ma_hd.ilike.%${qtxt}%,ten_kh.ilike.%${qtxt}%`);

  const lo=toISOStart(from), hi=toISONextStart(to);
  if(lo) q=q.gte('ngay',lo);
  if(hi) q=q.lt('ngay',hi);

  if (FILTER_COD === 'true') {
    q = q.eq('don_hang', true);
  } else if (FILTER_COD === 'false') {
    q = q.or('don_hang.eq.false,don_hang.is.null');
  }

  if (FILTER_STATUS) {
    q = q.ilike('trang_thai', `%${FILTER_STATUS}%`);
  }

  q = q.order('ngay',{ascending:false});

  const { from: rFrom, to: rTo } = getPageRange();

  let data, count;
  try{
    const res = await q.range(rFrom, rTo).throwOnError();
    data  = res.data || [];
    count = res.count ?? 0;
    setTotalCount(count);
    setState(true,'sẵn sàng');
  }catch(err){
    setState(false,'lỗi');
    if(tb) tb.innerHTML=`<tr><td colspan="11" class="empty">Lỗi: ${esc(err.message||err)}</td></tr>`;
    return;
  }

  const distinctStatuses = await fetchDistinctStatuses(qtxt, from, to);
  renderStatusFilterOptions(distinctStatuses);

  if (!data.length){
    if(tb) tb.innerHTML='<tr><td colspan="11" class="empty">Không có dữ liệu.</td></tr>';
    applyFilterChecked();
    updateCheckedCount();
    syncHeaderCheckbox();
    return;
  }

  if (tb) tb.innerHTML = data.map(r=>{
    const maRaw = r.ma_hd || '';
    const ma = esc(maRaw);
    const checked = SELECTED.has(maRaw) ? 'checked' : '';
    const selCls  = checked ? ' is-selected' : '';

    return `
      <tr class="${selCls}" data-ma="${maRaw}" data-kh="${esc(r.ma_kh||'')}"
          data-xacnhan="${esc(r.nv_check_don||'')}"
          data-dong="${esc(r.nv_dong_hang||'')}"
          data-prepdate="${esc(r.ngay_chuan_bi_don||'')}"
          data-dongdate="${esc(r.ngay_dong_hang||'')}"
          data-giaothanhcong="${esc(r.ngay_giao_thanh_cong||'')}"
          data-nv_giaohang="${esc(r.nv_giao_hang||'')}"
          data-diachi="${esc(r.dia_chi || r.diachi || '')}">
        <td class="sel"><input type="checkbox" class="row-chk" ${checked} /></td>
        <td data-cell="ma_hd">${ma}</td>
        <td class="col-don-hang" data-cell="don_hang" style="text-align:center">${renderDonHangCell(r.don_hang, maRaw)}</td>
        <td data-cell="ngay">${fmtDateHTML(r.ngay)}</td>
        <td data-cell="ten_kh">${esc(r.ten_kh||'')}</td>
        <td data-cell="tong_tien" class="right">${r.tong_tien!=null ? Number(r.tong_tien).toLocaleString('vi-VN') : ''}</td>
        <td data-cell="trang_thai">${renderStatusCell(maRaw, r.trang_thai)}</td>

        <td data-cell="ngay_xn" class="col-ngay-xn" style="min-width:180px;white-space:nowrap">
          ${fmtDateHTML(r.ngay_check_don)}
        </td>

        <td data-cell="nv_xn" class="col-nv-xn">${esc(r.nv_check_don||'')}</td>

        <td data-cell="nv_dong" class="col-nv-dh">
          <input class="emp-input" list="empList" data-ma="${ma}"
                 style="min-width:160px"
                 placeholder="— chọn / tìm NV —" value="${esc(r.nv_dong_hang||'')}">
        </td>

        <td data-cell="btn_send">
          ${!r.ngay_dong_hang ? `<button class="btn-send-row" data-ma="${ma}">Gửi tin</button>` : ''}
        </td>
      </tr>`;
  }).join('');

  applyFilterChecked();
  updateCheckedCount();
  syncHeaderCheckbox();
}

/* ================== KHỞI TẠO ================== */
async function init(){
  if (!__ACCESS_OK__) return;
  try{
    const nameCell = document.getElementById('tblName'); if(nameCell) nameCell.textContent = TABLE;

    if (!window.supabase || !window.supabase.createClient) {
      setState(false, 'Thiếu supabase-js (chưa load script @supabase/supabase-js@2 trước file app)');
      console.error('[INIT] supabase-js not found');
      return;
    }

    const INTERNAL_KEY = (typeof window.getInternalKey==='function') ? window.getInternalKey() : '';
    const base = (window.API_BASE || '').replace(/\/+$/,'');
    const cfgUrl = base ? `${base}/api/getConfig` : '/api/getConfig';
    const r = await fetch(cfgUrl, { headers: { 'x-internal-key': INTERNAL_KEY } });
    if(!r.ok){
      setState(false, `Không lấy được config (${r.status})`);
      console.error('[INIT] getConfig failed', r.status, await r.text().catch(()=>'')); 
      return;
    }
    const cfg = await r.json().catch(()=> ({}));

    // Lưu toàn bộ config runtime để các chức năng khác (đặc biệt webhook) dùng chung.
    APP_CONFIG = (cfg && typeof cfg === 'object') ? cfg : {};
    window.APP_CONFIG = APP_CONFIG;
    window.APP_WEBHOOK_URL = String(
      APP_CONFIG.webhook ||
      APP_CONFIG.WEBHOOK_URL ||
      APP_CONFIG.webhook_url ||
      ''
    ).trim();

    console.log('[INIT] webhook runtime =', getWebhookUrl());

    const { url, anon } = APP_CONFIG;
    if(!url || !anon){
      setState(false, 'Thiếu url/anon trong config');
      console.error('[INIT] Invalid config', cfg);
      return;
    }
    supa = window.supabase.createClient(url, anon);
    window.supa = supa;
    setState(true,'sẵn sàng');
  }catch(e){
    setState(false, esc(e.message||e));
    console.error('[INIT] exception', e);
    return;
  }

  // Tiêm CSS cho nút "Đã giao"
  (function injectDoneBtnCSS(){
    if (document.getElementById('btnDaGiaoStyle')) return;
    const style = document.createElement('style');
    style.id = 'btnDaGiaoStyle';
    style.textContent = `
      .btn-da-giao{
        background:#10b981; color:#fff; border:none;
        padding:6px 10px; border-radius:8px; font-weight:600; cursor:pointer;
      }
      .btn-da-giao:disabled{ opacity:.6; cursor:default; }
    `;
    document.head.appendChild(style);
  })();

  const capEl = document.getElementById('capDate');
  if (capEl && !capEl.value) capEl.value = todayYMD();
  setDefaultDateFilters();

  loadSelected(); loadFilterState(); loadStatusFilter();

  applyExpandState(); bindExpandButton(); showUserBar();
  bindPager();
  await loadEmployees(); buildEmpIndex(); renderEmpDatalist();
  bindScanAndButtons(); bindOverlayControls();
  bindTableActions(); bindHeaderSelectAll();
  bindFilterCheckedOnly(); bindViewRouteButton();

  applyFilterChecked(); updateCheckedCount();
  await reload();
}
// init() sẽ được gọi sau khi checkLogin() thành công trong HTML.

/* ========== SUPABASE REALTIME + THÔNG BÁO CHUÔNG ========== */
(function(){
  if (window.__DON_HANG_RT__) return;
  window.__DON_HANG_RT__ = true;

  (function injectNotifyStyles(){
    if (document.getElementById('notifyPatch')) return;
    const css = `
      #notifyBell{ position:relative; }
      #notifyBell::after{
        content: attr(data-count);
        position:absolute; top:-6px; right:-6px;
        min-width:18px; height:18px; padding:0 6px;
        border-radius:999px; background:#ef4444; color:#fff;
        font-weight:700; font-size:11px; line-height:18px; text-align:center;
        box-shadow:0 0 0 2px rgba(255,255,255,.9);
        opacity:0; transform:scale(.6);
        transition:opacity .15s ease, transform .15s ease;
      }
      #notifyBell[data-count="0"]::after{ opacity:0; transform:scale(.6); }
      #notifyBell:not([data-count="0"])::after{ opacity:1; transform:scale(1); }

      #notifyPanel{
        background:#ffffff !important; color:#111827 !important;
        border:1px solid #e5e7eb !important; border-radius:12px !important;
        box-shadow:0 12px 28px rgba(0,0,0,.18) !important;
        width:300px !important;
      }
      #notifyPanel .np-head{
        background:#f9fafb !important; color:#111827 !important;
        border-bottom:1px solid #e5e7eb !important;
        font-weight:700; letter-spacing:.2px;
      }
      #notifyPanel .np-body{ max-height:55vh !important; }
      #notifyPanel .np-item{
        padding:10px 12px !important; border-bottom:1px dashed #e5e7eb !important;
        display:flex; flex-direction:column; gap:4px;
      }
      #notifyPanel .np-item:last-child{ border-bottom:none !important; }
      #notifyPanel .np-item time{ color:#6b7280 !important; font-size:12px !important; }
      #notifyPanel .np-empty{ color:#6b7280 !important; }
    `;
    const style = document.createElement('style');
    style.id = 'notifyPatch'; style.textContent = css;
    document.head.appendChild(style);
  })();

  let NOTIFY_COUNT = 0;
  function setBellCount(n){
    NOTIFY_COUNT = Math.max(0, Math.min(99, Number(n)||0));
    const bell = document.getElementById('notifyBell');
    if (bell) bell.setAttribute('data-count', String(NOTIFY_COUNT));
  }
  function bumpBell(n=1){ setBellCount(NOTIFY_COUNT + n); }

  (function bindBellReset(){
    const bell = document.getElementById('notifyBell');
    bell?.addEventListener('click', ()=> setBellCount(0));
  })();

  (function initCountFromDOM(){
    const list = document.getElementById('notifyList');
    if (!list) return;
    const init = list.querySelectorAll('.np-item').length;
    setBellCount(init);
  })();

  function pushNotify(text){
    const list = document.getElementById('notifyList');
    if(!list) return;
    const empty = list.querySelector('.np-empty'); if (empty) empty.remove();
    const item = document.createElement('div');
    item.className = 'np-item';
    const now = new Date().toLocaleString('vi-VN');
    item.innerHTML = `${esc(text)}<time>${now}</time>`;
    if (list.firstChild) list.insertBefore(item, list.firstChild);
    else list.appendChild(item);
    const items = list.querySelectorAll('.np-item');
    if (items.length > 100) list.removeChild(items[items.length-1]);
    bumpBell(1);
  }
  window.pushNotify = window.pushNotify || pushNotify;

  function updateRowFromRecord(r){
    if(!r || !r.ma_hd) return false;
    const tr = document.querySelector(`#tbody tr[data-ma="${CSS.escape(r.ma_hd)}"]`);
    if(!tr) return false;

    tr.dataset.xacnhan          = (r.nv_check_don || '').trim();
    tr.dataset.dong             = (r.nv_dong_hang || '').trim();
    tr.dataset.prepdate         = r.ngay_chuan_bi_don || '';
    tr.dataset.dongdate         = r.ngay_dong_hang || '';
    tr.dataset.giaothanhcong    = r.ngay_giao_thanh_cong || '';
    tr.dataset.nv_giaohang      = r.nv_giao_hang || '';

    const cDonHang = tr.querySelector('[data-cell="don_hang"]');
    const cNgay    = tr.querySelector('[data-cell="ngay"]');
    const cTen     = tr.querySelector('[data-cell="ten_kh"]');
    const cTien    = tr.querySelector('[data-cell="tong_tien"]');
    const cTT      = tr.querySelector('[data-cell="trang_thai"]');
    const cNgayXN  = tr.querySelector('[data-cell="ngay_xn"]');
    const cNVXN    = tr.querySelector('[data-cell="nv_xn"]');
    const cNVDH    = tr.querySelector('[data-cell="nv_dong"]');
    const inputNVDH  = cNVDH?.querySelector('.emp-input');
    const btnSend    = tr.querySelector('.btn-send-row');

    if (cDonHang) cDonHang.innerHTML = renderDonHangCell(r.don_hang, r.ma_hd);
    if (cNgay)    cNgay.innerHTML    = fmtDateHTML(r.ngay);
    if (cTen)     cTen.textContent   = (r.ten_kh||'');
    if (cTien)    cTien.textContent  = (r.tong_tien!=null ? Number(r.tong_tien).toLocaleString('vi-VN') : '');
    if (cTT)      cTT.innerHTML      = renderStatusCell(r.ma_hd, r.trang_thai);
    if (cNgayXN)  cNgayXN.innerHTML  = fmtDateHTML(r.ngay_check_don);
    if (cNVXN)    cNVXN.textContent  = (r.nv_check_don||'');
    if (inputNVDH)  inputNVDH.value  = (r.nv_dong_hang||'');

    // Ẩn nút "Đã giao" nếu trạng thái đã giao xong
    const delivered = (()=> {
      const s = vnFold(r.trang_thai || '');
      return s.includes(vnFold('thành công')) || s.includes(vnFold('đã giao')) || s.includes('done');
    })();
    if (delivered){
      tr.querySelectorAll('.btn-da-giao').forEach(b=> b.style.display='none');
    }

    if (btnSend){ btnSend.style.display = r.ngay_dong_hang ? 'none' : ''; }
    return true;
  }

  function setupRealtime(){
    if (!supa) return false;
    const ch = supa.channel('rt-don_hang')
      .on('postgres_changes', { event: '*', schema: 'public', table: TABLE }, (payload) => {
        try{
          const type = payload.eventType;
          const rNew = payload.new || {};
          const rOld = payload.old || {};
          const ma   = rNew.ma_hd || rOld.ma_hd || '(không rõ)';

          if (type === 'UPDATE'){
            const ok = updateRowFromRecord(rNew);
            const tt = (rNew.trang_thai || '').trim();
            if (!ok) {
              pushNotify(`🔄 Cập nhật đơn ${esc(ma)} (ngoài danh sách hiển thị)`);
            } else {
              pushNotify(`🔄 Cập nhật đơn ${esc(ma)}${tt?` → “${esc(tt)}”`:''}`);
            }
          } else if (type === 'INSERT'){
            pushNotify(`➕ Thêm mới đơn ${esc(ma)} (đã đồng bộ)`);
          } else if (type === 'DELETE'){
            const tr = document.querySelector(`#tbody tr[data-ma="${CSS.escape(ma)}"]`);
            if (tr) {
              tr.remove();
              updateCheckedCount();
              syncHeaderCheckbox();
            }
            pushNotify(`🗑️ Xóa đơn ${esc(ma)}`);
          }
        }catch(e){ console.warn('Realtime error:', e); }
      })
      .subscribe(() => {});
    window.__DON_HANG_RT_CH__ = ch;
    return true;
  }

  const __wait = setInterval(()=>{ if (supa){ setupRealtime() && clearInterval(__wait); } }, 300);

  window.addEventListener('capnhat-don-hang', ()=>{
    onCapNhatDon();
    const iso = getCapDateISO();
    if (iso) pushNotify(`⚡ Đã gửi webhook cập nhật hóa đơn cho ngày <b>${esc(isoToVN(iso))}</b>`);
    else pushNotify(`⚠️ Ngày cập nhật không hợp lệ`);
  });

  window.addEventListener('beforeunload', ()=>{
    try { window.__DON_HANG_RT_CH__?.unsubscribe(); } catch {}
  });
})();

/* ================== NHẬN TÍN HIỆU TỪ FORM CON ================== */
window.addEventListener('message', (ev) => {
  const msg = (ev && ev.data) || {};
  if (msg.type === 'close-overlay') {
    closeOverlay();
    try {
      const list = document.getElementById('notifyList');
      if (list) {
        const item = document.createElement('div');
        item.className = 'np-item';
        const now = new Date().toLocaleString('vi-VN');
        item.innerHTML = `Đã đóng form chi tiết <time>${now}</time>`;
        list.prepend(item);
      }
    } catch (_) {}
  }
});
</script>

<script>
(async function protectedInit(){
  let daXacThuc = false;

  try {
    if (typeof window.checkLogin !== 'function') {
      throw new Error('Không tìm thấy check_login.js');
    }

    const loginOk = await window.checkLogin();
    if (!loginOk) return;

    daXacThuc = true;

    console.log(
      '[CHECK_DON] LOGIN OK:',
      loginOk.ma_nv,
      loginOk.ten_nv || ''
    );

    document.body.classList.add('ready');

    if (typeof init !== 'function') {
      throw new Error('Không tìm thấy hàm init()');
    }

    await init();

  } catch (error) {
    console.error('[CHECK_DON] INIT ERROR:', error);

    if (!daXacThuc) {
      if (typeof window.logoutCheck === 'function') {
        window.logoutCheck(
          error?.message || 'Không kiểm tra được đăng nhập'
        );
      } else {
        location.replace('./login.html');
      }
      return;
    }

    document.body.classList.add('ready');

    const sbMsg = document.getElementById('sbMsg');
    if (sbMsg) {
      sbMsg.textContent =
        'Lỗi khởi tạo: ' + (error?.message || error);
      sbMsg.className = 'err';
    }
  }
})();
</script>
