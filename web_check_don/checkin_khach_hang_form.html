<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
  />

  <title>Form khách hàng</title>

  <!--
    Thứ tự bắt buộc:
    1. internal_key.js
    2. config.js
    3. Supabase
    4. Code của trang
  -->
  <script src="./js/internal_key.js"></script>
  <script src="./js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #f3f4f6;
      color: #111827;
      font-family:
        system-ui,
        -apple-system,
        Segoe UI,
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }

    .wrap {
      max-width: 520px;
      margin: 0 auto;
      padding: 8px;
    }

    .card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.12);
      overflow: hidden;
    }

    .head {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 7px;
      padding: 9px 11px;
      background: white;
      border-bottom: 1px solid #e5e7eb;
    }

    h1 {
      margin: 0;
      font-size: 16px;
      line-height: 1.2;
    }

    .close {
      width: 30px;
      height: 30px;
      border: 0;
      border-radius: 8px;
      background: #f3f4f6;
      font-size: 22px;
      cursor: pointer;
    }

    form {
      padding: 10px;
    }

    label {
      display: block;
      margin-top: 6px;
      font-size: 12px;
      font-weight: 800;
      color: #374151;
    }

    input,
    textarea,
    select {
      width: 100%;
      margin-top: 3px;
      padding: 7px 9px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: white;
      font: inherit;
    }

    textarea {
      min-height: 58px;
      resize: vertical;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
    }

    .field {
      min-width: 0;
    }

    .field label {
      margin-top: 6px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 7px;
    }

    .bottom-buy {
      margin-top: 7px;
      padding-top: 7px;
      border-top: 1px solid #e5e7eb;
    }

    .actions {
      display: flex;
      gap: 7px;
      margin-top: 9px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 8px 10px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .actions button {
      flex: 1;
    }

    #saveBtn {
      background: #16a34a;
      color: white;
    }

    #gpsBtn {
      background: #2563eb;
      color: white;
    }

    .msg {
      display: none;
      margin-top: 12px;
      padding: 10px 11px;
      border-radius: 8px;
      font-weight: 800;
    }

    .msg.ok {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .msg.err {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .muted {
      color: #6b7280;
      font-size: 12px;
      margin-top: 6px;
    }

    @media (max-width: 520px) {
      .wrap {
        padding: 0;
      }

      .card {
        min-height: 100vh;
        border-radius: 0;
        border: 0;
      }

      .grid,
      .grid-3,
      .actions {
        grid-template-columns: 1fr;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <div class="head">
        <h1>
          Form khách hàng ID:
          <span id="idText"></span>
        </h1>

        <button
          id="closeBtn"
          class="close"
          type="button"
        >
          ×
        </button>
      </div>

      <form id="form">
        <div class="grid">
          <div class="field">
            <label>Mã KH</label>
            <input id="ma_kh" autocomplete="off" />
          </div>

          <div class="field">
            <label>Điện thoại</label>
            <input id="dien_thoai" inputmode="tel" autocomplete="off" />
          </div>
        </div>

        <label>Tên KH</label>
        <input id="ten_kh" autocomplete="off" />

        <label>Địa chỉ</label>
        <textarea id="dia_chi"></textarea>

        <div class="grid">
          <div class="field">
            <label>Phường/Xã</label>
            <input id="phuong_xa" autocomplete="off" />
          </div>

          <div class="field">
            <label>Nhân viên</label>
            <select id="ma_nv">
              <option value="">Nhân viên</option>
            </select>
          </div>
        </div>

        <div class="grid-3">
          <div class="field">
            <label>Số gương/ghế</label>
            <select id="so_luong_guong_ghe">
              <option value="">--</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8</option>
              <option value="9">9</option>
              <option value="10">10</option>
              <option value="11">11</option>
              <option value="12">12</option>
              <option value="13">13</option>
              <option value="14">14</option>
              <option value="15">15</option>
              <option value="16">16</option>
              <option value="17">17</option>
              <option value="18">18</option>
              <option value="19">19</option>
              <option value="20">20</option>
            </select>
          </div>

          <div class="field">
            <label>Kinh độ</label>
            <input id="lng" inputmode="decimal" autocomplete="off" />
          </div>

          <div class="field">
            <label>Vĩ độ</label>
            <input id="lat" inputmode="decimal" autocomplete="off" />
          </div>
        </div>

        <label>Mô tả</label>
        <textarea id="mo_ta" placeholder="Nhập mô tả..."></textarea>

        <div class="bottom-buy">
          <label>Đã mua hàng</label>
          <select id="Da_mua_hang">
            <option value="">Chưa rõ</option>
            <option value="true">Đã mua</option>
            <option value="false">Chưa mua</option>
          </select>
        </div>

        <div class="actions">
          <button
            id="saveBtn"
            type="submit"
          >
            Lưu cập nhật
          </button>

          <button
            id="gpsBtn"
            type="button"
          >
            Lấy vị trí
          </button>
        </div>

        <div class="muted">
          Form popup này chỉ cần có ID khách hàng, không chặn ma_nv.
        </div>

        <div
          id="msg"
          class="msg"
        ></div>
      </form>
    </div>
  </div>

  <script>
    (async function () {
      const params =
        new URLSearchParams(location.search);

      const rowId =
        String(params.get("id") || "").trim();

      const idText =
        document.getElementById("idText");

      const msg =
        document.getElementById("msg");

      const form =
        document.getElementById("form");

      const saveBtn =
        document.getElementById("saveBtn");

      const gpsBtn =
        document.getElementById("gpsBtn");

      const closeBtn =
        document.getElementById("closeBtn");

      const nvSelect =
        document.getElementById("ma_nv");

      const fields = [
        "ma_kh",
        "ten_kh",
        "dia_chi",
        "phuong_xa",
        "dien_thoai",
        "ma_nv",
        "lng",
        "lat",
        "Da_mua_hang",
        "so_luong_guong_ghe",
        "mo_ta"
      ];

      const nvNameByCode = new Map();

      let supabaseClient = null;
      let saveBusy = false;
      let gpsBusy = false;

      idText.textContent =
        rowId || "thiếu";

      function showMsg(type, text) {
        msg.className =
          "msg " + type;

        msg.textContent =
          text;
      }

      function input(id) {
        return document.getElementById(id);
      }

      function toBoolOrNull(value) {
        if (value === "true") {
          return true;
        }

        if (value === "false") {
          return false;
        }

        return null;
      }

      function getSelectedTenNV() {
        const code =
          String(
            nvSelect.value || ""
          ).trim();

        return (
          nvNameByCode.get(code) ||
          ""
        );
      }

      async function initSupabase() {
        /*
         * Chờ config.js kết nối với internal_key.js
         * và tải Environment Variables hoàn tất.
         */
        if (!window.configReady) {
          throw new Error(
            "Không tìm thấy configReady. Kiểm tra internal_key.js và config.js."
          );
        }

        await window.configReady;

        if (
          typeof window.getConfig !==
          "function"
        ) {
          throw new Error(
            "Không tìm thấy getConfig() từ config.js."
          );
        }

        const supabaseUrl =
          String(
            window.getConfig("url") ||
            ""
          ).trim();

        /*
         * Ưu tiên role, nếu không có thì dùng anon.
         */
        const supabaseKey =
          String(
            window.getConfig("role") ||
            window.getConfig("anon") ||
            ""
          ).trim();

        if (!supabaseUrl) {
          throw new Error(
            "Thiếu SUPABASE_URL từ config.js."
          );
        }

        if (!supabaseKey) {
          throw new Error(
            "Thiếu SUPABASE_ROLE hoặc SUPABASE_ANON_KEY từ config.js."
          );
        }

        if (
          !window.supabase ||
          typeof window.supabase.createClient !==
            "function"
        ) {
          throw new Error(
            "Không tải được thư viện Supabase."
          );
        }

        const internalKey =
          typeof window.getInternalKey ===
          "function"
            ? String(
                window.getInternalKey() ||
                ""
              ).trim()
            : "";

        supabaseClient =
          window.supabase.createClient(
            supabaseUrl,
            supabaseKey,
            {
              auth: {
                persistSession: false,
                autoRefreshToken: false
              },

              global: {
                headers: internalKey
                  ? {
                      "x-internal-key":
                        internalKey
                    }
                  : {}
              }
            }
          );

        return supabaseClient;
      }

      async function loadNhanVienOptions(
        selectedMaNV = ""
      ) {
        const current =
          String(
            selectedMaNV || ""
          ).trim();

        const {
          data,
          error
        } = await supabaseClient
          .from(
            "nv_checkin_khach_hang"
          )
          .select("ma_nv,ten_nv")
          .not(
            "ma_nv",
            "is",
            null
          )
          .order(
            "ten_nv",
            {
              ascending: true
            }
          );

        if (error) {
          showMsg(
            "err",
            "Lỗi tải danh sách nhân viên: " +
              error.message
          );

          return;
        }

        nvNameByCode.clear();

        nvSelect.innerHTML =
          '<option value="">Nhân viên</option>';

        (data || []).forEach(row => {
          const code =
            String(
              row.ma_nv || ""
            ).trim();

          if (
            !code ||
            nvNameByCode.has(code)
          ) {
            return;
          }

          const name =
            String(
              row.ten_nv || ""
            ).trim();

          nvNameByCode.set(
            code,
            name
          );

          const option =
            document.createElement(
              "option"
            );

          option.value =
            code;

          option.textContent =
            [code, name]
              .filter(Boolean)
              .join(" - ") ||
            code;

          nvSelect.appendChild(
            option
          );
        });

        if (
          current &&
          !nvNameByCode.has(current)
        ) {
          nvNameByCode.set(
            current,
            ""
          );

          const option =
            document.createElement(
              "option"
            );

          option.value =
            current;

          option.textContent =
            current;

          nvSelect.appendChild(
            option
          );
        }

        nvSelect.value =
          current;
      }

      async function loadRow() {
        showMsg(
          "ok",
          "Đang tải dữ liệu..."
        );

        const {
          data,
          error
        } = await supabaseClient
          .from(
            "nv_checkin_khach_hang"
          )
          .select(
            "id,ma_kh,ten_kh,dia_chi,phuong_xa,dien_thoai,ma_nv,lng,lat,Da_mua_hang,so_luong_guong_ghe,mo_ta"
          )
          .eq(
            "id",
            Number(rowId)
          )
          .maybeSingle();

        if (error) {
          showMsg(
            "err",
            "Lỗi tải dữ liệu: " +
              error.message
          );

          return;
        }

        if (!data) {
          showMsg(
            "err",
            "Không tìm thấy khách hàng id = " +
              rowId
          );

          return;
        }

        await loadNhanVienOptions(
          data.ma_nv || ""
        );

        fields.forEach(name => {
          if (
            name ===
            "Da_mua_hang"
          ) {
            input(name).value =
              data[name] === true
                ? "true"
                : data[name] === false
                  ? "false"
                  : "";

            return;
          }

          if (name === "so_luong_guong_ghe") {
            input(name).value =
              data[name] === null || data[name] === undefined
                ? ""
                : String(data[name]);

            return;
          }

          input(name).value =
            data[name] ?? "";
        });

        showMsg(
          "ok",
          "Đã tải dữ liệu."
        );
      }

      form.addEventListener(
        "submit",
        async event => {
          event.preventDefault();

          if (saveBusy) {
            return;
          }

          saveBusy = true;

          saveBtn.disabled = true;
          saveBtn.textContent =
            "Đang lưu...";

          try {
            const payload = {};

            fields.forEach(name => {
              if (
                name ===
                "Da_mua_hang"
              ) {
                payload[name] =
                  toBoolOrNull(
                    input(name).value
                  );

                return;
              }

              if (name === "so_luong_guong_ghe") {
                const rawValue =
                  String(input(name).value || "").trim();

                payload[name] =
                  rawValue === ""
                    ? null
                    : Number(rawValue);

                return;
              }

              const value =
                String(
                  input(name).value ||
                  ""
                ).trim();

              payload[name] =
                value === ""
                  ? null
                  : value;
            });

            payload.ten_nv =
              getSelectedTenNV() ||
              null;

            const {
              error
            } = await supabaseClient
              .from(
                "nv_checkin_khach_hang"
              )
              .update(payload)
              .eq(
                "id",
                Number(rowId)
              );

            if (error) {
              showMsg(
                "err",
                "Lỗi lưu: " +
                  error.message
              );

              return;
            }

            showMsg(
              "ok",
              "Đã lưu cập nhật."
            );

            try {
              if (
                window.opener &&
                !window.opener.closed
              ) {
                window.opener.postMessage(
                  {
                    type:
                      "khachhang-updated",
                    id: rowId
                  },
                  location.origin
                );
              }
            } catch {}

            setTimeout(() => {
              try {
                window.close();
              } catch {}
            }, 350);

          } catch (error) {
            console.error(
              "Lỗi lưu form:",
              error
            );

            showMsg(
              "err",
              "Lỗi lưu: " +
                (
                  error.message ||
                  error
                )
            );
          } finally {
            saveBusy = false;

            saveBtn.disabled = false;
            saveBtn.textContent =
              "Lưu cập nhật";
          }
        }
      );

      gpsBtn.addEventListener(
        "click",
        async () => {
          if (gpsBusy) {
            return;
          }

          if (
            !navigator.geolocation
          ) {
            showMsg(
              "err",
              "Trình duyệt không hỗ trợ GPS."
            );

            return;
          }

          if (
            navigator.permissions &&
            navigator.permissions.query
          ) {
            try {
              const permission =
                await navigator.permissions.query(
                  {
                    name:
                      "geolocation"
                  }
                );

              if (
                permission.state ===
                "denied"
              ) {
                showMsg(
                  "err",
                  "Bạn đang chặn quyền vị trí. Hãy bấm biểu tượng ổ khóa/cài đặt cạnh thanh địa chỉ, cho phép Vị trí rồi mở lại form."
                );

                return;
              }
            } catch {}
          }

          gpsBusy = true;

          gpsBtn.disabled = true;
          gpsBtn.textContent =
            "Đang lấy...";

          showMsg(
            "ok",
            "Đang lấy vị trí..."
          );

          navigator.geolocation.getCurrentPosition(
            position => {
              input("lat").value =
                position.coords.latitude;

              input("lng").value =
                position.coords.longitude;

              showMsg(
                "ok",
                "Đã lấy vị trí. Bấm Lưu cập nhật để lưu."
              );

              gpsBusy = false;
              gpsBtn.disabled = false;
              gpsBtn.textContent =
                "Lấy vị trí";
            },

            error => {
              if (error.code === 1) {
                showMsg(
                  "err",
                  "Bạn chưa cho phép vị trí. Hãy bật quyền Vị trí cho trang web rồi bấm lại Lấy vị trí."
                );
              } else if (
                error.code === 2
              ) {
                showMsg(
                  "err",
                  "Không xác định được vị trí. Hãy bật GPS/Wi-Fi/vị trí trên máy rồi thử lại."
                );
              } else if (
                error.code === 3
              ) {
                showMsg(
                  "err",
                  "Lấy vị trí quá lâu. Hãy bật vị trí/GPS rồi thử lại."
                );
              } else {
                showMsg(
                  "err",
                  "Không lấy được vị trí: " +
                    (
                      error.message ||
                      "Bạn chưa cấp quyền GPS"
                    )
                );
              }

              gpsBusy = false;
              gpsBtn.disabled = false;
              gpsBtn.textContent =
                "Lấy vị trí";
            },

            {
              enableHighAccuracy: true,
              timeout: 10000,
              maximumAge: 0
            }
          );
        }
      );

      closeBtn.onclick =
        () => window.close();

      if (!rowId) {
        showMsg(
          "err",
          "Thiếu id khách hàng trên URL."
        );

        return;
      }

      /*
       * Khởi tạo đúng thứ tự:
       * 1. Chờ config
       * 2. Tạo Supabase
       * 3. Tải dữ liệu
       */
      await initSupabase();
      await loadRow();

    })().catch(error => {
      const msg =
        document.getElementById(
          "msg"
        );

      if (msg) {
        msg.className =
          "msg err";

        msg.textContent =
          "Lỗi form: " +
          (
            error.message ||
            error
          );
      }

      console.error(
        "Lỗi khởi tạo form:",
        error
      );
    });
  </script>
</body>
</html>
