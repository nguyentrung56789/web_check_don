<!doctype html>
<html lang="vi">
<head>

  <meta
    name="viewport"

  />

  <title>Gửi tin khách hàng</title>

  <script src="./js/internal_key.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {

    .topbar {

<body>

<div class="wrap">

  <div class="topbar">

    <div class="titlebox">
      <h1>Danh sách khách hàng gửi tin</h1>

      <div class="count">
        Khách hợp lệ:
        <span id="validCount">0</span>
      </div>
    </div>

    <div class="actions">
      <button
        id="btnReload"

      >
        ↻ Tải lại
      </button>

      <button
        id="btnRun"
        class="btn-run"
      >
        ▶ Chạy
      </button>

      <button
        id="btnStop"
        class="btn-stop"
        disabled
      >
        ■ Dừng
      </button>
    </div>

  </div>

  <div id="status" class="status">
    Đang khởi tạo...
  </div>

  <div class="table-card">
    <div class="table-scroll">

      <table>

        <thead>
          <tr>
            <th>STT</th>
            <th>Mã KH</th>
            <th>Tên khách hàng</th>
            <th>Tên nhân viên</th>
            <th>conversation_id</th>
            <th>Trạng thái</th>
          </tr>
        </thead>

        <tbody id="tbody">
          <tr>
            <td colspan="6" class="empty">
              Đang tải dữ liệu...
            </td>
          </tr>
        </tbody>

      </table>

    </div>
  </div>

</div>


<script>

/* =========================================================
   CẤU HÌNH
========================================================= */

const TABLE_NAME =
  'kv_khachhang_nhanvien_guitin';

const TABLE_NHAN_VIEN =
  'kv_nhan_vien';

const WEBHOOK_URL =
  'https://n8n.clawbot.io.vn/webhook/guitin_autozalo';


/*
  Thời gian chờ gửi tin.

  Payload sẽ là:

  {
    mode: "random",
    fixed_seconds: null,
    min_seconds: 100,
    max_seconds: 200
  }
*/

const DELAY_CONFIG = {
  mode: 'random',
  fixed_seconds: null,
  min_seconds: 100,
  max_seconds: 200
};


/* =========================================================
   BIẾN
========================================================= */

let sb = null;

let rows = [];

let isRunning = false;

let currentRunId = null;


/* =========================================================
   STATUS
========================================================= */

function setStatus(text) {

  document
    .getElementById('status')
    .textContent = text;

}


/* =========================================================
   INTERNAL KEY
========================================================= */

function getInternalKeySafe() {

  try {

    if (typeof getInternalKey === 'function') {

      return getInternalKey();

    }

  } catch (e) {}

  return (
    window.INTERNAL_KEY ||
    window.COD_INTERNAL_KEY ||
    window.internalKey ||
    ''
  );

}


/* =========================================================
   TẠO SUPABASE CLIENT
========================================================= */

async function createSupabaseClient() {

  const internalKey =
    getInternalKeySafe();

  const res =
    await fetch('/api/getConfig', {

      headers: internalKey
        ? {
            'x-internal-key': internalKey
          }
        : {}

    });


  if (!res.ok) {

    throw new Error(
      'Không lấy được /api/getConfig. HTTP ' +
      res.status
    );

  }


  const cfg =
    await res.json();


  const url =
    cfg.url ||
    cfg.SUPABASE_URL ||
    cfg.supabaseUrl ||
    cfg.supabase_url;


  const anon =
    cfg.anon ||
    cfg.key ||
    cfg.SUPABASE_ANON ||
    cfg.SUPABASE_ANON_KEY ||
    cfg.supabase_anon_key;


  if (!url || !anon) {

    throw new Error(
      'Thiếu SUPABASE_URL hoặc SUPABASE_ANON_KEY'
    );

  }


  return window.supabase.createClient(
    url,
    anon
  );

}


/* =========================================================
   LẤY NHÂN VIÊN ĐANG ĐĂNG NHẬP
========================================================= */

function getCurrentUser() {

  /*
    1. Thử lấy từ localStorage "nv"
  */

  try {

    const nv =
      JSON.parse(
        localStorage.getItem('nv') || 'null'
      );

    if (nv && nv.ma_nv) {

      return nv;

    }

  } catch (e) {}


  /*
    2. Thử kiểu đăng nhập Chatwoot cũ
  */

  try {

    const nv =
      JSON.parse(
        localStorage.getItem(
          'chatwoot_crm_user'
        ) || 'null'
      );

    if (nv && nv.ma_nv) {

      return nv;

    }

  } catch (e) {}


  /*
    3. last_ma_nv
  */

  const lastMaNv =
    String(
      localStorage.getItem('last_ma_nv') ||
      ''
    ).trim();

  if (lastMaNv) {

    return {
      ma_nv: lastMaNv
    };

  }


  /*
    4. URL ?ma_nv=...
  */

  const params =
    new URLSearchParams(
      window.location.search
    );

  const maNvUrl =
    String(
      params.get('ma_nv') || ''
    ).trim();

  if (maNvUrl) {

    return {
      ma_nv: maNvUrl
    };

  }


  /*
    5. Nếu trang này được mở bằng popup
       thử lấy user từ trang cha.
  */

  try {

    if (
      window.opener &&
      window.opener.currentUser &&
      window.opener.currentUser.ma_nv
    ) {

      return window.opener.currentUser;

    }

  } catch (e) {}


  return null;

}


/* =========================================================
   LẤY MA_NV ĐANG ĐĂNG NHẬP
========================================================= */

function getLoggedInMaNv() {

  const currentUser =
    getCurrentUser();

  return String(
    currentUser?.ma_nv || ''
  ).trim();

}


/* =========================================================
   TẢI DỮ LIỆU
========================================================= */

async function loadData() {

  try {

    setStatus(
      'Đang tải dữ liệu...'
    );


    document
      .getElementById('tbody')
      .innerHTML =
        `
        <tr>
          <td
            colspan="6"
            class="empty"
          >
            Đang tải dữ liệu...
          </td>
        </tr>
        `;


    /*
      Lấy thêm:
      - ten_khachhang
      - ten_nhanvien

      ma_nv vẫn được lấy,
      nhưng KHÔNG HIỂN THỊ ra bảng.

      ma_nv cần giữ lại để xử lý bên trong.
    */

    const {
      data,
      error
    } =
      await sb
        .from(TABLE_NAME)
        .select(`
          ma_kh,
          ma_nv,
          ten_kh,
          ten_nv,
          conversation_id,
          trang_thai
        `)
        .not(
          'conversation_id',
          'is',
          null
        )
        .order(
          'ma_kh',
          {
            ascending: true
          }
        );


    if (error) {

      throw error;

    }


    /*
      Lọc thêm trường hợp
      conversation_id = ""
    */

    /*
      Nếu ten_nv trong bảng gửi tin đang NULL/rỗng,
      đọc lại kv_nhan_vien theo ma_nv để bổ sung tên nhân viên.
    */
    const validData = (data || []).filter(r => {
      return (
        r.conversation_id !== null &&
        r.conversation_id !== undefined &&
        String(r.conversation_id).trim() !== ''
      );
    });

    const maNvList = Array.from(
      new Set(
        validData
          .map(r => String(r.ma_nv || '').trim())
          .filter(Boolean)
      )
    );

    const tenNvMap = new Map();

    if (maNvList.length > 0) {
      const { data: nvData, error: nvError } = await sb
        .from(TABLE_NHAN_VIEN)
        .select('ma_nv, ten_nv')
        .in('ma_nv', maNvList);

      if (nvError) {
        console.warn('[LOAD TEN_NV WARNING]', nvError);
      } else {
        (nvData || []).forEach(nv => {
          tenNvMap.set(
            String(nv.ma_nv || '').trim(),
            String(nv.ten_nv || '').trim()
          );
        });
      }
    }

    rows = validData.map(r => {
      const maNv = String(r.ma_nv || '').trim();
      const tenNvTrongBangGuiTin = String(r.ten_nv || '').trim();

      return {
        ...r,
        ten_nv: tenNvTrongBangGuiTin || tenNvMap.get(maNv) || ''
      };
    });


    document
      .getElementById('validCount')
      .textContent =
        rows.length;


    renderTable();


    setStatus(
      'Đã tải ' +
      rows.length +
      ' khách hợp lệ.'
    );

  }

  catch (err) {

    console.error(
      '[LOAD DATA ERROR]',
      err
    );


    rows = [];


    document
      .getElementById('validCount')
      .textContent =
        '0';


    document
      .getElementById('tbody')
      .innerHTML =
        `
        <tr>
          <td
            colspan="6"
            class="empty"
          >
            Không tải được dữ liệu
          </td>
        </tr>
        `;


    setStatus(
      'Lỗi tải dữ liệu: ' +
      (
        err.message ||
        err
      )
    );

  }

}


/* =========================================================
   HIỂN THỊ BẢNG
========================================================= */

function renderTable() {

  const tbody =
    document.getElementById('tbody');


  if (!rows.length) {

    tbody.innerHTML =
      `
      <tr>
        <td
          colspan="6"
          class="empty"
        >
          Không có khách hợp lệ
        </td>
      </tr>
      `;

    return;

  }


  tbody.innerHTML =
    rows.map(
      (r, i) => `

        <tr>

          <td>
            ${i + 1}
          </td>

          <td>
            ${escapeHtml(
              r.ma_kh ?? ''
            )}
          </td>

          <td>
            ${escapeHtml(
              r.ten_kh ?? ''
            )}
          </td>

          <td>
            ${escapeHtml(
              r.ten_nv ?? ''
            )}
          </td>

          <td>
            ${escapeHtml(
              r.conversation_id ?? ''
            )}
          </td>

          <td>
            <span class="cmd">
              ${escapeHtml(
                String(r.trang_thai || '').trim() || 'Chưa chạy'
              )}
            </span>
          </td>

        </tr>

      `
    ).join('');

}


/* =========================================================
   CHỐNG HTML
========================================================= */

function escapeHtml(value) {

  return String(value)

    .replaceAll(
      '&',
      '&amp;'
    )

    .replaceAll(
      '<',
      '&lt;'
    )

    .replaceAll(
      '>',
      '&gt;'
    )

    .replaceAll(
      '"',
      '&quot;'
    )

    .replaceAll(
      "'",
      '&#039;'
    );

}


/* =========================================================
   GỬI WEBHOOK CHẠY
========================================================= */

async function sendRunWebhook() {

  const maNv =
    getLoggedInMaNv();


  if (!maNv) {

    throw new Error(
      'Không lấy được ma_nv của nhân viên đang đăng nhập.'
    );

  }


  /*
    BODY ĐÚNG NHƯ ẢNH BẠN GỬI
  */

  if (!currentRunId) {
    currentRunId =
      (window.crypto && typeof window.crypto.randomUUID === 'function')
        ? window.crypto.randomUUID()
        : ('run_' + Date.now() + '_' + Math.random().toString(36).slice(2, 9));
  }

  const body = {

    action: 'run',

    ma_nv: maNv,

    payload: {

      run_id: currentRunId,

      so_khach_hop_le: rows.length,

      thoi_gian_cho: {

        mode:
          DELAY_CONFIG.mode,

        fixed_seconds:
          DELAY_CONFIG.fixed_seconds,

        min_seconds:
          DELAY_CONFIG.min_seconds,

        max_seconds:
          DELAY_CONFIG.max_seconds

      }

    }

  };


  console.log(
    '[GUITIN_AUTOZALO] URL:',
    WEBHOOK_URL
  );


  console.log(
    '[GUITIN_AUTOZALO] BODY:',
    body
  );


  const response =
    await fetch(
      WEBHOOK_URL,
      {

        method: 'POST',

        headers: {
          'Content-Type':
            'application/json'
        },

        body:
          JSON.stringify(body)

      }
    );


  /*
    Lấy response n8n để debug
  */

  let responseText = '';

  try {

    responseText =
      await response.text();

  } catch (e) {}


  console.log(
    '[GUITIN_AUTOZALO] RESPONSE:',
    response.status,
    responseText
  );


  if (!response.ok) {

    throw new Error(
      'Webhook lỗi HTTP ' +
      response.status +
      (
        responseText
          ? ': ' + responseText
          : ''
      )
    );

  }


  return {
    ok: true,
    status: response.status,
    responseText
  };

}


/* =========================================================
   NÚT CHẠY
========================================================= */

async function startRun() {

  if (isRunning) {

    return;

  }


  if (!rows.length) {

    alert(
      'Không có khách hợp lệ để chạy.'
    );

    return;

  }


  /*
    Kiểm tra ma_nv trước khi chạy
  */

  const maNv =
    getLoggedInMaNv();


  if (!maNv) {

    alert(
      'Không lấy được mã nhân viên đang đăng nhập.'
    );

    return;

  }


  try {

    /*
      Khóa nút trong lúc gọi webhook
    */

    document
      .getElementById('btnRun')
      .disabled =
        true;


    setStatus(
      'Đang gửi lệnh chạy tới n8n...'
    );


    /*
      GỬI WEBHOOK
    */

    await sendRunWebhook();


    /*
      Chỉ chuyển sang chạy
      nếu webhook thành công
    */

    isRunning = true;


    document
      .getElementById('btnRun')
      .disabled =
        true;


    document
      .getElementById('btnStop')
      .disabled =
        false;


    renderTable();


    setStatus(
      'Đã gửi lệnh chạy ' +
      rows.length +
      ' khách. ' +
      'ma_nv: ' +
      maNv +
      ' | Chờ ngẫu nhiên 100 - 200 giây.'
    );

  }

  catch (err) {

    console.error(
      '[RUN ERROR]',
      err
    );


    isRunning = false;


    document
      .getElementById('btnRun')
      .disabled =
        false;


    document
      .getElementById('btnStop')
      .disabled =
        true;


    renderTable();


    setStatus(
      'Lỗi chạy: ' +
      (
        err.message ||
        err
      )
    );


    alert(
      'Không chạy được.\n\n' +
      (
        err.message ||
        err
      )
    );

  }

}


/* =========================================================
   GỬI WEBHOOK DỪNG
========================================================= */

async function sendStopWebhook() {

  const maNv = getLoggedInMaNv();

  if (!maNv) {
    throw new Error('Không lấy được ma_nv của nhân viên đang đăng nhập.');
  }

  const body = {
    action: 'stop',
    ma_nv: maNv,
    payload: {
      run_id: currentRunId,
      stop: true
    }
  };

  console.log('[GUITIN_AUTOZALO][STOP] URL:', WEBHOOK_URL);
  console.log('[GUITIN_AUTOZALO][STOP] BODY:', body);

  const response = await fetch(WEBHOOK_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(body)
  });

  let responseText = '';
  try {
    responseText = await response.text();
  } catch (e) {}

  console.log(
    '[GUITIN_AUTOZALO][STOP] RESPONSE:',
    response.status,
    responseText
  );

  if (!response.ok) {
    throw new Error(
      'Webhook dừng lỗi HTTP ' +
      response.status +
      (responseText ? ': ' + responseText : '')
    );
  }

  return {
    ok: true,
    status: response.status,
    responseText
  };
}


/* =========================================================
   NÚT DỪNG
========================================================= */

async function stopRun() {

  if (!isRunning) {
    return;
  }

  const btnStop = document.getElementById('btnStop');
  const btnRun = document.getElementById('btnRun');

  try {
    btnStop.disabled = true;
    btnStop.textContent = 'Đang dừng...';

    setStatus('Đang gửi lệnh dừng tới n8n...');

    await sendStopWebhook();

    isRunning = false;

    btnRun.disabled = false;
    btnStop.disabled = true;
    btnStop.textContent = '■ Dừng';

    renderTable();

    setStatus(
      'Đã gửi lệnh DỪNG tới n8n.' +
      (currentRunId ? ' run_id: ' + currentRunId : '')
    );

    currentRunId = null;

  } catch (err) {
    console.error('[STOP ERROR]', err);

    btnStop.disabled = false;
    btnStop.textContent = '■ Dừng';

    setStatus('Lỗi gửi lệnh dừng: ' + (err.message || err));

    alert(
      'Không gửi được lệnh dừng.\n\n' +
      (err.message || err)
    );
  }
}


/* =========================================================
   EVENT
========================================================= */

document
  .getElementById('btnReload')
  .addEventListener(
    'click',
    loadData
  );


document
  .getElementById('btnRun')
  .addEventListener(
    'click',
    startRun
  );


document
  .getElementById('btnStop')
  .addEventListener(
    'click',
    stopRun
  );


/* =========================================================
   KÉO / DI CHUYỂN FORM
========================================================= */

function enableDraggableForm() {
  const wrap = document.querySelector('.wrap');
  const handle = document.querySelector('.topbar');

  if (!wrap || !handle) return;

  let dragging = false;
  let offsetX = 0;
  let offsetY = 0;

  handle.addEventListener('mousedown', function (event) {
    if (event.button !== 0) return;
    if (event.target.closest('button, input, select, textarea, a')) return;

    const rect = wrap.getBoundingClientRect();

    wrap.style.position = 'fixed';
    wrap.style.margin = '0';
    wrap.style.width = rect.width + 'px';
    wrap.style.maxWidth = 'calc(100vw - 12px)';
    wrap.style.left = rect.left + 'px';
    wrap.style.top = rect.top + 'px';
    wrap.style.zIndex = '9999';

    offsetX = event.clientX - rect.left;
    offsetY = event.clientY - rect.top;
    dragging = true;

    event.preventDefault();
  });

  document.addEventListener('mousemove', function (event) {
    if (!dragging) return;

    const maxLeft = Math.max(0, window.innerWidth - wrap.offsetWidth);
    const maxTop = Math.max(0, window.innerHeight - 60);

    const left = Math.min(Math.max(0, event.clientX - offsetX), maxLeft);
    const top = Math.min(Math.max(0, event.clientY - offsetY), maxTop);

    wrap.style.left = left + 'px';
    wrap.style.top = top + 'px';
  });

  document.addEventListener('mouseup', function () {
    dragging = false;
  });
}


/* =========================================================
   REALTIME TRẠNG THÁI TỪ SUPABASE
   Bảng kv_khachhang_nhanvien_guitin đã bật Realtime.
========================================================= */

let statusChannel = null;

function normalizeRealtimeKey(value) {
  return String(value ?? '').trim();
}

function isDoneStatus(value) {
  const s = String(value ?? '').trim().toLowerCase();

  return (
    s === 'đã gửi xong' ||
    s === 'da gui xong' ||
    s === 'da_gui_xong' ||
    s === 'hoàn thành' ||
    s === 'hoan thanh' ||
    s === 'hoan_thanh' ||
    s === 'completed'
  );
}

function applyRealtimeStatus(payload) {
  console.log('[REALTIME UPDATE]', payload);

  const newRow = payload?.new;
  if (!newRow) return;

  const conversationId = normalizeRealtimeKey(newRow.conversation_id);
  const maKh = normalizeRealtimeKey(newRow.ma_kh);

  let changed = false;

  rows.forEach(function (row) {
    const sameConversation =
      conversationId &&
      normalizeRealtimeKey(row.conversation_id) === conversationId;

    const sameMaKh =
      maKh &&
      normalizeRealtimeKey(row.ma_kh) === maKh;

    if (!sameConversation && !sameMaKh) {
      return;
    }

    const oldStatus = normalizeRealtimeKey(row.trang_thai);
    const newStatus = normalizeRealtimeKey(newRow.trang_thai);

    if (oldStatus !== newStatus) {
      row.trang_thai = newRow.trang_thai ?? '';
      changed = true;
    }
  });

  if (changed) {
    renderTable();
  }

  const doneCount = rows.filter(function (row) {
    return isDoneStatus(row.trang_thai);
  }).length;

  if (doneCount > 0) {
    setStatus(
      'Đã gửi xong ' +
      doneCount +
      '/' +
      rows.length +
      ' khách.'
    );
  }

  if (rows.length > 0 && doneCount === rows.length) {
    isRunning = false;

    const btnRun = document.getElementById('btnRun');
    const btnStop = document.getElementById('btnStop');

    if (btnRun) btnRun.disabled = false;
    if (btnStop) btnStop.disabled = true;

    setStatus('✅ Đã gửi xong ' + rows.length + '/' + rows.length + ' khách.');
  }
}

function subscribeTrangThaiRealtime() {
  if (!sb) return;

  if (statusChannel) {
    try {
      sb.removeChannel(statusChannel);
    } catch (e) {
      console.warn('[REALTIME REMOVE CHANNEL]', e);
    }
    statusChannel = null;
  }

  statusChannel = sb
    .channel('guitin_trang_thai_' + Date.now())
    .on(
      'postgres_changes',
      {
        event: 'UPDATE',
        schema: 'public',
        table: TABLE_NAME
      },
      applyRealtimeStatus
    )
    .subscribe(function (status, err) {
      console.log('[REALTIME SUBSCRIBE]', status, err || '');

      if (status === 'SUBSCRIBED') {
        console.log('✅ Đã kết nối Realtime:', TABLE_NAME);
      }

      if (
        status === 'CHANNEL_ERROR' ||
        status === 'TIMED_OUT'
      ) {
        console.error('❌ Realtime lỗi:', status, err || '');
        setStatus('Lỗi kết nối Realtime: ' + status);
      }
    });
}

window.addEventListener('beforeunload', function () {
  if (statusChannel && sb) {
    try {
      sb.removeChannel(statusChannel);
    } catch (e) {}
  }
});
