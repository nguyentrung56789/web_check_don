<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Quản lý nhân viên</title>

  <script src="./js/internal_key.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/cod_config.js"></script>
  <script src="./js/auth_token.js"></script>

  <style>
    :root{
      --bg:#f4f6f8;
      --card:#ffffff;
      --text:#172033;
      --muted:#687386;
      --line:#dde3ea;
      --head:#f0f2f5;
      --primary:#087af5;
      --primary-soft:#e8f2ff;
      --danger:#dc3545;
      --success:#087af5;
      --shadow:0 8px 28px rgba(15,23,42,.08);
    }

    *{box-sizing:border-box}

    html,body{min-height:100%}

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    }

    button,input,select{font:inherit}

    .page{
      width:min(1500px,calc(100% - 28px));
      margin:18px auto;
    }

    .panel{
      background:var(--card);
      border-radius:16px;
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .tabs{
      display:flex;
      gap:42px;
      padding:0 32px;
      border-bottom:1px solid var(--line);
    }

    .tab{
      position:relative;
      padding:30px 0 16px;
      border:0;
      background:none;
      color:#263042;
      font-size:19px;
      cursor:pointer;
    }

    .tab.active{
      color:var(--primary);
      font-weight:650;
    }

    .tab.active::after{
      content:"";
      position:absolute;
      left:0;
      right:0;
      bottom:-1px;
      height:3px;
      background:var(--primary);
      border-radius:3px 3px 0 0;
    }

    .toolbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:14px;
      padding:18px 32px 20px;
    }

    .toolbar-left,
    .toolbar-right{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .btn{
      min-height:46px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:9px;
      padding:0 16px;
      border:1px solid #cfd7e2;
      border-radius:12px;
      background:#fff;
      color:#273244;
      font-weight:650;
      cursor:pointer;
    }

    .btn:hover{background:#f8fafc}

    .btn-primary{
      color:#273244;
      background:#fff;
    }

    .btn-danger{
      color:var(--danger);
    }

    .icon{
      width:22px;
      height:22px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      font-size:24px;
      line-height:1;
    }

    .filter-box{
      display:none;
      grid-template-columns:1.3fr 1fr 1fr auto;
      gap:12px;
      padding:0 32px 18px;
    }

    .filter-box.show{display:grid}

    .field{
      width:100%;
      min-height:44px;
      border:1px solid #cfd7e2;
      border-radius:10px;
      padding:9px 12px;
      outline:none;
      color:var(--text);
      background:#fff;
    }

    .field:focus{
      border-color:#80b9fa;
      box-shadow:0 0 0 3px rgba(8,122,245,.12);
    }

    .table-wrap{
      overflow:auto;
      padding:0 32px;
    }

    table{
      width:100%;
      min-width:1050px;
      border-collapse:collapse;
    }

    th,td{
      padding:16px 14px;
      text-align:left;
      border-bottom:1px solid var(--line);
      white-space:nowrap;
    }

    thead th{
      background:var(--head);
      color:#182132;
      font-weight:750;
    }

    tbody tr:hover{background:#fafcff}

    .check{
      width:20px;
      height:20px;
      cursor:pointer;
    }

    .status{
      display:inline-flex;
      align-items:center;
      min-height:28px;
      padding:3px 8px;
      border-radius:6px;
      font-size:15px;
      font-weight:650;
    }

    .status.on{
      color:#006bd6;
      background:var(--primary-soft);
    }

    .status.off{
      color:#8a2430;
      background:#ffe9ec;
    }

    .role-empty{color:#9aa4b2}

    .action-btn{
      border:0;
      background:none;
      color:var(--primary);
      cursor:pointer;
      font-weight:650;
      padding:5px 8px;
    }

    .action-btn.delete{color:var(--danger)}

    .footer{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      padding:10px 32px 18px;
    }

    .pagination{
      display:flex;
      align-items:center;
      gap:8px;
    }

    .page-btn{
      width:38px;
      height:38px;
      border:1px solid transparent;
      border-radius:9px;
      background:#fff;
      cursor:pointer;
      color:#536174;
    }

    .page-btn:hover:not(:disabled){
      border-color:#cfd7e2;
      background:#f8fafc;
    }

    .page-btn:disabled{
      opacity:.4;
      cursor:not-allowed;
    }

    .page-current{
      min-width:56px;
      height:38px;
      display:flex;
      align-items:center;
      justify-content:center;
      border:1px solid #cfd7e2;
      border-radius:9px;
      background:#fff;
    }

    .count{
      color:#354155;
      font-weight:550;
    }

    .loading,
    .empty{
      padding:34px;
      text-align:center;
      color:var(--muted);
    }

    .toast{
      position:fixed;
      right:18px;
      bottom:18px;
      z-index:1000;
      display:none;
      max-width:min(420px,calc(100vw - 36px));
      padding:13px 16px;
      border-radius:12px;
      color:#fff;
      background:#172033;
      box-shadow:0 10px 30px rgba(0,0,0,.22);
    }

    .toast.show{display:block}
    .toast.err{background:#b42318}
    .toast.ok{background:#087443}

    .modal-backdrop{
      position:fixed;
      inset:0;
      z-index:999;
      display:none;
      align-items:center;
      justify-content:center;
      padding:18px;
      background:rgba(15,23,42,.46);
    }

    .modal-backdrop.show{display:flex}

    .modal{
      width:min(620px,100%);
      max-height:92vh;
      overflow:auto;
      border-radius:16px;
      background:#fff;
      box-shadow:0 24px 70px rgba(0,0,0,.28);
    }

    .modal-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:20px 22px;
      border-bottom:1px solid var(--line);
    }

    .modal-head h2{
      margin:0;
      font-size:20px;
    }

    .close{
      width:38px;
      height:38px;
      border:0;
      border-radius:9px;
      background:#f1f4f7;
      cursor:pointer;
      font-size:22px;
    }

    .modal-body{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:15px;
      padding:22px;
    }

    .form-group label{
      display:block;
      margin-bottom:6px;
      color:#566174;
      font-size:13px;
      font-weight:650;
    }

    .form-group.full{grid-column:1/-1}

    .switch-row{
      display:flex;
      align-items:center;
      gap:10px;
      min-height:44px;
    }

    .modal-foot{
      display:flex;
      justify-content:flex-end;
      gap:10px;
      padding:16px 22px 22px;
    }

    .btn-save{
      border-color:var(--primary);
      background:var(--primary);
      color:#fff;
    }

    @media(max-width:760px){
      .page{
        width:100%;
        margin:0;
      }

      .panel{border-radius:0}

      .tabs,
      .toolbar,
      .table-wrap,
      .footer{
        padding-left:14px;
        padding-right:14px;
      }

      .toolbar{
        align-items:stretch;
        flex-direction:column;
      }

      .toolbar-left,
      .toolbar-right{
        justify-content:space-between;
      }

      .filter-box{
        grid-template-columns:1fr;
        padding-left:14px;
        padding-right:14px;
      }

      .modal-body{grid-template-columns:1fr}
      .form-group.full{grid-column:auto}
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="panel">
      <div class="tabs">
        <button class="tab active" type="button">Tài khoản người dùng</button>
        <button class="tab" type="button" id="btnRoleTab">Quản lý vai trò</button>
      </div>

      <div class="toolbar">
        <div class="toolbar-left">
          <button class="btn" type="button" id="btnFilter">
            <span class="icon">☰</span>
            Lọc
          </button>

          <button class="btn btn-danger" type="button" id="btnDeleteSelected" hidden>
            Xóa đã chọn
          </button>
        </div>

        <div class="toolbar-right">
          <button class="btn btn-primary" type="button" id="btnCreate">
            <span class="icon">＋</span>
            Tạo tài khoản
          </button>

          <button class="btn" type="button" id="btnReload" title="Tải lại dữ liệu">
            <span class="icon">⟳</span>
          </button>
        </div>
      </div>

      <div class="filter-box" id="filterBox">
        <input class="field" id="searchInput" placeholder="Tìm tên, điện thoại, mã nhân viên..." />

        <select class="field" id="roleFilter">
          <option value="">Tất cả vai trò</option>
        </select>

        <select class="field" id="statusFilter">
          <option value="">Tất cả trạng thái</option>
          <option value="true">Đang hoạt động</option>
          <option value="false">Ngừng hoạt động</option>
        </select>

        <button class="btn" type="button" id="btnClearFilter">Xóa lọc</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th style="width:48px">
                <input class="check" id="checkAll" type="checkbox" />
              </th>
              <th>Tên hiển thị</th>
              <th>Mã nhân viên</th>
              <th>Điện thoại</th>
              <th>Vai trò</th>
              <th>Chức danh</th>
              <th>Trạng thái</th>
              <th style="width:150px">Thao tác</th>
            </tr>
          </thead>

          <tbody id="tbody">
            <tr>
              <td colspan="8" class="loading">Đang tải dữ liệu...</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="footer">
        <div class="pagination">
          <button class="page-btn" id="btnFirst" type="button">|‹</button>
          <button class="page-btn" id="btnPrev" type="button">‹</button>
          <div class="page-current" id="pageNumber">1</div>
          <button class="page-btn" id="btnNext" type="button">›</button>
          <button class="page-btn" id="btnLast" type="button">›|</button>
        </div>

        <div class="count" id="countText">0 người dùng</div>
      </div>
    </section>
  </main>

  <div class="modal-backdrop" id="modalBackdrop">
    <section class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h2 id="modalTitle">Tạo tài khoản</h2>
        <button class="close" id="btnCloseModal" type="button">×</button>
      </div>

      <form id="userForm">
        <div class="modal-body">
          <input id="formId" type="hidden" />

          <div class="form-group">
            <label for="formTenNv">Tên hiển thị *</label>
            <input class="field" id="formTenNv" required />
          </div>

          <div class="form-group">
            <label for="formIdNv">Mã nhân viên KiotViet</label>
            <input class="field" id="formIdNv" type="number" step="1" />
          </div>

          <div class="form-group">
            <label for="formDienThoai">Điện thoại</label>
            <input class="field" id="formDienThoai" inputmode="tel" />
          </div>

          <div class="form-group">
            <label for="formMaVaiTro">Mã vai trò</label>
            <input class="field" id="formMaVaiTro" list="roleList" />
            <datalist id="roleList"></datalist>
          </div>

          <div class="form-group">
            <label for="formChucDanh">Chức danh</label>
            <input class="field" id="formChucDanh" />
          </div>

          <div class="form-group">
            <label for="formMatKhau">Mật khẩu</label>
            <input class="field" id="formMatKhau" type="password" autocomplete="new-password" />
          </div>

          <div class="form-group full">
            <label>Trạng thái</label>
            <div class="switch-row">
              <input class="check" id="formHoatDong" type="checkbox" checked />
              <span>Đang hoạt động</span>
            </div>
          </div>
        </div>

        <div class="modal-foot">
          <button class="btn" id="btnCancelModal" type="button">Hủy</button>
          <button class="btn btn-save" id="btnSave" type="submit">Lưu tài khoản</button>
        </div>
      </form>
    </section>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const TABLE_NAME = 'kv_nhan_vien';
    const PAGE_SIZE = 10;

    let supabaseClient = null;
    let currentPage = 1;
    let totalRows = 0;
    let currentRows = [];
    let selectedIds = new Set();

    const $ = (id) => document.getElementById(id);

    function showToast(message, type = 'ok') {
      const toast = $('toast');
      toast.textContent = message;
      toast.className = `toast show ${type}`;

      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => {
        toast.className = 'toast';
      }, 3200);
    }

    function formatPhone(phone) {
      const value = String(phone ?? '').trim();
      if (!value || value === '0') return '—';
      return value;
    }

    function roleName(row) {
      return row.ma_vai_tro || '—';
    }

    async function getSupabaseConfig() {
      const possibleConfigs = [
        window.COD_CONFIG,
        window.codConfig,
        window.APP_CONFIG,
        window.CONFIG
      ].filter(Boolean);

      for (const cfg of possibleConfigs) {
        const url =
          cfg.SUPABASE_URL ||
          cfg.supabaseUrl ||
          cfg.supabase_url;

        const key =
          cfg.SUPABASE_ANON ||
          cfg.SUPABASE_ANON_KEY ||
          cfg.supabaseAnon ||
          cfg.supabaseKey ||
          cfg.supabase_anon_key;

        if (url && key) return { url, key };
      }

      if (typeof window.getConfig === 'function') {
        const cfg = await window.getConfig();

        if (cfg?.SUPABASE_URL && cfg?.SUPABASE_ANON) {
          return {
            url: cfg.SUPABASE_URL,
            key: cfg.SUPABASE_ANON
          };
        }
      }

      try {
        const response = await fetch('/api/getConfig', {
          cache: 'no-store'
        });

        if (response.ok) {
          const cfg = await response.json();

          if (cfg?.SUPABASE_URL && cfg?.SUPABASE_ANON) {
            return {
              url: cfg.SUPABASE_URL,
              key: cfg.SUPABASE_ANON
            };
          }
        }
      } catch (error) {}

      throw new Error(
        'Không tìm thấy SUPABASE_URL và SUPABASE_ANON trong cod_config.js hoặc /api/getConfig'
      );
    }

    async function initSupabase() {
      const config = await getSupabaseConfig();

      supabaseClient = window.supabase.createClient(
        config.url,
        config.key
      );
    }

    function getFilters() {
      return {
        keyword: $('searchInput').value.trim(),
        role: $('roleFilter').value.trim(),
        status: $('statusFilter').value
      };
    }

    function applyFilters(query) {
      const { keyword, role, status } = getFilters();

      if (keyword) {
        const clean = keyword.replace(/[%(),]/g, ' ').trim();

        query = query.or(
          `ten_nv.ilike.%${clean}%,dien_thoai.ilike.%${clean}%,ma_vai_tro.ilike.%${clean}%`
        );
      }

      if (role) {
        query = query.eq('ma_vai_tro', role);
      }

      if (status === 'true') {
        query = query.eq('hoat_dong', true);
      }

      if (status === 'false') {
        query = query.eq('hoat_dong', false);
      }

      return query;
    }

    async function loadRoles() {
      const { data, error } = await supabaseClient
        .from(TABLE_NAME)
        .select('ma_vai_tro')
        .not('ma_vai_tro', 'is', null);

      if (error) {
        console.warn('Không tải được danh sách vai trò:', error);
        return;
      }

      const roles = [
        ...new Set(
          (data || [])
            .map((item) => String(item.ma_vai_tro || '').trim())
            .filter(Boolean)
        )
      ].sort((a, b) => a.localeCompare(b, 'vi'));

      $('roleFilter').innerHTML =
        '<option value="">Tất cả vai trò</option>' +
        roles.map((role) =>
          `<option value="${escapeHtml(role)}">${escapeHtml(role)}</option>`
        ).join('');

      $('roleList').innerHTML =
        roles.map((role) =>
          `<option value="${escapeHtml(role)}"></option>`
        ).join('');
    }

    async function loadUsers() {
      if (!supabaseClient) return;

      $('tbody').innerHTML = `
        <tr>
          <td colspan="8" class="loading">Đang tải dữ liệu...</td>
        </tr>
      `;

      const from = (currentPage - 1) * PAGE_SIZE;
      const to = from + PAGE_SIZE - 1;

      let query = supabaseClient
        .from(TABLE_NAME)
        .select(
          'id,id_nv,ten_nv,dien_thoai,hoat_dong,ma_vai_tro,chuc_danh',
          { count: 'exact' }
        );

      query = applyFilters(query);

      const { data, error, count } = await query
        .order('ten_nv', { ascending: true })
        .range(from, to);

      if (error) {
        console.error(error);
        $('tbody').innerHTML = `
          <tr>
            <td colspan="8" class="empty">
              Không tải được dữ liệu: ${escapeHtml(error.message)}
            </td>
          </tr>
        `;
        return;
      }

      currentRows = data || [];
      totalRows = count || 0;

      const totalPages = Math.max(1, Math.ceil(totalRows / PAGE_SIZE));

      if (currentPage > totalPages) {
        currentPage = totalPages;
        return loadUsers();
      }

      selectedIds.clear();
      updateSelectionUI();
      renderRows();
      updatePagination();
    }

    function renderRows() {
      if (!currentRows.length) {
        $('tbody').innerHTML = `
          <tr>
            <td colspan="8" class="empty">
              Không có tài khoản phù hợp.
            </td>
          </tr>
        `;
        return;
      }

      $('tbody').innerHTML = currentRows.map((row) => {
        const active = row.hoat_dong !== false;

        return `
          <tr>
            <td>
              <input
                class="check row-check"
                type="checkbox"
                data-id="${escapeHtml(String(row.id))}"
              />
            </td>

            <td>${escapeHtml(row.ten_nv || '—')}</td>

            <td>${escapeHtml(row.id_nv ?? row.id ?? '—')}</td>

            <td>${escapeHtml(formatPhone(row.dien_thoai))}</td>

            <td class="${row.ma_vai_tro ? '' : 'role-empty'}">
              ${escapeHtml(roleName(row))}
            </td>

            <td class="${row.chuc_danh ? '' : 'role-empty'}">
              ${escapeHtml(row.chuc_danh || '—')}
            </td>

            <td>
              <span class="status ${active ? 'on' : 'off'}">
                ${active ? 'Đang hoạt động' : 'Ngừng hoạt động'}
              </span>
            </td>

            <td>
              <button
                class="action-btn edit-btn"
                type="button"
                data-id="${escapeHtml(String(row.id))}"
              >
                Sửa
              </button>

              <button
                class="action-btn delete delete-btn"
                type="button"
                data-id="${escapeHtml(String(row.id))}"
              >
                Xóa
              </button>
            </td>
          </tr>
        `;
      }).join('');

      document.querySelectorAll('.row-check').forEach((checkbox) => {
        checkbox.addEventListener('change', handleRowCheck);
      });

      document.querySelectorAll('.edit-btn').forEach((button) => {
        button.addEventListener('click', () => {
          openEditModal(button.dataset.id);
        });
      });

      document.querySelectorAll('.delete-btn').forEach((button) => {
        button.addEventListener('click', () => {
          deleteOne(button.dataset.id);
        });
      });
    }

    function updatePagination() {
      const totalPages = Math.max(1, Math.ceil(totalRows / PAGE_SIZE));
      const start = totalRows ? (currentPage - 1) * PAGE_SIZE + 1 : 0;
      const end = Math.min(currentPage * PAGE_SIZE, totalRows);

      $('pageNumber').textContent = currentPage;
      $('countText').textContent =
        totalRows > 0
          ? `${start} - ${end} trong ${totalRows} người dùng`
          : '0 người dùng';

      $('btnFirst').disabled = currentPage <= 1;
      $('btnPrev').disabled = currentPage <= 1;
      $('btnNext').disabled = currentPage >= totalPages;
      $('btnLast').disabled = currentPage >= totalPages;
    }

    function handleRowCheck(event) {
      const id = event.target.dataset.id;

      if (event.target.checked) {
        selectedIds.add(id);
      } else {
        selectedIds.delete(id);
      }

      updateSelectionUI();
    }

    function updateSelectionUI() {
      const checkAll = $('checkAll');
      const visibleIds = currentRows.map((row) => String(row.id));
      const checkedVisible = visibleIds.filter((id) => selectedIds.has(id));

      checkAll.checked =
        visibleIds.length > 0 &&
        checkedVisible.length === visibleIds.length;

      checkAll.indeterminate =
        checkedVisible.length > 0 &&
        checkedVisible.length < visibleIds.length;

      $('btnDeleteSelected').hidden = selectedIds.size === 0;
      $('btnDeleteSelected').textContent =
        selectedIds.size
          ? `Xóa đã chọn (${selectedIds.size})`
          : 'Xóa đã chọn';
    }

    function openCreateModal() {
      $('modalTitle').textContent = 'Tạo tài khoản';
      $('userForm').reset();
      $('formId').value = '';
      $('formHoatDong').checked = true;
      $('modalBackdrop').classList.add('show');
      $('formTenNv').focus();
    }

    function openEditModal(id) {
      const row = currentRows.find(
        (item) => String(item.id) === String(id)
      );

      if (!row) {
        showToast('Không tìm thấy nhân viên cần sửa.', 'err');
        return;
      }

      $('modalTitle').textContent = 'Chỉnh sửa tài khoản';
      $('formId').value = row.id ?? '';
      $('formTenNv').value = row.ten_nv ?? '';
      $('formIdNv').value = row.id_nv ?? '';
      $('formDienThoai').value = row.dien_thoai ?? '';
      $('formMaVaiTro').value = row.ma_vai_tro ?? '';
      $('formChucDanh').value = row.chuc_danh ?? '';
      $('formMatKhau').value = '';
      $('formHoatDong').checked = row.hoat_dong !== false;

      $('modalBackdrop').classList.add('show');
      $('formTenNv').focus();
    }

    function closeModal() {
      $('modalBackdrop').classList.remove('show');
    }

    async function saveUser(event) {
      event.preventDefault();

      const id = $('formId').value.trim();
      const tenNv = $('formTenNv').value.trim();

      if (!tenNv) {
        showToast('Vui lòng nhập tên hiển thị.', 'err');
        $('formTenNv').focus();
        return;
      }

      const payload = {
        ten_nv: tenNv,
        id_nv: $('formIdNv').value
          ? Number($('formIdNv').value)
          : null,
        dien_thoai: $('formDienThoai').value.trim() || null,
        ma_vai_tro: $('formMaVaiTro').value.trim() || null,
        chuc_danh: $('formChucDanh').value.trim() || null,
        hoat_dong: $('formHoatDong').checked
      };

      const password = $('formMatKhau').value;

      if (password) {
        payload.mat_khau = password;
      }

      $('btnSave').disabled = true;
      $('btnSave').textContent = 'Đang lưu...';

      try {
        let result;

        if (id) {
          result = await supabaseClient
            .from(TABLE_NAME)
            .update(payload)
            .eq('id', id)
            .select()
            .single();
        } else {
          result = await supabaseClient
            .from(TABLE_NAME)
            .insert(payload)
            .select()
            .single();
        }

        if (result.error) throw result.error;

        closeModal();
        showToast(id ? 'Đã cập nhật tài khoản.' : 'Đã tạo tài khoản.');
        await Promise.all([loadUsers(), loadRoles()]);
      } catch (error) {
        console.error(error);
        showToast(`Không lưu được: ${error.message}`, 'err');
      } finally {
        $('btnSave').disabled = false;
        $('btnSave').textContent = 'Lưu tài khoản';
      }
    }

    async function deleteOne(id) {
      const row = currentRows.find(
        (item) => String(item.id) === String(id)
      );

      const name = row?.ten_nv || id;

      if (!confirm(`Bạn có chắc muốn xóa tài khoản "${name}"?`)) {
        return;
      }

      const { error } = await supabaseClient
        .from(TABLE_NAME)
        .delete()
        .eq('id', id);

      if (error) {
        showToast(`Không xóa được: ${error.message}`, 'err');
        return;
      }

      showToast('Đã xóa tài khoản.');
      await Promise.all([loadUsers(), loadRoles()]);
    }

    async function deleteSelected() {
      const ids = [...selectedIds];

      if (!ids.length) return;

      if (!confirm(`Bạn có chắc muốn xóa ${ids.length} tài khoản đã chọn?`)) {
        return;
      }

      const { error } = await supabaseClient
        .from(TABLE_NAME)
        .delete()
        .in('id', ids);

      if (error) {
        showToast(`Không xóa được: ${error.message}`, 'err');
        return;
      }

      showToast(`Đã xóa ${ids.length} tài khoản.`);
      selectedIds.clear();
      await Promise.all([loadUsers(), loadRoles()]);
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function debounce(fn, delay = 350) {
      let timer;

      return (...args) => {
        clearTimeout(timer);
        timer = setTimeout(() => fn(...args), delay);
      };
    }

    $('btnFilter').addEventListener('click', () => {
      $('filterBox').classList.toggle('show');
    });

    $('btnCreate').addEventListener('click', openCreateModal);
    $('btnReload').addEventListener('click', loadUsers);
    $('btnCloseModal').addEventListener('click', closeModal);
    $('btnCancelModal').addEventListener('click', closeModal);
    $('userForm').addEventListener('submit', saveUser);
    $('btnDeleteSelected').addEventListener('click', deleteSelected);

    $('modalBackdrop').addEventListener('click', (event) => {
      if (event.target === $('modalBackdrop')) closeModal();
    });

    $('checkAll').addEventListener('change', (event) => {
      currentRows.forEach((row) => {
        const id = String(row.id);

        if (event.target.checked) {
          selectedIds.add(id);
        } else {
          selectedIds.delete(id);
        }
      });

      document.querySelectorAll('.row-check').forEach((checkbox) => {
        checkbox.checked = event.target.checked;
      });

      updateSelectionUI();
    });

    const reloadFromFilter = debounce(() => {
      currentPage = 1;
      loadUsers();
    });

    $('searchInput').addEventListener('input', reloadFromFilter);
    $('roleFilter').addEventListener('change', reloadFromFilter);
    $('statusFilter').addEventListener('change', reloadFromFilter);

    $('btnClearFilter').addEventListener('click', () => {
      $('searchInput').value = '';
      $('roleFilter').value = '';
      $('statusFilter').value = '';
      currentPage = 1;
      loadUsers();
    });

    $('btnFirst').addEventListener('click', () => {
      currentPage = 1;
      loadUsers();
    });

    $('btnPrev').addEventListener('click', () => {
      if (currentPage > 1) {
        currentPage--;
        loadUsers();
      }
    });

    $('btnNext').addEventListener('click', () => {
      const totalPages = Math.max(1, Math.ceil(totalRows / PAGE_SIZE));

      if (currentPage < totalPages) {
        currentPage++;
        loadUsers();
      }
    });

    $('btnLast').addEventListener('click', () => {
      currentPage = Math.max(1, Math.ceil(totalRows / PAGE_SIZE));
      loadUsers();
    });

    $('btnRoleTab').addEventListener('click', () => {
      showToast(
        'Tab Quản lý vai trò sẽ kết nối bảng vai trò ở bước tiếp theo.',
        'err'
      );
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') closeModal();
    });

    (async function start() {
      try {
        await initSupabase();
        await Promise.all([loadUsers(), loadRoles()]);
      } catch (error) {
        console.error(error);

        $('tbody').innerHTML = `
          <tr>
            <td colspan="8" class="empty">
              ${escapeHtml(error.message)}
            </td>
          </tr>
        `;

        showToast(error.message, 'err');
      }
    })();
  </script>
</body>
</html>
