  <script>
/* ================== CONFIG ================== */
const TARGET_W = 900, TARGET_H = 1600;

/* ===== VỊ TRÍ CHECK-IN GẦN ĐÂY: lấy trực tiếp từ Supabase ===== */
const LOCATION_TABLE = 'nv_checkin_khach_hang';
const NEAR_RADIUS_M = 50;
const LOCATION_TTL_MS = 2 * 60 * 1000;
const LOCATION_CACHE_KEY = 'CHECKIN_LOCATION_POINTS_CACHE_V1';
const LOCATION_CACHE_TS_KEY = 'CHECKIN_LOCATION_POINTS_TS_V1';
const NEARBY_SESSION_KEY = 'CHECKIN_NEARBY_POINTS_V1';
const SESSION_IMG_KEY = 'CHECKIN_IMAGE_PAYLOAD';

let LOCATION_POINTS = [];

/* ===== Local cache helpers ===== */
const lsGet = k => {
  try { return JSON.parse(localStorage.getItem(k) || 'null'); }
  catch { return null; }
};
const lsSet = (k,v) => {
  try { localStorage.setItem(k, JSON.stringify(v)); } catch {}
};

/* ===== Đọc cấu hình Supabase từ config.js / /api/getConfig ===== */
function safeText(v){
  if (v === null || v === undefined) return '';
  if (typeof v === 'string' || typeof v === 'number' || typeof v === 'boolean') {
    return String(v).trim();
  }
  return '';
}

function pickConfigValue(value, keys=[]){
  const direct = safeText(value);
  if (direct) return direct;

  if (value && typeof value === 'object'){
    for (const key of keys){
      if (Object.prototype.hasOwnProperty.call(value, key)){
        const s = safeText(value[key]);
        if (s) return s;
      }
    }
  }
  return '';
}

let __SUPABASE_REST_CONFIG__ = null;

async function getSupabaseRestConfig(){
  if (__SUPABASE_REST_CONFIG__) return __SUPABASE_REST_CONFIG__;

  try{
    if (window.configReady && typeof window.configReady.then === 'function'){
      await window.configReady;
    }
  }catch{}

  let url = '';
  let anon = '';

  try{
    url = pickConfigValue(window.getConfig?.('url'), [
      'url','value','SUPABASE_URL','supabaseUrl','supabase_url'
    ]);

    anon = pickConfigValue(window.getConfig?.('anon'), [
      'anon','key','value','SUPABASE_ANON','SUPABASE_ANON_KEY',
      'supabaseAnon','supabaseKey','supabase_anon_key'
    ]);
  }catch{}

  if (!url || !anon){
    const internalKey = typeof window.getInternalKey === 'function'
      ? safeText(window.getInternalKey())
      : '';

    const res = await fetch('/api/getConfig', {
      method:'GET',
      headers:{
        'x-internal-key': internalKey,
        'Accept':'application/json'
      },
      cache:'no-store'
    });

    if (!res.ok){
      throw new Error(`Không lấy được cấu hình Supabase: HTTP ${res.status}`);
    }

    const cfg = await res.json();

    if (!url){
      url = pickConfigValue(cfg, [
        'url','SUPABASE_URL','supabaseUrl','supabase_url'
      ]);
    }

    if (!anon){
      anon = pickConfigValue(cfg, [
        'anon','key','SUPABASE_ANON','SUPABASE_ANON_KEY',
        'supabaseAnon','supabaseKey','supabase_anon_key'
      ]);
    }
  }

  url = safeText(url).replace(/\/+$/, '');
  anon = safeText(anon);

  if (!url) throw new Error('Thiếu Supabase URL');
  if (!anon) throw new Error('Thiếu Supabase anon key');

  __SUPABASE_REST_CONFIG__ = { url, anon };
  return __SUPABASE_REST_CONFIG__;
}

/* ===== Lấy toàn bộ điểm check-in có lat/lng từ table nv_checkin_khach_hang =====
   lat/lng của table hiện là TEXT nên ép Number() ở phía trình duyệt.
*/
async function fetchLocationPointsFromSupabase(){
  const { url, anon } = await getSupabaseRestConfig();

  const qs = new URLSearchParams({
    select: 'ma_kh,ma_nv,ten_kh,lng,lat,dien_thoai',
    limit: '10000'
  });

  const res = await fetch(
    `${url}/rest/v1/${LOCATION_TABLE}?${qs.toString()}`,
    {
      method:'GET',
      headers:{
        apikey: anon,
        Authorization: `Bearer ${anon}`,
        Accept: 'application/json'
      },
      cache:'no-store'
    }
  );

  if (!res.ok){
    const detail = await res.text().catch(()=>'');
    throw new Error(`Không tải được vị trí: HTTP ${res.status}${detail ? ' - ' + detail : ''}`);
  }

  const rows = await res.json();

  return (Array.isArray(rows) ? rows : [])
    .map(r => ({
      ma_kh: safeText(r.ma_kh),
      ma_nv: safeText(r.ma_nv),
      ten_kh: safeText(r.ten_kh),
      dien_thoai: safeText(r.dien_thoai),
      lat: Number(r.lat),
      lng: Number(r.lng)
    }))
    .filter(r =>
      Number.isFinite(r.lat) &&
      Number.isFinite(r.lng) &&
      r.lat !== 0 &&
      r.lng !== 0
    );
}

async function ensureLocationPoints(force=false){
  if (!force && LOCATION_POINTS.length) return LOCATION_POINTS;

  if (!force){
    const cached = lsGet(LOCATION_CACHE_KEY);
    const ts = Number(lsGet(LOCATION_CACHE_TS_KEY) || 0);

    if (
      Array.isArray(cached) &&
      cached.length &&
      ts &&
      Date.now() - ts < LOCATION_TTL_MS
    ){
      LOCATION_POINTS = cached;
      return LOCATION_POINTS;
    }
  }

  const data = await fetchLocationPointsFromSupabase();
  LOCATION_POINTS = data;
  lsSet(LOCATION_CACHE_KEY, data);
  lsSet(LOCATION_CACHE_TS_KEY, Date.now());
  return LOCATION_POINTS;
}

/* ===== Tính khoảng cách theo mét ===== */
function distanceMeters(a,b){
  const toRad = d => d * Math.PI / 180;
  const R = 6371000;

  const dLat = toRad(b.lat - a.lat);
  const dLng = toRad(b.lng - a.lng);
  const s1 = Math.sin(dLat / 2);
  const s2 = Math.sin(dLng / 2);

  const aa =
    s1*s1 +
    Math.cos(toRad(a.lat)) *
    Math.cos(toRad(b.lat)) *
    s2*s2;

  return 2 * R * Math.atan2(Math.sqrt(aa), Math.sqrt(1-aa));
}

/* ===== Trả TẤT CẢ vị trí <= radiusM, gần -> xa ===== */
function findNearbyInArray(lat,lng,arr,radiusM=NEAR_RADIUS_M){
  const origin = { lat:Number(lat), lng:Number(lng) };

  if (
    !Number.isFinite(origin.lat) ||
    !Number.isFinite(origin.lng)
  ) return [];

  return (Array.isArray(arr) ? arr : [])
    .map(it => {
      const d = distanceMeters(origin, {
        lat:Number(it.lat),
        lng:Number(it.lng)
      });

      return {
        ...it,
        dist: Math.round(d)
      };
    })
    .filter(it => Number.isFinite(it.dist) && it.dist <= radiusM)
    .sort((a,b) => a.dist - b.dist);
}

/* ===== Lấy danh sách vị trí quanh GPS hiện tại và lưu cho trang sau ===== */
async function prepareNearbyLocations(lat,lng){
  let nearby = [];

  try{
    const points = await ensureLocationPoints();
    nearby = findNearbyInArray(lat, lng, points, NEAR_RADIUS_M);

    const payload = {
      lat: Number(lat),
      lng: Number(lng),
      radius_m: NEAR_RADIUS_M,
      total: nearby.length,
      items: nearby,
      created_at: Date.now()
    };

    sessionStorage.setItem(
      NEARBY_SESSION_KEY,
      JSON.stringify(payload)
    );

    // alias ngắn để trang checkin_khach_hang cũ/mới đều dễ đọc
    sessionStorage.setItem(
      'CHECKIN_NEARBY_POINTS',
      JSON.stringify(payload)
    );

    if (nearby.length){
      const first = nearby[0];
      const label =
        first.ten_kh ||
        first.ma_kh ||
        first.dien_thoai ||
        'Vị trí';

      toast(
        `📍 Có ${nearby.length} vị trí trong ${NEAR_RADIUS_M}m. Gần nhất: ${label} (${first.dist}m)`,
        'ok',
        2800
      );
    }else{
      toast(
        `📍 Không có vị trí đã lưu trong bán kính ${NEAR_RADIUS_M}m`,
        'info',
        2200
      );
    }
  }catch(err){
    console.warn('[CHECKIN] Không tải được vị trí xung quanh:', err);

    const payload = {
      lat: Number(lat),
      lng: Number(lng),
      radius_m: NEAR_RADIUS_M,
      total: 0,
      items: [],
      error: String(err?.message || err || ''),
      created_at: Date.now()
    };

    try{
      sessionStorage.setItem(
        NEARBY_SESSION_KEY,
        JSON.stringify(payload)
      );
      sessionStorage.setItem(
        'CHECKIN_NEARBY_POINTS',
        JSON.stringify(payload)
      );
    }catch{}

    // Không chặn chụp/gửi ảnh nếu danh sách vị trí lỗi.
    toast(
      '⚠️ Không tải được danh sách vị trí gần, vẫn tiếp tục ảnh check-in.',
      'err',
      2600
    );
  }

  return nearby;
}

const canvas    = $('canvas');

const MA_HD = qp.get('ma_hd') || '';

function getLoggedNV(){
  const nv = lsGet('nv');
  if (nv && nv.ma_nv) return nv;

  const ctx = (() => {
    try { return JSON.parse(sessionStorage.getItem('nv_ctx') || 'null'); }

}

  qp.get('ma_nv') ||

if (!MA_NV) {

if (!LOGGED_NV || !LOGGED_NV.ma_nv || LOGGED_NV.hoat_dong === false) {

/* ================== AUDIO (shutter) ================== */
let audioCtx = null, compressor = null;
const SHUTTER_GAIN = 0.9;

async function ensureAudioCtx(){
  if(!audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AC();
    compressor = audioCtx.createDynamicsCompressor();
    compressor.threshold.setValueAtTime(-24, audioCtx.currentTime);
    compressor.knee.setValueAtTime(30, audioCtx.currentTime);
    compressor.ratio.setValueAtTime(12, audioCtx.currentTime);
    compressor.attack.setValueAtTime(0.002, audioCtx.currentTime);
    compressor.release.setValueAtTime(0.1, audioCtx.currentTime);
    compressor.connect(audioCtx.destination);
  }
  if(audioCtx.state === 'suspended') await audioCtx.resume();
}

function noiseBurst(ctx, t0, dur=0.03){
  const len = Math.floor(ctx.sampleRate * dur);
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for(let i=0;i<len;i++) data[i] = (Math.random()*2-1) * 0.6;
  const src = ctx.createBufferSource(); src.buffer = buf;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(SHUTTER_GAIN, t0 + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0008, t0 + dur);
  const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.setValueAtTime(4500, t0);
  src.connect(lp); lp.connect(g); g.connect(compressor);
  src.start(t0); src.stop(t0 + dur + 0.01);
}

let soundEnabled = (localStorage.getItem('soundEnabled')??'1') === '1';

function renderSoundBtn(){
  if (!btnSound) return;
  btnSound.classList.toggle('btn-on', soundEnabled);
  btnSound.textContent = soundEnabled ? '🔊' : '🔇';
  btnSound.title = soundEnabled ? 'Đang bật tiếng (bấm để tắt)' : 'Đang tắt tiếng (bấm để bật)';
}
renderSoundBtn();

btnSound && (btnSound.onclick = ()=>{ 
  soundEnabled=!soundEnabled; 
  localStorage.setItem('soundEnabled', soundEnabled?'1':'0'); 
  renderSoundBtn(); 
  toast(soundEnabled?'Đã bật tiếng chụp':'Đã tắt tiếng chụp'); 
});

async function playShutter(){
  if(!soundEnabled) return;
  await ensureAudioCtx();
  const ctx = audioCtx; const now = ctx.currentTime;
  noiseBurst(ctx, now, 0.035);
  const osc1 = ctx.createOscillator(), g1 = ctx.createGain();
  osc1.type='square'; osc1.frequency.setValueAtTime(1400, now);
  g1.gain.setValueAtTime(0, now);
  g1.gain.linearRampToValueAtTime(SHUTTER_GAIN, now + 0.01);
  g1.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
  osc1.connect(g1); g1.connect(compressor); osc1.start(now); osc1.stop(now + 0.1);
  const t2 = now + 0.06;
  const osc2 = ctx.createOscillator(), g2 = ctx.createGain();
  osc2.type='square'; osc2.frequency.setValueAtTime(950, t2);
  g2.gain.setValueAtTime(0, t2);
  g2.gain.linearRampToValueAtTime(SHUTTER_GAIN*0.7, t2 + 0.012);
  g2.gain.exponentialRampToValueAtTime(0.001, t2 + 0.08);
  osc2.connect(g2); g2.connect(compressor); osc2.start(t2); osc2.stop(t2 + 0.09);
  if (navigator.vibrate) navigator.vibrate(30);
}

/* ================== TOAST ================== */
function toast(t,type='info',ms=2400){
  if (!toastEl) return;
  toastEl.textContent=t;
  toastEl.style.opacity='1';
  toastEl.style.transform='translate(-50%,10px)';
  clearTimeout(toast._t);
  toast._t=setTimeout(()=>{
    toastEl.style.opacity='0';
    toastEl.style.transform='translate(-50%,-120%)';
  },ms);
}

/* ================== GPS + VỊ TRÍ GẦN (CHỈ XỬ LÝ KHI BẤM CHỤP) ================== */
function openGeoHelp(){
  const msg =
`⚠️ Bạn đã chặn quyền vị trí.
Cách bật lại nhanh:

• Chrome/Edge (máy tính): bấm biểu tượng 🔒 cạnh thanh địa chỉ → Site settings → Location = Allow → tải lại trang.
• Điện thoại: Settings → Privacy/Location → bật Location; và trong Chrome → Site settings → Location = Allow.

Sau đó bấm lại "Bật camera".`;
  try{ alert(msg); }catch{}
}

function getGeoPermStateSafe(){
  return (navigator.permissions && navigator.permissions.query)
    ? navigator.permissions.query({ name:'geolocation' }).then(p=>p.state).catch(()=>null)
    : Promise.resolve(null);
}

function getGPSOnce(timeoutMs = 10000){ 
  return new Promise(resolve=>{
    if(!('geolocation' in navigator)) return resolve(null);
    navigator.geolocation.getCurrentPosition(
      p=>resolve({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy}),
      err=>resolve({err}),
      { enableHighAccuracy:true, timeout:timeoutMs, maximumAge:30000 }
    );
  });
}

// ✅ đảm bảo: denied => báo + return false
// ✅ prompt => tự gọi getCurrentPosition để bật popup xin quyền
// ✅ granted => cố lấy 1 tọa độ hợp lệ (lat != 0)
async function ensureGeoAllowedAndGet(){
  if(!('geolocation' in navigator)){
    toast('Thiết bị không hỗ trợ vị trí (GPS)', 'err', 3500);
    try{ alert('Thiết bị không hỗ trợ vị trí (GPS).'); }catch{}
    return false;
  }

  const st = await getGeoPermStateSafe();

  if (st === 'denied'){
    toast('⚠️ Bạn đã chặn quyền vị trí. Hãy bật lại trong cài đặt trình duyệt.', 'err', 4200);
    openGeoHelp();
    return false;
  }

  // st === 'prompt' hoặc null => gọi để bật popup xin quyền
  const r = await getGPSOnce();

  // bị chặn ngay lúc popup
  if (r && r.err){
    const code = r.err.code;
    if (code === 1){ // PERMISSION_DENIED
      toast('⚠️ Bạn đã chặn quyền vị trí. Hãy bật lại trong cài đặt trình duyệt.', 'err', 4200);
      openGeoHelp();
      return false;
    }
    toast('⚠️ Không lấy được GPS. Hãy bật vị trí/GPS và thử lại.', 'err', 3500);
    return false;
  }

  const lat = r?.lat ?? 0;
  const lng = r?.lng ?? 0;

  if (!lat || lat === 0 || !lng || lng === 0){
    toast('⚠️ Chưa có vị trí GPS. Hãy bật vị trí rồi thử lại.', 'err', 3500);
    try{ alert('⚠️ Chưa có vị trí GPS. Hãy bật vị trí/GPS rồi bấm lại "Bật camera".'); }catch{}
    return false;
  }

  // lưu lại để các bước khác dùng (nếu cần)
  window.__myLatLng = { lat, lng };
  return true;
}

const CSS_DIGITAL_ZOOM_MAX = 5;

/* ================== CAMERA, ZOOM, TORCH ================== */
let stream=null, videoTrack=null, torchOn=false;
let zoomSupported=false, cssZoomFallback=false;
let zoomMin=1, zoomMax=1, zoomStep=0.1, zoomVal=1;

function stopCam(){
  if(stream){ try{ stream.getTracks().forEach(t=>t.stop()); }catch{} }
  stream=null; videoTrack=null;
  if (video) video.srcObject=null;
}

async function startCam(){
  try{
    stopCam();
    stage && stage.classList.remove('ready');

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error('Trình duyệt không hỗ trợ camera');
    }

    const base = {
      video: {
        width:  { ideal: 1080 },
        height: { ideal: 1920 },
        facingMode: { ideal: 'environment' }
      },
      audio: false
    };

    try{
      stream = await navigator.mediaDevices.getUserMedia(base);
    }catch(e){
      if (e.name === 'NotAllowedError') {
        throw new Error('Bạn đã chặn quyền camera. Vào Cài đặt trình duyệt để bật lại.');
      }
      if (e.name === 'NotFoundError') {
        throw new Error('Không tìm thấy thiết bị camera.');
      }
      if (String(e.message || '').includes('Device in use')) {
        toast('Camera đang bận — thử lại...', 'info', 2000);
        await new Promise(r => setTimeout(r, 1000));
        stream = await navigator.mediaDevices.getUserMedia(base);
      } else {
        throw e;
      }
    }

    if (video) {
      video.srcObject = stream;
      video.setAttribute('playsinline','');
      video.muted = true;

      // Đợi metadata
      await new Promise(r => { video.onloadedmetadata = r; });

      // BẮT BUỘC phải play() cho mobile
      try {
        await video.play();
      } catch (err) {
        console.warn('Không play được video:', err);
      }
    }

    videoTrack = stream.getVideoTracks()[0] || null;

    stage && stage.classList.add('ready');

    if (btnShot) btnShot.disabled = false;
    await initZoom();

    // 👇 luôn dùng mức zoom nhỏ nhất
    await setZoom(zoomMin);
    await tryApplyTorch(false);

    toast('Đã bật camera. GPS và vị trí gần sẽ lấy khi bấm chụp.','ok');

    // Không gọi Sheet/GPS khi mở camera để trang nhẹ hơn.
    // GPS chỉ lấy khi bấm chụp ảnh.

  }catch(e){
    console.error(e);
    if (btnShot) btnShot.disabled = true;
    stage && stage.classList.remove('ready');
    toast('Lỗi camera: ' + (e.message || e), 'err', 4200);
  }
}

function renderCssZoom(){
  if (!video) return;
  video.style.transformOrigin = 'center center';
  video.style.transform = `scale(${zoomVal})`;
}

async function initZoom(){
  zoomSupported = false;
  cssZoomFallback = false;
  zoomMin = 1;
  zoomMax = 1;
  zoomStep = 0.1;
  zoomVal = 1;

  try{
    const caps = videoTrack?.getCapabilities?.() || {};
    const hasZoom = caps && typeof caps.zoom === 'object';

    if (hasZoom && typeof caps.zoom.min === 'number'){
      zoomSupported = true;
      zoomMin  = caps.zoom.min;
      zoomMax  = caps.zoom.max || caps.zoom.min;
      zoomStep = caps.zoom.step || 0.1;
      zoomVal  = zoomMin;
      await videoTrack.applyConstraints({ advanced: [{ zoom: zoomVal }] });
    } else {
      cssZoomFallback = true;
      zoomMin  = 1;
      zoomMax  = CSS_DIGITAL_ZOOM_MAX;
      zoomStep = 0.2;
      zoomVal  = 1;
      renderCssZoom();
    }
  } catch {
    cssZoomFallback = true;
    zoomMin  = 1;
    zoomMax  = CSS_DIGITAL_ZOOM_MAX;
    zoomStep = 0.2;
    zoomVal  = 1;
    renderCssZoom();
  }

  if (btnZoomIn)  btnZoomIn.disabled  = (zoomVal >= zoomMax);
  if (btnZoomOut) btnZoomOut.disabled = (zoomVal <= zoomMin);
}

async function setZoom(next){
  next = Number(next) || 1;
  next = Math.max(zoomMin, Math.min(zoomMax, next));
  if (Math.abs(next - zoomVal) < 1e-3) return;
  zoomVal = next;

  try{
    if (zoomSupported){
      await videoTrack.applyConstraints({ advanced: [{ zoom: zoomVal }] });
    } else if (cssZoomFallback){
      renderCssZoom();
    }
  } catch (e){
    cssZoomFallback = true;
    zoomSupported = false;
    renderCssZoom();
  }

  if (btnZoomOut) btnZoomOut.disabled = zoomVal <= (zoomMin + 1e-6);
  if (btnZoomIn)  btnZoomIn.disabled  = zoomVal >= (zoomMax - 1e-6);
}

btnZoomIn  && (btnZoomIn.onclick  = ()=> setZoom((zoomVal + zoomStep).toFixed(2)));
btnZoomOut && (btnZoomOut.onclick = ()=> setZoom((zoomVal - zoomStep).toFixed(2)));

async function tryApplyTorch(turnOn){
  try{
    if(!videoTrack) return false;
    const capabilities = videoTrack.getCapabilities?.() || {};
    if(!('torch' in capabilities)) { if (btnTorch) btnTorch.disabled=true; return false; }
    await videoTrack.applyConstraints({ advanced: [{ torch: !!turnOn }] });
    torchOn = !!turnOn;
    btnTorch && btnTorch.classList.toggle('btn-on', torchOn);
    return true;
  }catch{
    if (btnTorch) btnTorch.disabled=true;
    return false;
  }
}

btnTorch && (btnTorch.onclick = async ()=>{
  const ok = await tryApplyTorch(!torchOn);
  if(!ok) toast('Thiết bị không hỗ trợ đèn', 'err');
});

/* ================== CANVAS ================== */
function drawToCanvas(){
  if (!video || !canvas) return;
  const fw = video.videoWidth, fh = video.videoHeight;
  if(!fw || !fh) return;
  const desired = TARGET_W / TARGET_H;
  const ar = fw / fh;
  let sx=0, sy=0, sw=fw, sh=fh;
  if (ar > desired){ sw = fh * desired; sx = (fw - sw) / 2; }
  else { sh = fw / desired; sy = (fh - sh) / 2; }
  if (cssZoomFallback && zoomVal > 1){
    const cx = sx + sw/2, cy = sy + sh/2, z = zoomVal;
    const newSw = sw / z, newSh = sh / z;
    sx = cx - newSw/2; sy = cy - newSh/2; sw = newSw; sh = newSh;
  }
  canvas.width = TARGET_W; canvas.height = TARGET_H;
  canvas.getContext('2d').drawImage(video, sx, sy, sw, sh, 0, 0, TARGET_W, TARGET_H);
}

/* ================== EVENTS ================== */
btnStart && (btnStart.onclick = startCam);

let shooting = false;

btnShot && (btnShot.onclick = async ()=>{
  if(!stream || shooting){
    toast('Đang xử lý...', 'info');
    return;
  }

  shooting = true;
  btnShot.disabled = true;

  try{
    await ensureAudioCtx();
    await playShutter();
    drawToCanvas();

    toast('Đang lấy vị trí GPS...', 'info', 1800);
    const gps = await getGPSOnce(10000);

    if (gps && gps.err){
      if (gps.err.code === 1){
        toast('⚠️ Bạn đã chặn quyền vị trí. Hãy bật lại GPS.', 'err', 4200);
        openGeoHelp();
        return;
      }

      toast('⚠️ Không lấy được GPS. Hãy bật vị trí rồi chụp lại.', 'err', 3500);
      return;
    }

    const lat = gps?.lat ?? 0;
    const lng = gps?.lng ?? 0;

    if (!lat || lat === 0 || !lng || lng === 0){
      toast('⚠️ Chưa có vị trí. Hãy bật GPS rồi chụp lại.', 'err', 3500);
      try{ alert('⚠️ Chưa có vị trí. Hãy bật GPS/vị trí rồi chụp lại.'); }catch{}
      return; // THOÁT, KHÔNG ĐI TIẾP
    }

    // Lấy TẤT CẢ vị trí check-in đã lưu trong bán kính 50m.
    // Kết quả được lưu vào sessionStorage để checkin_khach_hang.html hiển thị.
    await prepareNearbyLocations(lat, lng);

    const mime = 'image/jpeg';
    const dataUrl = canvas.toDataURL(mime, 0.85);

    const payload = {
      image_mime: mime,
      image_b64: (dataUrl.split(',')[1] || ''),
      ma_nv: MA_NV,
      ten_nv: TEN_NV,
      ma_kh: MA_KH || '',
      ma_hd: MA_HD || ''
    };

    sessionStorage.setItem(SESSION_IMG_KEY, JSON.stringify(payload));

    const targetUrl = new URL('/checkin_khach_hang.html', location.origin);

    targetUrl.searchParams.set('lat', String(lat));
    targetUrl.searchParams.set('lng', String(lng));
    targetUrl.searchParams.set('lag', String(lat)); // giữ nguyên theo bạn
    targetUrl.searchParams.set('nearby', '1');
    targetUrl.searchParams.set('radius', String(NEAR_RADIUS_M));
    targetUrl.searchParams.set('ma_nv', MA_NV);
    targetUrl.searchParams.set('ten_nv', TEN_NV);

    if (MA_KH) targetUrl.searchParams.set('ma_kh', MA_KH);
    if (MA_HD) targetUrl.searchParams.set('ma_hd', MA_HD);

targetUrl.searchParams.set('img', 'session');

/*
  Mỗi lần chụp ảnh mới từ app_checkin,
  tạo shot_id mới để trang checkin_khach_hang biết đây là lượt chụp mới.
*/
const shotId = String(Date.now());
targetUrl.searchParams.set('shot_id', shotId);
sessionStorage.setItem('CHECKIN_CURRENT_SHOT_ID', shotId);

/*
  Xóa toàn bộ khóa tạm của nút Mã KH trên chính trình duyệt/tab hiện tại.
  Khi mở checkin_khach_hang.html:
  - Các nút Mã KH sẽ hiện lại bình thường.
  - Chỉ những KH đã check-in cùng ngày theo dữ liệu thật mới bị mờ.
*/
sessionStorage.removeItem('CLICKED_CHECKIN_BROWSER_V1');
sessionStorage.removeItem('CHECKIN_BROWSER_DONE_V1');

location.assign(targetUrl.toString());

  } catch (err) {
    console.error(err);
    toast('Lỗi khi chuẩn bị dữ liệu: ' + (err.message || err), 'err', 4000);
  } finally {
    setTimeout(()=>{
      shooting = false;
      btnShot.disabled = !stream;
    }, 800);
  }
});

/* Nút Menu → về main.html */
btnMenu && (btnMenu.onclick = ()=>{
  location.assign('main.html');
});

/* ================== AUTO BOOT ================== */

// helper: đảm bảo stage + UI hiện ra (kể cả khi chưa bật cam)
function showStage(){
  if (stage && !stage.classList.contains('ready')) {
    stage.classList.add('ready');
  }
}

async function getPermState(name){
  try{
    if (!navigator.permissions?.query) return null;
    const p = await navigator.permissions.query({ name });
    return p.state;
  }catch{
    return null;
  }
}

// Nếu trình duyệt đã lưu quyền camera thì tự mở camera.
// Không kiểm tra GPS ở đây. GPS chỉ lấy khi bấm chụp ảnh.
(async () => {
  showStage();
  if (btnShot) btnShot.disabled = true;

  const camState = await getPermState('camera');

  if (camState === 'granted') {
    toast('Đang mở camera...', 'info', 1200);
    await startCam();
    return;
  }

  toast('Bấm nút "Cam" để mở camera.', 'info', 2200);
})();

/* Khi tab ẩn/hiện lại */
document.addEventListener('visibilitychange', () => { 
  if (document.hidden) {
    // Ẩn tab → tắt camera cho nhẹ máy
    stopCam();
  } else {
    showStage();
    if (!stream) {
      if (btnShot) btnShot.disabled = true;
      toast('Bấm nút "Cam" để mở lại camera. GPS sẽ lấy khi chụp.', 'info', 2600);
    }
  }
});
  </script>
